name: R19.4 Seamless Windows In-App Update Acceptance

on:
  pull_request:
    paths:
      - "src/kodepoia/update/**"
      - "src/kodepoia/kodestudio/update_settings.py"
      - "packaging/windows/Kodepoia.iss"
      - "tests/test_r19_4_seamless_windows_update.py"
      - "tests/test_supply_chain_r16_9.py"
      - "scripts/r19_4_seamless_windows_update_acceptance.py"
      - ".github/workflows/r19-4-seamless-windows-update-acceptance.yml"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA to validate
        required: true
        type: string

permissions:
  contents: read

env:
  KODEPOIA_SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  seamless-update-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os, subprocess
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert actual == os.environ["KODEPOIA_SOURCE_SHA"], (actual, os.environ["KODEPOIA_SOURCE_SHA"])
      - name: Install focused dependencies
        run: python -m pip install -e ".[dev,code]"
      - name: Compile R19.4 sources
        run: python -m compileall -q src/kodepoia/update src/kodepoia/kodestudio/update_settings.py scripts/r19_4_seamless_windows_update_acceptance.py tests/test_r19_4_seamless_windows_update.py
      - name: Ruff R19.4
        run: python -m ruff check src/kodepoia/update/seamless.py src/kodepoia/update/startup.py src/kodepoia/kodestudio/update_settings.py scripts/r19_4_seamless_windows_update_acceptance.py tests/test_r19_4_seamless_windows_update.py
      - name: Focused R19.4 tests
        run: python -m pytest tests/test_r19_4_seamless_windows_update.py tests/test_r19_3_network_update_transport.py
      - name: Emit exact-source R19.4 acceptance
        run: python scripts/r19_4_seamless_windows_update_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output docs/roadmap/R19_4_SEAMLESS_WINDOWS_UPDATE_ACCEPTANCE.json
      - name: Upload exact-source R19.4 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r19-4-seamless-windows-update-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: docs/roadmap/R19_4_SEAMLESS_WINDOWS_UPDATE_ACCEPTANCE.json
          if-no-files-found: error