name: R14.14 Focused Fixture Patch

on:
  push:
    branches:
      - r14/14-liveops-campaigns-schedules

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: r14/14-liveops-campaigns-schedules
          fetch-depth: 4

      - name: Assert fixture patch surface
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/test_r14_14_liveops.py
          test -f scripts/_r14_14_test_fixture_patch.py
          test -f .github/workflows/r14-14-test-fixture-patch.yml

      - name: Apply exact fixture authorization patch
        run: python scripts/_r14_14_test_fixture_patch.py

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile focused surface
        run: python -m compileall -q src/kodepoia/backend/liveops.py tests/test_r14_14_liveops.py

      - name: Run focused R14.14 tests
        run: python -m pytest -q tests/test_r14_14_liveops.py

      - name: Commit clean focused result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm scripts/_r14_14_test_fixture_patch.py
          rm .github/workflows/r14-14-test-fixture-patch.yml
          git add tests/test_r14_14_liveops.py
          git add -u -- scripts/_r14_14_test_fixture_patch.py .github/workflows/r14-14-test-fixture-patch.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx 'tests/test_r14_14_liveops.py'
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/_r14_14_test_fixture_patch.py'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/r14-14-test-fixture-patch.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(r14.14): use explicit authorized object fixtures'
          git push origin HEAD:r14/14-liveops-campaigns-schedules
