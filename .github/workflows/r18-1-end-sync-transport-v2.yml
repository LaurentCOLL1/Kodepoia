name: R18.1 END Sync Transport v2

on:
  push:
    branches:
      - r18/01-release-identity
    paths:
      - .github/workflows/r18-1-end-sync-transport-v2.yml

permissions:
  contents: write

jobs:
  end-sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply END sync
        run: python scripts/r18_1_end_sync_transport.py

      - name: Commit clean END sync
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/r18-1-end-sync-transport.yml
          test ! -e .github/workflows/r18-1-end-sync-transport-v2.yml
          test ! -e scripts/r18_1_end_sync_transport.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(r18.1): END-sync canonical release identity"
          git push origin HEAD:r18/01-release-identity
