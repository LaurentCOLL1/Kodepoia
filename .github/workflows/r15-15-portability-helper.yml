name: R15.15 portability helper

on:
  push:
    branches:
      - r15/15-cli-kodestudio-ux

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/15-cli-kodestudio-ux
          fetch-depth: 0
      - name: Normalize redacted paths cross-platform
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/kodepoia/tuning/r15_ux.py')
          text = path.read_text(encoding='utf-8')
          old = '        return str(resolved.relative_to(root))\n'
          new = '        return resolved.relative_to(root).as_posix()\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/r15-15-portability-helper.yml
          git add src/kodepoia/tuning/r15_ux.py
          git diff --cached --check
          git commit -m "fix(r15.15): normalize evidence paths cross-platform"
          git push origin HEAD:r15/15-cli-kodestudio-ux
