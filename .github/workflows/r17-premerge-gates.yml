name: Temporary R17 Exact-Head Premerge Gates

on:
  push:
    branches:
      - scratch/r17-premerge-gates

permissions:
  contents: read

jobs:
  r0:
    name: r0-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KODEPOIA_SOURCE_SHA: a27d8720a7aabb12488805488e6f5909c08b1270
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install R0 dependencies
        run: python -m pip install -r scripts/requirements-r0.txt
      - name: Verify Git LFS
        run: git lfs version
      - name: Repository Guard
        run: python scripts/check_repo.py

  python-core:
    name: python-core-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KODEPOIA_SOURCE_SHA: a27d8720a7aabb12488805488e6f5909c08b1270
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install
        run: python -m pip install -e ".[dev,code]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Full Python Core
        run: pytest

  ui-smoke:
    name: kodestudio-ui-windows
    runs-on: windows-latest
    env:
      KODEPOIA_SOURCE_SHA: a27d8720a7aabb12488805488e6f5909c08b1270
      QT_QPA_PLATFORM: offscreen
      KODEPOIA_LOCALE: fr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install UI dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: KodeStudio + R17 smoke
        run: pytest tests/test_kodestudio_smoke.py tests/test_r6_5_accessibility_ui.py tests/test_r6_6_localization_ui.py tests/test_r7_10_research_ui.py tests/test_r8_10_kodestudio.py tests/test_r17_guided_ux.py tests/test_r17_packaged_entrypoint.py

  end-installer:
    name: r17-end-windows-installer
    runs-on: windows-latest
    env:
      KODEPOIA_SOURCE_SHA: a27d8720a7aabb12488805488e6f5909c08b1270
      KODEPOIA_LOCALE: fr
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact checkout provenance
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:KODEPOIA_SOURCE_SHA) {
            throw "Expected $env:KODEPOIA_SOURCE_SHA, got $actual"
          }
      - name: Install test and packaging dependencies
        run: python -m pip install -e ".[dev,ui,code,packaging]"
      - name: Run focused R17 tests
        run: pytest tests/test_r17_guided_ux.py tests/test_r17_packaged_entrypoint.py
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build KodepoiaSetup.exe
        shell: pwsh
        run: ./scripts/build_windows_installer.ps1 -Version "1.1.0-rc1"
      - name: Assert installer output
        shell: pwsh
        run: |
          $setup = Resolve-Path "dist/windows/KodepoiaSetup.exe"
          if ((Get-Item $setup).Length -le 0) { throw "Installer is empty" }
          Get-FileHash $setup -Algorithm SHA256
          Get-Content "dist/windows/installer-manifest.json"
      - name: Silent clean-environment install, packaged UI smoke and uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "Kodepoia-installed"
          $smokeDir = Join-Path $env:RUNNER_TEMP "Kodepoia-smoke-cwd"
          $smokeReport = Join-Path $env:RUNNER_TEMP "kodepoia-packaged-smoke.txt"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeReport -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $process = Start-Process -FilePath "dist/windows/KodepoiaSetup.exe" -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/MERGETASKS=!desktopicon",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $exe = Join-Path $installDir "KodepoiaStudio.exe"
          if (-not (Test-Path $exe)) { throw "Installed KodepoiaStudio.exe missing" }
          $uninstall = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstall)) { throw "Uninstaller missing" }
          $originalPath = $env:PATH
          $originalPythonHome = $env:PYTHONHOME
          $originalPythonPath = $env:PYTHONPATH
          $env:PATH = @(
            (Join-Path $env:SystemRoot "System32"),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot "System32\Wbem")
          ) -join ";"
          $env:PYTHONHOME = $null
          $env:PYTHONPATH = $null
          try {
            if (Get-Command python.exe -ErrorAction SilentlyContinue) { throw "Developer Python is still visible during packaged smoke" }
            if (Get-Command pip.exe -ErrorAction SilentlyContinue) { throw "Developer pip is still visible during packaged smoke" }
            $smokeProcess = Start-Process -FilePath $exe -ArgumentList @(
              "--smoke-test",
              "--smoke-report=$smokeReport"
            ) -WorkingDirectory $smokeDir -Wait -PassThru
            if ($smokeProcess.ExitCode -ne 0) {
              if (Test-Path $smokeReport) {
                Write-Host "=== Packaged KodeStudio smoke traceback ==="
                Get-Content $smokeReport
              }
              throw "Packaged KodeStudio smoke failed with $($smokeProcess.ExitCode)"
            }
          }
          finally {
            $env:PATH = $originalPath
            $env:PYTHONHOME = $originalPythonHome
            $env:PYTHONPATH = $originalPythonPath
          }
          $uninstallProcess = Start-Process -FilePath $uninstall -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller failed" }
          for ($attempt = 0; $attempt -lt 40 -and (Test-Path $exe); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $exe) { throw "KodepoiaStudio.exe still exists after successful uninstaller exit" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KodepoiaSetup-Windows-END-a27d8720
          if-no-files-found: error
          path: |
            dist/windows/KodepoiaSetup.exe
            dist/windows/installer-manifest.json
