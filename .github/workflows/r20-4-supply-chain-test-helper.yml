name: R20.4 Supply-Chain Test Helper

on:
  push:
    branches:
      - r20/04-scheduled-metadata-refresh

permissions:
  contents: write

jobs:
  align-test:
    if: github.event.head_commit.message == 'R20.4 — trigger supply-chain test alignment'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact helper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Align R16.9 regression test with R20.4 authority
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/test_supply_chain_r16_9.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "assert len(policy.immutable_authority_workflows) == 41",
              "assert len(policy.immutable_authority_workflows) == 43",
          )
          needle = "    assert policy.allow_write_workflows == (r18_3_workflow,)\n"
          replacement = '''    r20_4_workflow = ".github/workflows/r20-4-scheduled-metadata-refresh.yml"\n    assert r20_4_workflow in policy.immutable_authority_workflows\n    r20_4_acceptance_workflow = (\n        ".github/workflows/r20-4-scheduled-metadata-refresh-acceptance.yml"\n    )\n    assert r20_4_acceptance_workflow in policy.immutable_authority_workflows\n    assert policy.allow_write_workflows == (r18_3_workflow, r20_4_workflow)\n'''
          if needle not in text and replacement not in text:
              raise SystemExit("unable to locate R16.9 allow-write assertion")
          text = text.replace(needle, replacement)
          path.write_text(text, encoding="utf-8")

      - name: Commit aligned test
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_supply_chain_r16_9.py
          if git diff --cached --quiet; then
            echo "No test alignment changes produced" >&2
            exit 1
          fi
          git commit -m "R20.4 — align R16.9 authority regression"
          git push origin HEAD:r20/04-scheduled-metadata-refresh
