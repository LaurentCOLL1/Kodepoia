name: R18 Prerelease And Root Installer Transport

on:
  push:
    branches:
      - release/r18-root-installer-prerelease-transport

permissions:
  contents: write

jobs:
  publish-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      KODEPOIA_RELEASE_SOURCE_SHA: 6208b725acc949a8e07e4745c740edead5ca5a29
      KODEPOIA_RELEASE_TAG: v1.1.0-rc1
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/r18-root-installer-prerelease-transport
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Prepare immutable release-source worktree
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'kodepoia-release-source'
          git worktree add --detach $source $env:KODEPOIA_RELEASE_SOURCE_SHA
          $actual = (git -C $source rev-parse HEAD).Trim()
          if ($actual -ne $env:KODEPOIA_RELEASE_SOURCE_SHA) {
            throw "Expected release source $env:KODEPOIA_RELEASE_SOURCE_SHA, got $actual"
          }
          "KODEPOIA_RELEASE_SOURCE_DIR=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install release build dependencies
        shell: pwsh
        run: |
          Set-Location $env:KODEPOIA_RELEASE_SOURCE_DIR
          python -m pip install -e '.[dev,ui,code,packaging]'

      - name: Run focused packaged-entrypoint regression
        shell: pwsh
        run: |
          Set-Location $env:KODEPOIA_RELEASE_SOURCE_DIR
          pytest tests/test_r17_guided_ux.py tests/test_r17_packaged_entrypoint.py

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build exact-source Windows installer
        shell: pwsh
        run: |
          Set-Location $env:KODEPOIA_RELEASE_SOURCE_DIR
          ./scripts/build_windows_installer.ps1 -Version '1.1.0-rc1'

      - name: Clean install, packaged smoke and uninstall
        shell: pwsh
        run: |
          $setup = Join-Path $env:KODEPOIA_RELEASE_SOURCE_DIR 'dist/windows/KodepoiaSetup.exe'
          if (-not (Test-Path $setup)) { throw 'KodepoiaSetup.exe missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Kodepoia-release-installed'
          $smokeDir = Join-Path $env:RUNNER_TEMP 'Kodepoia-release-smoke'
          $smokeReport = Join-Path $env:RUNNER_TEMP 'Kodepoia-release-smoke.txt'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null

          $install = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/MERGETASKS=!desktopicon',"/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }

          $exe = Join-Path $installDir 'KodepoiaStudio.exe'
          $uninstall = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $exe)) { throw 'Installed KodepoiaStudio.exe missing' }
          if (-not (Test-Path $uninstall)) { throw 'Uninstaller missing' }

          $originalPath = $env:PATH
          $originalPythonHome = $env:PYTHONHOME
          $originalPythonPath = $env:PYTHONPATH
          $env:PATH = @((Join-Path $env:SystemRoot 'System32'),$env:SystemRoot,(Join-Path $env:SystemRoot 'System32\Wbem')) -join ';'
          $env:PYTHONHOME = $null
          $env:PYTHONPATH = $null
          try {
            if (Get-Command python.exe -ErrorAction SilentlyContinue) { throw 'Developer Python visible during packaged smoke' }
            if (Get-Command pip.exe -ErrorAction SilentlyContinue) { throw 'Developer pip visible during packaged smoke' }
            $smoke = Start-Process -FilePath $exe -ArgumentList @('--smoke-test',"--smoke-report=$smokeReport") -WorkingDirectory $smokeDir -Wait -PassThru
            if ($smoke.ExitCode -ne 0) {
              if (Test-Path $smokeReport) { Get-Content $smokeReport }
              throw "Packaged smoke failed with $($smoke.ExitCode)"
            }
          }
          finally {
            $env:PATH = $originalPath
            $env:PYTHONHOME = $originalPythonHome
            $env:PYTHONPATH = $originalPythonPath
          }

          $remove = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstaller failed with $($remove.ExitCode)" }
          for ($attempt = 0; $attempt -lt 40 -and (Test-Path $exe); $attempt++) { Start-Sleep -Milliseconds 250 }
          if (Test-Path $exe) { throw 'KodepoiaStudio.exe still exists after uninstall' }

      - name: Record installer identity
        shell: pwsh
        run: |
          $setup = Join-Path $env:KODEPOIA_RELEASE_SOURCE_DIR 'dist/windows/KodepoiaSetup.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $setup).Length
          "KODEPOIA_INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KODEPOIA_INSTALLER_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer SHA-256: $hash"
          Write-Host "Installer bytes: $size"

      - name: Publish public GitHub prerelease
        shell: pwsh
        run: |
          $setup = Join-Path $env:KODEPOIA_RELEASE_SOURCE_DIR 'dist/windows/KodepoiaSetup.exe'
          $manifest = Join-Path $env:KODEPOIA_RELEASE_SOURCE_DIR 'dist/windows/installer-manifest.json'
          $notes = Join-Path $env:RUNNER_TEMP 'r18-release-notes.md'
          @"
          Kodepoia 1.1.0-rc1 is the accepted Windows beta/release-candidate produced after R18 completion.

          - Windows x64 standalone installer: KodepoiaSetup.exe
          - Source commit: $env:KODEPOIA_RELEASE_SOURCE_SHA
          - SHA-256: $env:KODEPOIA_INSTALLER_SHA256
          - Installer size: $env:KODEPOIA_INSTALLER_SIZE bytes
          - production_signed=false

          This is a public prerelease, not a production-signed stable release. Windows/SmartScreen may display a signature or reputation warning. Public WinGet submission, production Authenticode signing and production TUF key custody/rotation remain separate and are not triggered by this release.
          "@ | Set-Content -Path $notes -Encoding utf8

          gh release view $env:KODEPOIA_RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:KODEPOIA_RELEASE_TAG already exists; refusing an implicit mutation"
          }
          gh release create $env:KODEPOIA_RELEASE_TAG `
            "$setup#KodepoiaSetup.exe" `
            "$manifest#installer-manifest.json" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:KODEPOIA_RELEASE_SOURCE_SHA `
            --title 'Kodepoia 1.1.0-rc1' `
            --notes-file $notes `
            --prerelease

      - name: Materialize root installer mirror and documentation
        shell: pwsh
        run: |
          $setup = Join-Path $env:KODEPOIA_RELEASE_SOURCE_DIR 'dist/windows/KodepoiaSetup.exe'
          Copy-Item $setup (Join-Path $env:GITHUB_WORKSPACE 'KodepoiaSetup.exe') -Force
          "$env:KODEPOIA_INSTALLER_SHA256  KodepoiaSetup.exe" | Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'KodepoiaSetup.exe.sha256') -Encoding ascii
          python .github/r18_release_root_sync.py

      - name: Commit clean root-installer candidate through Git LFS
        shell: pwsh
        run: |
          git lfs install --local
          Remove-Item '.github/r18_release_root_sync.py' -Force
          Remove-Item '.github/workflows/r18-release-root-sync-transport.yml' -Force
          git add -A
          Write-Host '=== Staged paths ==='
          git diff --cached --name-status
          python scripts/check_repo.py
          $lfs = git lfs ls-files
          $lfs | Write-Host
          if (-not ($lfs -match 'KodepoiaSetup.exe')) { throw 'Root KodepoiaSetup.exe is not tracked by Git LFS' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: expose Windows installer at root and record prerelease'
          git push origin HEAD:release/r18-root-installer-prerelease-transport
