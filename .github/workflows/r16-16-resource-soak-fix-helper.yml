name: R16.16 Resource Soak Fix Helper

on:
  push:
    branches:
      - "r16/16-resource-soak-fix-helper"

permissions:
  contents: write

jobs:
  publish-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "r16/16-resource-soak-fix-helper"
          path: helper
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact rejected R16.16 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "1a05f94accee401cfca5d9f361c4191821db0fd6"
          path: repo
          fetch-depth: 0

      - name: Apply and publish bounded fix
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=1a05f94accee401cfca5d9f361c4191821db0fd6
          TARGET=src/kodepoia/quality/resource_soak.py
          test "$(git -C repo rev-parse HEAD)" = "$SOURCE"
          cp helper/.github/r16_16_resource_soak_fix_helper.py /tmp/r16_16_resource_soak_fix_helper.py
          cd repo
          git update-index --assume-unchanged docs/roadmap/R10_7_LOCAL_ACCEPTANCE.json
          python /tmp/r16_16_resource_soak_fix_helper.py
          git add -- "$TARGET"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 1
          test "${staged[0]}" = "$TARGET"
          git diff --cached --check
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'fix(r16.16): correct resource soak lint and runtime defects' | git commit-tree "$tree" -p "$SOURCE")
          mapfile -t committed < <(git diff-tree --no-commit-id --name-only -r "$commit")
          test "${#committed[@]}" -eq 1
          test "${committed[0]}" = "$TARGET"
          echo "R16_16_FIXED_HEAD=$commit"
          git push origin "$commit":refs/heads/r16/16-resource-concurrency-leak-diagnostics-soak
