name: R16.14 Implementation Helper

on:
  push:
    branches:
      - "r16/14-implementation-helper"

permissions:
  contents: write

jobs:
  publish-technical-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "r16/14-implementation-helper"
          path: helper
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact R16.14 START branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "r16/14-representative-audio-voice-cinematic-beta-workflow"
          path: repo
          fetch-depth: 0

      - name: Generate, test and publish exact technical source
        shell: bash
        run: |
          set -euo pipefail
          START=7ed6f09262fc259bd875fc76c4583b758474090b
          test "$(git -C repo rev-parse HEAD)" = "$START"
          cp helper/.github/r16_14_implementation_helper.py /tmp/r16_14_implementation_helper.py
          cp helper/.github/r16_14_implementation_wrapper.py /tmp/r16_14_implementation_wrapper.py
          cd repo
          python /tmp/r16_14_implementation_wrapper.py

          python -m pip install -e ".[dev]"
          targets=(
            "src/kodepoia/media/r16_14_acceptance.py"
            "scripts/r16_14_media_beta_acceptance.py"
            "tests/test_r16_14_media_beta.py"
          )
          python -m ruff check --select F401 --fix "${targets[@]}"
          python -m ruff format "${targets[@]}"
          python -m compileall -q "${targets[@]}"
          python -m ruff check "${targets[@]}"
          python -m ruff format --check "${targets[@]}"
          python -m pytest -q \
            tests/test_r16_14_media_beta.py \
            tests/test_supply_chain_r16_9.py
          python scripts/r16_14_media_beta_acceptance.py \
            --source-sha 1111111111111111111111111111111111111111 \
            --platform helper-prepublish \
            --output artifacts/r16_14_helper_acceptance.json

          expected=(
            ".github/workflows/r16-14-media-beta-acceptance.yml"
            "configs/r16_supply_chain_policy.json"
            "scripts/r16_14_media_beta_acceptance.py"
            "src/kodepoia/media/r16_14_acceptance.py"
            "tests/fixtures/r16_14_media_beta/scenario.json"
            "tests/test_r16_14_media_beta.py"
            "tests/test_supply_chain_r16_9.py"
          )
          git add -- "${expected[@]}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${staged[*]}" = "${expected_sorted[*]}"
          git diff --cached --check

          tree=$(git write-tree)
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'feat(r16.14): add representative media beta acceptance' | git commit-tree "$tree" -p "$START")
          mapfile -t committed < <(git diff-tree --no-commit-id --name-only -r "$commit" | sort)
          test "${committed[*]}" = "${expected_sorted[*]}"
          echo "TECHNICAL_SOURCE=$commit"
          git push origin "$commit":refs/heads/r16/14-representative-audio-voice-cinematic-beta-workflow
