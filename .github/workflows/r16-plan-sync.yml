name: R16 Plan Continuity Sync

on:
  push:
    branches:
      - r16/00-phase-plan
    paths:
      - .github/workflows/r16-plan-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          ref: r16/00-phase-plan
          fetch-depth: 0

      - name: Synchronize R16 planning continuity
        shell: bash
        env:
          R16_BLOCK_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          text = path.read_text(encoding="utf-8")

          old_authority = "**R1–R15 COMPLETE + NORMALIZED. R16 planning AUTHORIZED on the normalized `main` produced when this unique R15 phase normalization PR merges.**"
          new_authority = "**R1–R15 COMPLETE + NORMALIZED. R16 planning IN_PROGRESS from normalized `main` `b83c5cf0354f675e468e3ab37c2eefa66aaa9d56`; R16.1–R16.18 PLANNED; no R16 implementation is authorized before planning ACCEPTED + NORMALIZED.**"
          assert text.count(old_authority) == 1
          text = text.replace(old_authority, new_authority, 1)

          marker = "\n\n- R15.1 :"
          assert text.count(marker) == 1
          global_line = "\n- R16 planning : **IN_PROGRESS** — branch `r16/00-phase-plan` from normalized R15 `main` `b83c5cf0354f675e468e3ab37c2eefa66aaa9d56`; exhaustive `docs/roadmap/R16_PLAN.md` freezes R16.1–R16.18 before implementation; planning acceptance and its one continuity-only normalization remain pending."
          text = text.replace(marker, global_line + marker, 1)

          start_marker = "## Next authorized action\n"
          end_marker = "## Permanent R-phase execution rule\n"
          start = text.find(start_marker)
          end = text.find(end_marker)
          assert start >= 0 and end > start
          block = base64.b64decode(os.environ["R16_BLOCK_B64"]).decode("utf-8")
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding="utf-8", newline="\n")

          check = path.read_text(encoding="utf-8")
          assert check.count("## R16 planning authority") == 1
          assert check.count("## R16 status index") == 1
          assert check.count("| R16.18 | PLANNED | CONDITIONAL |") == 1
          assert "R16 planning IN_PROGRESS" in check
          assert "Do **not** start R16.1" in check
          PY

      - name: Remove staging workflow and verify scope
        shell: bash
        run: |
          git rm .github/workflows/r16-plan-sync.yml
          git diff --check -- docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r16-plan-sync.yml
          git diff --name-only

      - name: Commit synchronized continuity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git commit -m "docs(r16): sync planning continuity"
          git push origin HEAD:r16/00-phase-plan
