name: R18.8 policy fixup helper (ephemeral)

on:
  push:
    branches:
      - r18/08-verified-download-install-rollback
    paths:
      - .github/workflows/r18-8-policy-fixup-helper.yml

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_supply_chain_r16_9.py")
          text = path.read_text(encoding="utf-8")
          old_count = "assert len(policy.immutable_authority_workflows) == 29"
          if text.count(old_count) != 1:
              raise SystemExit("authority workflow count anchor missing")
          text = text.replace(old_count, "assert len(policy.immutable_authority_workflows) == 30", 1)
          anchor = (
              '    r18_7_workflow = ".github/workflows/r18-7-update-discovery-acceptance.yml"\n'
              "    assert r18_7_workflow in policy.immutable_authority_workflows\n"
          )
          addition = anchor + (
              '    r18_8_workflow = ".github/workflows/r18-8-verified-install-acceptance.yml"\n'
              "    assert r18_8_workflow in policy.immutable_authority_workflows\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit("R18.7 authority anchor missing")
          text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          Path(".github/workflows/r18-8-policy-fixup-helper.yml").unlink()
          PY
          git config user.name "kodepoia-r18-8-fixup"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_supply_chain_r16_9.py .github/workflows/r18-8-policy-fixup-helper.yml
          git diff --cached --check
          git commit -m "test(r18.8): register supply-chain authority"
          git push origin HEAD:r18/08-verified-download-install-rollback
