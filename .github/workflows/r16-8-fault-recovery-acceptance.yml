name: R16.8 Fault Recovery Acceptance

on:
  push:
    branches:
      - r16/08-fault-injection-recovery
  pull_request:
    paths:
      - .github/workflows/r16-8-fault-recovery-acceptance.yml
      - scripts/r16_8_fault_recovery_acceptance.py
      - src/kodepoia/core/fault_recovery.py
      - src/kodepoia/core/recovery.py
      - tests/test_fault_recovery_r16_8.py
      - docs/roadmap/R16_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fault-recovery:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True, encoding="utf-8"
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused acceptance dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile focused R16.8 sources
        run: >-
          python -m compileall -q
          src/kodepoia/core/fault_recovery.py
          src/kodepoia/core/recovery.py
          scripts/r16_8_fault_recovery_acceptance.py
          tests/test_fault_recovery_r16_8.py

      - name: Ruff focused R16.8 sources
        run: >-
          python -m ruff check
          src/kodepoia/core/fault_recovery.py
          src/kodepoia/core/recovery.py
          scripts/r16_8_fault_recovery_acceptance.py
          tests/test_fault_recovery_r16_8.py

      - name: Run focused R16.8 tests
        run: python -m pytest -q tests/test_fault_recovery_r16_8.py

      - name: Emit exact-source R16.8 acceptance
        run: >-
          python scripts/r16_8_fault_recovery_acceptance.py
          --source-sha "${{ env.EVIDENCE_SHA }}"
          --output artifacts/r16_8_fault_recovery_acceptance.json

      - name: Upload exact-source acceptance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r16-8-fault-recovery-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r16_8_fault_recovery_acceptance.json
          if-no-files-found: error
          retention-days: 30
