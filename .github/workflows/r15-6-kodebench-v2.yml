name: R15.6 KodeBench v2 Acceptance

on:
  push:
    branches: [r15/06-kodebench-v2]
  pull_request:
    paths:
      - 'src/kodepoia/bench/**'
      - 'src/kodepoia/cli.py'
      - 'tests/test_bench.py'
      - 'tests/test_kodebench_v2.py'
      - 'schemas/kodebench-v2-report.schema.json'
      - '.github/workflows/r15-6-kodebench-v2.yml'
      - 'docs/roadmap/R15_6_*'
      - 'docs/roadmap/R15_PLAN.md'
      - 'docs/continuity/KODEPOIA_CONTINUITY.md'

permissions:
  contents: read

jobs:
  kodebench-v2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: R3 compatibility plus R15.6 focused tests
        run: python -m pytest -q tests/test_bench.py tests/test_kodebench_v2.py
      - name: Ruff R15.6-owned surface
        run: >-
          python -m ruff check
          src/kodepoia/bench/kodebench.py
          tests/test_kodebench_v2.py
      - name: Verify touched import blocks
        run: python -m ruff check --select I src/kodepoia/bench/__init__.py src/kodepoia/cli.py
      - name: Compile KodeBench surface
        run: python -m compileall -q src/kodepoia/bench src/kodepoia/cli.py
      - name: CLI comparison help smoke
        run: python -m kodepoia.cli kodebench-compare --help
