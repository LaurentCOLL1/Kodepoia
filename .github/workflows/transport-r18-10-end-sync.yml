name: Transport R18.10 END sync

on:
  push:
    branches:
      - transport/r18-10-end-sync-20260906

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: transport/r18-10-end-sync-20260906
          fetch-depth: 0

      - name: Apply clean END-sync to authoritative branch
        shell: bash
        run: python .github/transport/r18_10_end_sync.py
