name: R13.14 End Sync Helper

on:
  push:
    branches:
      - r13/14-mobile-diagnostics

permissions:
  contents: write

jobs:
  end-sync:
    if: github.event.head_commit.message != 'R13.14 end-sync via CI'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: r13/14-mobile-diagnostics
          fetch-depth: 0
      - name: Patch plan and continuity exactly
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          plan_path = Path("docs/roadmap/R13_PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          plan = replace_once(
              plan,
              "**Execution checkpoint:** R13.1–R13.13 are `COMPLETE + NORMALIZED`. R13.13 final end-synchronized head `8fd1b548129b73ceff5bc665001ce4a4bd59fa79` passed R0 #1703, Python Core #1677 and KodeStudio UI Smoke #1644; PR #245 merged as `627c7e5b21c71ae33652493660c7933e81634929`, then continuity-only normalization `5bfacd4d554f8245f7939c20691825c8cc9a25d2` passed R0 #1705, Python Core #1679 and UI #1646 and PR #246 merged as normalized `main` `69efa1f5cf92ae3c3ce4040fe5abe54faae2ed8b`. R13.14 is `IN_PROGRESS` on dedicated branch `r13/14-mobile-diagnostics`; R13.15–R13.17 remain `PLANNED`.",
              "**Execution checkpoint:** R13.1–R13.13 are `COMPLETE + NORMALIZED`. R13.14 is `COMPLETE / END-SYNCED` on dedicated branch `r13/14-mobile-diagnostics`; accepted technical candidate `ebb446daf6a6c38cff71b0834151ace74ff46099` passed exact-head R0 #1707 / `33094260088`, Python Core #1681 / `33094260123`, and KodeStudio UI Smoke #1648 / `33094260179`, all SUCCESS. Because end-sync documentation changes bytes, PR #247 remains merge-pending until fresh R0 + full Python Core + UI Smoke pass on the final end-synchronized head. R13.15–R13.17 remain `PLANNED`.",
              "plan checkpoint",
          )
          plan = replace_once(
              plan,
              "R13 planning is **ACCEPTED + NORMALIZED** on `main` `aef297e385dc49ad6ae0935d4f9ef25a35e5e984`; R13.1–R13.13 are **COMPLETE + NORMALIZED**; R13.14 is **IN_PROGRESS**; R13.15–R13.17 remain **PLANNED / NOT STARTED**.",
              "R13 planning is **ACCEPTED + NORMALIZED** on `main` `aef297e385dc49ad6ae0935d4f9ef25a35e5e984`; R13.1–R13.13 are **COMPLETE + NORMALIZED**; R13.14 is **COMPLETE / END-SYNCED, MERGE + NORMALIZATION PENDING**; R13.15–R13.17 remain **PLANNED / NOT STARTED**.",
              "plan phase summary",
          )
          plan = replace_once(
              plan,
              "| R13.14 | Mobile diagnostics: logs, crash/ANR/test/performance bundles + redaction | IN_PROGRESS | CONDITIONAL | R13.6/R13.11/R13.12 + R6 |",
              "| R13.14 | Mobile diagnostics: logs, crash/ANR/test/performance bundles + redaction | COMPLETE | CONDITIONAL | R13.6/R13.11/R13.12 + R6 |",
              "plan table",
          )
          start = "**Start record:** branch **`r13/14-mobile-diagnostics`** created exactly from normalized `main` **`69efa1f5cf92ae3c3ce4040fe5abe54faae2ed8b`**. Status **IN_PROGRESS** before implementation. Manual starts **CONDITIONAL / NOT TRIGGERED**: the frozen core claim is deterministic/local diagnostic ingestion, redaction, validation, fingerprint/dedup, bounded retention/export and release correlation using fixtures plus already accepted Android/iOS test evidence; it does not require a physical device, Play Console/Firebase account, Apple Developer/TestFlight/App Store Connect account, production signing material, user-machine Android SDK/Xcode installation or continuous telemetry service. Current official diagnostics semantics remain versioned provider evidence rather than architecture constants: Android ANR timeout ranges may vary by OEM and system-vs-app causes must remain distinguishable; Apple crash reports, Jetsam reports and console logs are distinct diagnostic sources, and privacy-sensitive information must not be included in logs. If a frozen R13.14 claim is found to require device-only diagnostics that accepted CI cannot establish, stop before R13.15 and request bounded user-controlled evidence without requesting credentials or secrets in chat."
          completion = "**Completion record:** accepted exact-head technical candidate **`ebb446daf6a6c38cff71b0834151ace74ff46099`** passed R0 Repository Guard #1707 / `33094260088`, Python Core #1681 / `33094260123`, and KodeStudio UI Smoke #1648 / `33094260179`, all SUCCESS on that exact SHA. Python Core passed the full Ubuntu/Windows tests and package builds and included focused `tests/test_mobile_r13_14_diagnostics.py`. The accepted core adds versioned `mobile-diagnostics-v1` schema plus bounded source-digest verification, strict UTF-8/NUL/size rejection, deterministic pre-export redaction, platform/source/provider separation, release/artifact/device/toolchain/test-run binding, deterministic crash/ANR/Jetsam/test/performance fingerprinting, bounded performance observations, retention/export budgets and explicit collection modes only; durable bundles always emit `continuous_hidden_telemetry=false`. Cross-release and cross-artifact substitution fail closed. No new live external tool/account/device seam was introduced, so manual remains **CONDITIONAL / NOT TRIGGERED**. This end synchronization marks R13.14 COMPLETE; because these documentary bytes changed after the technical candidate, fresh R0 + full Python Core + KodeStudio UI Smoke must pass on the final end-synchronized head before PR #247 may merge with `expected_head_sha`. R13.15 remains PLANNED until implementation merge plus the single continuity-only normalization complete."
          plan = replace_once(plan, start + "\n\n# R13.15", start + "\n\n" + completion + "\n\n# R13.15", "plan R13.14 completion")
          plan_path.write_text(plan, encoding="utf-8")

          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          continuity = continuity_path.read_text(encoding="utf-8")
          old_prompt = "> Kodepoia, architecture v1.0 gelée. **R1–R12 COMPLETE + NORMALIZED. R13 planning ACCEPTED + NORMALIZED. R13.1–R13.13 COMPLETE + NORMALIZED. R13.14 IN_PROGRESS on dedicated branch `r13/14-mobile-diagnostics`; R13.15–R13.17 PLANNED / NOT STARTED.** R13.13 final end-synchronized head `8fd1b548129b73ceff5bc665001ce4a4bd59fa79` passed R0 Repository Guard #1703 / `33081597102`, Python Core #1677 / `33081597094`, and KodeStudio UI Smoke #1644 / `33081597217`, all SUCCESS; PR #245 merged as `627c7e5b21c71ae33652493660c7933e81634929`. Its single continuity-only normalization head `5bfacd4d554f8245f7939c20691825c8cc9a25d2` changed only this file, passed R0 #1705 / `33089274530`, Python Core #1679 / `33089274603`, and UI #1646 / `33089274597`, then PR #246 merged as normalized `main` `69efa1f5cf92ae3c3ce4040fe5abe54faae2ed8b`. R13.14 starts exactly from that normalized main. Frozen core scope: structured Android logcat/crash/ANR/test/performance diagnostics and Apple XCTest/result/log/crash/Jetsam-style diagnostic ingestion through a common provider/platform-explicit envelope; deterministic fingerprint/dedup; device/toolchain/artifact/release binding; redaction before persistence/export; bounded retention/size; performance snapshots; no hidden continuous telemetry. Manual is CONDITIONAL / NOT TRIGGERED and becomes required only if a frozen claim truly depends on device-only diagnostics unavailable to accepted CI."
          new_prompt = "> Kodepoia, architecture v1.0 gelée. **R1–R12 COMPLETE + NORMALIZED. R13 planning ACCEPTED + NORMALIZED. R13.1–R13.13 COMPLETE + NORMALIZED. R13.14 COMPLETE / END-SYNCED on dedicated branch `r13/14-mobile-diagnostics`; implementation merge + single continuity-only normalization PENDING. R13.15–R13.17 PLANNED / NOT STARTED.** Authorized normalized base for R13.14 is `69efa1f5cf92ae3c3ce4040fe5abe54faae2ed8b`. Accepted technical candidate `ebb446daf6a6c38cff71b0834151ace74ff46099` passed exact-head R0 Repository Guard #1707 / `33094260088`, Python Core #1681 / `33094260123`, and KodeStudio UI Smoke #1648 / `33094260179`, all SUCCESS. Core is deterministic/local mobile diagnostic evidence only: source SHA verification, redaction before persistence/export, bounded Android/Apple source taxonomy, immutable release/artifact/device/toolchain/test-run binding, deterministic fingerprints, performance observations and bounded retention/export; `continuous_hidden_telemetry=false`. Manual remains CONDITIONAL / NOT TRIGGERED. Because end-sync documentation changed bytes, PR #247 may merge only after fresh R0 + full Python Core + UI Smoke succeed on the same final exact head, followed by exactly one continuity-only normalization before R13.15 starts."
          continuity = replace_once(continuity, old_prompt, new_prompt, "continuity prompt")
          continuity = replace_once(
              continuity,
              "- R13.14: **IN_PROGRESS** on `r13/14-mobile-diagnostics`, created exactly from normalized `main` **`69efa1f5cf92ae3c3ce4040fe5abe54faae2ed8b`**. Manual **CONDITIONAL / NOT TRIGGERED**.",
              "- R13.14: **COMPLETE / END-SYNCED; MERGE + NORMALIZATION PENDING** on `r13/14-mobile-diagnostics`. Accepted technical candidate **`ebb446daf6a6c38cff71b0834151ace74ff46099`**. Manual **CONDITIONAL / NOT TRIGGERED**.",
              "continuity global status",
          )
          continuity = replace_once(continuity, "## R13.14 start authority", "## R13.14 end-sync authority", "continuity heading")
          continuity = replace_once(
              continuity,
              "- Status: **IN_PROGRESS** before implementation. R13.15–R13.17 remain **PLANNED / NOT STARTED**.",
              "- Status: **COMPLETE / END-SYNCED; IMPLEMENTATION MERGE + SINGLE NORMALIZATION PENDING**. R13.15–R13.17 remain **PLANNED / NOT STARTED**.",
              "continuity R13.14 status",
          )
          anchor = "- Diagnostic payloads are bounded and redacted before any persisted/exportable representation; source digests, device/toolchain/artifact and release correlation remain explicit; crash/ANR fingerprinting and dedup must be deterministic; corrupt/oversized inputs fail closed; cross-release substitution is rejected; no continuous hidden telemetry, background surveillance, secret collection or silent network uploader is introduced."
          record = "- Accepted exact-head technical candidate **`ebb446daf6a6c38cff71b0834151ace74ff46099`** passed R0 Repository Guard #1707 / `33094260088`, Python Core #1681 / `33094260123`, and KodeStudio UI Smoke #1648 / `33094260179`, all SUCCESS. Python Core passed full Ubuntu/Windows tests and package builds including focused R13.14 diagnostics tests. Durable schema/model enforce source digest verification, strict bounded input, deterministic redaction, provider/platform/source separation, release/artifact/device/toolchain/test-run binding, deterministic fingerprinting, bounded performance snapshots and retention/export, and `continuous_hidden_telemetry=false`. No live external account/device/credential seam was introduced. Because end-sync documentation changes bytes, this final branch head must freshly pass R0 + full Python Core + UI Smoke before PR #247 may merge with `expected_head_sha`; then exactly one continuity-only normalization is required before R13.15."
          continuity = replace_once(continuity, anchor, anchor + "\n" + record, "continuity candidate record")
          continuity = replace_once(
              continuity,
              "| R13.14 | Mobile diagnostics: logs, crash/ANR/test/performance bundles + redaction | IN_PROGRESS | CONDITIONAL |",
              "| R13.14 | Mobile diagnostics: logs, crash/ANR/test/performance bundles + redaction | COMPLETE | CONDITIONAL |",
              "continuity table",
          )
          old_next = "Complete the matching R13.14 **start synchronization in `docs/roadmap/R13_PLAN.md` before implementation**. Then implement the frozen R13.14 core on this dedicated branch with required `R13_14_DESIGN.md`, `R13_14_ACCEPTANCE.md`, a durable diagnostics schema, focused tests, deterministic redaction/fingerprint/binding/retention logic, and no new live external seam unless the frozen claim genuinely requires one. Run exact-head R0 Repository Guard + full Python Core + KodeStudio UI Smoke (plus any existing affected platform workflow required by the final diff). If device-only evidence becomes required, stop and mark MANUAL_REQUIRED before R13.15; otherwise keep manual CONDITIONAL / NOT TRIGGERED."
          new_next = "Freeze the final R13.14 end-synchronized branch head. Run fresh exact-head **R0 Repository Guard + full Python Core + KodeStudio UI Smoke** on that same SHA. If all three are SUCCESS, merge implementation PR #247 with `expected_head_sha=<final-head>`. Then create exactly one branch from the implementation merge for **continuity-only normalization**, change no plan/code/schema/test bytes, verify the diff is exactly `docs/continuity/KODEPOIA_CONTINUITY.md`, run fresh exact-head R0 + Python + UI, and merge that normalization PR with `expected_head_sha`. Only the resulting normalized `main` authorizes R13.15 to start. If any gate fails, correct the affected R13.14 bytes and rerun all required exact-head gates; manual remains CONDITIONAL / NOT TRIGGERED unless a genuinely device-only prerequisite is newly discovered."
          continuity = replace_once(continuity, old_next, new_next, "continuity next action")
          continuity_path.write_text(continuity, encoding="utf-8")
      - name: Commit end-sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/R13_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --quiet && exit 0
          git commit -m "R13.14 end-sync via CI"
          git push origin HEAD:r13/14-mobile-diagnostics
