name: Python Core

on:
  push:
    branches:
      - main
      - develop
      - "agent/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: python-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python-core-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,code]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate PowerShell acceptance runner syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @(
            "scripts/r3_accept_local.ps1",
            "scripts/r5_accept_local.ps1",
            "scripts/r5_diagnose_godot_process.ps1",
            "scripts/r6_4_accept_local.ps1",
            "scripts/r6_5_accept_local.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Test
        run: pytest

  ui-smoke:
    name: kodestudio-ui-windows
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install UI and test dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: KodeStudio smoke
        run: pytest tests/test_kodestudio_smoke.py tests/test_r6_5_accessibility_ui.py
