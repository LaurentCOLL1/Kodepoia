name: R15.10 Continuity Normalization Helper

on:
  push:
    branches: [r15/10-post-merge-normalization]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/10-post-merge-normalization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply continuity-only normalization
        run: python .github/scripts/r15_10_normalize_continuity.py
      - name: Verify and publish clean normalization head
        shell: bash
        run: |
          rm .github/scripts/r15_10_normalize_continuity.py
          rm .github/workflows/r15-10-normalization-helper.yml
          actual="$(git diff --name-only | grep -v '^docs/roadmap/R10_7_LOCAL_ACCEPTANCE.json$' | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/r15_10_normalize_continuity.py' \
            '.github/workflows/r15-10-normalization-helper.yml' \
            'docs/continuity/KODEPOIA_CONTINUITY.md' | sort)"
          test "$actual" = "$expected" || {
            echo 'Unexpected normalization diff:'
            git diff --name-only
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git rm .github/scripts/r15_10_normalize_continuity.py .github/workflows/r15-10-normalization-helper.yml
          staged="$(git diff --cached --name-only | sort)"
          test "$staged" = "$expected"
          git diff --cached --check
          git commit -m 'docs(r15.10): normalize post-merge continuity'
          git push origin HEAD:r15/10-post-merge-normalization
