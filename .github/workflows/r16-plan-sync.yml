name: R16 Plan Continuity Sync

on:
  push:
    branches:
      - r16/00-phase-plan
    paths:
      - .github/workflows/r16-plan-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          ref: r16/00-phase-plan
          fetch-depth: 0

      - name: Synchronize R16 planning continuity
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          text = path.read_text(encoding="utf-8")

          old_authority = "**R1–R15 COMPLETE + NORMALIZED. R16 planning AUTHORIZED on the normalized `main` produced when this unique R15 phase normalization PR merges.**"
          new_authority = "**R1–R15 COMPLETE + NORMALIZED. R16 planning IN_PROGRESS from normalized `main` `b83c5cf0354f675e468e3ab37c2eefa66aaa9d56`; R16.1–R16.18 PLANNED; no R16 implementation is authorized before planning ACCEPTED + NORMALIZED.**"
          assert text.count(old_authority) == 1, "unexpected R16 top authority marker"
          text = text.replace(old_authority, new_authority, 1)

          global_marker = "\n\n- R15.1 :"
          assert text.count(global_marker) == 1, "unexpected R15.1 insertion marker"
          r16_global = (
              "\n- R16 planning : **IN_PROGRESS** — branch `r16/00-phase-plan` from normalized R15 `main` "
              "`b83c5cf0354f675e468e3ab37c2eefa66aaa9d56`; exhaustive `docs/roadmap/R16_PLAN.md` freezes "
              "R16.1–R16.18 before implementation; planning acceptance and its one continuity-only normalization remain pending."
          )
          text = text.replace(global_marker, r16_global + global_marker, 1)

          start_marker = "## Next authorized action\n"
          end_marker = "## Permanent R-phase execution rule\n"
          start = text.find(start_marker)
          end = text.find(end_marker)
          assert start >= 0 and end > start, "continuity terminal markers not found"

          planning_block = """## R16 planning authority

- Exact branch point: normalized R15 `main` `b83c5cf0354f675e468e3ab37c2eefa66aaa9d56`.
- Dedicated planning branch: `r16/00-phase-plan`.
- Frozen-roadmap title: **Hardening / Beta / v1.0**.
- Roadmap chain: red-team prompt injection / malicious repository / secrets / plugins / destructive commands / corrupted memory / recovery, followed by representative Godot 2D/3D, Windows desktop, ComfyUI, audio/voice and long-term-project validation.
- Exhaustive plan: `docs/roadmap/R16_PLAN.md`; subdivision set **R16.1–R16.18** is PLANNED and no R16 implementation is present in the planning authority.
- Red-team fixtures are synthetic, bounded and non-destructive; live secrets, uncontrolled malware, destructive host commands and production targets are excluded from core acceptance.
- Security decisions are fail-closed with instruction/data separation, least privilege, secret redaction, untrusted tool/plugin boundaries, memory-not-policy, bounded resources, recovery-before-continuation and critical-veto invariants.
- Core planning/implementation acceptance is CI-owned. Later R16.13/R16.14/R16.15/R16.17/R16.18 carry CONDITIONAL external/hardware/live-environment gates exactly as frozen in the plan; if one is explicitly triggered during implementation, execution stops before the following subdivision until exact evidence is reviewed.
- Planning acceptance requires fresh exact-head R0 Repository Guard + full Python Core + KodeStudio UI Smoke, planning PR merge with exact `expected_head_sha`, then exactly one continuity-only planning normalization with fresh exact-head R0/Python/UI and protected merge. Only the resulting normalized `main` authorizes R16.1.

## R16 status index

| ID | Status | Manual |
| --- | --- | --- |
| R16.1 | PLANNED | NONE |
| R16.2 | PLANNED | NONE |
| R16.3 | PLANNED | NONE |
| R16.4 | PLANNED | NONE |
| R16.5 | PLANNED | NONE |
| R16.6 | PLANNED | NONE |
| R16.7 | PLANNED | NONE |
| R16.8 | PLANNED | NONE |
| R16.9 | PLANNED | NONE |
| R16.10 | PLANNED | NONE |
| R16.11 | PLANNED | NONE |
| R16.12 | PLANNED | NONE |
| R16.13 | PLANNED | CONDITIONAL |
| R16.14 | PLANNED | CONDITIONAL |
| R16.15 | PLANNED | CONDITIONAL |
| R16.16 | PLANNED | NONE |
| R16.17 | PLANNED | CONDITIONAL |
| R16.18 | PLANNED | CONDITIONAL |

## Next authorized action

Complete and re-gate the exhaustive R16 planning authority. Do **not** start R16.1 before the planning PR and its unique planning continuity normalization are both merged successfully.

"""
          text = text[:start] + planning_block + text[end:]
          path.write_text(text, encoding="utf-8", newline="\n")

          check = path.read_text(encoding="utf-8")
          assert check.count("## R16 planning authority") == 1
          assert check.count("## R16 status index") == 1
          assert check.count("| R16.18 | PLANNED | CONDITIONAL |") == 1
          assert "R16 planning IN_PROGRESS" in check
          assert "Do **not** start R16.1" in check

      - name: Remove staging workflow and verify scope
        shell: bash
        run: |
          git rm .github/workflows/r16-plan-sync.yml
          git diff --check -- docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r16-plan-sync.yml
          git diff --name-only

      - name: Commit synchronized continuity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r16-plan-sync.yml
          git commit -m "docs(r16): sync planning continuity"
          git push origin HEAD:r16/00-phase-plan
