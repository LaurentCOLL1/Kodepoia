name: R19.3 Network UpdateTransport Acceptance

on:
  pull_request:
    paths:
      - "src/kodepoia/update/**"
      - "src/kodepoia/kodestudio/app_v11.py"
      - "configs/update_transport_r19_3.json"
      - "configs/r16_supply_chain_policy.json"
      - "tests/test_r19_3_network_update_transport.py"
      - "tests/test_supply_chain_r16_9.py"
      - "scripts/r19_3_network_update_acceptance.py"
      - ".github/workflows/r19-3-network-update-transport-acceptance.yml"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA to validate
        required: true
        type: string

permissions:
  contents: read

env:
  KODEPOIA_SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  network-update-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os, subprocess
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert actual == os.environ["KODEPOIA_SOURCE_SHA"], (actual, os.environ["KODEPOIA_SOURCE_SHA"])
      - name: Install focused dependencies
        run: python -m pip install -e ".[dev,code]"
      - name: Compile R19.3 sources
        run: python -m compileall -q src/kodepoia/update src/kodepoia/kodestudio/app_v11.py scripts/r19_3_network_update_acceptance.py tests/test_r19_3_network_update_transport.py
      - name: Ruff R19.3
        run: python -m ruff check src/kodepoia/update/network.py src/kodepoia/update/startup.py src/kodepoia/kodestudio/app_v11.py scripts/r19_3_network_update_acceptance.py tests/test_r19_3_network_update_transport.py tests/test_supply_chain_r16_9.py
      - name: Focused R19.3 tests
        run: python -m pytest tests/test_r19_3_network_update_transport.py tests/test_supply_chain_r16_9.py
      - name: Emit exact-source R19.3 acceptance
        run: python scripts/r19_3_network_update_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output docs/roadmap/R19_3_NETWORK_UPDATE_ACCEPTANCE.json
      - name: Upload exact-source R19.3 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r19-3-network-update-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: docs/roadmap/R19_3_NETWORK_UPDATE_ACCEPTANCE.json
          if-no-files-found: error
