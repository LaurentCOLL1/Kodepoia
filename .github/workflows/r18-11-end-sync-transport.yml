name: R18.11 END Sync Transport

on:
  push:
    branches:
      - r18/11-end-sync-transport

permissions:
  contents: write

jobs:
  append-end-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAN_APPEND_B64: ""
      CONT_APPEND_B64: ""
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify transport lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7f53831abe194a90e23a4a5e22135533ed08a876 HEAD
          test "$(git rev-parse 7f53831abe194a90e23a4a5e22135533ed08a876^{tree})" = "def07ea7566d97c3253a5111f870cdadf10bb398"

      - name: Append R18.11 END authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          for path, key in (
              (Path("docs/roadmap/R18_PLAN.md"), "PLAN_APPEND_B64"),
              (Path("docs/continuity/KODEPOIA_CONTINUITY.md"), "CONT_APPEND_B64"),
          ):
              path.write_bytes(path.read_bytes() + base64.b64decode(os.environ[key]))
          PY

      - name: Commit transport tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r18-11-end-sync-transport.yml
          git add docs/roadmap/R18_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git config user.name "LaurentCOLL1"
          git config user.email "128934707+LaurentCOLL1@users.noreply.github.com"
          git commit -m "R18.11 — prepare append-only END-sync tree"
          git push origin HEAD:r18/11-end-sync-transport
