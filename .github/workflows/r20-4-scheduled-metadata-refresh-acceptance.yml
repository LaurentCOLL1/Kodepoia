name: R20.4 Scheduled Metadata Refresh Acceptance

on:
  push:
    branches:
      - r20/04-scheduled-metadata-refresh
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r20-4-scheduled-metadata-refresh.yml
      - .github/workflows/r20-4-scheduled-metadata-refresh-acceptance.yml
      - .github/workflows/r0-bootstrap.yml
      - .github/workflows/python-core.yml
      - .github/workflows/ui-smoke.yml
      - configs/r16_supply_chain_policy.json
      - scripts/r16_9_supply_chain_acceptance.py
      - scripts/r20_4_scheduled_metadata_refresh.py
      - src/kodepoia/update/steady_state_refresh.py
      - tests/test_r20_4_steady_state_refresh.py
      - tests/test_supply_chain_r16_9.py
      - docs/continuity/KODEPOIA_CONTINUITY_R20.md
      - update-repository/metadata/snapshot.json
      - update-repository/metadata/timestamp.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r20-4-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  steady-state-contract:
    name: r20-4-contract-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile R20.4 sources
        run: >-
          python -m compileall -q
          src/kodepoia/update/steady_state_refresh.py
          scripts/r20_4_scheduled_metadata_refresh.py
          tests/test_r20_4_steady_state_refresh.py

      - name: Run Ruff R20.4
        run: >-
          python -m ruff check
          src/kodepoia/update/steady_state_refresh.py
          scripts/r20_4_scheduled_metadata_refresh.py
          tests/test_r20_4_steady_state_refresh.py

      - name: Run R20.4 and inherited online-signing regressions
        run: >-
          python -m pytest -q
          tests/test_r20_4_steady_state_refresh.py
          tests/test_r20_3_zero_cost_signing.py
          tests/test_r20_3_root_transition.py
          tests/test_r20_2_online_signing.py
          tests/test_r20_1_bridge_refresh.py
          tests/test_supply_chain_r16_9.py

      - name: Prove current production metadata is an idempotent no-op
        run: >-
          python scripts/r20_4_scheduled_metadata_refresh.py
          --mode check
          --reference-time 2026-09-10T18:00:00Z

      - name: Assert production check did not modify metadata
        shell: python
        run: |
          import subprocess

          changed = subprocess.check_output(
              ["git", "status", "--porcelain", "--", "update-repository/metadata"],
              text=True,
          ).strip()
          if changed:
              raise SystemExit(f"production no-op check modified metadata: {changed}")

      - name: Assert scheduled publication security contract
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/r20-4-scheduled-metadata-refresh.yml")
          text = path.read_text(encoding="utf-8")
          lowered = text.lower()
          required = (
              'cron: "17 */6 * * *"',
              "workflow_dispatch:",
              "group: r20-4-production-metadata-refresh",
              "cancel-in-progress: false",
              "environment: tuf-production-signing",
              "actions: write",
              "contents: write",
              "pull-requests: write",
              "tuf_snapshot_ed25519_seed_b64",
              "tuf_timestamp_ed25519_seed_b64",
              "r0-bootstrap.yml/dispatches",
              "repository-bootstrap-ubuntu-latest",
              "repository-bootstrap-windows-latest",
              "pulls/$pr_number/merge",
              'merge_method="merge"',
              "main advanced from",
              "unexpected refresh changes",
          )
          for marker in required:
              if marker not in lowered:
                  raise SystemExit(f"scheduled refresh workflow missing invariant: {marker}")

          check_prefix = lowered.split("sign-and-publish:", 1)[0]
          for secret in (
              "tuf_snapshot_ed25519_seed_b64",
              "tuf_timestamp_ed25519_seed_b64",
          ):
              if secret in check_prefix:
                  raise SystemExit(f"freshness-only job references signing secret: {secret}")

          forbidden = (
              "id-token: write",
              "pull_request_target",
              "upload-artifact",
              "git push origin head:main",
              "actions_allow_use_unsecure_node_version",
          )
          for marker in forbidden:
              if marker in lowered:
                  raise SystemExit(f"scheduled refresh workflow contains forbidden capability: {marker}")

      - name: Assert Node-24 exact pins are repository-governed
        shell: python
        run: |
          import json
          from pathlib import Path

          checkout = "3d3c42e5aac5ba805825da76410c181273ba90b1"
          setup_python = "5fda3b95a4ea91299a34e894583c3862153e4b97"
          old_checkout = "11d5960a326750d58380" + "78e36cf38b85af677262"
          old_setup_python = "a26af69be951a213d495" + "a4c3e4e4022e16d87065"
          policy = json.loads(Path("configs/r16_supply_chain_policy.json").read_text(encoding="utf-8"))
          pins = policy["external_action_pins"]
          if pins["actions/checkout"]["commit_sha"] != checkout:
              raise SystemExit("checkout Node-24 pin is not the governed R16.9 pin")
          if pins["actions/setup-python"]["commit_sha"] != setup_python:
              raise SystemExit("setup-python Node-24 pin is not the governed R16.9 pin")
          workflow_text = "\n".join(
              path.read_text(encoding="utf-8")
              for path in Path(".github/workflows").glob("*.yml")
          )
          if old_checkout in workflow_text or old_setup_python in workflow_text:
              raise SystemExit("deprecated Node-20 exact action pin remains in workflows")

      - name: Emit R20.4 acceptance summary
        shell: python
        run: |
          import json
          import os

          print(json.dumps({
              "format": "kodepoia-r20-4-scheduled-refresh-acceptance",
              "schema_version": 1,
              "source_sha": os.environ["EVIDENCE_SHA"].strip().lower(),
              "schedule_hours": 6,
              "schedule_minute": 17,
              "refresh_threshold_hours": 24,
              "snapshot_expiry_hours": 72,
              "timestamp_expiry_hours": 48,
              "atomic_publication_via_protected_pr": True,
              "required_repository_guard_dispatched": True,
              "live_signing_secrets_consumed": False,
              "release_assets_modified": False,
              "node24_pins_governed": True,
              "paid_provider_required": False,
              "status": "pass",
          }, indent=2, sort_keys=True))
