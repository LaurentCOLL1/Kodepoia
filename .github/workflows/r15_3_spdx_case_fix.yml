name: R15.3 SPDX case helper
on:
  push:
    branches: [r15/03-sanitization-governance]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/03-sanitization-governance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Align operator case semantics
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/kodepoia/experience/governance.py')
          s = p.read_text(encoding='utf-8')
          old = '_TOKEN = re.compile(r"\\(|\\)|\\bAND\\b|\\bOR\\b|\\bWITH\\b|[A-Za-z0-9][A-Za-z0-9.+:-]*")'
          new = ('_TOKEN = re.compile(\n'
                 '    r"\\(|\\)|(?<![A-Za-z0-9.+:-])(?:AND|and|OR|or|WITH|with)"\n'
                 '    r"(?![A-Za-z0-9.+:-])|[A-Za-z0-9][A-Za-z0-9.+:-]*"\n'
                 ')')
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '        if token in {"(", ")", "AND", "OR", "WITH"}:\n'
          new = '        if token in {"(", ")"} or token.upper() in {"AND", "OR", "WITH"}:\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '        return self.pos < len(self.tokens) and self.tokens[self.pos] == value\n'
          new = '        return self.pos < len(self.tokens) and self.tokens[self.pos].upper() == value\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '        token = self.tokens[self.pos]\n        self.pos += 1\n        return token\n\n\ndef assess_license'
          new = ('        token = self.tokens[self.pos]\n'
                 '        self.pos += 1\n'
                 '        upper = token.upper()\n'
                 '        return upper if upper in {"AND", "OR", "WITH"} else token\n\n\n'
                 'def assess_license')
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')

          t = Path('tests/test_experience_governance.py')
          ts = t.read_text(encoding='utf-8')
          anchor = '    assert result.operators == ("OR",)\n'
          assert ts.count(anchor) == 1
          ts = ts.replace(
              anchor,
              anchor
              + '    lower = assess_license("MIT or Apache-2.0", _policy())\n'
              + '    assert lower.decision is PolicyDecision.ALLOW\n'
              + '    assert lower.operators == ("OR",)\n',
              1,
          )
          t.write_text(ts, encoding='utf-8', newline='\n')
      - name: Verify focused suite
        run: |
          python -m pytest -q tests/test_experience_contracts.py tests/test_experience_collector.py tests/test_experience_governance.py
          python -m ruff check src/kodepoia/experience tests/test_experience_contracts.py tests/test_experience_collector.py tests/test_experience_governance.py
          python -m compileall -q src/kodepoia/experience
      - name: Commit correction and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15_3_spdx_case_fix.yml
          git add src/kodepoia/experience/governance.py tests/test_experience_governance.py
          git commit -m "fix(r15.3): accept SPDX operator case variants"
          git push origin HEAD:r15/03-sanitization-governance
