name: R14.5 PostgreSQL Patch Temp

on:
  push:
    branches:
      - r14/05-postgresql-persistence
    paths:
      - .github/r14-05-postgres-patch.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/05-postgresql-persistence
          fetch-depth: 0
      - name: Apply persistence hardening patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/kodepoia/backend/postgres.py')
          text = p.read_text(encoding='utf-8')

          old = '''    def digest(self) -> str:\n        return canonical_sha256(self.canonical())\n\n\n@dataclass(frozen=True, slots=True)\nclass PostgresMigrationRecord:'''
          new = '''    def digest(self) -> str:\n        return canonical_sha256(self.canonical())\n\n    def prefix_digest(self, sequence: int) -> str:\n        if isinstance(sequence, bool) or not isinstance(sequence, int) or not 1 <= sequence <= len(self.migrations):\n            raise PostgresPolicyError("migration prefix sequence is out of range")\n        payload = {\n            "schema_id": self.schema_id,\n            "migrations": [item.canonical() for item in self.migrations[:sequence]],\n        }\n        return canonical_sha256(payload)\n\n\n@dataclass(frozen=True, slots=True)\nclass PostgresMigrationRecord:'''
          if old not in text:
              raise SystemExit('prefix digest insertion marker not found')
          text = text.replace(old, new, 1)

          old = '''        kwargs: dict[str, Any] = {\n            "connect_timeout": self.policy.connect_timeout_s,\n            "application_name": self.policy.application_name,\n        }\n        if self.policy.ssl_required:\n            kwargs["sslmode"] = "require"\n        conn = self._connect_callable()(dsn, **kwargs)\n        try:\n            with conn.cursor() as cur:\n                cur.execute("SET statement_timeout = %s", (self.policy.statement_timeout_ms,))\n                cur.execute("SET lock_timeout = %s", (self.policy.lock_timeout_ms,))\n                cur.execute(\n                    "SET idle_in_transaction_session_timeout = %s",\n                    (self.policy.idle_transaction_timeout_ms,),\n                )\n            yield conn\n        finally:\n            conn.close()'''
          new = '''        options = (\n            f"-c statement_timeout={self.policy.statement_timeout_ms} "\n            f"-c lock_timeout={self.policy.lock_timeout_ms} "\n            f"-c idle_in_transaction_session_timeout={self.policy.idle_transaction_timeout_ms}"\n        )\n        kwargs: dict[str, Any] = {\n            "connect_timeout": self.policy.connect_timeout_s,\n            "application_name": self.policy.application_name,\n            "options": options,\n        }\n        if self.policy.ssl_required:\n            kwargs["sslmode"] = "require"\n        conn = self._connect_callable()(dsn, **kwargs)\n        try:\n            yield conn\n        finally:\n            conn.close()'''
          if old not in text:
              raise SystemExit('connect policy marker not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              'if record.schema_digest != plan.digest():\n                raise PostgresStateError("migration schema digest drift detected")',
              'if record.schema_digest != plan.prefix_digest(record.sequence):\n                raise PostgresStateError("migration schema digest drift detected")',
              1,
          )
          text = text.replace(
              '(migration.migration_id, migration.sequence, migration.checksum, plan.digest()),',
              '(migration.migration_id, migration.sequence, migration.checksum, plan.prefix_digest(migration.sequence)),',
              1,
          )
          text = text.replace(
              'if not retryable or attempts > policy.max_retries + 1:',
              'if not retryable or attempts > policy.max_retries:',
              1,
          )
          p.write_text(text, encoding='utf-8', newline='\n')

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          marker = '[project.optional-dependencies]\nui = ["PySide6>=6.10,<7"]\n'
          replacement = '[project.optional-dependencies]\nui = ["PySide6>=6.10,<7"]\npostgres = ["psycopg[binary]>=3.2,<4"]\n'
          if marker not in text:
              raise SystemExit('pyproject optional dependency marker not found')
          text = text.replace(marker, replacement, 1)
          pyproject.write_text(text, encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/r14-05-postgres-patch-temp.yml .github/r14-05-postgres-patch.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/kodepoia/backend/postgres.py pyproject.toml
          git commit -m "R14.5 harden PostgreSQL transaction and migration policies"
          git push origin HEAD:r14/05-postgresql-persistence
