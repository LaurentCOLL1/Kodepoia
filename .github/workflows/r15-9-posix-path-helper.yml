name: R15.9 Canonical Path Helper

on:
  push:
    paths:
      - '.github/workflows/r15-9-posix-path-helper.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/09-qlora-sft
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonicalize repository-relative evidence paths
        shell: python
        run: |
          from pathlib import Path

          training = Path('src/kodepoia/tuning/training.py')
          text = training.read_text(encoding='utf-8')
          replacements = {
              'str(resume_checkpoint.relative_to(root))': 'resume_checkpoint.relative_to(root).as_posix()',
              '"run_dir": str(run_dir.relative_to(root)),': '"run_dir": run_dir.relative_to(root).as_posix(),',
              'adapter_path=str(adapter_path.relative_to(self.root)),': 'adapter_path=adapter_path.relative_to(self.root).as_posix(),',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'training canonical path marker count != 1: {old}')
              text = text.replace(old, new, 1)
          training.write_text(text, encoding='utf-8', newline='\n')

          worker = Path('src/kodepoia/tuning/train_worker.py')
          text = worker.read_text(encoding='utf-8')
          replacements = {
              '"artifact_path": str(tensor_path.relative_to(root)),': '"artifact_path": tensor_path.relative_to(root).as_posix(),',
              'record["metadata_path"] = str(metadata_path.relative_to(root))': 'record["metadata_path"] = metadata_path.relative_to(root).as_posix()',
              '"adapter_path": str(adapter_path.relative_to(root)),': '"adapter_path": adapter_path.relative_to(root).as_posix(),',
              '"artifact_path": str(adapter.relative_to(root)),': '"artifact_path": adapter.relative_to(root).as_posix(),',
          }
          for old, new in replacements.items():
              count = text.count(old)
              expected = 2 if old == '"adapter_path": str(adapter_path.relative_to(root)),' else 1
              if count != expected:
                  raise SystemExit(f'worker canonical path marker count {count} != {expected}: {old}')
              text = text.replace(old, new)
          worker.write_text(text, encoding='utf-8', newline='\n')
      - name: Validate on core-only Ubuntu environment
        run: |
          python -m pip install -e '.[dev]'
          ruff format src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py
          ruff check src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py tests/test_tuning_r15_9.py
          python -m compileall -q src/kodepoia/tuning
          pytest -q tests/test_tuning_r15_8.py tests/test_tuning_r15_9.py
      - name: Commit canonical paths and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/r15-9-posix-path-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py .github/workflows/r15-9-posix-path-helper.yml
          git diff --cached --check
          git commit -m 'fix(r15.9): canonicalize evidence paths across platforms'
          git push origin HEAD:r15/09-qlora-sft
