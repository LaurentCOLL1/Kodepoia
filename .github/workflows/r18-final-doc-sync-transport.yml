name: R18 Final Documentation Sync Transport

on:
  push:
    branches:
      - docs/r18-final-state-sync-transport

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/r18-final-state-sync-transport
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact final-state sync
        run: python .github/scripts/r18_final_doc_sync_transport.py
      - name: Materialize clean documentation tree
        run: |
          rm .github/workflows/r18-final-doc-sync-transport.yml
          rm .github/scripts/r18_final_doc_sync_transport.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap/R18_PLAN.md .github/workflows/r18-final-doc-sync-transport.yml .github/scripts/r18_final_doc_sync_transport.py
          git diff --cached --name-only
          git commit -m "docs: synchronize final R18 state"
          git push origin HEAD:docs/r18-final-state-sync-transport
