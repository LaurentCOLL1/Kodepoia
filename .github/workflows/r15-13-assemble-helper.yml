name: R15.13 Bounded Implementation Assembly
# Retrigger after target workflow pre-created via authorized API.

on:
  push:
    branches: [r15/13-ollama-import-packaging]
    paths:
      - '.github/workflows/r15-13-assemble-helper.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/13-ollama-import-packaging
          fetch-depth: 0
      - name: Verify helper head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Assemble bounded R15.13 implementation
        shell: python
        run: |
          import base64
          import gzip
          from pathlib import Path

          payloads = {
              "src/kodepoia/tuning/ollama_packaging.py": "",
              "tests/test_ollama_packaging_r15_13.py": "",
              "schemas/r15-13-ollama-package.schema.json": "",
              ".github/workflows/r15-13-ollama-packaging.yml": "",
          }
          for name, payload in payloads.items():
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(gzip.decompress(base64.b64decode(payload)))
      - name: Commit assembled implementation and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r15-13-assemble-helper.yml
          git add src/kodepoia/tuning/ollama_packaging.py
          git add tests/test_ollama_packaging_r15_13.py
          git add schemas/r15-13-ollama-package.schema.json
          git add .github/workflows/r15-13-ollama-packaging.yml
          git diff --cached --check
          git commit -m 'feat(r15.13): implement governed Ollama packaging'
          git push origin HEAD:r15/13-ollama-import-packaging
