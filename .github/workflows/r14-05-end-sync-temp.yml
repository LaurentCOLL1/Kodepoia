name: R14.5 END Sync Temp

on:
  push:
    branches: ["r14/05-postgresql-persistence"]
    paths: [".github/r14-05-end-sync.trigger"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/05-postgresql-persistence
          fetch-depth: 0
      - name: Apply governed END-sync
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          TECH = "3273ac50b43b64f6f365522f170765f44f45eedf"
          R0 = "R0 Repository Guard #1787 / `33190672723`"
          PY = "Python Core #1761 / `33190672676`"
          UI = "KodeStudio UI Smoke #1728 / `33190672761`"
          PG = "R14 PostgreSQL Acceptance #1 / `33190672769`"

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected marker exactly once, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          plan = "docs/roadmap/R14_PLAN.md"
          replace_once(
              plan,
              "**Execution checkpoint:** R1–R13 are COMPLETE + NORMALIZED; R14 planning is ACCEPTED + NORMALIZED. R14.1–R14.4 are COMPLETE + NORMALIZED. R14.4 normalization head `8601ac19b87635648aef1c5f5c37a6cb899c26be` passed R0 #1785 / `33189536524`, Python Core #1759 / `33189536553`, and UI #1726 / `33189536543`, all SUCCESS; normalization PR #264 merged as normalized `main` `45dc68f1cd3bf05c62aede1b2519c6c513c67166`. R14.5 is IN_PROGRESS on `r14/05-postgresql-persistence` from that exact normalized main; R14.6–R14.17 remain PLANNED. R14.5 core manual state is NONE.",
              "**Execution checkpoint:** R1–R13 are COMPLETE + NORMALIZED; R14 planning is ACCEPTED + NORMALIZED. R14.1–R14.4 are COMPLETE + NORMALIZED. R14.5 accepted immutable technical source `3273ac50b43b64f6f365522f170765f44f45eedf` passed R0 #1787 / `33190672723`, Python Core #1761 / `33190672676`, KodeStudio UI Smoke #1728 / `33190672761`, and R14 PostgreSQL Acceptance #1 / `33190672769`, all SUCCESS. R14.5 is COMPLETE at technical/evidence level on PR #265; R14.6–R14.17 remain PLANNED until final END-head re-gates, expected-head merge and the single continuity-only normalization. R14.5 core manual state is NONE."
          )
          replace_once(
              plan,
              "| R14.5 | PostgreSQL authoritative persistence, migrations, transactions + concurrency | IN_PROGRESS | NONE | R14.1–R14.3 + R8/R12 |",
              "| R14.5 | PostgreSQL authoritative persistence, migrations, transactions + concurrency | COMPLETE | NONE | R14.1–R14.3 + R8/R12 |"
          )
          replace_once(
              plan,
              "## Completion record\n\nTo be appended when accepted.\n\n---\n\n# R14.6 — Authoritative server command/state model + real-time transport/trust boundary",
              "## Completion record\n\n- Accepted immutable technical source: `3273ac50b43b64f6f365522f170765f44f45eedf`.\n- Technical exact-head gates: R0 Repository Guard #1787 / `33190672723` SUCCESS; Python Core #1761 / `33190672676` SUCCESS; KodeStudio UI Smoke #1728 / `33190672761` SUCCESS; R14 PostgreSQL Acceptance #1 / `33190672769` SUCCESS.\n- Ubuntu full Python suite: 1509 passed, 13 skipped, 46 warnings; Windows Core suite also SUCCESS; both package builds and Python internal UI smoke SUCCESS.\n- PostgreSQL focused acceptance: 44 R14.5/R14.4/R14.3 tests passed against PostgreSQL 18.6 (`server_version_num=180006`, stable_supported=true).\n- Real PostgreSQL acceptance checks all true: fresh apply, rollback/reapply, transaction atomicity, optimistic conflict, row lock, idempotency, bounded retry and backup/restore. A real PostgreSQL `40P01` deadlock was provoked and detected.\n- Migration plan digest: `b96484ae6d56fe54b013b975572310d8daf44cf43116c5c43edc73845856b71b`; restore digest: `bcc5ae8b707231568263e0f52c8426dd956a67e4e131bcf97becb4b45ccb9f6e`; evidence reports `secrets_exposed=false`.\n- Stable external baseline at acceptance: PostgreSQL 18.6 released 2026-08-13; PostgreSQL 19 Beta 3 remains pre-release/testing-only.\n- Manual intervention: NONE.\n- Current subdivision status: `COMPLETE` at technical/evidence level. R14.6 remains `PLANNED` until final END re-gates, PR #265 expected-head merge and exactly one continuity-only normalization.\n\n---\n\n# R14.6 — Authoritative server command/state model + real-time transport/trust boundary"
          )

          acceptance = "docs/roadmap/R14_5_ACCEPTANCE.md"
          replace_once(
              acceptance,
              "## Technical evidence\n\nTo be filled only after the immutable technical head passes all fresh exact-head gates.",
              "## Technical evidence\n\n- Immutable source SHA: `3273ac50b43b64f6f365522f170765f44f45eedf`.\n- R0 Repository Guard #1787 / `33190672723`: SUCCESS on Ubuntu and Windows.\n- Python Core #1761 / `33190672676`: SUCCESS; Ubuntu full suite 1509 passed / 13 skipped / 46 warnings; Windows Core, both package builds and internal UI smoke also SUCCESS.\n- KodeStudio UI Smoke #1728 / `33190672761`: SUCCESS.\n- R14 PostgreSQL Acceptance #1 / `33190672769`: SUCCESS against PostgreSQL 18.6 (`server_version_num=180006`, `stable_supported=true`).\n- Focused PostgreSQL gate: 44 tests passed.\n- Functional checks: `fresh_apply=true`, `rollback_reapply=true`, `atomicity=true`, `optimistic_conflict=true`, `row_lock=true`, `idempotency=true`, `bounded_retry=true`, `backup_restore=true`.\n- PostgreSQL server logs confirm a real `40P01` deadlock was generated and detected during acceptance.\n- Migration-plan digest: `b96484ae6d56fe54b013b975572310d8daf44cf43116c5c43edc73845856b71b`.\n- Restore digest: `bcc5ae8b707231568263e0f52c8426dd956a67e4e131bcf97becb4b45ccb9f6e`.\n- Evidence is bound to the immutable source SHA, validates against the Draft 2020-12 evidence schema and reports `secrets_exposed=false`.\n- Manual intervention: NONE."
          )

          continuity = "docs/continuity/KODEPOIA_CONTINUITY.md"
          replace_once(
              continuity,
              "> Kodepoia, architecture v1.0 gelée. **R1–R13 COMPLETE + NORMALIZED. R14 planning ACCEPTED + NORMALIZED. R14.1–R14.4 COMPLETE + NORMALIZED. R14.5 IN_PROGRESS on `r14/05-postgresql-persistence`; R14.6–R14.17 remain PLANNED.** R14.4 normalization head `8601ac19b87635648aef1c5f5c37a6cb899c26be` passed R0 #1785 / `33189536524`, Python Core #1759 / `33189536553`, and UI #1726 / `33189536543`; PR #264 merged as normalized `main` `45dc68f1cd3bf05c62aede1b2519c6c513c67166`. R14.5 starts exactly there and targets stable PostgreSQL 18.x; core manual state is NONE.",
              "> Kodepoia, architecture v1.0 gelée. **R1–R13 COMPLETE + NORMALIZED. R14 planning ACCEPTED + NORMALIZED. R14.1–R14.4 COMPLETE + NORMALIZED. R14.5 is COMPLETE at technical/evidence level on PR #265; R14.6–R14.17 remain PLANNED pending R14.5 final END re-gates, expected-head merge and one continuity-only normalization.** R14.5 immutable technical source `3273ac50b43b64f6f365522f170765f44f45eedf` passed R0 #1787 / `33190672723`, Python Core #1761 / `33190672676`, UI #1728 / `33190672761`, and PostgreSQL Acceptance #1 / `33190672769`, all SUCCESS. PostgreSQL evidence used 18.6 (`180006`) with all eight functional checks true, real deadlock detection and `secrets_exposed=false`. Manual state: NONE."
          )
          replace_once(
              continuity,
              "- R14 planning: **ACCEPTED + NORMALIZED**. R14.1–R14.4 are **COMPLETE + NORMALIZED**. R14.4 normalization head **`8601ac19b87635648aef1c5f5c37a6cb899c26be`** passed R0 #1785 / `33189536524`, Python #1759 / `33189536553`, UI #1726 / `33189536543`; PR #264 merged as normalized **`main` `45dc68f1cd3bf05c62aede1b2519c6c513c67166`**. R14.5 is **IN_PROGRESS** on `r14/05-postgresql-persistence`; R14.6–R14.17 remain PLANNED. Manual for R14.5: **NONE**.",
              "- R14 planning: **ACCEPTED + NORMALIZED**. R14.1–R14.4 are **COMPLETE + NORMALIZED**. R14.5 accepted immutable technical source **`3273ac50b43b64f6f365522f170765f44f45eedf`** passed R0 #1787 / `33190672723`, Python #1761 / `33190672676`, UI #1728 / `33190672761`, and PostgreSQL Acceptance #1 / `33190672769`, all SUCCESS. R14.5 is **COMPLETE** at technical/evidence level on PR #265; R14.6–R14.17 remain PLANNED until final END re-gates, expected-head merge and single continuity-only normalization. Manual for R14.5: **NONE**."
          )
          replace_once(
              continuity,
              "- Manual intervention: **NONE**.\n\n## R14.1 post-merge normalization authority",
              "- Manual intervention: **NONE**.\n- Accepted immutable technical source: `3273ac50b43b64f6f365522f170765f44f45eedf`.\n- Technical gates: R0 #1787 / `33190672723`, Python Core #1761 / `33190672676`, UI #1728 / `33190672761`, PostgreSQL Acceptance #1 / `33190672769`, all SUCCESS.\n- Ubuntu full suite: 1509 passed / 13 skipped / 46 warnings. PostgreSQL focused suite: 44 passed against PostgreSQL 18.6 (`180006`). All eight persistence checks passed; migration digest `b96484ae6d56fe54b013b975572310d8daf44cf43116c5c43edc73845856b71b`, restore digest `bcc5ae8b707231568263e0f52c8426dd956a67e4e131bcf97becb4b45ccb9f6e`, no secrets exposed.\n- Current R14.5 status: `COMPLETE` at technical/evidence level. R14.6 remains PLANNED until final END exact-head gates, PR #265 merge with expected-head protection and exactly one continuity-only normalization.\n\n## R14.1 post-merge normalization authority"
          )
          PY

          git rm .github/workflows/r14-05-end-sync-temp.yml .github/r14-05-end-sync.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/roadmap/R14_PLAN.md docs/roadmap/R14_5_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/r14-05-end-sync.trigger' '.github/workflows/r14-05-end-sync-temp.yml' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R14_5_ACCEPTANCE.md' 'docs/roadmap/R14_PLAN.md' | sort)"
          test "$staged" = "$expected"
          git commit -m "R14.5 END-sync acceptance evidence"
          changed="$(git diff --name-only 3273ac50b43b64f6f365522f170765f44f45eedf..HEAD | sort)"
          expected_changed="$(printf '%s\n' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R14_5_ACCEPTANCE.md' 'docs/roadmap/R14_PLAN.md' | sort)"
          test "$changed" = "$expected_changed"
          git push origin HEAD:r14/05-postgresql-persistence
