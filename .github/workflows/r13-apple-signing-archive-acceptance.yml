name: R13 Apple Signing Archive Acceptance

on:
  push:
    branches:
      - "r13/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r13-apple-signing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-apple-signing-archive:
    name: apple-signing-archive-macos-26
    runs-on: macos-26
    timeout-minutes: 25
    env:
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Kodepoia evidence dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused R13.10 Apple signing/archive tests
        run: python -m pytest tests/test_r13_10_apple_signing_archive.py -q

      - name: Build unsigned simulator and archive fixture
        run: >-
          python scripts/r13_10_apple_signing_acceptance.py
          --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}"
          --output "${{ runner.temp }}/R13_10_APPLE_SIGNING_ARCHIVE.json"

      - name: Verify exact-head non-production evidence
        run: >-
          python -c "import json,os,pathlib; p=json.loads(pathlib.Path(r'${{ runner.temp }}/R13_10_APPLE_SIGNING_ARCHIVE.json').read_text(encoding='utf-8')); assert p['source_sha']==os.environ['KODEPOIA_SOURCE_SHA']; assert p['simulator_build_succeeded'] is True; assert p['unsigned_archive_succeeded'] is True; assert p['archive_info_present'] is True; assert p['archive_product_present'] is True; assert p['code_signing_allowed'] is False; assert p['code_signing_required'] is False; assert p['archive_metadata_readiness']=='DISTRIBUTION_CREDENTIALS_REQUIRED'; assert p['distribution_signing_capable'] is False; assert p['distribution_credentials_required'] is True; assert p['export_method']=='APP_STORE_CONNECT'; assert p['export_options_prepared'] is True; assert p['export_attempted'] is False; assert p['account_or_signing_credential_used'] is False; assert p['physical_device_capability_proven'] is False; assert p['live_app_store_acceptance_claimed'] is False; assert p['blockers']==[]"

      - name: Upload exact-head Apple signing/archive evidence
        uses: actions/upload-artifact@v4
        with:
          name: r13-10-apple-signing-${{ runner.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          if-no-files-found: error
          path: ${{ runner.temp }}/R13_10_APPLE_SIGNING_ARCHIVE.json
