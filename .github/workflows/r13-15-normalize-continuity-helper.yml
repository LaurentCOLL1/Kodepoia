name: R13.15 Normalize Continuity Helper

on:
  push:
    branches:
      - r13/15-normalize-continuity

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message != 'R13.15 continuity normalization via CI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r13/15-normalize-continuity
          fetch-depth: 0
      - name: Normalize continuity exactly
        shell: python
        run: |
          from pathlib import Path

          FINAL = 'a6109e2d6f1a093bc709eb8385d8f0ce8dac0341'
          MERGE = 'a92f5b1e31f09f37320e0759f7633569b9125487'
          R0 = '#1718 / `33098494117`'
          PY = '#1692 / `33098494367`'
          UI = '#1659 / `33098494215`'

          def one(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          path = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          c = path.read_text(encoding='utf-8')

          old_prompt = "> Kodepoia, architecture v1.0 gelée. **R1–R12 COMPLETE + NORMALIZED. R13 planning ACCEPTED + NORMALIZED. R13.1–R13.14 COMPLETE + NORMALIZED. R13.15 COMPLETE / END-SYNCED on dedicated branch `r13/15-store-compliance-engine`; implementation merge + single continuity-only normalization PENDING. R13.16–R13.17 PLANNED / NOT STARTED.** Authorized normalized base is `80e9ae84f4c9edd8b2e41eadb93310abae6e442f`. Accepted technical candidate `dc9e04b1d0170b889ae02231a68304e7b7a11c60` passed exact-head R0 #1715 / `33097922318`, Python Core #1689 / `33097922338`, and UI #1656 / `33097922322`, all SUCCESS. Core is deterministic/versioned store-readiness evidence with source provenance/dates/scopes, current/future/expired/stale/unofficial truthfulness, conflicts, Google/Apple facts, SDK inventory, account-only confirmations and no legal/live-account claim. Manual remains NONE. Because end-sync documentation changed bytes, PR #249 may merge only after fresh R0 + full Python Core + UI Smoke pass on the same final exact head, followed by exactly one continuity-only normalization before R13.16."
          new_prompt = f"> Kodepoia, architecture v1.0 gelée. **R1–R12 COMPLETE + NORMALIZED. R13 planning ACCEPTED + NORMALIZED. R13.1–R13.14 COMPLETE + NORMALIZED. R13.15 COMPLETE / IMPLEMENTATION MERGED; single continuity-only normalization IN_PROGRESS on `r13/15-normalize-continuity`. R13.16–R13.17 PLANNED / NOT STARTED.** Final R13.15 end-synchronized head `{FINAL}` passed exact-head R0 {R0}, Python Core {PY}, and UI {UI}, all SUCCESS; implementation PR #249 merged with `expected_head_sha={FINAL}` as `{MERGE}`. This branch is the single allowed continuity-only normalization and must change exactly `docs/continuity/KODEPOIA_CONTINUITY.md`; only after this normalization head passes fresh R0 + full Python Core + UI Smoke and its PR merges with `expected_head_sha` may R13.16 start. Manual remains NONE."
          c = one(c, old_prompt, new_prompt, 'prompt')

          c = one(
              c,
              "- R13.15: **COMPLETE / END-SYNCED; MERGE + NORMALIZATION PENDING** on `r13/15-store-compliance-engine`. Accepted technical candidate **`dc9e04b1d0170b889ae02231a68304e7b7a11c60`**. Manual **NONE**.",
              f"- R13.15: **COMPLETE / IMPLEMENTATION MERGED; SINGLE CONTINUITY-ONLY NORMALIZATION IN PROGRESS**. Final accepted end-synchronized head **`{FINAL}`**; implementation merge **`{MERGE}`** from PR #249. Manual **NONE**.",
              'global status',
          )

          c = one(c, "## R13.15 end-sync authority", "## R13.15 normalization authority", 'heading')
          c = one(
              c,
              "- Status: **COMPLETE / END-SYNCED; IMPLEMENTATION MERGE + SINGLE NORMALIZATION PENDING**. R13.16–R13.17 remain **PLANNED / NOT STARTED**.",
              "- Status: **COMPLETE / IMPLEMENTATION MERGED; SINGLE CONTINUITY-ONLY NORMALIZATION IN PROGRESS**. R13.16–R13.17 remain **PLANNED / NOT STARTED**.",
              'authority status',
          )

          old_record = "- Accepted exact-head technical candidate **`dc9e04b1d0170b889ae02231a68304e7b7a11c60`** passed R0 Repository Guard #1715 / `33097922318`, Python Core #1689 / `33097922338`, and KodeStudio UI Smoke #1656 / `33097922322`, all SUCCESS. Full Python Core passed Ubuntu/Windows tests, both package builds and internal UI smoke. Google Play Readiness #179 / `33097922247` and Apple Xcode Acceptance #162 / `33097922206` also passed as directly relevant regressions. Durable `store-compliance-v1` output embeds applicable source evidence and enforces currentness/conflict/account boundaries, SDK accounting, deterministic digests, `legal_certification=false` and `live_account_query_attempted=false`. Because end-sync documentation changes bytes, fresh R0 + full Python Core + UI Smoke must pass on the final head before PR #249 may merge with `expected_head_sha`; then exactly one continuity-only normalization is required before R13.16."
          new_record = f"- Accepted technical candidate **`dc9e04b1d0170b889ae02231a68304e7b7a11c60`** first passed R0 #1715 / `33097922318`, Python Core #1689 / `33097922338`, and UI #1656 / `33097922322`. Final end-synchronized head **`{FINAL}`** then passed fresh exact-head R0 {R0}, Python Core {PY}, and KodeStudio UI Smoke {UI}, all SUCCESS; Google Play Readiness #184 / `33098494495` and Apple Xcode Acceptance #167 / `33098494315` also passed as directly relevant regressions. PR #249 merged with **`expected_head_sha={FINAL}`** as implementation merge **`{MERGE}`**. This branch **`r13/15-normalize-continuity`** was created exactly from that merge and is the single allowed continuity-only normalization. Durable `store-compliance-v1` semantics remain unchanged: provider-scoped dated evidence, explicit current/future/expired/stale/unofficial states, fail-closed conflicts, SDK accounting, account-only confirmations, deterministic digests, `legal_certification=false`, and `live_account_query_attempted=false`."
          c = one(c, old_record, new_record, 'accepted record')

          c = one(
              c,
              "| R13.15 | Current store compliance engine: privacy, ratings, permissions, SDK/policy evidence | PLANNED | NONE |",
              "| R13.15 | Current store compliance engine: privacy, ratings, permissions, SDK/policy evidence | COMPLETE | NONE |",
              'frozen index',
          )

          old_next = "Freeze the final R13.15 end-synchronized branch head. Run fresh exact-head **R0 Repository Guard + full Python Core + KodeStudio UI Smoke** on that same SHA. If all three are SUCCESS, merge implementation PR #249 with `expected_head_sha=<final-head>`. Then create exactly one branch from the implementation merge for continuity-only normalization, verify the diff is exactly `docs/continuity/KODEPOIA_CONTINUITY.md`, run fresh exact-head R0 + Python + UI, and merge that normalization PR with `expected_head_sha`. Only the resulting normalized `main` authorizes R13.16. Manual remains NONE."
          new_next = "Freeze this single R13.15 continuity-only normalization head and verify its diff against implementation merge `a92f5b1e31f09f37320e0759f7633569b9125487` is exactly `docs/continuity/KODEPOIA_CONTINUITY.md`. Run fresh exact-head **R0 Repository Guard + full Python Core + KodeStudio UI Smoke**. If all three are SUCCESS, merge the normalization PR with `expected_head_sha`. Only the resulting normalized `main` authorizes R13.16 to start on its own dedicated branch with start plan+continuity synchronization. If any normalization gate fails, correct only continuity and rerun all three; manual remains NONE."
          c = one(c, old_next, new_next, 'next action')

          path.write_text(c, encoding='utf-8')
      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --quiet && exit 0
          git commit -m "R13.15 continuity normalization via CI"
          git push origin HEAD:r13/15-normalize-continuity
