name: R17 Windows Installer

on:
  push:
    branches:
      - "r17/**"
      - "release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r17-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    env:
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KODEPOIA_LOCALE: fr
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:KODEPOIA_SOURCE_SHA) {
            throw "Expected $env:KODEPOIA_SOURCE_SHA, got $actual"
          }

      - name: Install test and packaging dependencies
        run: python -m pip install -e ".[dev,ui,code,packaging]"

      - name: Run focused R17 tests
        run: pytest tests/test_r17_guided_ux.py

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build KodepoiaSetup.exe
        shell: pwsh
        run: ./scripts/build_windows_installer.ps1 -Version "1.1.0-rc1"

      - name: Assert installer output
        shell: pwsh
        run: |
          $setup = Resolve-Path "dist/windows/KodepoiaSetup.exe"
          if ((Get-Item $setup).Length -le 0) { throw "Installer is empty" }
          Get-FileHash $setup -Algorithm SHA256
          Get-Content "dist/windows/installer-manifest.json"

      - name: Silent clean-environment install, packaged UI smoke and uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "Kodepoia-installed"
          $smokeDir = Join-Path $env:RUNNER_TEMP "Kodepoia-smoke-cwd"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null

          $process = Start-Process -FilePath "dist/windows/KodepoiaSetup.exe" -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/MERGETASKS=!desktopicon",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }

          $exe = Join-Path $installDir "KodepoiaStudio.exe"
          if (-not (Test-Path $exe)) { throw "Installed KodepoiaStudio.exe missing" }
          $uninstall = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstall)) { throw "Uninstaller missing" }

          # Prove the installed application starts independently of the repository
          # checkout and without a developer Python/pip being visible on PATH.
          $originalPath = $env:PATH
          $originalPythonHome = $env:PYTHONHOME
          $originalPythonPath = $env:PYTHONPATH
          $env:PATH = @(
            (Join-Path $env:SystemRoot "System32"),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot "System32\Wbem")
          ) -join ";"
          $env:PYTHONHOME = $null
          $env:PYTHONPATH = $null
          try {
            if (Get-Command python.exe -ErrorAction SilentlyContinue) {
              throw "Developer Python is still visible during packaged smoke"
            }
            if (Get-Command pip.exe -ErrorAction SilentlyContinue) {
              throw "Developer pip is still visible during packaged smoke"
            }
            $smokeProcess = Start-Process -FilePath $exe -ArgumentList @("--smoke-test") -WorkingDirectory $smokeDir -Wait -PassThru
            if ($smokeProcess.ExitCode -ne 0) {
              throw "Packaged KodeStudio smoke failed with $($smokeProcess.ExitCode)"
            }
          }
          finally {
            $env:PATH = $originalPath
            $env:PYTHONHOME = $originalPythonHome
            $env:PYTHONPATH = $originalPythonPath
          }

          $uninstallProcess = Start-Process -FilePath $uninstall -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller failed" }

          for ($attempt = 0; $attempt -lt 40 -and (Test-Path $exe); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $exe) {
            throw "KodepoiaStudio.exe still exists after successful uninstaller exit"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KodepoiaSetup-Windows
          if-no-files-found: error
          path: |
            dist/windows/KodepoiaSetup.exe
            dist/windows/installer-manifest.json
