name: R14.5 Continuity Normalize Temp

on:
  push:
    branches: ["r14/05-continuity-normalization"]
    paths: [".github/r14-05-normalize.trigger"]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/05-continuity-normalization
          fetch-depth: 0
      - name: Normalize R14.5 continuity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          text = path.read_text(encoding="utf-8")

          def once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected marker once, found {count}: {old[:120]!r}")
              text = text.replace(old, new, 1)

          once(
              "> Kodepoia, architecture v1.0 gelée. **R1–R13 COMPLETE + NORMALIZED. R14 planning ACCEPTED + NORMALIZED. R14.1–R14.4 COMPLETE + NORMALIZED. R14.5 is COMPLETE at technical/evidence level on PR #265; R14.6–R14.17 remain PLANNED pending R14.5 final END re-gates, expected-head merge and one continuity-only normalization.** R14.5 immutable technical source `3273ac50b43b64f6f365522f170765f44f45eedf` passed R0 #1787 / `33190672723`, Python Core #1761 / `33190672676`, UI #1728 / `33190672761`, and PostgreSQL Acceptance #1 / `33190672769`, all SUCCESS. PostgreSQL evidence used 18.6 (`180006`) with all eight functional checks true, real deadlock detection and `secrets_exposed=false`. Manual state: NONE.",
              "> Kodepoia, architecture v1.0 gelée. **R1–R13 COMPLETE + NORMALIZED. R14 planning ACCEPTED + NORMALIZED. R14.1–R14.4 COMPLETE + NORMALIZED. R14.5 becomes COMPLETE + NORMALIZED upon merge of the single continuity-only normalization PR from `r14/05-continuity-normalization`; R14.6–R14.17 remain PLANNED until then.** R14.5 immutable technical source `3273ac50b43b64f6f365522f170765f44f45eedf` passed R0 #1787 / `33190672723`, Python Core #1761 / `33190672676`, UI #1728 / `33190672761`, and PostgreSQL Acceptance #1 / `33190672769`; final END-head `9606436453c6cc2bed90120bc3f9069311ef65e0` passed fresh R0 #1791 / `33191315047`, Python #1765 / `33191315090`, UI #1732 / `33191315092`, and PostgreSQL Acceptance #5 / `33191315129`, all SUCCESS. PR #265 merged with expected-head protection as `39d8aa12e3d36a618376f7060d1088f9fe61ba32`. Manual state: NONE."
          )
          once(
              "- R14 planning: **ACCEPTED + NORMALIZED**. R14.1–R14.4 are **COMPLETE + NORMALIZED**. R14.5 accepted immutable technical source **`3273ac50b43b64f6f365522f170765f44f45eedf`** passed R0 #1787 / `33190672723`, Python #1761 / `33190672676`, UI #1728 / `33190672761`, and PostgreSQL Acceptance #1 / `33190672769`, all SUCCESS. R14.5 is **COMPLETE** at technical/evidence level on PR #265; R14.6–R14.17 remain PLANNED until final END re-gates, expected-head merge and single continuity-only normalization. Manual for R14.5: **NONE**.",
              "- R14 planning: **ACCEPTED + NORMALIZED**. R14.1–R14.4 are **COMPLETE + NORMALIZED**. R14.5 final END-head **`9606436453c6cc2bed90120bc3f9069311ef65e0`** passed R0 #1791 / `33191315047`, Python #1765 / `33191315090`, UI #1732 / `33191315092`, and PostgreSQL Acceptance #5 / `33191315129`, all SUCCESS; PR #265 merged as **`39d8aa12e3d36a618376f7060d1088f9fe61ba32`**. Single continuity-only normalization is in progress on `r14/05-continuity-normalization`; after its fresh gates and expected-head merge R14.5 is **COMPLETE + NORMALIZED** and R14.6 is authorized. R14.6–R14.17 otherwise remain PLANNED. Manual for R14.5: **NONE**."
          )
          once(
              "- Current R14.5 status: `COMPLETE` at technical/evidence level. R14.6 remains PLANNED until final END exact-head gates, PR #265 merge with expected-head protection and exactly one continuity-only normalization.",
              "- Final END-synchronized head: `9606436453c6cc2bed90120bc3f9069311ef65e0`; relative to the immutable technical source only `docs/roadmap/R14_PLAN.md`, `docs/roadmap/R14_5_ACCEPTANCE.md`, and continuity changed.\n- Final exact-head re-gates: R0 #1791 / `33191315047`, Python Core #1765 / `33191315090`, UI #1732 / `33191315092`, and PostgreSQL Acceptance #5 / `33191315129`, all SUCCESS.\n- Implementation/evidence PR #265 merged with `expected_head_sha=9606436453c6cc2bed90120bc3f9069311ef65e0` as `39d8aa12e3d36a618376f7060d1088f9fe61ba32`.\n- Single authorized normalization branch: `r14/05-continuity-normalization`, created exactly from that merge. Its cumulative diff MUST contain exactly `docs/continuity/KODEPOIA_CONTINUITY.md`. This candidate declares the resulting main state **R14.5 COMPLETE + NORMALIZED** and authorizes R14.6 only after fresh R0 + full Python Core + KodeStudio UI Smoke and expected-head merge."
          )

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          git rm .github/workflows/r14-05-normalize-temp.yml .github/r14-05-normalize.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/r14-05-normalize.trigger' '.github/workflows/r14-05-normalize-temp.yml' 'docs/continuity/KODEPOIA_CONTINUITY.md' | sort)"
          test "$staged" = "$expected"
          git commit -m "R14.5 normalize continuity after merge"
          changed="$(git diff --name-only 39d8aa12e3d36a618376f7060d1088f9fe61ba32..HEAD | sort)"
          test "$changed" = "docs/continuity/KODEPOIA_CONTINUITY.md"
          git push origin HEAD:r14/05-continuity-normalization
