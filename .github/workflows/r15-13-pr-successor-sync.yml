name: R15.13 PR Successor Sync

on:
  push:
    branches: [r15/13-ollama-import-packaging]
    paths:
      - '.github/workflows/r15-13-pr-successor-sync.yml'
      - 'scripts/r15_13_pr_successor_sync.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/13-ollama-import-packaging
          fetch-depth: 0
      - name: Verify accepted END ancestry
        shell: bash
        run: git merge-base --is-ancestor 3881ee8d2c24770626963dcda2c9ab0c0abe250c HEAD
      - name: Correct PR successor references
        shell: bash
        run: python scripts/r15_13_pr_successor_sync.py
      - name: Commit bounded PR successor correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap/R15_PLAN.md docs/roadmap/R15_13_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          git commit -m 'docs(r15.13): bind END evidence to PR successor'
          git push origin HEAD:r15/13-ollama-import-packaging
