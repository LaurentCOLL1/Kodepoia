name: R15.5 END Sync Recovery Docs Commit 9
on:
  push:
    branches: [r15/05-end-sync-recovery]
    paths: ['.github/workflows/r15-5-end-sync-recovery-doc-commit9.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/05-end-sync-recovery
          fetch-depth: 0
      - name: Apply canonical R15.5 END records
        shell: python
        run: |
          from pathlib import Path
          import re
          start = '4c9bee744e4c43ef130e50c4867ca3d467878c51'
          base = '8744df5f3a408595693c67819a29f95b3a82f1d7'
          source = '1ecdfda67a23d8659e48e4c76f805a45a1560ec5'
          merged_end = '9cc528a3be1dba2f915b6383c1817191f78060d1'
          implementation_merge = 'ceba5be8875e5eb9af62db202c050015be00e09a'
          plan_path = Path('docs/roadmap/R15_PLAN.md')
          plan = plan_path.read_text(encoding='utf-8')
          old_checkpoint = '**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. R15.1–R15.4 are COMPLETE + NORMALIZED. R15.5 is IN_PROGRESS from normalized R15.4 `main` `8744df5f3a408595693c67819a29f95b3a82f1d7` on dedicated branch `r15/05-immutable-dataset-builder`; R15.6–R15.17 remain PLANNED.'
          new_checkpoint = f'**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. R15.1–R15.4 are COMPLETE + NORMALIZED. R15.5 is COMPLETE on this bounded END-sync recovery candidate after implementation merge `{implementation_merge}`; fresh exact-head recovery gates and an expected-head recovery merge remain required, followed by the unique continuity-only normalization before R15.6. R15.6–R15.17 remain PLANNED.'
          assert plan.count(old_checkpoint) == 1
          plan = plan.replace(old_checkpoint, new_checkpoint, 1)
          old_row = '| R15.5 | Immutable dataset builder, group-safe deterministic splits, manifests + dataset cards | IN_PROGRESS | NONE | R15.1–R15.4 |'
          new_row = '| R15.5 | Immutable dataset builder, group-safe deterministic splits, manifests + dataset cards | COMPLETE | NONE | R15.1–R15.4 |'
          assert plan.count(old_row) == 1
          plan = plan.replace(old_row, new_row, 1)
          assert '## R15.5 implementation and END-sync recovery evidence' not in plan
          marker = re.search(r'\n---\n\n# R15\.6\b', plan)
          assert marker is not None
          record = f'''\n## R15.5 implementation and END-sync recovery evidence\n\n- Clean START: `{start}` from normalized R15.4 `main` `{base}`.\n- Immutable technical source: `{source}`.\n- Exact-source qualification: R15.5 #4 / `33288632868` SUCCESS Ubuntu + Windows; R0 #2102 / `33288632870` SUCCESS; Python Core #2077 / `33288632943` SUCCESS 5/5; KodeStudio UI Smoke #2042 / `33288632867` SUCCESS.\n- Technical scope accepted: policy-bound immutable dataset construction, authoritative R15.4 group-safe splits, contamination exclusion, deterministic domain and `(domain, task)` balancing, tokenizer-independent text/prompt-completion/conversational JSONL, safe provenance, strict manifest/card schemas and fail-closed manifest↔JSONL reconciliation.\n- Pre-recovery PR head `{merged_end}` passed R15.5 #6 / `33288867382` SUCCESS Ubuntu + Windows, R0 #2103 / `33288867356` SUCCESS, Python Core #2078 / `33288867418` SUCCESS 5/5 and KodeStudio UI Smoke #2043 / `33288867394` SUCCESS, then PR #304 merged with exact expected head as `{implementation_merge}`.\n- Recovery reason: `.github/workflows/r15-5-end-sync-helper.yml` did not execute its intended documentary synchronization before PR #304 merged. The merge therefore left this phase plan, design, acceptance and continuity stale. No stale status or prior rejected evidence is laundered into normalization.\n- This END-sync recovery candidate changes documentary authority only. Its final exact head MUST receive fresh R15.5 acceptance + R0 + full Python Core + KodeStudio UI Smoke before the recovery PR may merge with `expected_head_sha`.\n- After recovery merge, exactly one continuity-only post-merge normalization remains mandatory before R15.6 START-sync.\n- Manual state: **NONE**.\n'''
          plan = plan[:marker.start()] + record + plan[marker.start():]
          plan_path.write_text(plan, encoding='utf-8')
          design_path = Path('docs/roadmap/R15_5_DESIGN.md')
          design = design_path.read_text(encoding='utf-8')
          assert design.count('**Status:** IMPLEMENTED / TECHNICAL GATES PENDING') == 1
          design = design.replace('**Status:** IMPLEMENTED / TECHNICAL GATES PENDING', '**Status:** COMPLETE', 1)
          pending = 'Pending fresh exact-head R15.5 acceptance on Ubuntu + Windows, followed by R0 Repository Guard, full Python Core and KodeStudio UI Smoke.'
          evidence = f'Immutable technical source `{source}` passed R15.5 #4 / `33288632868` Ubuntu + Windows, R0 #2102 / `33288632870`, Python Core #2077 / `33288632943` 5/5 and UI #2042 / `33288632867`. Pre-recovery END head `{merged_end}` passed R15.5 #6 / `33288867382`, R0 #2103 / `33288867356`, Python #2078 / `33288867418` 5/5 and UI #2043 / `33288867394`, then PR #304 merged as `{implementation_merge}`. Because the intended END-sync helper did not update documentary authority before merge, this bounded recovery requires fresh exact-head R15.5/R0/Python/UI gates before its expected-head merge; no prior run is reused as recovery acceptance.'
          assert design.count(pending) == 1
          design = design.replace(pending, evidence, 1)
          design_path.write_text(design, encoding='utf-8')
          acceptance_path = Path('docs/roadmap/R15_5_ACCEPTANCE.md')
          acceptance = acceptance_path.read_text(encoding='utf-8')
          assert acceptance.count('**Acceptance state:** IMPLEMENTED / TECHNICAL GATES PENDING') == 1
          acceptance = acceptance.replace('**Acceptance state:** IMPLEMENTED / TECHNICAL GATES PENDING', '**Acceptance state:** COMPLETE', 1)
          pending_evidence = 'Pending fresh exact-head R15.5 acceptance after completion of the full planned scope. No stale run or pre-correction SUCCESS claim is accepted as final evidence.'
          accepted_evidence = f'Immutable technical source `{source}`: R15.5 #4 / `33288632868` SUCCESS Ubuntu + Windows; R0 #2102 / `33288632870` SUCCESS; Python Core #2077 / `33288632943` SUCCESS 5/5; UI #2042 / `33288632867` SUCCESS. Pre-recovery END head `{merged_end}`: R15.5 #6 / `33288867382` SUCCESS Ubuntu + Windows; R0 #2103 / `33288867356` SUCCESS; Python Core #2078 / `33288867418` SUCCESS 5/5; UI #2043 / `33288867394` SUCCESS. PR #304 merged that exact head as `{implementation_merge}`, but its intended END-sync helper did not synchronize plan/design/acceptance/continuity first. This recovery is non-laundering: fresh exact-head R15.5/R0/Python/UI evidence on this repaired documentary tree is required before recovery merge.'
          assert acceptance.count(pending_evidence) == 1
          acceptance = acceptance.replace(pending_evidence, accepted_evidence, 1)
          acceptance_path.write_text(acceptance, encoding='utf-8')
          continuity_path = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          continuity = continuity_path.read_text(encoding='utf-8')
          old_top = '> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1–R15.4 COMPLETE + NORMALIZED; R15.5 IN_PROGRESS; R15.6–R15.17 PLANNED.** R15.5 exact branch point is normalized R15.4 `main` `8744df5f3a408595693c67819a29f95b3a82f1d7`; dedicated branch `r15/05-immutable-dataset-builder`; manual NONE. Dataset construction remains fail-closed: only curated, fully authorized, sanitized, uncontaminated records may enter; R15.4 duplicate groups must remain split-atomic and protected holdouts remain forbidden.'
          new_top = f'> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1–R15.4 COMPLETE + NORMALIZED; R15.5 COMPLETE; R15.6–R15.17 PLANNED.** R15.5 implementation PR #304 merged exact head `{merged_end}` as `{implementation_merge}`, but its intended END-sync helper failed to synchronize documentary authority before merge. This bounded END-sync recovery candidate requires fresh exact-head R15.5/R0/Python/UI gates and expected-head recovery merge, then one continuity-only normalization before R15.6. Manual NONE.'
          assert continuity.count(old_top) == 1
          continuity = continuity.replace(old_top, new_top, 1)
          old_line = '- R15.5 : **IN_PROGRESS** — exact branch point normalized R15.4 `main` `8744df5f3a408595693c67819a29f95b3a82f1d7`; branch `r15/05-immutable-dataset-builder`; START-sync only, no R15.5 implementation precedes this state; manual NONE.'
          new_line = f'- R15.5 : **COMPLETE** — clean START `{start}` from normalized R15.4 `main` `{base}`; immutable technical source `{source}`; source gates R15.5 #4 / `33288632868`, R0 #2102 / `33288632870`, Python #2077 / `33288632943`, UI #2042 / `33288632867` SUCCESS; pre-recovery END `{merged_end}` gates R15.5 #6 / `33288867382`, R0 #2103 / `33288867356`, Python #2078 / `33288867418`, UI #2043 / `33288867394` SUCCESS; PR #304 merged exact head as `{implementation_merge}`. The intended END-sync helper failed to update plan/design/acceptance/continuity before merge, so this bounded recovery candidate requires fresh exact-head R15.5/R0/Python/UI, expected-head recovery merge and then the unique continuity-only normalization before R15.6. Manual NONE.'
          assert continuity.count(old_line) == 1
          continuity = continuity.replace(old_line, new_line, 1)
          old_table = '| R15.5 | IN_PROGRESS | NONE |'
          assert continuity.count(old_table) == 1
          continuity = continuity.replace(old_table, '| R15.5 | COMPLETE | NONE |', 1)
          continuity_path.write_text(continuity, encoding='utf-8')
      - name: Commit documentary recovery
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R15_PLAN.md docs/roadmap/R15_5_DESIGN.md docs/roadmap/R15_5_ACCEPTANCE.md
          actual="$(git diff --cached --name-only | sort)"
          expected=$'docs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R15_5_ACCEPTANCE.md\ndocs/roadmap/R15_5_DESIGN.md\ndocs/roadmap/R15_PLAN.md'
          printf 'CACHED\n%s\n' "$actual"
          test "$actual" = "$expected"
          git commit -m "docs(r15.5): recover missed END synchronization"
          git push origin HEAD:r15/05-end-sync-recovery
