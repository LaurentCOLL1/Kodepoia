name: V2 Capability Truth Acceptance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-capability-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-truth:
    name: v2-capability-truth-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev,code,ui]"

      - name: Compile V2.0 sources
        run: >-
          python -m compileall -q
          src/kodepoia/capability_truth.py
          src/kodepoia/kodestudio/research_panel.py
          scripts/v2_0_acceptance.py
          tests/test_v2_0_capability_truth.py
          tests/test_v2_0_research_ui.py

      - name: Run Ruff V2.0
        run: >-
          python -m ruff check
          src/kodepoia/capability_truth.py
          src/kodepoia/kodestudio/research_panel.py
          scripts/v2_0_acceptance.py
          tests/test_v2_0_capability_truth.py
          tests/test_v2_0_research_ui.py

      - name: Run V2.0 and inherited Research regressions
        run: >-
          python -m pytest -q
          tests/test_v2_0_capability_truth.py
          tests/test_v2_0_research_ui.py
          tests/test_r7_10_research_service.py
          tests/test_r7_10_research_ui.py

      - name: Emit exact-source V2.0 acceptance
        shell: python
        run: |
          import os
          import subprocess

          subprocess.check_call(
              [
                  "python",
                  "scripts/v2_0_acceptance.py",
                  "--source-sha",
                  os.environ["EVIDENCE_SHA"],
                  "--output",
                  "artifacts/v2_0/capability-truth.json",
              ]
          )

      - name: Assert V2.0 acceptance is complete
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("artifacts/v2_0/capability-truth.json").read_text(encoding="utf-8")
          )
          if report["source_sha"] != os.environ["EVIDENCE_SHA"].strip().lower():
              raise SystemExit("V2.0 evidence source SHA mismatch")
          if report["status"] != "PASS":
              raise SystemExit(f"V2.0 acceptance failed: {report['failed_checks']}")
          if report["checks_total"] != 7 or report["checks_passed"] != 7:
              raise SystemExit("V2.0 acceptance matrix is incomplete")
