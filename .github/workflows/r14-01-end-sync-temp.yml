name: R14.1 END Sync Temp
on:
  push:
    paths:
      - 'docs/roadmap/R14_1_END_SYNC_TRIGGER.md'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R14.1 branch
        uses: actions/checkout@v4
        with:
          ref: r14/01-backend-contracts-boundaries
          fetch-depth: 0
      - name: Apply deterministic END-sync
        run: python scripts/r14_1_end_sync.py
      - name: Prepare final END-sync tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm -f scripts/r14_1_end_sync.py .github/workflows/r14-01-end-sync-temp.yml docs/roadmap/R14_1_END_SYNC_TRIGGER.md
          git add docs/roadmap/R14_PLAN.md docs/roadmap/R14_1_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R14.1 END-sync acceptance plan and continuity'
          TECH=84972d283f6f530ae46ebf6c0452188927b178ff
          mapfile -t changed < <(git diff --name-only "$TECH" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = 'docs/continuity/KODEPOIA_CONTINUITY.md'
          test "${changed[1]}" = 'docs/roadmap/R14_1_ACCEPTANCE.md'
          test "${changed[2]}" = 'docs/roadmap/R14_PLAN.md'
          git push origin HEAD:r14/01-backend-contracts-boundaries
