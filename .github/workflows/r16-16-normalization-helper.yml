name: R16.16 Continuity Normalization Helper

on:
  push:
    branches:
      - "r16/16-normalization-helper"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false

      - name: Preserve isolated patch helper
        shell: bash
        run: cp .github/helpers/r16_16_normalize_continuity.py /tmp/r16_16_normalize_continuity.py

      - name: Checkout exact implementation merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 068f522b052b820c40474ab8a3c689ac47610761
          fetch-depth: 0
          lfs: false
          clean: true

      - name: Assert exact isolated base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "068f522b052b820c40474ab8a3c689ac47610761"
          test ! -e .github/workflows/r16-16-normalization-helper.yml
          test ! -e .github/helpers/r16_16_normalize_continuity.py
          git reset --mixed HEAD

      - name: Apply normalization patch
        shell: bash
        run: python /tmp/r16_16_normalize_continuity.py

      - name: Assert phase plan byte-identical
        shell: bash
        run: git diff HEAD --quiet -- docs/roadmap/R16_PLAN.md

      - name: Assert continuity changed
        shell: bash
        run: '! git diff HEAD --quiet -- docs/continuity/KODEPOIA_CONTINUITY.md'

      - name: Assert clean continuity diff
        shell: bash
        run: git diff HEAD --check -- docs/continuity/KODEPOIA_CONTINUITY.md

      - name: Assert R16.16 normalized candidate state
        shell: bash
        run: grep -Fq '| R16.16 | COMPLETE + NORMALIZED | NONE |' docs/continuity/KODEPOIA_CONTINUITY.md

      - name: Assert R16.17 remains planned
        shell: bash
        run: grep -Fq '| R16.17 | PLANNED | CONDITIONAL |' docs/continuity/KODEPOIA_CONTINUITY.md

      - name: Build and verify exact continuity-only commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --mixed HEAD
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          test -z "$(git diff --cached --name-only -- docs/roadmap/R16_PLAN.md)"
          test "$(git diff --cached --name-only)" = "docs/continuity/KODEPOIA_CONTINUITY.md"
          git diff --cached --check
          git commit -m "docs(r16.16): normalize post-merge continuity"
          test "$(git rev-parse HEAD^)" = "068f522b052b820c40474ab8a3c689ac47610761"
          test "$(git diff --name-only HEAD^ HEAD)" = "docs/continuity/KODEPOIA_CONTINUITY.md"
          git diff HEAD^ HEAD --check

      - name: Publish exact normalization candidate
        shell: bash
        run: git push origin HEAD:refs/heads/r16/16-continuity-normalization
