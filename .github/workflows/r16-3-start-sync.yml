name: R16.3 START Sync

on:
  push:
    branches:
      - r16/03-malicious-repository-workspace-quarantine
    paths:
      - .github/workflows/r16-3-start-sync.yml

permissions:
  contents: write

jobs:
  start-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R16.3 branch
        uses: actions/checkout@v4
        with:
          ref: r16/03-malicious-repository-workspace-quarantine
          fetch-depth: 0

      - name: Synchronize R16.3 START authority
        shell: python
        run: |
          from pathlib import Path
          import re

          plan_path = Path("docs/roadmap/R16_PLAN.md")
          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          plan = plan_path.read_text(encoding="utf-8")
          continuity = continuity_path.read_text(encoding="utf-8")

          checkpoint = (
              "**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + "
              "NORMALIZED. R16.1–R16.2 are COMPLETE + NORMALIZED. R16.3 is IN_PROGRESS from normalized `main` "
              "`71e9ab8e2b56457e856109aa509a863c110d3fa3`; R16.4–R16.18 remain PLANNED."
          )
          plan, count = re.subn(r"^\*\*Execution checkpoint:\*\*.*$", checkpoint, plan, count=1, flags=re.M)
          if count != 1:
              raise SystemExit("R16 checkpoint replacement failed")

          replacements = {
              "| R16.2 | Prompt-injection and untrusted-content hardening | COMPLETE | NONE |":
                  "| R16.2 | Prompt-injection and untrusted-content hardening | COMPLETE + NORMALIZED | NONE |",
              "| R16.3 | Malicious repository/workspace quarantine and safe bootstrap | PLANNED | NONE |":
                  "| R16.3 | Malicious repository/workspace quarantine and safe bootstrap | IN_PROGRESS | NONE |",
          }
          for old, new in replacements.items():
              if plan.count(old) != 1:
                  raise SystemExit(f"plan row replacement failed: {old}")
              plan = plan.replace(old, new, 1)

          old_header = (
              "R16.2 COMPLETE + NORMALIZED through implementation/evidence merge `9e2bea3343e96a8e140029c9836e42380e81c9b9` "
              "and this unique continuity-only normalization branch `r16/02-continuity-normalization` when merged. "
              "R16.3–R16.18 remain PLANNED; R16.3 START-sync is authorized only from the normalized `main` produced by this normalization PR."
          )
          new_header = (
              "R16.2 COMPLETE + NORMALIZED on exact normalized `main` `71e9ab8e2b56457e856109aa509a863c110d3fa3`. "
              "R16.3 IN_PROGRESS on `r16/03-malicious-repository-workspace-quarantine` from that exact normalized main; "
              "R16.4–R16.18 remain PLANNED."
          )
          if continuity.count(old_header) != 1:
              raise SystemExit("continuity header replacement failed")
          continuity = continuity.replace(old_header, new_header, 1)

          entry = (
              "- R16.3 : **IN_PROGRESS** — normalized R16.2 `main` `71e9ab8e2b56457e856109aa509a863c110d3fa3`; "
              "branch `r16/03-malicious-repository-workspace-quarantine`; mandatory START-sync only, before implementation. "
              "Frozen scope: workspace preflight/quarantine; parse/index/read separated from executable build/run/hook/plugin behavior; "
              "canonical path and symlink/junction escape rejection; repository configuration cannot widen command/environment/filesystem/network authority; "
              "hooks/task runners/Godot scripts/shell-batch-PowerShell/generated instructions remain discoverable but non-authoritative; bounded archive/submodule/external-reference handling; "
              "machine-readable workspace-risk summary. Manual **NONE**; host-destructive execution excluded from acceptance."
          )
          marker = "\n- R15.1 : **COMPLETE + NORMALIZED**"
          if continuity.count(marker) != 1:
              raise SystemExit("continuity insertion marker failed")
          continuity = continuity.replace(marker, "\n" + entry + "\n" + marker.lstrip("\n"), 1)

          plan_path.write_text(plan, encoding="utf-8", newline="\n")
          continuity_path.write_text(continuity, encoding="utf-8", newline="\n")

      - name: Verify START sync scope
        shell: bash
        run: |
          git rm .github/workflows/r16-3-start-sync.yml
          git add docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/r16-3-start-sync.yml' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R16_PLAN.md' | sort)"
          test "$actual" = "$expected"

      - name: Commit clean START sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(r16.3): synchronize START authority"
          git push origin HEAD:r16/03-malicious-repository-workspace-quarantine
