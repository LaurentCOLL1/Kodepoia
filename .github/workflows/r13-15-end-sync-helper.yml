name: R13.15 End Sync Helper

on:
  push:
    branches:
      - r13/15-store-compliance-engine

permissions:
  contents: write

jobs:
  end-sync:
    if: github.event.head_commit.message != 'R13.15 end-sync via CI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r13/15-store-compliance-engine
          fetch-depth: 0
      - name: Patch end-sync authority exactly
        shell: python
        run: |
          from pathlib import Path

          CANDIDATE = 'dc9e04b1d0170b889ae02231a68304e7b7a11c60'
          R0 = '#1715 / `33097922318`'
          PY = '#1689 / `33097922338`'
          UI = '#1656 / `33097922322`'

          def one(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          plan_path = Path('docs/roadmap/R13_PLAN.md')
          plan = plan_path.read_text(encoding='utf-8')
          old_checkpoint = "**Execution checkpoint:** R13.1–R13.14 are `COMPLETE + NORMALIZED`. R13.14 final end-synchronized head `42b500d3a4a19fad9370fb4b56fa528f5ed742eb` passed R0 #1711 / `33095039101`, Python Core #1685 / `33095038903`, and KodeStudio UI Smoke #1652 / `33095038908`; PR #247 merged as `a7a6fc43823c53e78d31d71e20c110abbc35196d`, then single continuity-only normalization head `0c990e8d68c1940a092d589bd6b864299d064eeb` passed R0 #1713 / `33095670861`, Python Core #1687 / `33095670808`, and UI #1654 / `33095670718`, and PR #248 merged as normalized `main` `80e9ae84f4c9edd8b2e41eadb93310abae6e442f`. R13.15 is `IN_PROGRESS` on dedicated branch `r13/15-store-compliance-engine`; R13.16–R13.17 remain `PLANNED`."
          new_checkpoint = f"**Execution checkpoint:** R13.1–R13.14 are `COMPLETE + NORMALIZED`. R13.15 is `COMPLETE / END-SYNCED` on dedicated branch `r13/15-store-compliance-engine`; accepted technical candidate `{CANDIDATE}` passed exact-head R0 {R0}, Python Core {PY}, and KodeStudio UI Smoke {UI}, all SUCCESS. Google Play Readiness #179 / `33097922247` and Apple Xcode Acceptance #162 / `33097922206` also passed as directly relevant regression evidence. Because this end-sync changes documentation bytes, PR #249 remains merge-pending until fresh R0 + full Python Core + UI Smoke pass on the same final end-synchronized head. R13.16–R13.17 remain `PLANNED`."
          plan = one(plan, old_checkpoint, new_checkpoint, 'plan checkpoint')
          plan = one(
              plan,
              "R13 planning is **ACCEPTED + NORMALIZED** on `main` `aef297e385dc49ad6ae0935d4f9ef25a35e5e984`; R13.1–R13.14 are **COMPLETE + NORMALIZED**; R13.15 is **IN_PROGRESS**; R13.16–R13.17 remain **PLANNED / NOT STARTED**.",
              "R13 planning is **ACCEPTED + NORMALIZED** on `main` `aef297e385dc49ad6ae0935d4f9ef25a35e5e984`; R13.1–R13.14 are **COMPLETE + NORMALIZED**; R13.15 is **COMPLETE / END-SYNCED, MERGE + NORMALIZATION PENDING**; R13.16–R13.17 remain **PLANNED / NOT STARTED**.",
              'plan phase summary',
          )
          plan = one(
              plan,
              "| R13.15 | Current store compliance engine: privacy, ratings, permissions, SDK/policy evidence | IN_PROGRESS | NONE | R13.7/R13.10 + R7/R6 |",
              "| R13.15 | Current store compliance engine: privacy, ratings, permissions, SDK/policy evidence | COMPLETE | NONE | R13.7/R13.10 + R7/R6 |",
              'plan table',
          )
          start = "**Start record:** branch **`r13/15-store-compliance-engine`** created exactly from normalized `main` **`80e9ae84f4c9edd8b2e41eadb93310abae6e442f`** after R13.14 normalization PR #248. Status **IN_PROGRESS** before implementation. Manual is **NONE** for the frozen core: R13.15 evaluates deterministic local/versioned compliance evidence and does not require a Play Console/App Store Connect account, credential, production signing material, physical device, live form submission or publication. Official-source baseline retrieved 2026-08-27 remains evidence, not architecture constants: Google Play new apps/updates require Android 16 / API 36 from 2026-08-31 with provider-documented exceptions by form factor and an extension path to 2026-11-01; Google User Data/permissions policy applies to app and integrated SDK behavior and includes future-effective policy changes; Apple App Store Connect uploads require Xcode 26+ / SDK 26+ since 2026-04-28; Apple required-reason API declarations must use approved reasons; App Privacy must include third-party partner practices and a privacy-policy URL; age rating is required and region-sensitive. Stale, unofficial-only, conflicting, future-effective, expired or account-only evidence must stay explicit and must never synthesize CURRENT/legal-certification claims."
          completion = f"**Completion record:** accepted exact-head technical candidate **`{CANDIDATE}`** passed R0 Repository Guard {R0}, Python Core {PY}, and KodeStudio UI Smoke {UI}, all SUCCESS. Python Core passed complete Ubuntu/Windows tests, both package builds and its internal UI smoke, including the focused R13.15 compliance tests. Google Play Readiness #179 / `33097922247` passed Ubuntu+Windows exact-head dry-run/non-publishing regression, and Apple Xcode Acceptance #162 / `33097922206` passed hosted macOS exact-head stable capability regression without account/device claims. Core adds durable `store-compliance-v1` evidence plus provider-neutral dated rule evaluation, official-host currentness, future/expired/stale/unofficial separation, scoped conflict detection, bounded Google/Apple facts, third-party SDK accounting, store surface facts, explicit account-only confirmations, deterministic digests, `legal_certification=false`, and `live_account_query_attempted=false`. Manual remains **NONE**. This end synchronization marks R13.15 COMPLETE; because these documentary bytes changed, fresh R0 + full Python Core + KodeStudio UI Smoke must pass on the final end-synchronized head before PR #249 may merge with `expected_head_sha`. R13.16 remains PLANNED until implementation merge plus exactly one continuity-only normalization complete."
          plan = one(plan, start + "\n\n# R13.16", start + "\n\n" + completion + "\n\n# R13.16", 'plan completion')
          plan_path.write_text(plan, encoding='utf-8')

          acceptance_path = Path('docs/roadmap/R13_15_ACCEPTANCE.md')
          acceptance = acceptance_path.read_text(encoding='utf-8')
          acceptance = one(
              acceptance,
              "**Status:** technical acceptance pending exact-head CI",
              "**Status:** technical candidate ACCEPTED; final end-sync exact-head re-gates pending",
              'acceptance status',
          )
          technical = f"## Accepted technical candidate\n\nExact Git SHA **`{CANDIDATE}`** passed R0 Repository Guard {R0}, full Python Core {PY}, and KodeStudio UI Smoke {UI}, all SUCCESS on that exact SHA. Full Python Core includes Ubuntu/Windows tests, Ubuntu/Windows package builds and the internal KodeStudio smoke; focused R13.15 tests are part of the repository suite. Directly relevant existing regressions also passed: Google Play Readiness #179 / `33097922247` on Ubuntu+Windows and Apple Xcode Acceptance #162 / `33097922206` on hosted macOS. No live account/device/publication evidence is claimed.\n\nBecause this acceptance/end-sync documentation changes bytes after the technical candidate, these records are not themselves merge authority. Fresh R0 + full Python Core + KodeStudio UI Smoke must pass on the final end-synchronized SHA before PR #249 merges with `expected_head_sha`. Manual remains **NONE**.\n\n"
          acceptance = one(acceptance, "## Merge/normalization rule", technical + "## Merge/normalization rule", 'acceptance candidate record')
          acceptance_path.write_text(acceptance, encoding='utf-8')

          cpath = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          c = cpath.read_text(encoding='utf-8')
          old_prompt = "> Kodepoia, architecture v1.0 gelée. **R1–R12 COMPLETE + NORMALIZED. R13 planning ACCEPTED + NORMALIZED. R13.1–R13.14 COMPLETE + NORMALIZED. R13.15 IN_PROGRESS on dedicated branch `r13/15-store-compliance-engine`; R13.16–R13.17 PLANNED / NOT STARTED.** R13.14 normalization head `0c990e8d68c1940a092d589bd6b864299d064eeb` passed R0 #1713 / `33095670861`, Python Core #1687 / `33095670808`, and UI #1654 / `33095670718`, all SUCCESS; PR #248 merged as normalized `main` `80e9ae84f4c9edd8b2e41eadb93310abae6e442f`. R13.15 branch starts exactly there. Frozen R13.15 core is deterministic/versioned current-store compliance evidence: dated/provider-scoped official rules, effective/expiry windows, conflicts/staleness, Google target API/Data safety/permissions/content rating, Apple SDK/privacy manifest/required-reason API/App Privacy/privacy-policy/age rating, third-party SDK declarations, localization/accessibility/assets and ResearchGuard provenance. Manual is NONE; account-only forms remain explicit `NEEDS_ACCOUNT_CONFIRMATION`."
          new_prompt = f"> Kodepoia, architecture v1.0 gelée. **R1–R12 COMPLETE + NORMALIZED. R13 planning ACCEPTED + NORMALIZED. R13.1–R13.14 COMPLETE + NORMALIZED. R13.15 COMPLETE / END-SYNCED on dedicated branch `r13/15-store-compliance-engine`; implementation merge + single continuity-only normalization PENDING. R13.16–R13.17 PLANNED / NOT STARTED.** Authorized normalized base is `80e9ae84f4c9edd8b2e41eadb93310abae6e442f`. Accepted technical candidate `{CANDIDATE}` passed exact-head R0 {R0}, Python Core {PY}, and UI {UI}, all SUCCESS. Core is deterministic/versioned store-readiness evidence with source provenance/dates/scopes, current/future/expired/stale/unofficial truthfulness, conflicts, Google/Apple facts, SDK inventory, account-only confirmations and no legal/live-account claim. Manual remains NONE. Because end-sync documentation changed bytes, PR #249 may merge only after fresh R0 + full Python Core + UI Smoke pass on the same final exact head, followed by exactly one continuity-only normalization before R13.16."
          c = one(c, old_prompt, new_prompt, 'continuity prompt')
          c = one(
              c,
              "- R13.15: **IN_PROGRESS** on `r13/15-store-compliance-engine`, created exactly from normalized main `80e9ae84f4c9edd8b2e41eadb93310abae6e442f`. Manual **NONE**.",
              f"- R13.15: **COMPLETE / END-SYNCED; MERGE + NORMALIZATION PENDING** on `r13/15-store-compliance-engine`. Accepted technical candidate **`{CANDIDATE}`**. Manual **NONE**.",
              'continuity global status',
          )
          c = one(c, "## R13.15 start authority", "## R13.15 end-sync authority", 'continuity heading')
          c = one(
              c,
              "- Status: **IN_PROGRESS** before implementation. R13.16–R13.17 remain **PLANNED / NOT STARTED**.",
              "- Status: **COMPLETE / END-SYNCED; IMPLEMENTATION MERGE + SINGLE NORMALIZATION PENDING**. R13.16–R13.17 remain **PLANNED / NOT STARTED**.",
              'continuity status',
          )
          anchor = "- Manual: **NONE**. Account-only forms may remain `NEEDS_ACCOUNT_CONFIRMATION`; no store account, token, credential, live upload/publication, production key or physical device is needed for core acceptance."
          record = f"- Accepted exact-head technical candidate **`{CANDIDATE}`** passed R0 Repository Guard {R0}, Python Core {PY}, and KodeStudio UI Smoke {UI}, all SUCCESS. Full Python Core passed Ubuntu/Windows tests, both package builds and internal UI smoke. Google Play Readiness #179 / `33097922247` and Apple Xcode Acceptance #162 / `33097922206` also passed as directly relevant regressions. Durable `store-compliance-v1` output embeds applicable source evidence and enforces currentness/conflict/account boundaries, SDK accounting, deterministic digests, `legal_certification=false` and `live_account_query_attempted=false`. Because end-sync documentation changes bytes, fresh R0 + full Python Core + UI Smoke must pass on the final head before PR #249 may merge with `expected_head_sha`; then exactly one continuity-only normalization is required before R13.16."
          c = one(c, anchor, anchor + "\n" + record, 'continuity candidate record')
          next_old = "Complete R13.15 on dedicated branch `r13/15-store-compliance-engine`: implement the frozen provider-rule schema/currentness/conflict engine, Google + Apple checks, third-party SDK inventory, store-asset/accessibility/localization checks, ResearchGuard provenance, required design/acceptance docs and focused adversarial tests. Manual is NONE for deterministic evaluation. Run exact-head R0 Repository Guard + full Python Core + KodeStudio UI Smoke; after accepted technical evidence, perform end plan+continuity sync, fresh exact-head re-gates if bytes changed, merge with `expected_head_sha`, then exactly one continuity-only normalization before R13.16."
          next_new = "Freeze the final R13.15 end-synchronized branch head. Run fresh exact-head **R0 Repository Guard + full Python Core + KodeStudio UI Smoke** on that same SHA. If all three are SUCCESS, merge implementation PR #249 with `expected_head_sha=<final-head>`. Then create exactly one branch from the implementation merge for continuity-only normalization, verify the diff is exactly `docs/continuity/KODEPOIA_CONTINUITY.md`, run fresh exact-head R0 + Python + UI, and merge that normalization PR with `expected_head_sha`. Only the resulting normalized `main` authorizes R13.16. Manual remains NONE."
          c = one(c, next_old, next_new, 'continuity next action')
          cpath.write_text(c, encoding='utf-8')
      - name: Commit end sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/R13_PLAN.md docs/roadmap/R13_15_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --quiet && exit 0
          git commit -m "R13.15 end-sync via CI"
          git push origin HEAD:r13/15-store-compliance-engine
