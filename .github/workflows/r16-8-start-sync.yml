name: R16.8 START Sync Helper

on:
  push:
    branches:
      - r16/08-fault-injection-killswitch-backup-recovery-drills
    paths:
      - .github/workflows/r16-8-start-sync.yml

permissions:
  contents: write

jobs:
  start-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R16.8 branch
        uses: actions/checkout@v4
        with:
          ref: r16/08-fault-injection-killswitch-backup-recovery-drills
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install R0 checker dependencies
        run: python -m pip install -r scripts/requirements-r0.txt

      - name: Apply bounded R16.8 START sync
        shell: python
        run: |
          from pathlib import Path

          base = "951c53959956d1b88b3c9c3a8c4c328c1127236b"
          branch = "r16/08-fault-injection-killswitch-backup-recovery-drills"

          plan_path = Path("docs/roadmap/R16_PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          old_checkpoint = "**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + NORMALIZED. R16.1–R16.6 are COMPLETE + NORMALIZED. R16.7 is COMPLETE on immutable technical source `f095781fde179045fcbcf7fb89661f72f9c51c46` with fresh technical acceptance recorded below; post-merge continuity normalization is still required before R16.8. R16.8–R16.18 remain PLANNED."
          new_checkpoint = f"**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + NORMALIZED. R16.1–R16.7 are COMPLETE + NORMALIZED. R16.8 is IN_PROGRESS from normalized `main` `{base}` on dedicated branch `{branch}`. R16.9–R16.18 remain PLANNED."
          if plan.count(old_checkpoint) != 1:
              raise SystemExit("R16_PLAN checkpoint replacement count != 1")
          plan = plan.replace(old_checkpoint, new_checkpoint, 1)

          old_rows = "| R16.7 | Memory/context poisoning detection, quarantine and rebuild | COMPLETE | NONE |\n| R16.8 | Fault injection, KillSwitch, backup and recovery drills | PLANNED | NONE |"
          new_rows = "| R16.7 | Memory/context poisoning detection, quarantine and rebuild | COMPLETE + NORMALIZED | NONE |\n| R16.8 | Fault injection, KillSwitch, backup and recovery drills | IN_PROGRESS | NONE |"
          if plan.count(old_rows) != 1:
              raise SystemExit("R16_PLAN status-row replacement count != 1")
          plan = plan.replace(old_rows, new_rows, 1)
          plan_path.write_text(plan, encoding="utf-8", newline="\n")

          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          continuity = continuity_path.read_text(encoding="utf-8")
          old_top = "> Kodepoia, architecture v1.0 gelée. **R1–R15 COMPLETE + NORMALIZED. R16 planning ACCEPTED + NORMALIZED. R16.1–R16.7 COMPLETE + NORMALIZED. R16.8–R16.18 remain PLANNED. R16.8 START-sync is authorized only from the normalized `main` produced by the unique R16.7 post-merge continuity-only normalization.**"
          new_top = f"> Kodepoia, architecture v1.0 gelée. **R1–R15 COMPLETE + NORMALIZED. R16 planning ACCEPTED + NORMALIZED. R16.1–R16.7 COMPLETE + NORMALIZED. R16.8 IN_PROGRESS on `{branch}` from normalized `main` `{base}`. R16.9–R16.18 remain PLANNED.**"
          if continuity.count(old_top) != 1:
              raise SystemExit("continuity top replacement count != 1")
          continuity = continuity.replace(old_top, new_top, 1)

          anchor_prefix = "- R16.7 : **COMPLETE + NORMALIZED** — normalized R16.6 `main` `9c358e48e97352046160d48cee0417ade435b6ac`;"
          matches = [line for line in continuity.splitlines() if line.startswith(anchor_prefix)]
          if len(matches) != 1:
              raise SystemExit("R16.7 continuity anchor count != 1")
          r16_7_line = matches[0]
          new_line = f"- R16.8 : **IN_PROGRESS** — normalized R16.7 `main` `{base}`; dedicated branch `{branch}`; scope frozen to deterministic fault injection across KillSwitch, ProcessSandbox, SafeChange, backup/recovery, interrupted writes, subprocess crash/hang, resource-denial simulation, corrupted checkpoint/state, cancellation and restart; no production DR claim; manual NONE. R16.9 remains PLANNED."
          if new_line not in continuity:
              continuity = continuity.replace(r16_7_line, r16_7_line + "\n" + new_line, 1)
          continuity_path.write_text(continuity, encoding="utf-8", newline="\n")

      - name: Validate bounded START sync
        shell: bash
        run: |
          git diff --check -- docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          python scripts/check_repo.py
          expected=$'docs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R16_PLAN.md'
          actual="$(git diff --name-only -- docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R16_PLAN.md | sort)"
          test "$actual" = "$expected"
          unexpected="$(git diff --name-only -- . \
            ':(exclude)docs/continuity/KODEPOIA_CONTINUITY.md' \
            ':(exclude)docs/roadmap/R16_PLAN.md' \
            ':(exclude)docs/roadmap/R10_7_LOCAL_ACCEPTANCE.json' | sort)"
          test -z "$unexpected"

      - name: Commit START sync and self-delete helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r16-8-start-sync.yml
          git add docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          expected=$'.github/workflows/r16-8-start-sync.yml\ndocs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R16_PLAN.md'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m "docs(r16.8): START-sync fault recovery hardening"
          git push origin HEAD:r16/08-fault-injection-killswitch-backup-recovery-drills
