name: R15.6 Normalization Helper

on:
  push:
    branches:
      - r15/06-post-merge-normalization
    paths:
      - scripts/r15_6_normalize_temp.py

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: r15/06-post-merge-normalization
      - name: Apply bounded continuity-only normalization
        shell: bash
        run: |
          python scripts/r15_6_normalize_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          changed=$(git diff --cached --name-only)
          test "$changed" = "docs/continuity/KODEPOIA_CONTINUITY.md"
          git rm scripts/r15_6_normalize_temp.py .github/workflows/r15-6-normalization-helper.yml
          git commit -m "docs(r15.6): normalize post-merge continuity"
          git push origin HEAD:r15/06-post-merge-normalization
