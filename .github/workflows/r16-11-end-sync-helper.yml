name: R16.11 END Sync Helper

on:
  push:
    branches:
      - r16/11-representative-godot-3d-beta-project
    paths:
      - .github/workflows/r16-11-end-sync-helper.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R16.11 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: r16/11-representative-godot-3d-beta-project
          fetch-depth: 0

      - name: Patch bounded END authority
        run: python .github/r16_11_end_sync.py

      - name: Validate bounded END sync
        run: |
          git diff --check -- docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          python scripts/check_repo.py

      - name: Commit END sync and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r16-11-end-sync-helper.yml .github/r16_11_end_sync.py
          git add docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          expected=$'.github/r16_11_end_sync.py\n.github/workflows/r16-11-end-sync-helper.yml\ndocs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R16_PLAN.md'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git commit -m "docs(r16.11): synchronize END authority"
          git push origin HEAD:r16/11-representative-godot-3d-beta-project
