[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kodepoia"
version = "0.1.0.dev1"
description = "Local-first AI development environment for games and applications"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ui = ["PySide6==6.11.1"]

[project.scripts]
kodepoia = "kodepoia.__main__:main"
kodestudio = "kodepoia.kodestudio.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kodepoia*"]
