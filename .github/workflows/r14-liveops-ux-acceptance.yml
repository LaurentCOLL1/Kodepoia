name: R14 CLI KodeStudio LiveOps UX Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - r14/16-cli-kodestudio-liveops-ux
    paths:
      - .github/workflows/r14-liveops-ux-acceptance.yml
      - schemas/r14/backend-liveops-ux-evidence.schema.json
      - scripts/r14_16_liveops_ux_acceptance.py
      - src/kodepoia/backend/liveops_ux.py
      - src/kodepoia/backend/r14_cli.py
      - src/kodepoia/kodestudio/backend_liveops_panel.py
      - src/kodepoia/kodestudio/r14_localization.py
      - src/kodepoia/cli.py
      - src/kodepoia/kodestudio/app.py
      - tests/test_r14_16_liveops_ux.py
      - tests/test_r14_16_cli.py
      - tests/test_r14_16_kodestudio.py
      - tests/test_r6_6_localization_ui.py
      - docs/roadmap/R14_PLAN.md
      - docs/roadmap/R14_16_ACCEPTANCE.md
      - docs/continuity/KODEPOIA_CONTINUITY.md

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      EVIDENCE_PATH: docs/roadmap/R14_16_ACCEPTANCE-${{ matrix.os }}.json
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ubuntu Qt runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Guard exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='${{ github.sha }}'
          test "${#SOURCE_SHA}" -eq 40
          test "$SOURCE_SHA" = "$(printf '%s' "$SOURCE_SHA" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install project test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,ui]'

      - name: Compile R14.16 surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/kodepoia/backend/liveops_ux.py \
            src/kodepoia/backend/r14_cli.py \
            src/kodepoia/kodestudio/backend_liveops_panel.py \
            src/kodepoia/kodestudio/r14_localization.py \
            src/kodepoia/cli.py \
            src/kodepoia/kodestudio/app.py \
            scripts/r14_16_liveops_ux_acceptance.py \
            tests/test_r14_16_liveops_ux.py \
            tests/test_r14_16_cli.py \
            tests/test_r14_16_kodestudio.py \
            tests/test_r6_6_localization_ui.py

      - name: Run focused R14.16 tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_r14_16_liveops_ux.py \
            tests/test_r14_16_cli.py \
            tests/test_r14_16_kodestudio.py \
            tests/test_r6_6_localization_ui.py

      - name: Generate exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/r14_16_liveops_ux_acceptance.py \
            --source-sha '${{ github.sha }}' \
            --output "$EVIDENCE_PATH"

      - name: Validate evidence schema and invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator

          evidence_path = Path(os.environ['EVIDENCE_PATH'])
          schema_path = Path('schemas/r14/backend-liveops-ux-evidence.schema.json')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(evidence)
          assert evidence['source_sha'] == os.environ['GITHUB_SHA']
          assert evidence['status'] == 'pass'
          assert evidence['manual_state'] == 'none'
          assert evidence['provider_live_claim'] is False
          assert evidence['external_provider_required'] is False
          assert evidence['secrets_exposed'] is False
          assert evidence['raw_command_input_exposed'] is False
          assert evidence['raw_endpoint_input_exposed'] is False
          assert evidence['automatic_production_publish'] is False
          assert evidence['operation_count'] == 15
          assert evidence['check_count'] == evidence['passed_count']
          assert evidence['check_count'] >= 30
          assert all(evidence['checks'].values())
          PY

      - name: Upload R14.16 acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: R14_16_LIVEOPS_UX_ACCEPTANCE-${{ matrix.os }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: error
