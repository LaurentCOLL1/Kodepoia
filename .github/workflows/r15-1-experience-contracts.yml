name: R15.1 Experience Contracts Acceptance

on:
  push:
    branches:
      - 'r15/**'
    paths:
      - 'src/kodepoia/experience/**'
      - 'schemas/experience-record-v1.schema.json'
      - 'tests/test_experience_contracts.py'
      - '.github/workflows/r15-1-experience-contracts.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/kodepoia/experience/**'
      - 'schemas/experience-record-v1.schema.json'
      - 'tests/test_experience_contracts.py'
      - '.github/workflows/r15-1-experience-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: R15.1 focused tests
        run: python -m pytest -q tests/test_experience_contracts.py
      - name: Compile experience package
        run: python -m compileall -q src/kodepoia/experience
