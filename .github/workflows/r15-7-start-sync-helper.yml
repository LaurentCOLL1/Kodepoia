name: R15.7 START Sync Helper

on:
  push:
    branches:
      - r15/07-gap-diagnosis-train-decision
    paths:
      - scripts/r15_7_start_sync_temp.py

permissions:
  contents: write

jobs:
  start-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: r15/07-gap-diagnosis-train-decision
      - name: Apply bounded R15.7 START synchronization
        shell: bash
        run: |
          python scripts/r15_7_start_sync_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          changed=$(git diff --cached --name-only | sort)
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -Fx 'docs/continuity/KODEPOIA_CONTINUITY.md' >/dev/null
          printf '%s\n' "$changed" | grep -Fx 'docs/roadmap/R15_PLAN.md' >/dev/null
          git rm scripts/r15_7_start_sync_temp.py .github/workflows/r15-7-start-sync-helper.yml
          git commit -m "docs(r15.7): synchronize START authority"
          git push origin HEAD:r15/07-gap-diagnosis-train-decision
