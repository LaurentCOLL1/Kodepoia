name: R15.13 END Sync Helper

on:
  push:
    branches: [r15/13-ollama-import-packaging]
    paths:
      - '.github/workflows/r15-13-end-sync-helper.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/13-ollama-import-packaging
          fetch-depth: 0
      - name: Verify immutable technical source ancestry
        shell: bash
        run: git merge-base --is-ancestor f0dfcd1ed3e9d2382ad44efdcd2ec05dbac1b7ac HEAD
      - name: Apply bounded documentary END-sync
        shell: bash
        run: python scripts/r15_13_end_sync_helper.py
      - name: Commit documentary END-sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap/R15_PLAN.md docs/roadmap/R15_13_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          git commit -m 'docs(r15.13): synchronize COMPLETE END state'
          git push origin HEAD:r15/13-ollama-import-packaging
