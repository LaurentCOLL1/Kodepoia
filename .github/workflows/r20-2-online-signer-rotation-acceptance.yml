name: R20.2 Online Signer Rotation Acceptance

on:
  push:
    branches:
      - r20/02-online-signer-rotation
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r20-2-online-signer-rotation-acceptance.yml
      - docs/continuity/KODEPOIA_CONTINUITY_R20.md
      - docs/roadmap/R20_PLAN.md
      - src/kodepoia/update/online_signing.py
      - tests/test_r20_2_online_signing.py
      - update-repository/metadata/root.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r20-2-online-signer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signer-rotation-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile R20.2 sources
        run: >-
          python -m compileall -q
          src/kodepoia/update/online_signing.py
          tests/test_r20_2_online_signing.py

      - name: Run Ruff R20.2
        run: >-
          python -m ruff check
          src/kodepoia/update/online_signing.py
          tests/test_r20_2_online_signing.py

      - name: Run focused R20.2 and TUF regressions
        run: >-
          python -m pytest -q
          tests/test_r20_2_online_signing.py
          tests/test_r20_1_bridge_refresh.py
          tests/test_r18_6_update_trust.py
          tests/test_r18_7_update_discovery.py

      - name: Verify frozen R20.2 Root boundary and current successor
        shell: python
        run: |
          import hashlib
          import subprocess
          from pathlib import Path

          from tuf.api.metadata import Metadata, Root

          R20_2_END_SHA = "58585bbd680166d54147e11b0f4b50fd62c817af"
          EXPECTED_ROOT_V1_SHA256 = "892442754966aa643bbe15a2910aa3fef59032c8f5eade34fed62efd96aefee5"

          historical_root_bytes = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{R20_2_END_SHA}:update-repository/metadata/root.json",
              ]
          )
          historical_sha = hashlib.sha256(historical_root_bytes).hexdigest()
          if historical_sha != EXPECTED_ROOT_V1_SHA256:
              raise SystemExit(
                  f"R20.2 phase-end Root v1 drifted: expected {EXPECTED_ROOT_V1_SHA256}, got {historical_sha}"
              )

          historical_root = Metadata.from_bytes(historical_root_bytes)
          if not isinstance(historical_root.signed, Root) or historical_root.signed.version != 1:
              raise SystemExit("R20.2 phase-end Root is not the accepted Root v1")
          historical_root.signed.verify_delegate(
              "root", historical_root.signed_bytes, historical_root.signatures
          )

          current_root_bytes = Path("update-repository/metadata/root.json").read_bytes()
          current_root = Metadata.from_bytes(current_root_bytes)
          if not isinstance(current_root.signed, Root):
              raise SystemExit("current root.json has the wrong TUF type")
          if current_root.signed.version < historical_root.signed.version:
              raise SystemExit("current Root version rolled back below R20.2")

          if current_root.signed.version == historical_root.signed.version:
              if current_root_bytes != historical_root_bytes:
                  raise SystemExit("Root v1 bytes changed without a version increment")
          elif current_root.signed.version == historical_root.signed.version + 1:
              historical_root.signed.verify_delegate(
                  "root", current_root.signed_bytes, current_root.signatures
              )
              current_root.signed.verify_delegate(
                  "root", current_root.signed_bytes, current_root.signatures
              )
          else:
              raise SystemExit(
                  "R20.2 acceptance needs explicit intermediate Root-chain evidence for a jump larger than one version"
              )

          print(
              "R20.2 frozen Root boundary verified; current Root successor is version",
              current_root.signed.version,
          )

      - name: Assert R20.2 contains no provider credential workflow
        shell: python
        run: |
          from pathlib import Path

          workflow = Path(".github/workflows/r20-2-online-signer-rotation-acceptance.yml").read_text(encoding="utf-8").lower()
          forbidden = (
              "id-token" + ": write",
              "aws-actions/" + "configure-aws-credentials",
              "google-github-actions/" + "auth",
              "azure/" + "login",
          )
          for marker in forbidden:
              if marker in workflow:
                  raise SystemExit(f"R20.2 crossed the R20.3 provisioning boundary: {marker}")

      - name: Emit public R20.2 evidence
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          from tuf.api.metadata import Metadata, Root

          r20_2_end_sha = "58585bbd680166d54147e11b0f4b50fd62c817af"
          historical_root = subprocess.check_output(
              ["git", "show", f"{r20_2_end_sha}:update-repository/metadata/root.json"]
          )
          current_root_bytes = Path("update-repository/metadata/root.json").read_bytes()
          current_root = Metadata.from_bytes(current_root_bytes)
          if not isinstance(current_root.signed, Root):
              raise SystemExit("current root.json has the wrong TUF type")

          report = {
              "format": "kodepoia-r20-2-online-signer-rotation-acceptance",
              "schema_version": 2,
              "source_sha": os.environ["EVIDENCE_SHA"].strip().lower(),
              "historical_source_sha": r20_2_end_sha,
              "historical_root_sha256": hashlib.sha256(historical_root).hexdigest(),
              "historical_root_version": 1,
              "current_root_sha256": hashlib.sha256(current_root_bytes).hexdigest(),
              "current_root_version": current_root.signed.version,
              "current_root_successor_verified": True,
              "provider_neutral": True,
              "production_root_modified_during_r20_2": False,
              "private_keys_in_ci_evidence": False,
              "live_kms_provisioned": False,
              "offline_root_signing_performed": False,
              "status": "pass",
          }
          output = Path("artifacts/r20_2/online-signer-rotation-acceptance.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2, sort_keys=True))

      - name: Upload R20.2 evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r20-2-online-signer-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r20_2/
          if-no-files-found: error
          retention-days: 30
