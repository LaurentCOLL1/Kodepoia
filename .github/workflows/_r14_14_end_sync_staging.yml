- END state: **R14.14 COMPLETE at technical/evidence level**; R14.15–R14.17 remain PLANNED. This END synchronization must now pass fresh exact-head R0 + full Python Core + KodeStudio UI Smoke + R14 LiveOps Acceptance; merge is allowed only with expected-head protection, followed by exactly one continuity-only post-merge normalization before R14.15 is authorized."""
          placeholder = "## Completion record\n\nTo be appended when accepted."
          assert plan.count(placeholder) >= 1
          r14_14_start = plan.index("# R14.14 — LiveOps campaigns")
          r14_15_start = plan.index("# R14.15 — Service operations", r14_14_start)
          r14_14 = plan[r14_14_start:r14_15_start]
          assert r14_14.count(placeholder) == 1
          r14_14 = r14_14.replace(placeholder, "## Completion record\n\n" + completion, 1)
          plan = plan[:r14_14_start] + r14_14 + plan[r14_15_start:]
          plan_path.write_text(plan, encoding="utf-8")

          prompt = (
              "> Kodepoia, architecture v1.0 gelée. **R1–R13 COMPLETE + NORMALIZED. R14 planning ACCEPTED + NORMALIZED. "
              "R14.1–R14.13 COMPLETE + NORMALIZED. R14.14 COMPLETE at technical/evidence level; END-sync pending fresh exact-head gates. "
              "R14.15–R14.17 PLANNED and unauthorized.** R14.14 immutable technical source `bd7d0130b5241047e5583bd31e0a183be1a1e6f1`; "
              "clean START-head `c17356c7d24fb07544d3f58e65d7f4ef2a2f7624`; technical gates R0 #1930 / `33251838461`, Python Core #1905 / `33251838469`, "
              "UI #1870 / `33251838453`, R14 LiveOps Acceptance #4 / `33251838460` all SUCCESS, with 21 focused tests on Ubuntu and Windows and 23/23 deterministic checks PASS. "
              "Manual state: NONE; `provider_live_claim=false`. The only authorized next action is fresh validation of the three-file END-sync head, expected-head merge, then one continuity-only post-merge normalization before R14.15."
          )
          continuity, count = re.subn(r"(?m)^> Kodepoia, architecture v1\.0 gelée\..*$", prompt, continuity, count=1)
          assert count == 1

          old_global = "- R14.14 : **IN_PROGRESS** on `r14/14-liveops-campaigns-schedules` from normalized `main` `b56162e0903bf2dc29505dfb6385030ed5d4b9d4`."
          new_global = "- R14.14 : **COMPLETE at technical/evidence level / END-sync pending fresh gates** — immutable source `bd7d0130b5241047e5583bd31e0a183be1a1e6f1`; branch `r14/14-liveops-campaigns-schedules`; normalized base `b56162e0903bf2dc29505dfb6385030ed5d4b9d4`."
          assert continuity.count(old_global) == 1
          continuity = continuity.replace(old_global, new_global, 1)

          old_manual = "- Manual state actuel R14.13 : **NONE** (`provider_live_claim=false`; aucun provider externe requis)."
          new_manual = "- Manual state actuel R14.14 : **NONE** (`provider_live_claim=false`; `external_provider_required=false`; aucun provider externe requis)."
          assert continuity.count(old_manual) == 1
          continuity = continuity.replace(old_manual, new_manual, 1)

