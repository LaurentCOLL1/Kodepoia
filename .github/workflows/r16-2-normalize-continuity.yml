name: R16.2 Continuity Normalization

on:
  push:
    branches:
      - r16/02-continuity-normalization
    paths:
      - .github/workflows/r16-2-normalize-continuity.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout normalization branch
        uses: actions/checkout@v4
        with:
          ref: r16/02-continuity-normalization
          fetch-depth: 0

      - name: Normalize R16.2 continuity only
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          text = path.read_text(encoding="utf-8")

          old_header = (
              "R16.2 COMPLETE at mandatory END-sync on `r16/02-prompt-injection-untrusted-content`; "
              "fresh exact-END re-gates are required before protected merge, and R16.3–R16.18 remain PLANNED."
          )
          new_header = (
              "R16.2 COMPLETE + NORMALIZED through implementation/evidence merge "
              "`9e2bea3343e96a8e140029c9836e42380e81c9b9` and this unique continuity-only normalization branch "
              "`r16/02-continuity-normalization` when merged. R16.3–R16.18 remain PLANNED; R16.3 START-sync is "
              "authorized only from the normalized `main` produced by this normalization PR."
          )
          if text.count(old_header) != 1:
              raise SystemExit("R16.2 header authority replacement failed")
          text = text.replace(old_header, new_header, 1)

          replacement = (
              "- R16.2 : **COMPLETE + NORMALIZED** — normalized R16.1 `main` "
              "`ad7ec8339ea3e61fefa29fad6693a0e476b6bc58`; clean START `c3095e36bde1d580f4496397c280304384157aa9`; "
              "immutable technical source `6d4aee8947f2350a16e2316aae217030195cb68f`; technical R16.2 #12 / `33441078478` SUCCESS Ubuntu + Windows, "
              "R0 #2270 / `33441078505` SUCCESS Ubuntu + Windows, Python Core #2242 / `33441078446` SUCCESS 5/5 and UI #2207 / `33441078170` SUCCESS; "
              "final exact-END head `6b41a8583e5f0c0be9d804eb7fdf6dc58edc65b3` passed fresh R16.2 #16 / `33441790886` SUCCESS Ubuntu + Windows, "
              "R0 #2273 / `33441790868` SUCCESS Ubuntu + Windows, Python Core #2245 / `33441790845` SUCCESS 5/5 and UI #2210 / `33441791023` SUCCESS; "
              "PR #337 merged with `expected_head_sha=6b41a8583e5f0c0be9d804eb7fdf6dc58edc65b3` as implementation/evidence `main` `9e2bea3343e96a8e140029c9836e42380e81c9b9`. "
              "Cross-platform acceptance JSON SHA-256 `daa1714932a36fb24ba2050e607c99e48d6d5f7fe9b3ef8eb72c57f6667b0ced`; semantic `17e3d997642f3d52e0f3e6fc2c792ef91d83d8566876596936630c249198a434`; "
              "policy `97878fe69267c6fa6f2266d5bdcc87793385a315ca0b18d699d773fc31a2b990`; corpus `faa7f8bafa48438351a7435c3a55946f0a42ab8695540935a070865659189a51`; "
              "case-set `8aca9cb7fd1f3cfe5445bebaee48569f7dbb21a63ca35567dc636a84f9c22963`; targeted set `138328e20a43b6501f2413eb248bd4de29fadbc98a67ac975893ababf0d087ca`; "
              "supplemental set `d2a31a206689f51668609812b32c4c9d7b3f247de7ac3dedeb29fabb7ea1ab8e`; 18/18 PASS, `critical_veto=false`, manual NONE. "
              "`ResearchGuard` remains schema-compatible at public guard version 1. Linux technical artifact `9776303161` / `9a248e5e71cb7ce92a7b06b67a3055d8956dda672ec858d043c191f520ba5bf7`; "
              "Windows technical artifact `9776290305` / `39d1ea79415a7d15095461b6bd2f1c01eb28e8f8d0ab3c45d022a3c7c8b2cd7e`. "
              "This record is the unique post-merge continuity-only R16.2 normalization authority when its PR merges; R16.3 START-sync is authorized only from the resulting normalized `main`."
          )
          pattern = r"^- R16\.2 : \*\*COMPLETE\*\* — .*?$"
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit("R16.2 continuity record replacement failed")

          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Verify continuity-only scope
        shell: bash
        run: |
          git rm .github/workflows/r16-2-normalize-continuity.yml
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/r16-2-normalize-continuity.yml' 'docs/continuity/KODEPOIA_CONTINUITY.md' | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Commit clean continuity normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(r16.2): normalize post-merge continuity"
          git push origin HEAD:r16/02-continuity-normalization
