name: R16.15 Long-Term Project Durability Resume Upgrade Soak Acceptance

on:
  push:
    branches:
      - r16/15-long-term-project-durability-resume-upgrade-soak
  pull_request:
    paths:
      - .github/workflows/r16-15-project-durability-acceptance.yml
      - configs/r16_supply_chain_policy.json
      - scripts/r16_15_project_durability_acceptance.py
      - src/kodepoia/project/r16_15_acceptance.py
      - tests/fixtures/r16_15_project_durability/**
      - tests/test_r16_15_project_durability.py
      - tests/test_supply_chain_r16_9.py
      - docs/roadmap/R16_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-durability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True, encoding="utf-8"
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused acceptance dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build exact-source wheel and sdist
        run: python -m build --wheel --sdist --outdir dist

      - name: Compile focused R16.15 sources
        run: >-
          python -m compileall -q
          src/kodepoia/project/r16_15_acceptance.py
          scripts/r16_15_project_durability_acceptance.py
          tests/test_r16_15_project_durability.py

      - name: Ruff E501 focused R16.15 sources
        run: >-
          python -m ruff check --select E501
          src/kodepoia/project/r16_15_acceptance.py
          scripts/r16_15_project_durability_acceptance.py
          tests/test_r16_15_project_durability.py

      - name: Ruff I001 focused R16.15 sources
        if: always()
        run: >-
          python -m ruff check --select I001
          src/kodepoia/project/r16_15_acceptance.py
          scripts/r16_15_project_durability_acceptance.py
          tests/test_r16_15_project_durability.py

      - name: Ruff F focused R16.15 sources
        if: always()
        run: >-
          python -m ruff check --select F
          src/kodepoia/project/r16_15_acceptance.py
          scripts/r16_15_project_durability_acceptance.py
          tests/test_r16_15_project_durability.py

      - name: Ruff B focused R16.15 sources
        if: always()
        run: >-
          python -m ruff check --select B
          src/kodepoia/project/r16_15_acceptance.py
          scripts/r16_15_project_durability_acceptance.py
          tests/test_r16_15_project_durability.py

      - name: Ruff UP focused R16.15 sources
        if: always()
        run: >-
          python -m ruff check --select UP
          src/kodepoia/project/r16_15_acceptance.py
          scripts/r16_15_project_durability_acceptance.py
          tests/test_r16_15_project_durability.py

      - name: Ruff SIM focused R16.15 sources
        if: always()
        run: >-
          python -m ruff check --select SIM
          src/kodepoia/project/r16_15_acceptance.py
          scripts/r16_15_project_durability_acceptance.py
          tests/test_r16_15_project_durability.py

      - name: Ruff full focused R16.15 sources
        if: always()
        run: >-
          python -m ruff check
          src/kodepoia/project/r16_15_acceptance.py
          scripts/r16_15_project_durability_acceptance.py
          tests/test_r16_15_project_durability.py

      - name: Run focused R16.15 and supply-chain regression tests
        run: >-
          python -m pytest -q
          tests/test_r16_15_project_durability.py
          tests/test_supply_chain_r16_9.py

      - name: Emit exact-source R16.15 acceptance
        run: >-
          python scripts/r16_15_project_durability_acceptance.py
          --source-sha "${{ env.EVIDENCE_SHA }}"
          --platform "${{ runner.os }}"
          --output artifacts/r16_15_project_durability_acceptance.json

      - name: Upload exact-source acceptance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r16-15-project-durability-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r16_15_project_durability_acceptance.json
          if-no-files-found: error
          retention-days: 30
