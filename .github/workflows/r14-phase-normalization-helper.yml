name: R14 Phase Normalization Helper

on:
  push:
    branches:
      - 'r14/phase-normalization'
    paths:
      - '.github/workflows/r14-phase-normalization-helper.yml'
      - 'scripts/r14_phase_normalization_helper.py'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout normalization branch
        uses: actions/checkout@v4
        with:
          ref: r14/phase-normalization
          fetch-depth: 0

      - name: Apply unique continuity-only normalization
        shell: bash
        run: |
          set -euo pipefail
          python scripts/r14_phase_normalization_helper.py
          git rm .github/workflows/r14-phase-normalization-helper.yml scripts/r14_phase_normalization_helper.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          git commit -m 'docs(r14): finalize phase normalization continuity'
          git push origin HEAD:r14/phase-normalization
