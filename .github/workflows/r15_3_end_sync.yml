name: R15.3 END-sync helper
on:
  push:
    branches: [r15/03-sanitization-governance]
permissions:
  contents: write
jobs:
  end-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/03-sanitization-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-r0.txt
      - run: python scripts/r15_3_end_sync_temp.py
      - name: Commit END-sync and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15_3_end_sync.yml scripts/r15_3_end_sync_temp.py
          git add docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R15_3_DESIGN.md docs/roadmap/R15_3_ACCEPTANCE.md
          git commit -m "docs(r15.3): synchronize END state"
          git push origin HEAD:r15/03-sanitization-governance
