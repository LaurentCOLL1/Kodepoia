name: R15.5 END Sync Recovery Helper
on:
  push:
    branches: [r15/05-end-sync-recovery]
    paths: ['.github/workflows/r15-5-end-sync-recovery-helper.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/05-end-sync-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair bounded R15.5 END records
        shell: python
        run: |
          from pathlib import Path
          import re

          start = "4c9bee744e4c43ef130e50c4867ca3d467878c51"
          base = "8744df5f3a408595693c67819a29f95b3a82f1d7"
          source = "1ecdfda67a23d8659e48e4c76f805a45a1560ec5"
          source_focused = "R15.5 #4 / 33288632868"
          source_r0 = "R0 #2102 / 33288632870"
          source_python = "Python Core #2077 / 33288632943"
          source_ui = "KodeStudio UI Smoke #2042 / 33288632867"
          merged_end = "9cc528a3be1dba2f915b6383c1817191f78060d1"
          end_focused = "R15.5 #6 / 33288867382"
          end_r0 = "R0 #2103 / 33288867356"
          end_python = "Python Core #2078 / 33288867418"
          end_ui = "KodeStudio UI Smoke #2043 / 33288867394"
          implementation_merge = "ceba5be8875e5eb9af62db202c050015be00e09a"

          plan_path = Path("docs/roadmap/R15_PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          old_checkpoint = "**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. R15.1–R15.4 are COMPLETE + NORMALIZED. R15.5 is IN_PROGRESS from normalized R15.4 `main` `8744df5f3a408595693c67819a29f95b3a82f1d7` on dedicated branch `r15/05-immutable-dataset-builder`; R15.6–R15.17 remain PLANNED."
          new_checkpoint = f"**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. R15.1–R15.4 are COMPLETE + NORMALIZED. R15.5 implementation merged as `{implementation_merge}` but its pre-merge END-sync helper failed to update documentary authority; bounded END-sync recovery is therefore IN_PROGRESS and R15.6 remains blocked. R15.6–R15.17 remain PLANNED."
          assert plan.count(old_checkpoint) == 1
          plan = plan.replace(old_checkpoint, new_checkpoint, 1)
          old_row = "| R15.5 | Immutable dataset builder, group-safe deterministic splits, manifests + dataset cards | IN_PROGRESS | NONE | R15.1–R15.4 |"
          new_row = "| R15.5 | Immutable dataset builder, group-safe deterministic splits, manifests + dataset cards | COMPLETE / END-SYNC RECOVERY | NONE | R15.1–R15.4 |"
          assert plan.count(old_row) == 1
          plan = plan.replace(old_row, new_row, 1)
          marker = re.search(r"\n---\n\n# R15\.6\b", plan)
          assert marker is not None
          record = f'''\n## R15.5 implementation and END-sync recovery evidence\n\n- Clean START: `{start}` from normalized R15.4 `main` `{base}`.\n- Immutable technical source: `{source}`.\n- Exact-source qualification: {source_focused} SUCCESS Ubuntu + Windows; {source_r0} SUCCESS; {source_python} SUCCESS 5/5; {source_ui} SUCCESS.\n- Technical scope accepted: policy-bound immutable dataset construction, authoritative R15.4 group-safe splits, contamination exclusion, deterministic domain and `(domain, task)` balancing, tokenizer-independent text/prompt-completion/conversational JSONL, safe provenance, strict manifest/card schemas and fail-closed manifest↔JSONL reconciliation.\n- Pre-recovery PR head `{merged_end}` passed {end_focused} SUCCESS Ubuntu + Windows, {end_r0} SUCCESS, {end_python} SUCCESS 5/5 and {end_ui} SUCCESS, then PR #304 merged with exact expected head as `{implementation_merge}`.\n- Recovery reason: `.github/workflows/r15-5-end-sync-helper.yml` did not execute its intended documentary synchronization before PR #304 merged. The merge therefore left this phase plan, design, acceptance and continuity records stale. No stale status is being laundered into normalization.\n- This recovery changes documentary authority only. Its final exact head MUST receive fresh R15.5 acceptance + R0 + full Python Core + KodeStudio UI Smoke before a dedicated recovery PR may merge with `expected_head_sha`.\n- After recovery merge, exactly one continuity-only post-merge normalization remains mandatory before R15.6 START-sync.\n- Manual state: **NONE**.\n'''
          plan = plan[:marker.start()] + record + plan[marker.start():]
          plan_path.write_text(plan, encoding="utf-8", newline="\n")

          design_path = Path("docs/roadmap/R15_5_DESIGN.md")
          design = design_path.read_text(encoding="utf-8")
          assert design.count("**Status:** IMPLEMENTED / TECHNICAL GATES PENDING") == 1
          design = design.replace("**Status:** IMPLEMENTED / TECHNICAL GATES PENDING", "**Status:** COMPLETE / END-SYNC RECOVERY GATES PENDING", 1)
          pending = "Pending fresh exact-head R15.5 acceptance on Ubuntu + Windows, followed by R0 Repository Guard, full Python Core and KodeStudio UI Smoke."
          evidence = f"Immutable technical source `{source}` passed {source_focused} Ubuntu + Windows, {source_r0}, {source_python} 5/5 and {source_ui}. Pre-recovery END head `{merged_end}` passed {end_focused}, {end_r0}, {end_python} 5/5 and {end_ui}, then PR #304 merged as `{implementation_merge}`. The intended END-sync helper did not update the documentary records before merge, so this bounded recovery requires fresh exact-head R15.5/R0/Python/UI gates before its own expected-head merge; no prior run is reused as recovery acceptance."
          assert design.count(pending) == 1
          design = design.replace(pending, evidence, 1)
          design_path.write_text(design, encoding="utf-8", newline="\n")

          acceptance_path = Path("docs/roadmap/R15_5_ACCEPTANCE.md")
          acceptance = acceptance_path.read_text(encoding="utf-8")
          assert acceptance.count("**Acceptance state:** IMPLEMENTED / TECHNICAL GATES PENDING") == 1
          acceptance = acceptance.replace("**Acceptance state:** IMPLEMENTED / TECHNICAL GATES PENDING", "**Acceptance state:** COMPLETE / END-SYNC RECOVERY GATES PENDING", 1)
          pending_evidence = "Pending fresh exact-head R15.5 acceptance after completion of the full planned scope. No stale run or pre-correction SUCCESS claim is accepted as final evidence."
          accepted_evidence = f"Immutable technical source `{source}`: {source_focused} SUCCESS Ubuntu + Windows; {source_r0} SUCCESS; {source_python} SUCCESS 5/5; {source_ui} SUCCESS. Pre-recovery END head `{merged_end}`: {end_focused} SUCCESS Ubuntu + Windows; {end_r0} SUCCESS; {end_python} SUCCESS 5/5; {end_ui} SUCCESS. PR #304 merged that exact head as `{implementation_merge}`, but its intended END-sync helper did not synchronize plan/design/acceptance/continuity first. This recovery is therefore non-laundering: fresh exact-head R15.5/R0/Python/UI evidence on the repaired documentary tree is required before the recovery PR merges."
          assert acceptance.count(pending_evidence) == 1
          acceptance = acceptance.replace(pending_evidence, accepted_evidence, 1)
          acceptance_path.write_text(acceptance, encoding="utf-8", newline="\n")

          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          continuity = continuity_path.read_text(encoding="utf-8")
          old_top = "> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1–R15.4 COMPLETE + NORMALIZED; R15.5 IN_PROGRESS; R15.6–R15.17 PLANNED.** R15.5 exact branch point is normalized R15.4 `main` `8744df5f3a408595693c67819a29f95b3a82f1d7`; dedicated branch `r15/05-immutable-dataset-builder`; manual NONE. Dataset construction remains fail-closed: only curated, fully authorized, sanitized, uncontaminated records may enter; R15.4 duplicate groups must remain split-atomic and protected holdouts remain forbidden."
          new_top = f"> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1–R15.4 COMPLETE + NORMALIZED; R15.5 COMPLETE / END-SYNC RECOVERY IN_PROGRESS; R15.6–R15.17 PLANNED.** R15.5 implementation PR #304 merged exact head `{merged_end}` as `{implementation_merge}`, but its intended END-sync helper failed to synchronize documentary authority before merge. Recovery is fail-closed and requires fresh exact-head R15.5/R0/Python/UI gates plus expected-head recovery merge, then one continuity-only normalization before R15.6. Manual NONE."
          assert continuity.count(old_top) == 1
          continuity = continuity.replace(old_top, new_top, 1)
          old_line = "- R15.5 : **IN_PROGRESS** — exact branch point normalized R15.4 `main` `8744df5f3a408595693c67819a29f95b3a82f1d7`; branch `r15/05-immutable-dataset-builder`; START-sync only, no R15.5 implementation precedes this state; manual NONE."
          new_line = f"- R15.5 : **COMPLETE / END-SYNC RECOVERY IN_PROGRESS** — clean START `{start}` from normalized R15.4 `main` `{base}`; immutable technical source `{source}`; source gates {source_focused}, {source_r0}, {source_python}, {source_ui} SUCCESS; pre-recovery END `{merged_end}` gates {end_focused}, {end_r0}, {end_python}, {end_ui} SUCCESS; PR #304 merged exact head as `{implementation_merge}`. The intended END-sync helper failed to update plan/design/acceptance/continuity before merge, so R15.6 is blocked pending bounded documentary recovery, fresh exact-head R15.5/R0/Python/UI, expected-head recovery merge, then the unique continuity-only normalization. Manual NONE."
          assert continuity.count(old_line) == 1
          continuity = continuity.replace(old_line, new_line, 1)
          continuity_path.write_text(continuity, encoding="utf-8", newline="\n")
      - name: Validate recovery scope
        shell: bash
        run: |
          git diff --check
          python scripts/check_repo.py
          expected=$'docs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R15_5_ACCEPTANCE.md\ndocs/roadmap/R15_5_DESIGN.md\ndocs/roadmap/R15_PLAN.md'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
      - name: Commit repaired END sync and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15-5-end-sync-recovery-helper.yml
          git add docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R15_PLAN.md docs/roadmap/R15_5_DESIGN.md docs/roadmap/R15_5_ACCEPTANCE.md
          git diff --cached --check
          git commit -m "docs(r15.5): recover missed END synchronization"
          git push origin HEAD:r15/05-end-sync-recovery
