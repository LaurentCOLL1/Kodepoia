name: R14.13 END Synchronization

on:
  push:
    branches:
      - r14/13-events-telemetry-pipeline
    paths:
      - scripts/r14_13_end_sync.py
      - .github/workflows/r14-13-end-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch with ancestry
        uses: actions/checkout@v4
        with:
          ref: r14/13-events-telemetry-pipeline
          fetch-depth: 4

      - name: Assert immutable technical source ancestor
        run: python -c "import subprocess; assert subprocess.check_output(['git','rev-parse','HEAD~3'], text=True).strip() == 'b1729cabaffb19ac5491dee8a2c18e1bb5877746'"

      - name: Apply anchored R14.13 END synchronization
        run: |
          python scripts/r14_13_end_sync.py
          python -c "from pathlib import Path; p=Path('docs/roadmap/R14_13_ACCEPTANCE.md'); p.write_text('\n'.join(line.rstrip() for line in p.read_text(encoding='utf-8').splitlines())+'\n', encoding='utf-8')"

      - name: Commit clean END synchronization and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/r14_13_end_sync.py
          rm .github/workflows/r14-13-end-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/R14_PLAN.md docs/roadmap/R14_13_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md scripts/r14_13_end_sync.py .github/workflows/r14-13-end-sync.yml
          git diff --cached --check
          git commit -m "docs(r14.13): synchronize accepted END authority"
          git push origin HEAD:r14/13-events-telemetry-pipeline
