name: R15.2 START-sync helper

on:
  push:
    branches:
      - r15/02-validated-experience-capture

permissions:
  contents: write

jobs:
  start-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/02-validated-experience-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install R0 dependencies
        run: python -m pip install -r scripts/requirements-r0.txt
      - name: Synchronize R15.2 START state
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          plan = Path("docs/roadmap/R15_PLAN.md")
          text = plan.read_text(encoding="utf-8")
          old_checkpoint = (
              "**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED "
              "on `main` `29ae0ffabb7ffa974c4d544e33bfe54f0fa403f1`. R15.1 is COMPLETE with immutable technical "
              "source `2da5e5d5aa712462c898270c41c5cafb42e6aeaa`; implementation merge + unique post-merge "
              "normalization are pending. R15.2–R15.17 remain PLANNED."
          )
          new_checkpoint = (
              "**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. "
              "R15.1 is COMPLETE + NORMALIZED on `main` `f6681cdc072fdbd9eb8ebcf2c109859df31fb30f`; "
              "R15.2 is IN_PROGRESS on dedicated branch `r15/02-validated-experience-capture`; "
              "R15.3–R15.17 remain PLANNED."
          )
          assert text.count(old_checkpoint) == 1
          text = text.replace(old_checkpoint, new_checkpoint, 1)
          assert text.count("| R15.2 | Governed validated-experience capture, outcome labeling + opt-in/source scope | PLANNED | NONE | R15.1 + R1/R6/R8 |") == 1
          text = text.replace(
              "| R15.2 | Governed validated-experience capture, outcome labeling + opt-in/source scope | PLANNED | NONE | R15.1 + R1/R6/R8 |",
              "| R15.2 | Governed validated-experience capture, outcome labeling + opt-in/source scope | IN_PROGRESS | NONE | R15.1 + R1/R6/R8 |",
              1,
          )
          plan.write_text(text, encoding="utf-8", newline="\n")

          continuity = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          lines = continuity.read_text(encoding="utf-8").splitlines()
          lines[0] = (
              "> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. "
              "R15.1 COMPLETE + NORMALIZED on `main` `f6681cdc072fdbd9eb8ebcf2c109859df31fb30f`; "
              "R15.2 IN_PROGRESS on `r15/02-validated-experience-capture`; R15.3–R15.17 PLANNED.** "
              "R15.2 capture remains disabled by default, outcome-validation-gated, project/source scoped, "
              "quota-bounded and raw-content-redacted from audit/status surfaces."
          )
          status = next(i for i, line in enumerate(lines) if line == "| R15.2 | PLANNED | NONE |")
          lines[status] = "| R15.2 | IN_PROGRESS | NONE |"
          action = next(i for i, line in enumerate(lines) if line.startswith("**Merge this single R15.1 post-merge continuity-only normalization"))
          lines[action] = (
              "**R15.2 START-sync is active on `r15/02-validated-experience-capture` from normalized `main` "
              "`f6681cdc072fdbd9eb8ebcf2c109859df31fb30f`. Implement only the governed validated-experience "
              "capture scope; R15.3+ remain unauthorized.**"
          )
          continuity.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")

          subprocess.run(["git", "diff", "--check"], check=True)
          subprocess.run(["python", "scripts/check_repo.py"], check=True)
      - name: Commit START-sync and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15_2_start_sync.yml
          git add docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git commit -m "docs(r15.2): synchronize START state"
          git push origin HEAD:r15/02-validated-experience-capture
