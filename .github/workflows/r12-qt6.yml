name: R12 Qt6 Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r12-qt6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt6-macos:
    name: qt6-macos
    runs-on: macos-latest
    env:
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Kodepoia
        run: python -m pip install -e ".[dev]"
      - name: Provision supported Qt 6 toolchain as CI infrastructure
        shell: bash
        run: |
          set -euo pipefail
          brew install qtbase cmake ninja
          qt_prefix="$(brew --prefix qtbase)"
          test -d "$qt_prefix/bin"
          if test -x "$qt_prefix/bin/qtpaths6"; then
            qtpaths="$qt_prefix/bin/qtpaths6"
          elif test -x "$qt_prefix/bin/qtpaths"; then
            qtpaths="$qt_prefix/bin/qtpaths"
          else
            echo "qtpaths executable missing from Homebrew qtbase" >&2
            exit 1
          fi
          qt_version="$($qtpaths --qt-version)"
          case "$qt_version" in
            6.*) ;;
            *) echo "Expected Qt 6, got $qt_version" >&2; exit 1 ;;
          esac
          echo "$qt_prefix/bin" >> "$GITHUB_PATH"
          echo "Qt CI toolchain: version=$qt_version prefix=$qt_prefix"
      - name: Build and runtime-probe Qt fixture
        run: python scripts/r12_8_qt_acceptance.py --output ".kodepoia/evidence/R12_8_QT_MACOS.json"
      - name: Upload Qt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-8-qt6-macos-${{ github.event.pull_request.head.sha || github.sha }}
          path: .kodepoia/evidence/R12_8_QT_MACOS.json
          if-no-files-found: warn
