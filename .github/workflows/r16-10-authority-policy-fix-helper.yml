name: R16.10 Authority Policy Fix Helper

on:
  push:
    branches:
      - r16/10-representative-godot-2d-beta-project
    paths:
      - .github/workflows/r16-10-authority-policy-fix-helper.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: r16/10-representative-godot-2d-beta-project
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"

      - name: Patch policy-count assertion and remove helper
        shell: python
        run: |
          from pathlib import Path

          policy = Path("configs/r16_supply_chain_policy.json").read_text(encoding="utf-8")
          authority = '      ".github/workflows/r16-10-godot-2d-beta-acceptance.yml",'
          if policy.count(authority) != 1:
              raise SystemExit("R16.10 authority workflow is not registered exactly once")

          path = Path("tests/test_supply_chain_r16_9.py")
          text = path.read_text(encoding="utf-8")
          old = "    assert len(policy.immutable_authority_workflows) == 12\n"
          new = "    assert len(policy.immutable_authority_workflows) == 13\n"
          if text.count(old) != 1:
              raise SystemExit(f"unexpected authority-count assertion cardinality: {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

      - name: Validate and freeze clean policy fix
        run: |
          git rm .github/workflows/r16-10-authority-policy-fix-helper.yml
          python -m pytest -q tests/test_supply_chain_r16_9.py
          python -m ruff check tests/test_supply_chain_r16_9.py
          git diff --check -- tests/test_supply_chain_r16_9.py .github/workflows/r16-10-authority-policy-fix-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_supply_chain_r16_9.py
          expected=$'.github/workflows/r16-10-authority-policy-fix-helper.yml\ntests/test_supply_chain_r16_9.py'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m "test(r16.10): extend supply-chain authority count"
          git push origin HEAD:r16/10-representative-godot-2d-beta-project
