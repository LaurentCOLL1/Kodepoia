name: R16.9 Ruff Fix Helper

on:
  push:
    branches:
      - r16/09-supply-chain-provenance-hardening
    paths:
      - .github/workflows/r16-9-ruff-fix-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: r16/09-supply-chain-provenance-hardening
          fetch-depth: 0

      - name: Apply exactly five Ruff corrections
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/kodepoia/quality/supply_chain.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "import tomllib\nfrom dataclasses import dataclass\nfrom enum import StrEnum\nfrom pathlib import Path\nfrom typing import Any, Iterable, Mapping\n",
                  "import tomllib\nfrom collections.abc import Iterable, Mapping\nfrom dataclasses import dataclass\nfrom enum import StrEnum\nfrom pathlib import Path\nfrom typing import Any\n",
              ),
              (
                  "            if contents != policy.required_contents_permission:\n                if relative not in policy.allow_write_workflows:\n                    blockers.append(f\"workflow_contents_permission:{relative}:{contents or 'missing'}\")\n",
                  "            if (\n                contents != policy.required_contents_permission\n                and relative not in policy.allow_write_workflows\n            ):\n                blockers.append(f\"workflow_contents_permission:{relative}:{contents or 'missing'}\")\n",
              ),
              (
                  "            if any(value == \"write\" for value in parsed_permissions.values()):\n                if relative not in policy.allow_write_workflows:\n                    blockers.append(f\"workflow_write_permission:{relative}\")\n",
                  "            if (\n                any(value == \"write\" for value in parsed_permissions.values())\n                and relative not in policy.allow_write_workflows\n            ):\n                blockers.append(f\"workflow_write_permission:{relative}\")\n",
              ),
              (
                  "        if policy.forbid_parent_artifact_paths:\n            if any(_unsafe_artifact_path(value) for value in _artifact_upload_paths(text)):\n                blockers.append(f\"workflow_artifact_path_escape:{relative}\")\n",
                  "        if policy.forbid_parent_artifact_paths and any(\n            _unsafe_artifact_path(value) for value in _artifact_upload_paths(text)\n        ):\n            blockers.append(f\"workflow_artifact_path_escape:{relative}\")\n",
              ),
              (
                  "        digest = _sha256_bytes(f\"{group}\\0{requirement}\".encode(\"utf-8\"))\n",
                  "        digest = _sha256_bytes(f\"{group}\\0{requirement}\".encode())\n",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"bounded Ruff replacement cardinality mismatch: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Validate and push bounded correction
        shell: bash
        run: |
          git diff --check -- src/kodepoia/quality/supply_chain.py
          test -n "$(git diff --name-only -- src/kodepoia/quality/supply_chain.py)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kodepoia/quality/supply_chain.py
          test "$(git diff --cached --name-only)" = "src/kodepoia/quality/supply_chain.py"
          git commit -m "style(r16.9): satisfy focused Ruff gate"
          git push origin HEAD:r16/09-supply-chain-provenance-hardening
