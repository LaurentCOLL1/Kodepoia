name: R14.17 END Sync Helper

on:
  push:
    branches:
      - 'r14/17-adversarial-integrated-acceptance'
    paths:
      - '.github/workflows/r14-17-end-sync-helper.yml'
      - 'scripts/r14_17_end_sync_helper.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: r14/17-adversarial-integrated-acceptance
          fetch-depth: 0

      - name: Apply deterministic END sync
        shell: bash
        run: |
          set -euo pipefail
          python scripts/r14_17_end_sync_helper.py
          sed -i 's/[[:space:]]\+$//' docs/roadmap/R14_17_ACCEPTANCE.md
          git rm .github/workflows/r14-17-end-sync-helper.yml scripts/r14_17_end_sync_helper.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap/R14_PLAN.md docs/roadmap/R14_17_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          git commit -m 'docs(r14.17): finalize integrated END authority'
          git push origin HEAD:r14/17-adversarial-integrated-acceptance
