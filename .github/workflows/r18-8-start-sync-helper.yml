name: R18.8 START sync helper (ephemeral)

on:
  push:
    branches:
      - r18/08-verified-download-install-rollback
    paths:
      - .github/workflows/r18-8-start-sync-helper.yml

permissions:
  contents: write

jobs:
  start-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dedicated R18.8 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Write clean R18.8 START authority and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          base = "03ad2cbede77fbf29d996ad21ad65e74ae09273a"
          branch = "r18/08-verified-download-install-rollback"
          roadmap = Path("docs/roadmap/R18_PLAN.md")
          continuity = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          helper = Path(".github/workflows/r18-8-start-sync-helper.yml")

          rtext = roadmap.read_text(encoding="utf-8")
          clines = continuity.read_text(encoding="utf-8").splitlines()

          old_status = next(
              line for line in rtext.splitlines()
              if line.startswith("Roadmap status:")
          )
          new_status = (
              "Roadmap status: planning is **ACCEPTED + NORMALIZED** on `main` "
              "`bbffc382d4fb8a7d947345da11b56459d0fec825`. R18.1 is COMPLETE + NORMALIZED "
              "on canonical `main` `c611131268041b06f53de66eaadd45120e2b750d`. R18.2 is **COMPLETE + "
              "NORMALIZED** on canonical `main` `c376d0af789e584e1ef307f43e42a62ce024b052`. R18.3 is **COMPLETE + "
              "NORMALIZED** on canonical `main` `66314ff1c86e51d84f1abe15d107a6182ef9e54a`. R18.4 is **COMPLETE + "
              "NORMALIZED** on canonical `main` `b6aa853c59921bf51e346b7860e709cca63a4a2e`. R18.5 is **COMPLETE + "
              "NORMALIZED** on canonical `main` `2f0929c30f717ad608523cc1837ecfb1129a28f1`. R18.6 is **COMPLETE + "
              "NORMALIZED** on canonical `main` `4ccbe4ef1fe66f88e38dfc8c9dfebba7e183efe1`. R18.7 KodeStudio update "
              "discovery and release-channel UX is **COMPLETE + NORMALIZED** on canonical `main` "
              "`03ad2cbede77fbf29d996ad21ad65e74ae09273a` after implementation/evidence PR #395 and unique "
              "continuity-only normalization PR #396. R18.8 Verified download, user-consented install and rollback is "
              "**IN_PROGRESS at START-sync** on dedicated branch `r18/08-verified-download-install-rollback` from that exact "
              "normalized R18.7 main. R18.9–R18.11 remain PLANNED. The frozen v1.0/R1–R16 architecture and history are not rewritten."
          )
          if rtext.count(old_status) != 1:
              raise SystemExit("roadmap status anchor is not unique")
          rtext = rtext.replace(old_status, new_status, 1)

          banner = (
              "> Kodepoia, architecture v1.0 gelée. **R1–R17 COMPLETE + NORMALIZED. R18 planning ACCEPTED + NORMALIZED. "
              "R18.1–R18.7 are COMPLETE + NORMALIZED on their recorded canonical mains. R18.8 Verified download, "
              "user-consented install and rollback is IN_PROGRESS at START-sync from canonical normalized R18.7 `main` "
              "`03ad2cbede77fbf29d996ad21ad65e74ae09273a`; R18.9–R18.11 remain PLANNED.** Production signing, public GitHub "
              "Release publication, immutable-release repository setting changes, production TUF key custody/hosting and "
              "public WinGet submission remain CONDITIONAL / NOT TRIGGERED."
          )
          if not clines or not clines[0].startswith("> Kodepoia,"):
              raise SystemExit("continuity banner anchor missing")
          clines[0] = banner

          global_idx = next(i for i, line in enumerate(clines) if line.startswith("- R18.7 :"))
          clines[global_idx] = (
              "- R18.7 : **COMPLETE + NORMALIZED** — exact normalized R18.6 base `main` "
              "`4ccbe4ef1fe66f88e38dfc8c9dfebba7e183efe1`; immutable accepted technical source "
              "`9e177643f245eb32dd302a5c5eedd6d76d4b9386`; final exact-END `85021acb72cd0d69763eaa2c87e874019061d538` "
              "passed R18.7 #47 / `34019055827` Ubuntu + Windows, R16.9 #184 / `34019055655` Ubuntu + Windows, R0 #2528 / "
              "`34019055858` Ubuntu + Windows, Python Core #2500 / `34019055862` 5/5 and KodeStudio UI Smoke #2465 / "
              "`34019055667`; PR #395 merged exact head as implementation/evidence `main` "
              "`a896650d547e28fe0a7158dc360f5a11c2bb1b91`. Unique normalization head "
              "`fd933cbf548e4ec66fdda0cb3defb599764a0f5d` passed fresh R0 #2530 / `34019651604` Ubuntu + Windows, Python "
              "Core #2502 / `34019651257` 5/5 and KodeStudio UI Smoke #2467 / `34019651509`; PR #396 merged with exact "
              "expected-head protection as canonical normalized `main` `03ad2cbede77fbf29d996ad21ad65e74ae09273a`. Manual NONE; no "
              "production/public distribution effect was triggered. No second R18.7 normalization is authorized."
          )

          state_idx = next(
              i for i, line in enumerate(clines)
              if line.startswith("- State: **R18.7 COMPLETE + NORMALIZED")
          )
          clines[state_idx] = (
              "- State: **R18.8 IN_PROGRESS at START-sync** — planning and R18.1–R18.7 are COMPLETE + NORMALIZED. Canonical "
              "normalized R18.7 `main` is `03ad2cbede77fbf29d996ad21ad65e74ae09273a` after implementation/evidence PR #395 "
              "and unique normalization PR #396. R18.8 starts only from that exact SHA on dedicated branch "
              "`r18/08-verified-download-install-rollback`; R18.9–R18.11 remain PLANNED. Core manual state for R18.8 is NONE; "
              "production signing, public GitHub Release publication, immutable-release setting changes, production TUF key "
              "custody/hosting and public WinGet submission remain CONDITIONAL / NOT TRIGGERED."
          )

          next_idx = next(i for i, line in enumerate(clines) if line == "## Next authorized action")
          if next_idx + 2 >= len(clines):
              raise SystemExit("next-action block malformed")
          end_idx = next_idx + 1
          while end_idx < len(clines) and not clines[end_idx].startswith("## R17"):
              end_idx += 1
          start_section = [
              "## R18.8 START authority",
              "",
              "- Exact branch point: canonical normalized R18.7 `main` `03ad2cbede77fbf29d996ad21ad65e74ae09273a`.",
              "- Dedicated branch: `r18/08-verified-download-install-rollback`.",
              "- State transition: R18.1–R18.7 **COMPLETE + NORMALIZED**; R18.8 **IN_PROGRESS**; R18.9–R18.11 **PLANNED**.",
              "- START-sync scope is documentation-only: `docs/roadmap/R18_PLAN.md` + this continuity file. No downloader, cache, Authenticode handoff, installer execution, Qt flow, workflow or test implementation bytes are authorized before this START record.",
              "- Frozen R18.8 scope: bounded download of only the TUF-authorized Windows installer; exact target length/hash enforcement; authoritative Authenticode-policy verification and release-identity consistency; application-owned `.partial` staging with atomic finalize; explicit user confirmation before installer launch; structured close/restart handoff; previous-version recovery metadata; interrupted/cancelled/failed install coverage. Silent forced upgrades, deltas and project-data mutation remain out of scope.",
              "- Trust/execution boundary: downloaded bytes remain non-executable until TUF target binding, exact length/hash, release identity and R18.4 signing policy all pass. Execution accepts only the verified staged path; no model-provided URL, executable path, command or shell text becomes authority. User confirmation remains mandatory even after verification.",
              "- Current official research basis rechecked at START: TUF Targets metadata binds target files by hashes and size; Microsoft WinVerifyTrust/Authenticode verification treats only a zero return as success; Windows `runas` elevation invokes UAC consent. These platform facts are design inputs, not mutable runtime authority.",
              "- Core manual state: **NONE** for CI/synthetic acceptance. Production signing/public GitHub Release/immutable-release settings/production TUF custody-hosting/public WinGet remain **CONDITIONAL / NOT TRIGGERED**.",
              "- Temporary START-sync transport helpers are non-authoritative and must be absent from the clean START head. Its net diff from `03ad2cbede77fbf29d996ad21ad65e74ae09273a` must contain only `docs/roadmap/R18_PLAN.md` + `docs/continuity/KODEPOIA_CONTINUITY.md`.",
              "",
              "## Next authorized action",
              "",
              "Verify the clean R18.8 documentation-only START head differs from canonical normalized R18.7 `main` `03ad2cbede77fbf29d996ad21ad65e74ae09273a` only by `docs/roadmap/R18_PLAN.md` + `docs/continuity/KODEPOIA_CONTINUITY.md`, then implement R18.8 on the same dedicated branch. Technical acceptance must run on one immutable implementation source before END-sync. R18.9 remains unauthorized until R18.8 is COMPLETE + NORMALIZED.",
              "",
          ]
          clines[next_idx:end_idx] = start_section

          roadmap.write_text(rtext, encoding="utf-8", newline="\n")
          continuity.write_text("\n".join(clines) + "\n", encoding="utf-8", newline="\n")
          helper.unlink()
          PY

          git config user.name "kodepoia-r18-start-sync"
          git config user.email "actions@users.noreply.github.com"
          git add docs/roadmap/R18_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r18-8-start-sync-helper.yml
          git diff --cached --check
          git commit -m "docs(r18.8): establish START authority"
          git push origin HEAD:r18/08-verified-download-install-rollback
