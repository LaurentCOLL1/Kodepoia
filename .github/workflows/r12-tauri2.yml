name: R12 Tauri2 Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r12-tauri2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri2-windows:
    name: tauri2-windows
    runs-on: windows-2022
    env:
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Kodepoia
        run: python -m pip install -e ".[dev]"
      - name: Select supported Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup default stable-msvc
          rustc -vV
          cargo --version
      - name: Initialize hosted MSVC C++ environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe missing on hosted Windows runner" }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "Visual Studio C++ Build Tools installation not found" }
          $devcmd = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $devcmd)) { throw "VsDevCmd.bat missing" }
          $environment = & cmd.exe /d /s /c "`"$devcmd`" -no_logo -arch=x64 -host_arch=x64 >nul && set"
          $captured = @{}
          foreach ($line in $environment) {
            $separator = $line.IndexOf("=")
            if ($separator -le 0) { continue }
            $name = $line.Substring(0, $separator)
            $value = $line.Substring($separator + 1)
            $captured[$name.ToUpperInvariant()] = $value
          }
          foreach ($name in @("INCLUDE", "LIB", "LIBPATH")) {
            if (-not $captured.ContainsKey($name) -or -not $captured[$name]) { throw "MSVC $name environment missing" }
            "$name=$($captured[$name])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          $link = Get-ChildItem -Path (Join-Path $installation "VC\Tools\MSVC\*\bin\Hostx64\x64\link.exe") -File | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $link) { throw "MSVC link.exe missing" }
          $link.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "MSVC linker: $($link.FullName)"
      - name: Render deterministic Tauri fixture
        run: python scripts/r12_9_tauri_acceptance.py --prepare-only
      - name: Preload locked Rust dependencies as CI infrastructure
        shell: pwsh
        run: |
          $manifest = ".kodepoia/fixtures/tauri2/Cargo.toml"
          cargo generate-lockfile --manifest-path $manifest
          cargo fetch --locked --manifest-path $manifest
          if (-not (Test-Path ".kodepoia/fixtures/tauri2/Cargo.lock")) { throw "Cargo.lock missing after CI preload" }
      - name: Build offline and runtime-probe Tauri WebView2 fixture
        run: python scripts/r12_9_tauri_acceptance.py --output ".kodepoia/evidence/R12_9_TAURI_WINDOWS.json"
      - name: Upload Tauri evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-9-tauri2-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: .kodepoia/evidence/R12_9_TAURI_WINDOWS.json
          if-no-files-found: warn
