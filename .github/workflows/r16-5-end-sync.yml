name: R16.5 END Sync

on:
  push:
    branches:
      - r16/05-plugin-mcp-tool-trust-hardening
    paths:
      - .github/workflows/r16-5-end-sync.yml

permissions:
  contents: write

jobs:
  end-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R16.5 branch
        uses: actions/checkout@v4
        with:
          ref: r16/05-plugin-mcp-tool-trust-hardening
          fetch-depth: 0

      - name: Synchronize R16.5 END authority
        shell: python
        run: |
          from pathlib import Path
          import re

          plan_path = Path("docs/roadmap/R16_PLAN.md")
          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          plan = plan_path.read_text(encoding="utf-8")
          continuity = continuity_path.read_text(encoding="utf-8")

          checkpoint = (
              "**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + "
              "NORMALIZED. R16.1–R16.4 are COMPLETE + NORMALIZED. R16.5 is COMPLETE at mandatory END-sync; "
              "fresh exact-END R16.5/R0/Python/UI re-gates are required before protected merge. "
              "R16.6–R16.18 remain PLANNED."
          )
          plan, count = re.subn(r"^\*\*Execution checkpoint:\*\*.*$", checkpoint, plan, count=1, flags=re.M)
          if count != 1:
              raise SystemExit("R16 checkpoint replacement failed")

          old_row = "| R16.5 | Plugin/MCP/tool trust, authorization and supply-chain boundary | IN_PROGRESS | NONE |"
          new_row = "| R16.5 | Plugin/MCP/tool trust, authorization and supply-chain boundary | COMPLETE | NONE |"
          if plan.count(old_row) != 1:
              raise SystemExit("R16.5 plan row replacement failed")
          plan = plan.replace(old_row, new_row, 1)

          marker = "\n---\n\n# R16.6 — Destructive-command, excessive-agency and confused-deputy hardening"
          end_lines = [
              "",
              "## R16.5 END acceptance authority",
              "",
              "- Normalized branch point: `main` `eb62c9087dcb463917487ceb228d6926d6f9bb26`; clean START `c5eb6aa7d4fcd7551acf203651f51643dde9a695`; immutable technical source `4a3c925592e1e2915e7075825ca2d40e45ba1f1b`.",
              "- Technical-source gate: R16.5 #3 / `33517964905` SUCCESS Ubuntu + Windows after exact checkout provenance, compile, Ruff, 12 focused tests and exact-source acceptance.",
              "- Cross-platform acceptance is semantically identical: semantic SHA-256 `c8143a0386d384818cc4eef908cc224994c06291074e6a7e266f757c6483b83c`; 12/12 critical cases PASS with `security_claim=true`, `critical_veto=false`, `manual_state=NONE`, synthetic local plugin/MCP/tool fixtures, no live third-party server, no live credentials and zero network calls.",
              "- Linux artifact `9804400604` archive SHA-256 `e152d53eed46e710819b2980e8c6d7167f4cd61a06892fd77c2e52a93edfb1df`, payload SHA-256 `a51107a56236025532b750452238a7d61a53621a7721724e2aa1da181ce9ef7e`; Windows artifact `9804418715` archive SHA-256 `0b9faf72095b15a5f629e387c9b83849eb4f731651f6bc411aa39eb526f9dd74`, payload SHA-256 `435ee5cf1059b23c1615d7d5f745801fe84bb8d52494fa56b6b944c13df4efce`.",
              "- Security boundary delivered: discovery/registration/trust/invocation are distinct; descriptions, schemas and tool results remain untrusted data-only; identity/version/artifact and definition digests are pinned; capability escalation and missing runtime permissions fail closed; invocation approval binds exact identity, operation, capability set and initiating intent; credential issuer/audience are identity-bound; cross-tool/replayed approvals are denied; definition or binary replacement is quarantined; revocation clears cached invocation grants.",
              "- Manual NONE. R16.5 is COMPLETE at END-sync. Fresh exact-END R16.5/R0/Python/UI re-gates are mandatory before protected merge; R16.6 remains PLANNED until implementation merge and unique post-merge continuity normalization complete.",
              "",
          ]
          if plan.count(marker) != 1:
              raise SystemExit("R16.6 insertion marker missing or ambiguous")
          plan = plan.replace(marker, "\n".join(end_lines) + marker, 1)

          old_header = (
              "R16.1–R16.4 COMPLETE + NORMALIZED. R16.5 IN_PROGRESS on `r16/05-plugin-mcp-tool-trust-hardening` "
              "from normalized `main` `eb62c9087dcb463917487ceb228d6926d6f9bb26`. R16.6–R16.18 remain PLANNED."
          )
          new_header = (
              "R16.1–R16.4 COMPLETE + NORMALIZED. R16.5 COMPLETE at mandatory END-sync on "
              "`r16/05-plugin-mcp-tool-trust-hardening`; fresh exact-END re-gates are required before protected merge. "
              "R16.6–R16.18 remain PLANNED."
          )
          if continuity.count(old_header) != 1:
              raise SystemExit("continuity header replacement failed")
          continuity = continuity.replace(old_header, new_header, 1)

          replacement = (
              "- R16.5 : **COMPLETE** — normalized R16.4 `main` `eb62c9087dcb463917487ceb228d6926d6f9bb26`; "
              "clean START `c5eb6aa7d4fcd7551acf203651f51643dde9a695`; immutable technical source "
              "`4a3c925592e1e2915e7075825ca2d40e45ba1f1b`; technical R16.5 #3 / `33517964905` SUCCESS Ubuntu + Windows; "
              "semantic acceptance `c8143a0386d384818cc4eef908cc224994c06291074e6a7e266f757c6483b83c`; 12/12 PASS, "
              "`security_claim=true`, `critical_veto=false`, synthetic/local only, no live third-party server, live credentials or network calls, manual NONE. "
              "Linux artifact `9804400604` / `e152d53eed46e710819b2980e8c6d7167f4cd61a06892fd77c2e52a93edfb1df`; Windows artifact "
              "`9804418715` / `0b9faf72095b15a5f629e387c9b83849eb4f731651f6bc411aa39eb526f9dd74`. Discovery is not trust; tool metadata/results remain untrusted data-only; identity/version/artifact/definition are pinned; capabilities, runtime permissions, exact intent/operation approval and credential issuer/audience are bound; drift is quarantined and revocation clears grants. "
              "Fresh exact-END R16.5/R0/Python/UI re-gates are mandatory before merge; R16.6 remains PLANNED until post-merge normalization."
          )
          pattern = r"^- R16\.5 : \*\*IN_PROGRESS\*\* — .*?$"
          continuity, count = re.subn(pattern, replacement, continuity, count=1, flags=re.M)
          if count != 1:
              raise SystemExit("continuity R16.5 entry replacement failed")

          plan_path.write_text(plan, encoding="utf-8", newline="\n")
          continuity_path.write_text(continuity, encoding="utf-8", newline="\n")

      - name: Verify END sync scope
        shell: bash
        run: |
          git rm .github/workflows/r16-5-end-sync.yml
          git add docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/r16-5-end-sync.yml' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R16_PLAN.md' | sort)"
          test "$actual" = "$expected"

      - name: Commit clean END sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(r16.5): synchronize END acceptance"
          git push origin HEAD:r16/05-plugin-mcp-tool-trust-hardening
