name: Temporary R16.18 END Sync Transformer

on:
  push:
    branches:
      - r16/18-integrated-adversarial-real-project-rc-acceptance

permissions:
  contents: write

jobs:
  transform-end-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Transform documentation
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/r16_end_sync.py
          python /tmp/r16_end_sync.py
      - name: Restore accepted technical workflow and remove helper
        shell: bash
        run: |
          git checkout 230ff65feaaa50e9b0c740658e06c74976448908 -- .github/workflows/r16-18-integrated-rc-acceptance.yml
          rm -f .github/workflows/r16-18-end-sync-helper.yml
          git config user.name "LaurentCOLL1"
          git config user.email "128934707+LaurentCOLL1@users.noreply.github.com"
          git add docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r16-18-integrated-rc-acceptance.yml
          git add -u .github/workflows/r16-18-end-sync-helper.yml || true
          git diff --cached --name-only
          git commit -m "R16.18: synchronize END authority"
          git push origin HEAD:r16/18-integrated-adversarial-real-project-rc-acceptance
