name: R20.3 Zero-Cost Signing Acceptance

on:
  push:
    branches:
      - r20/03-zero-cost-architecture
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r20-3-zero-cost-signing-acceptance.yml
      - .github/workflows/r20-3-live-signing-challenge.yml
      - configs/r16_supply_chain_policy.json
      - docs/continuity/KODEPOIA_CONTINUITY_R20.md
      - docs/roadmap/R20_PLAN.md
      - docs/roadmap/R20_3_PUBLIC_KEYS.json
      - docs/roadmap/R20_3_ROOT_V2_UNSIGNED.json
      - docs/roadmap/R20_3_ROOT_ROTATION_MANIFEST.json
      - docs/roadmap/R20_3_PUBLIC_PACKAGE_ACCEPTANCE.json
      - scripts/r20_3_prepare_zero_cost_keys.py
      - scripts/r20_3_verify_public_package.py
      - scripts/r20_3_sign_root_v2.py
      - scripts/r20_3_finalize_transition.py
      - scripts/r20_3_live_signing_challenge.py
      - src/kodepoia/update/zero_cost_signing.py
      - src/kodepoia/update/root_transition.py
      - tests/test_r20_3_zero_cost_signing.py
      - tests/test_r20_3_root_transition.py
      - tests/test_supply_chain_r16_9.py
      - update-repository/metadata/root.json
      - update-repository/metadata/snapshot.json
      - update-repository/metadata/timestamp.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r20-3-zero-cost-signing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-cost-signing-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile R20.3 sources
        run: >-
          python -m compileall -q
          src/kodepoia/update/zero_cost_signing.py
          src/kodepoia/update/root_transition.py
          scripts/r20_3_prepare_zero_cost_keys.py
          scripts/r20_3_verify_public_package.py
          scripts/r20_3_sign_root_v2.py
          scripts/r20_3_finalize_transition.py
          scripts/r20_3_live_signing_challenge.py
          tests/test_r20_3_zero_cost_signing.py
          tests/test_r20_3_root_transition.py

      - name: Run Ruff R20.3
        run: >-
          python -m ruff check
          src/kodepoia/update/zero_cost_signing.py
          src/kodepoia/update/root_transition.py
          scripts/r20_3_prepare_zero_cost_keys.py
          scripts/r20_3_verify_public_package.py
          scripts/r20_3_sign_root_v2.py
          scripts/r20_3_finalize_transition.py
          scripts/r20_3_live_signing_challenge.py
          tests/test_r20_3_zero_cost_signing.py
          tests/test_r20_3_root_transition.py

      - name: Run R20.3 and inherited signer regressions
        run: >-
          python -m pytest -q
          tests/test_r20_3_zero_cost_signing.py
          tests/test_r20_3_root_transition.py
          tests/test_r20_2_online_signing.py
          tests/test_r20_1_bridge_refresh.py

      - name: Verify returned public package committed exactly
        run: python scripts/r20_3_verify_public_package.py

      - name: Assert production Root remains unchanged before offline ceremony
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          root = Path("update-repository/metadata/root.json").read_bytes()
          expected = "892442754966aa643bbe15a2910aa3fef59032c8f5eade34fed62efd96aefee5"
          actual = hashlib.sha256(root).hexdigest()
          if actual != expected:
              raise SystemExit(f"R20.3 pre-ceremony must preserve Root v1: {actual}")

      - name: Assert zero-cost architecture boundary
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path("docs/roadmap/R20_PLAN.md"),
              Path("docs/roadmap/R20_3_PUBLIC_KEYS.json"),
              Path("src/kodepoia/update/zero_cost_signing.py"),
              Path("scripts/r20_3_prepare_zero_cost_keys.py"),
          ]
          text = "\n".join(path.read_text(encoding="utf-8").lower() for path in paths)
          required = (
              "paid_provider_required\": false",
              "tuf_snapshot_ed25519_seed_b64",
              "tuf_timestamp_ed25519_seed_b64",
              "tuf-production-signing",
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"missing zero-cost invariant: {marker}")

          forbidden = (
              "aws-" + "actions/configure-aws-credentials",
              "google-" + "github-actions/auth",
              "azure/" + "login",
              "id-" + "token: write",
          )
          workflow = Path(
              ".github/workflows/r20-3-zero-cost-signing-acceptance.yml"
          ).read_text(encoding="utf-8").lower()
          for marker in forbidden:
              if marker in workflow:
                  raise SystemExit(f"paid/OIDC provider dependency leaked into reference acceptance: {marker}")

      - name: Assert manual boundary tooling is fail-closed
        shell: python
        run: |
          from pathlib import Path

          live = Path(".github/workflows/r20-3-live-signing-challenge.yml").read_text(
              encoding="utf-8"
          ).lower()
          required = (
              "workflow_dispatch",
              "contents: read",
              "refs/heads/main",
              "environment: tuf-production-signing",
              "tuf_snapshot_ed25519_seed_b64",
              "tuf_timestamp_ed25519_seed_b64",
          )
          for marker in required:
              if marker not in live:
                  raise SystemExit(f"live challenge missing invariant: {marker}")
          forbidden = (
              "contents: write",
              "upload-artifact",
              "pull_request_target",
              "schedule:",
          )
          for marker in forbidden:
              if marker in live:
                  raise SystemExit(f"live challenge contains forbidden capability: {marker}")

          root_tool = Path("scripts/r20_3_sign_root_v2.py").read_text(encoding="utf-8")
          transition_tool = Path("scripts/r20_3_finalize_transition.py").read_text(
              encoding="utf-8"
          )
          if "7ae909722149fe7f05380f93b7317c99347f8b3c1d102b7b6ddca64bbe1bbe1d" not in root_tool:
              raise SystemExit("Root ceremony is not pinned to accepted unsigned Root v2")
          if "R20_3_FULL_TRANSITION_PUBLIC_PACKAGE.zip" not in transition_tool:
              raise SystemExit("full transition public package contract is missing")

      - name: Assert no live signing secrets are referenced by PR acceptance
        shell: python
        run: |
          from pathlib import Path

          workflow = Path(
              ".github/workflows/r20-3-zero-cost-signing-acceptance.yml"
          ).read_text(encoding="utf-8").lower()
          secret_context_prefix = "secrets" + "."
          if secret_context_prefix in workflow:
              raise SystemExit("R20.3 PR acceptance must not consume live GitHub secrets")

      - name: Emit public R20.3 pre-boundary evidence
        shell: python
        run: |
          import json
          import os

          report = {
              "format": "kodepoia-r20-3-zero-cost-signing-acceptance",
              "schema_version": 1,
              "source_sha": os.environ["EVIDENCE_SHA"].strip().lower(),
              "zero_cost_reference_path": True,
              "github_hosted_public_repo_runner": True,
              "real_public_package_integrated": True,
              "uploaded_zip_sha256": "4b26dbf702f93e1c2e6f813eae7c22771a06e97fd9d77bd6d57bff1b6c22b1db",
              "snapshot_keyid": "fac1c790b4d6dbeb04ca4a803bd80e6fde19127fc7ada34003cef5d6b50506d8",
              "timestamp_keyid": "8d81006fd9de63660d74c43b6926ed664b2e9f1bdf81a9556367232533d5a2ad",
              "live_signing_secrets_consumed": False,
              "production_root_modified": False,
              "offline_root_signing_performed": False,
              "full_transition_tooling_ready": True,
              "paid_provider_required": False,
              "actions_artifact_storage_used": False,
              "status": "pass",
          }
          print(json.dumps(report, indent=2, sort_keys=True))
