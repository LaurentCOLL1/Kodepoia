name: R18.1 Release Identity Acceptance

on:
  push:
    branches:
      - r18/01-release-identity
  pull_request:
    paths:
      - .github/workflows/r18-1-release-identity-acceptance.yml
      - pyproject.toml
      - packaging/windows/Kodepoia.iss
      - scripts/build_windows_installer.ps1
      - scripts/r18_1_release_identity_acceptance.py
      - src/kodepoia/__init__.py
      - src/kodepoia/cli.py
      - src/kodepoia/release_identity.json
      - src/kodepoia/release_identity.py
      - src/kodepoia/kodestudio/app_v11.py
      - tests/test_r18_release_identity.py
      - docs/roadmap/R18_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-identity:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True, encoding="utf-8"
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused acceptance dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile focused R18.1 sources
        run: >-
          python -m compileall -q
          src/kodepoia/release_identity.py
          src/kodepoia/cli.py
          src/kodepoia/kodestudio/app_v11.py
          scripts/r18_1_release_identity_acceptance.py
          tests/test_r18_release_identity.py

      - name: Ruff focused R18.1 sources
        run: >-
          python -m ruff check
          src/kodepoia/release_identity.py
          src/kodepoia/cli.py
          src/kodepoia/kodestudio/app_v11.py
          scripts/r18_1_release_identity_acceptance.py
          tests/test_r18_release_identity.py

      - name: Run focused R18.1 tests
        run: python -m pytest -q tests/test_r18_release_identity.py

      - name: Emit exact-source R18.1 acceptance
        run: >-
          python scripts/r18_1_release_identity_acceptance.py
          --source-sha "${{ env.EVIDENCE_SHA }}"
          --output artifacts/r18_1_release_identity_acceptance.json

      - name: Upload exact-source acceptance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-1-release-identity-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r18_1_release_identity_acceptance.json
          if-no-files-found: error
          retention-days: 30
