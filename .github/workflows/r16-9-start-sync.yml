name: R16.9 START Sync Helper

on:
  push:
    branches:
      - r16/09-supply-chain-provenance-hardening

permissions:
  contents: write

jobs:
  start-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: r16/09-supply-chain-provenance-hardening
          fetch-depth: 0

      - name: Apply bounded R16.9 START sync
        shell: python
        run: |
          from pathlib import Path

          plan_path = Path('docs/roadmap/R16_PLAN.md')
          continuity_path = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          plan = plan_path.read_text(encoding='utf-8')
          continuity = continuity_path.read_text(encoding='utf-8')

          old_checkpoint = (
              'R16.1–R16.7 are COMPLETE + NORMALIZED. R16.8 is COMPLETE on immutable technical source '
              '`9bea715e7f575696ba66240d6ff127e72e85f82e` with fresh technical acceptance recorded below; '
              'post-merge continuity normalization is still required before R16.9. R16.9–R16.18 remain PLANNED.'
          )
          new_checkpoint = (
              'R16.1–R16.8 are COMPLETE + NORMALIZED. R16.9 is IN_PROGRESS from normalized `main` '
              '`9e62f7d8a85965c64d66cf317e028993b669f775` on dedicated branch '
              '`r16/09-supply-chain-provenance-hardening`. R16.10–R16.18 remain PLANNED.'
          )
          if plan.count(old_checkpoint) != 1:
              raise SystemExit('R16_PLAN checkpoint replacement count != 1')
          plan = plan.replace(old_checkpoint, new_checkpoint, 1)

          old_rows = (
              '| R16.8 | Fault injection, KillSwitch, backup and recovery drills | COMPLETE | NONE |\n'
              '| R16.9 | Dependency/workflow/release supply-chain provenance hardening | PLANNED | NONE |'
          )
          new_rows = (
              '| R16.8 | Fault injection, KillSwitch, backup and recovery drills | COMPLETE + NORMALIZED | NONE |\n'
              '| R16.9 | Dependency/workflow/release supply-chain provenance hardening | IN_PROGRESS | NONE |'
          )
          if plan.count(old_rows) != 1:
              raise SystemExit('R16_PLAN status rows replacement count != 1')
          plan = plan.replace(old_rows, new_rows, 1)

          old_top = (
              '**R1–R15 COMPLETE + NORMALIZED. R16 planning ACCEPTED + NORMALIZED. '
              'R16.1–R16.8 COMPLETE + NORMALIZED. R16.9–R16.18 remain PLANNED. '
              'R16.9 START-sync is authorized only from the normalized `main` produced by the unique '
              'R16.8 post-merge continuity-only normalization.**'
          )
          new_top = (
              '**R1–R15 COMPLETE + NORMALIZED. R16 planning ACCEPTED + NORMALIZED. '
              'R16.1–R16.8 COMPLETE + NORMALIZED. R16.9 IN_PROGRESS on '
              '`r16/09-supply-chain-provenance-hardening` from normalized `main` '
              '`9e62f7d8a85965c64d66cf317e028993b669f775`. R16.10–R16.18 remain PLANNED.**'
          )
          if continuity.count(old_top) != 1:
              raise SystemExit('continuity top replacement count != 1')
          continuity = continuity.replace(old_top, new_top, 1)

          anchor_prefix = '- R16.8 : **COMPLETE + NORMALIZED** — normalized R16.7 `main` `951c53959956d1b88b3c9c3a8c4c328c1127236b`;'
          matching = [line for line in continuity.splitlines() if line.startswith(anchor_prefix)]
          if len(matching) != 1:
              raise SystemExit('R16.8 continuity anchor count != 1')
          new_line = (
              '- R16.9 : **IN_PROGRESS** — normalized R16.8 `main` '
              '`9e62f7d8a85965c64d66cf317e028993b669f775`; dedicated branch '
              '`r16/09-supply-chain-provenance-hardening`; scope frozen to deterministic dependency/tool inventory, '
              'workflow permission/reference auditing, release-input integrity/provenance, BOM/license coverage and '
              'synthetic tamper rejection; manual NONE. R16.10 remains PLANNED.'
          )
          if new_line not in continuity:
              continuity = continuity.replace(matching[0], matching[0] + '\n' + new_line, 1)

          plan_path.write_text(plan, encoding='utf-8', newline='\n')
          continuity_path.write_text(continuity, encoding='utf-8', newline='\n')

      - name: Commit START sync and self-delete helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r16-9-start-sync.yml
          git add docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/r16-9-start-sync.yml docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R16_PLAN.md "
          git commit -m "docs(r16.9): START-sync supply-chain provenance hardening"
          git push origin HEAD:r16/09-supply-chain-provenance-hardening
