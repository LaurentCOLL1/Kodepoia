name: R18.10 Revocation Rollback Compromised Release Drills Acceptance

on:
  push:
    branches:
      - r18/10-revocation-rollback-compromised-release-drills
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r18-10-incident-drills-acceptance.yml
      - src/kodepoia/release/incident.py
      - src/kodepoia/release/signing.py
      - src/kodepoia/release/tuf_security.py
      - src/kodepoia/update/**
      - src/kodepoia/kodestudio/update_settings.py
      - src/kodepoia/kodestudio/v11_localization.py
      - scripts/r18_10_acceptance.py
      - tests/test_r18_10_incident_drills.py
      - tests/test_r18_10_kodestudio_incident.py
      - configs/r16_supply_chain_policy.json
      - tests/test_supply_chain_r16_9.py
      - docs/release/R18_10_INCIDENT_PLAYBOOK.md
      - docs/roadmap/R18_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r18-10-incident-drills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  incident-drills:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install Qt Linux runtime dependency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev,ui]"

      - name: Compile R18.10 sources and tests
        run: >-
          python -m compileall -q
          src/kodepoia/release/incident.py
          scripts/r18_10_acceptance.py
          tests/test_r18_10_incident_drills.py
          tests/test_r18_10_kodestudio_incident.py
          src/kodepoia/kodestudio/v11_localization.py

      - name: Enforce Ruff-clean R18.10 scope
        run: >-
          python -m ruff check
          src/kodepoia/release/incident.py
          scripts/r18_10_acceptance.py
          tests/test_r18_10_incident_drills.py
          tests/test_r18_10_kodestudio_incident.py
          src/kodepoia/kodestudio/v11_localization.py
          tests/test_supply_chain_r16_9.py

      - name: Run focused R18.10 incident and UI tests
        run: >-
          python -m pytest -q
          tests/test_r18_10_incident_drills.py
          tests/test_r18_10_kodestudio_incident.py

      - name: Run TUF delivery and supply-chain regressions
        run: >-
          python -m pytest -q
          tests/test_r18_6_tuf_security.py
          tests/test_r18_8_verified_delivery.py
          tests/test_supply_chain_r16_9.py

      - name: Emit exact-source R18.10 incident evidence
        run: >-
          python scripts/r18_10_acceptance.py
          --source-sha ${{ env.EVIDENCE_SHA }}
          --output artifacts/r18_10/acceptance.json

      - name: Upload R18.10 incident evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-10-incident-drills-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r18_10/
          if-no-files-found: error
          retention-days: 30
