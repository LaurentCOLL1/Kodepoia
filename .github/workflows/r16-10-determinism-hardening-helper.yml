name: R16.10 Determinism Hardening Helper

on:
  push:
    branches:
      - r16/10-representative-godot-2d-beta-project
    paths:
      - .github/workflows/r16-10-determinism-hardening-helper.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: r16/10-representative-godot-2d-beta-project
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply bounded deterministic-evidence hardening
        shell: python
        run: |
          from pathlib import Path

          attrs = Path('.gitattributes')
          text = attrs.read_text(encoding='utf-8')
          marker = 'tests/fixtures/r16_10_godot_2d_beta/** text eol=lf'
          if marker not in text:
              anchor = 'docs/roadmap/*_LOCAL_ACCEPTANCE.json text eol=lf\n'
              if text.count(anchor) != 1:
                  raise SystemExit('unexpected .gitattributes anchor cardinality')
              insert = anchor + '\n# R16.10 representative Godot fixture is byte-bound across CI platforms.\n' + marker + '\n'
              text = text.replace(anchor, insert)
              attrs.write_text(text, encoding='utf-8')

          acceptance = Path('src/kodepoia/kodegodot/beta_acceptance.py')
          text = acceptance.read_text(encoding='utf-8')
          old = '''        recovery = {\n            "snapshot_manifest_sha256": _file_sha256(\n                aggregate_snapshot / "MANIFEST.txt"\n            ),\n            "checkpoint_integrity_sha256": checkpoint.integrity_sha256,\n            "restored_project_sha256": restored_project,\n        }'''
          new = '''        recovery = {\n            "snapshot_manifest_sha256": _file_sha256(\n                aggregate_snapshot / "MANIFEST.txt"\n            ),\n            "restored_paths": list(MUTATED_SCENES),\n            "restored_project_sha256": restored_project,\n        }'''
          if text.count(old) != 1:
              raise SystemExit(f'unexpected recovery block cardinality: {text.count(old)}')
          text = text.replace(old, new)
          old_report = '        "recovery_sha256": _sha256_payload(recovery),\n'
          new_report = old_report + '        "recovery_checkpoint_integrity_sha256": checkpoint.integrity_sha256,\n'
          if text.count(old_report) != 1:
              raise SystemExit('unexpected recovery report cardinality')
          text = text.replace(old_report, new_report)
          acceptance.write_text(text, encoding='utf-8')

          test = Path('tests/test_r16_10_godot_beta.py')
          text = test.read_text(encoding='utf-8')
          old_asserts = '''    assert len(report["diff_sha256"]) == 64\n    assert len(report["diagnostic_sha256"]) == 64\n    assert len(report["recovery_sha256"]) == 64\n    assert len(report["semantic_sha256"]) == 64\n    assert len(report["evidence_sha256"]) == 64\n'''
          new_asserts = '''    assert report["fixture_sha256"] == "e87b912f36b960e724b4d2eb6367794c6933ae0255353b5cbcbb400294c66b95"\n    assert report["changed_project_sha256"] == "0312025cdbfef593ba21a4280d9d897c4ef8aa37ec8201ceeec9c9b9b96f054e"\n    assert report["diff_sha256"] == "4226629a0be5da2ba2dfb3f344d56b973d9893462ef8cba64c7bc8b37a450542"\n    assert report["diagnostic_sha256"] == "f61d0af7376d7deda7ad2ac65b5debdf47154f432403d41c150d351a59fc6b07"\n    assert report["recovery_sha256"] == "6f107c6ff1c683ad31597e400512fb247ed56b6e4d035c1a9f0e4dce5ab5a7d5"\n    assert report["semantic_sha256"] == "25b95aa0ae5ccd909a1b93e9e0d3540482a2f6c6c01491c6fd7845fd80bbe095"\n    assert len(report["recovery_checkpoint_integrity_sha256"]) == 64\n    assert len(report["evidence_sha256"]) == 64\n'''
          if text.count(old_asserts) != 1:
              raise SystemExit('unexpected test assertion block cardinality')
          test.write_text(text.replace(old_asserts, new_asserts), encoding='utf-8')
      - name: Validate and freeze clean hardening
        run: |
          python -m compileall -q src/kodepoia/kodegodot/beta_acceptance.py tests/test_r16_10_godot_beta.py
          python -m pytest -q tests/test_audit_safechange.py tests/test_r16_10_godot_beta.py
          python -m ruff check src/kodepoia/kodegodot/beta_acceptance.py tests/test_r16_10_godot_beta.py
          git diff --check -- .gitattributes src/kodepoia/kodegodot/beta_acceptance.py tests/test_r16_10_godot_beta.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r16-10-determinism-hardening-helper.yml
          git add .gitattributes src/kodepoia/kodegodot/beta_acceptance.py tests/test_r16_10_godot_beta.py
          expected=$'.gitattributes\n.github/workflows/r16-10-determinism-hardening-helper.yml\nsrc/kodepoia/kodegodot/beta_acceptance.py\ntests/test_r16_10_godot_beta.py'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m "test(r16.10): make evidence digests cross-platform deterministic"
          git push origin HEAD:r16/10-representative-godot-2d-beta-project
