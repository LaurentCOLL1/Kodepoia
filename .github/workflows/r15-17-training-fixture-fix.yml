name: R15.17 Temporary Training Fixture Fix

on:
  push:
    branches:
      - 'r15/17-adversarial-integrated-acceptance'
    paths:
      - '.github/workflows/r15-17-training-fixture-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/17-adversarial-integrated-acceptance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact R15.9 authorization and deterministic inventory normalization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/kodepoia/tuning/integrated_acceptance.py')
          text = path.read_text(encoding='utf-8')

          auth_old = 'fixture_authorization="repository-owned-r15.17-fixture"'
          auth_new = 'fixture_authorization="repository-owned-r15.9-fixture"'
          if text.count(auth_old) != 1:
              raise SystemExit('expected exactly one R15.17 fixture authorization')
          text = text.replace(auth_old, auth_new)

          inventory_old = '''    if tuple(checks) != CHECK_NAMES:\n        raise RuntimeError("R15.17 scenario did not execute the exact adversarial inventory")\n\n    identities = {'''
          inventory_new = '''    if len(checks) != len(CHECK_NAMES) or set(checks) != set(CHECK_NAMES):\n        raise RuntimeError("R15.17 scenario did not execute the exact adversarial inventory")\n    checks = {name: checks[name] for name in CHECK_NAMES}\n\n    identities = {'''
          if text.count(inventory_old) != 1:
              raise SystemExit('expected exactly one adversarial inventory guard')
          text = text.replace(inventory_old, inventory_new)
          path.write_text(text, encoding='utf-8')
          PY

          rm -f docs/roadmap/.r15_17_failure.txt
          python -m pip install -e '.[dev]'
          python -m ruff check src/kodepoia/tuning/integrated_acceptance.py scripts/r15_17_integrated_acceptance.py tests/test_r15_17_integrated_acceptance.py

          set +e
          python -m pytest -q tests/test_r15_17_integrated_acceptance.py > /tmp/r15_17_pytest.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "diagnostic_source_sha=$(git rev-parse HEAD)"
              echo "pytest_exit_code=$status"
              echo
              cat /tmp/r15_17_pytest.txt
            } > docs/roadmap/.r15_17_failure.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/roadmap/.r15_17_failure.txt
            git commit -m 'R15.17 record temporary focused failure diagnostic'
            git push origin HEAD:r15/17-adversarial-integrated-acceptance
            exit "$status"
          fi
          cat /tmp/r15_17_pytest.txt
          git diff --check

      - name: Commit only after focused acceptance passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/kodepoia/tuning/integrated_acceptance.py docs/roadmap/.r15_17_failure.txt
          git commit -m 'R15.17 bind training fixture and normalize check inventory'
          git push origin HEAD:r15/17-adversarial-integrated-acceptance
