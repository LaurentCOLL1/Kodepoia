name: R14.14 Pause Boundary Patch

on:
  push:
    branches:
      - r14/14-liveops-campaigns-schedules
    paths:
      - scripts/_r14_14_pause_boundary_patch.py
      - .github/workflows/r14-14-pause-boundary-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: r14/14-liveops-campaigns-schedules
          fetch-depth: 8
      - name: Assert patch surface
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/_r14_14_pause_boundary_patch.py
          test -f .github/workflows/r14-14-pause-boundary-patch.yml
      - name: Apply pause authority boundary
        run: python scripts/_r14_14_pause_boundary_patch.py
      - name: Compile LiveOps module
        run: python -m py_compile src/kodepoia/backend/liveops.py
      - name: Commit clean technical result
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/_r14_14_pause_boundary_patch.py
          rm .github/workflows/r14-14-pause-boundary-patch.yml
          git add src/kodepoia/backend/liveops.py
          git add -u scripts/_r14_14_pause_boundary_patch.py .github/workflows/r14-14-pause-boundary-patch.yml
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx 'src/kodepoia/backend/liveops.py'
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/_r14_14_pause_boundary_patch.py'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/r14-14-pause-boundary-patch.yml'
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(r14.14): isolate pause authority transition'
          git push origin HEAD:r14/14-liveops-campaigns-schedules
