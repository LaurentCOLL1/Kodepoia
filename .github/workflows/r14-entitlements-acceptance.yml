name: R14 Entitlements Acceptance

on:
  pull_request:
  push:
    branches:
      - main
      - r14/10-entitlements-billing-catalog
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entitlements-acceptance:
    name: entitlements-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_PATH: docs/roadmap/R14_10_ENTITLEMENTS_ACCEPTANCE-${{ matrix.os }}.json
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acceptance dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile acceptance surface
        run: >-
          python -m compileall -q
          src
          apps/kodestudio/backend/app
          tests/test_r14_4_auth_identity_sessions.py
          tests/test_r14_5_postgresql_persistence.py
          tests/test_r14_6_authoritative_server.py
          tests/test_r14_10_entitlements_billing.py
          tests/test_r13_7_google_play_readiness.py
          tests/test_mobile_r13_15_store_compliance.py
          scripts/r14_10_entitlements_acceptance.py

      - name: Focused R14 entitlement and authority regression
        run: >-
          python -m pytest -q
          tests/test_r14_4_auth_identity_sessions.py
          tests/test_r14_5_postgresql_persistence.py
          tests/test_r14_6_authoritative_server.py
          tests/test_r14_10_entitlements_billing.py

      - name: Focused R13 store compliance regression
        run: >-
          python -m pytest -q
          tests/test_r13_7_google_play_readiness.py
          tests/test_mobile_r13_15_store_compliance.py

      - name: Generate deterministic entitlement evidence
        run: >-
          python scripts/r14_10_entitlements_acceptance.py
          --source-sha "${{ env.EVIDENCE_SOURCE_SHA }}"
          --output "${{ env.EVIDENCE_PATH }}"

      - name: Validate evidence schema and exact source
        run: >-
          python -c "import json,os; from pathlib import Path; from jsonschema import Draft202012Validator; e=json.loads(Path(os.environ['EVIDENCE_PATH']).read_text(encoding='utf-8')); s=json.loads(Path('schemas/r14/backend-entitlement-evidence.schema.json').read_text(encoding='utf-8')); Draft202012Validator.check_schema(s); Draft202012Validator(s).validate(e); assert e['source_sha']==os.environ['EVIDENCE_SOURCE_SHA']; assert e['status']=='pass'; assert e['manual_state']=='conditional_not_triggered'; assert e['provider_live_claim'] is False; assert e['secrets_exposed'] is False"

      - name: Upload redacted entitlement evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r14-10-entitlements-evidence-${{ matrix.os }}-${{ env.EVIDENCE_SOURCE_SHA }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: error
