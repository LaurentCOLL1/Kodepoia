name: R15.9 Telemetry Helper

on:
  push:
    paths:
      - '.github/workflows/r15-9-telemetry-helper.yml'

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/09-qlora-sft
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add bounded resource telemetry
        shell: python
        run: |
          from pathlib import Path

          training = Path('src/kodepoia/tuning/training.py')
          text = training.read_text(encoding='utf-8')
          old = '''    optimized_splits: tuple[str, ...]\n    framework_versions: tuple[tuple[str, str | None], ...]\n    resumed_from: str | None\n'''
          new = '''    optimized_splits: tuple[str, ...]\n    framework_versions: tuple[tuple[str, str | None], ...]\n    resource_maxima: tuple[tuple[str, int | float | None], ...]\n    resumed_from: str | None\n'''
          if text.count(old) != 1:
              raise SystemExit('report telemetry field marker count != 1')
          text = text.replace(old, new, 1)
          old = '''        names = [name for name, _ in self.framework_versions]\n        if names != sorted(names) or len(names) != len(set(names)):\n            raise TrainingError("framework_versions must be unique and sorted")\n'''
          new = '''        names = [name for name, _ in self.framework_versions]\n        if names != sorted(names) or len(names) != len(set(names)):\n            raise TrainingError("framework_versions must be unique and sorted")\n        resource_names = tuple(name for name, _ in self.resource_maxima)\n        if resource_names != ("peak_ram_bytes", "peak_vram_bytes", "wall_seconds"):\n            raise TrainingError("resource_maxima must contain the canonical three metrics")\n        for name, value in self.resource_maxima:\n            if value is not None and (isinstance(value, bool) or not isinstance(value, (int, float)) or value < 0):\n                raise TrainingError(f"resource_maxima {name} must be non-negative numeric or null")\n'''
          if text.count(old) != 1:
              raise SystemExit('report telemetry validation marker count != 1')
          text = text.replace(old, new, 1)
          old = '''            "plan_digest": self.plan_digest,\n            "resumed_from": self.resumed_from,\n'''
          new = '''            "plan_digest": self.plan_digest,\n            "resource_maxima": {name: value for name, value in self.resource_maxima},\n            "resumed_from": self.resumed_from,\n'''
          if text.count(old) != 1:
              raise SystemExit('report telemetry descriptor marker count != 1')
          text = text.replace(old, new, 1)
          old = '''            "plan_digest",\n            "train_loss",\n'''
          new = '''            "plan_digest",\n            "resource_maxima",\n            "train_loss",\n'''
          if text.count(old) != 1:
              raise SystemExit('worker expected telemetry marker count != 1')
          text = text.replace(old, new, 1)
          old = '''        optimized = tuple(str(item) for item in output["optimized_splits"])\n        report = TrainingReport(\n'''
          new = '''        optimized = tuple(str(item) for item in output["optimized_splits"])\n        resources_raw = output["resource_maxima"]\n        if not isinstance(resources_raw, dict):\n            raise TrainingError("resource_maxima must be an object")\n        resource_maxima = tuple(\n            sorted((str(name), value) for name, value in resources_raw.items())\n        )\n        report = TrainingReport(\n'''
          if text.count(old) != 1:
              raise SystemExit('worker telemetry parse marker count != 1')
          text = text.replace(old, new, 1)
          old = '''            framework_versions=versions,\n            resumed_from=resumed_from,\n'''
          new = '''            framework_versions=versions,\n            resource_maxima=resource_maxima,\n            resumed_from=resumed_from,\n'''
          if text.count(old) != 1:
              raise SystemExit('report telemetry construction marker count != 1')
          text = text.replace(old, new, 1)
          old = '''            framework_versions=(("python", platform.python_version()),),\n            resumed_from=None,\n'''
          new = '''            framework_versions=(("python", platform.python_version()),),\n            resource_maxima=(("peak_ram_bytes", None), ("peak_vram_bytes", None), ("wall_seconds", 0.0)),\n            resumed_from=None,\n'''
          if text.count(old) != 1:
              raise SystemExit('terminal telemetry marker count != 1')
          text = text.replace(old, new, 1)
          training.write_text(text, encoding='utf-8', newline='\n')

          worker = Path('src/kodepoia/tuning/train_worker.py')
          text = worker.read_text(encoding='utf-8')
          if text.count('import sys\n') != 1:
              raise SystemExit('worker sys import marker count != 1')
          text = text.replace('import sys\n', 'import sys\nimport time\nimport tracemalloc\n', 1)
          old = '''def _run_fixture(config: dict[str, Any], root: Path, run_dir: Path) -> dict[str, object]:\n    plan_digest = str(config["plan_digest"])\n'''
          new = '''def _run_fixture(config: dict[str, Any], root: Path, run_dir: Path) -> dict[str, object]:\n    started = time.monotonic()\n    tracemalloc.start()\n    plan_digest = str(config["plan_digest"])\n'''
          if text.count(old) != 1:
              raise SystemExit('fixture telemetry start marker count != 1')
          text = text.replace(old, new, 1)
          old = '''    train_loss, eval_loss = _fixture_losses(max_steps)\n    return {\n'''
          new = '''    train_loss, eval_loss = _fixture_losses(max_steps)\n    _, peak_ram = tracemalloc.get_traced_memory()\n    tracemalloc.stop()\n    return {\n'''
          if text.count(old) != 1:
              raise SystemExit('fixture telemetry stop marker count != 1')
          text = text.replace(old, new, 1)
          old = '''        "plan_digest": plan_digest,\n        "train_loss": train_loss,\n'''
          new = '''        "plan_digest": plan_digest,\n        "resource_maxima": {\n            "peak_ram_bytes": int(peak_ram),\n            "peak_vram_bytes": None,\n            "wall_seconds": time.monotonic() - started,\n        },\n        "train_loss": train_loss,\n'''
          if text.count(old) != 1:
              raise SystemExit('fixture telemetry output marker count != 1')
          text = text.replace(old, new, 1)
          old = '''def _run_real(config: dict[str, Any], root: Path, run_dir: Path) -> dict[str, object]:\n    """Execute optional SFT/QLoRA. Heavy packages are imported only in this worker."""\n    import torch\n'''
          new = '''def _run_real(config: dict[str, Any], root: Path, run_dir: Path) -> dict[str, object]:\n    """Execute optional SFT/QLoRA. Heavy packages are imported only in this worker."""\n    started = time.monotonic()\n    import torch\n'''
          if text.count(old) != 1:
              raise SystemExit('real telemetry start marker count != 1')
          text = text.replace(old, new, 1)
          old = '''        "plan_digest": config["plan_digest"],\n        "train_loss": float(metrics.get("train_loss", 0.0)),\n'''
          new = '''        "plan_digest": config["plan_digest"],\n        "resource_maxima": {\n            "peak_ram_bytes": None,\n            "peak_vram_bytes": int(torch.cuda.max_memory_allocated()) if torch.cuda.is_available() else None,\n            "wall_seconds": time.monotonic() - started,\n        },\n        "train_loss": float(metrics.get("train_loss", 0.0)),\n'''
          if text.count(old) != 1:
              raise SystemExit('real telemetry output marker count != 1')
          worker.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          tests = Path('tests/test_tuning_r15_9.py')
          text = tests.read_text(encoding='utf-8')
          old = '''    assert first.completed_steps == 4\n    assert [item.step for item in first.checkpoints] == [2, 4]\n'''
          new = '''    assert first.completed_steps == 4\n    maxima = dict(first.resource_maxima)\n    assert maxima["peak_ram_bytes"] is not None and maxima["peak_ram_bytes"] >= 0\n    assert maxima["peak_vram_bytes"] is None\n    assert maxima["wall_seconds"] is not None and maxima["wall_seconds"] >= 0\n    assert [item.step for item in first.checkpoints] == [2, 4]\n'''
          if text.count(old) != 1:
              raise SystemExit('test telemetry marker count != 1')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate telemetry changes
        run: |
          python -m pip install -e '.[dev]'
          ruff format src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py tests/test_tuning_r15_9.py
          ruff check --unsafe-fixes --fix src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py tests/test_tuning_r15_9.py
          ruff check src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py tests/test_tuning_r15_9.py
          python -m compileall -q src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py
          pytest -q tests/test_tuning_r15_8.py tests/test_tuning_r15_9.py
      - name: Commit telemetry and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/r15-9-telemetry-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py tests/test_tuning_r15_9.py .github/workflows/r15-9-telemetry-helper.yml
          git diff --cached --check
          git commit -m 'feat(r15.9): record bounded training resource maxima'
          git push origin HEAD:r15/09-qlora-sft
