name: R18.2 Deterministic Release Bundle Acceptance

on:
  push:
    branches:
      - r18/02-deterministic-release-bundle
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r18-2-deterministic-release-bundle-acceptance.yml
      - scripts/build_windows_installer.ps1
      - scripts/build_release_bundle.py
      - scripts/verify_release_bundle.py
      - scripts/r18_2_release_bundle_acceptance.py
      - src/kodepoia/release/**
      - schemas/release_bundle_manifest.schema.json
      - schemas/release_identity.schema.json
      - tests/test_r18_release_bundle.py
      - docs/release/RELEASE_NOTES_TEMPLATE.md
      - LICENSE
      - NOTICE
      - NOTICE.md
      - THIRD_PARTY_NOTICES
      - THIRD_PARTY_NOTICES.md
      - docs/roadmap/R18_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r18-2-release-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True, encoding="utf-8"
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused acceptance dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile focused R18.2 sources
        run: >-
          python -m compileall -q
          src/kodepoia/release
          scripts/build_release_bundle.py
          scripts/verify_release_bundle.py
          scripts/r18_2_release_bundle_acceptance.py
          tests/test_r18_release_bundle.py

      - name: Ruff R18.2-owned Python sources
        run: >-
          python -m ruff check
          src/kodepoia/release/bundle.py
          scripts/build_release_bundle.py
          scripts/verify_release_bundle.py
          scripts/r18_2_release_bundle_acceptance.py
          tests/test_r18_release_bundle.py

      - name: Run focused R18.2 tests
        run: python -m pytest -q tests/test_r18_release_bundle.py

      - name: Emit synthetic exact-source R18.2 acceptance
        run: >-
          python scripts/r18_2_release_bundle_acceptance.py
          --source-sha "${{ env.EVIDENCE_SHA }}"
          --output artifacts/r18_2_synthetic_acceptance.json

      - name: Upload synthetic exact-source acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-2-contract-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r18_2_synthetic_acceptance.json
          if-no-files-found: error
          retention-days: 30

  windows-two-build:
    runs-on: windows-latest
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KODEPOIA_LOCALE: fr
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: pwsh
        run: |
          $expected = [string]$env:EVIDENCE_SHA
          $expected = $expected.Trim().ToLowerInvariant()
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Expected $expected, got $actual"
          }

      - name: Install build and test dependencies
        run: python -m pip install -e ".[dev,ui,code,packaging]"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer and deterministic bundle one
        shell: pwsh
        run: |
          ./scripts/build_windows_installer.ps1 -SourceSha "$env:EVIDENCE_SHA"
          New-Item -ItemType Directory -Force -Path "artifacts/r18_2/build1" | Out-Null
          Copy-Item "dist/windows/KodepoiaSetup.exe" "artifacts/r18_2/build1/KodepoiaSetup.exe"
          Copy-Item `
            "dist/windows/installer-manifest.json" `
            "artifacts/r18_2/build1/installer-manifest.json"
          python scripts/build_release_bundle.py `
            --installer "artifacts/r18_2/build1/KodepoiaSetup.exe" `
            --installer-manifest "artifacts/r18_2/build1/installer-manifest.json" `
            --source-sha "$env:EVIDENCE_SHA" `
            --output-dir "artifacts/r18_2/bundle1"

      - name: Build installer and deterministic bundle two
        shell: pwsh
        run: |
          ./scripts/build_windows_installer.ps1 -SourceSha "$env:EVIDENCE_SHA"
          New-Item -ItemType Directory -Force -Path "artifacts/r18_2/build2" | Out-Null
          Copy-Item "dist/windows/KodepoiaSetup.exe" "artifacts/r18_2/build2/KodepoiaSetup.exe"
          Copy-Item `
            "dist/windows/installer-manifest.json" `
            "artifacts/r18_2/build2/installer-manifest.json"
          python scripts/build_release_bundle.py `
            --installer "artifacts/r18_2/build2/KodepoiaSetup.exe" `
            --installer-manifest "artifacts/r18_2/build2/installer-manifest.json" `
            --source-sha "$env:EVIDENCE_SHA" `
            --output-dir "artifacts/r18_2/bundle2"

      - name: Verify two exact-source bundles and emit acceptance
        shell: pwsh
        run: |
          $bundle1 = (
            Get-ChildItem "artifacts/r18_2/bundle1" -Filter "*.zip" |
              Select-Object -First 1
          ).FullName
          $bundle2 = (
            Get-ChildItem "artifacts/r18_2/bundle2" -Filter "*.zip" |
              Select-Object -First 1
          ).FullName
          if (-not $bundle1 -or -not $bundle2) {
            throw "Expected both deterministic release bundle ZIPs."
          }
          python scripts/verify_release_bundle.py $bundle1 --source-sha "$env:EVIDENCE_SHA"
          python scripts/verify_release_bundle.py $bundle2 --source-sha "$env:EVIDENCE_SHA"
          python scripts/r18_2_release_bundle_acceptance.py `
            --source-sha "$env:EVIDENCE_SHA" `
            --bundle-one $bundle1 `
            --bundle-two $bundle2 `
            --output "artifacts/r18_2/R18_2_WINDOWS_ACCEPTANCE.json"

      - name: Silent clean install, packaged UI smoke and uninstall
        shell: pwsh
        run: |
          $setup = Resolve-Path "artifacts/r18_2/build2/KodepoiaSetup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "Kodepoia-r18-2-installed"
          $smokeDir = Join-Path $env:RUNNER_TEMP "Kodepoia-r18-2-smoke-cwd"
          $smokeReport = Join-Path $env:RUNNER_TEMP "kodepoia-r18-2-packaged-smoke.txt"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeReport -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null

          $process = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/MERGETASKS=!desktopicon",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer exited with $($process.ExitCode)"
          }

          $exe = Join-Path $installDir "KodepoiaStudio.exe"
          $uninstall = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $exe)) { throw "Installed KodepoiaStudio.exe missing" }
          if (-not (Test-Path $uninstall)) { throw "Uninstaller missing" }

          $originalPath = $env:PATH
          $originalPythonHome = $env:PYTHONHOME
          $originalPythonPath = $env:PYTHONPATH
          $env:PATH = @(
            (Join-Path $env:SystemRoot "System32"),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot "System32\Wbem")
          ) -join ";"
          $env:PYTHONHOME = $null
          $env:PYTHONPATH = $null
          try {
            if (Get-Command python.exe -ErrorAction SilentlyContinue) {
              throw "Developer Python is visible during packaged smoke"
            }
            if (Get-Command pip.exe -ErrorAction SilentlyContinue) {
              throw "Developer pip is visible during packaged smoke"
            }
            $smoke = Start-Process -FilePath $exe -ArgumentList @(
              "--smoke-test",
              "--smoke-report=$smokeReport"
            ) -WorkingDirectory $smokeDir -Wait -PassThru
            if ($smoke.ExitCode -ne 0) {
              if (Test-Path $smokeReport) { Get-Content $smokeReport }
              throw "Packaged KodeStudio smoke failed with $($smoke.ExitCode)"
            }
          }
          finally {
            $env:PATH = $originalPath
            $env:PYTHONHOME = $originalPythonHome
            $env:PYTHONPATH = $originalPythonPath
          }

          $uninstallProcess = Start-Process -FilePath $uninstall -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "Uninstaller failed with $($uninstallProcess.ExitCode)"
          }

          for ($attempt = 0; $attempt -lt 40 -and (Test-Path $exe); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $exe) {
            throw "KodepoiaStudio.exe still exists after successful uninstall"
          }

      - name: Upload Windows two-build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-2-windows-two-build-${{ env.EVIDENCE_SHA }}
          path: artifacts/r18_2
          if-no-files-found: error
          retention-days: 30
