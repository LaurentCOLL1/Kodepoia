name: R14.14 Backend Exports Patch

on:
  push:
    branches:
      - r14/14-liveops-campaigns-schedules
    paths:
      - scripts/_r14_14_backend_exports_patch.py
      - .github/workflows/r14-14-backend-exports-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: r14/14-liveops-campaigns-schedules
          fetch-depth: 6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert helper surface
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/_r14_14_backend_exports_patch.py
          test -f .github/workflows/r14-14-backend-exports-patch.yml
      - name: Apply guarded exports patch
        run: python scripts/_r14_14_backend_exports_patch.py
      - name: Compile and import public backend
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/kodepoia/backend/__init__.py src/kodepoia/backend/liveops.py
          PYTHONPATH=src python - <<'PY'
          import kodepoia.backend as backend
          names = (
              'CatalogProductReference', 'ConfigSnapshotReference', 'ContentManifestReference',
              'EventContractReference', 'InMemoryLiveOpsService', 'LiveOpsActivationRecord',
              'LiveOpsApproval', 'LiveOpsAudience', 'LiveOpsAudienceResult', 'LiveOpsAuditRecord',
              'LiveOpsAuthorizationError', 'LiveOpsCampaignDefinition', 'LiveOpsCampaignState',
              'LiveOpsCapacityError', 'LiveOpsPolicyError', 'LiveOpsPreview', 'LiveOpsRotation',
              'LiveOpsRuntimeRecord', 'LiveOpsScheduleWindow', 'LiveOpsSeasonDefinition',
              'LiveOpsSeasonReference', 'LiveOpsStateError', 'LiveOpsStateSnapshot',
          )
          for name in names:
              assert hasattr(backend, name), name
              assert name in backend.__all__, name
          PY
      - name: Commit clean export result
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/_r14_14_backend_exports_patch.py
          rm .github/workflows/r14-14-backend-exports-patch.yml
          git add src/kodepoia/backend/__init__.py
          git add -u scripts/_r14_14_backend_exports_patch.py .github/workflows/r14-14-backend-exports-patch.yml
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx 'src/kodepoia/backend/__init__.py'
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/_r14_14_backend_exports_patch.py'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/r14-14-backend-exports-patch.yml'
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(r14.14): export LiveOps backend contracts'
          git push origin HEAD:r14/14-liveops-campaigns-schedules
