name: Temporary R18.2 Exact-END Premerge Gates

on:
  push:
    branches:
      - scratch/r18-2-end-premerge-gates

permissions:
  contents: read

jobs:
  r0:
    name: r0-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KODEPOIA_SOURCE_SHA: ea7eb038661ae4637680eb5ce5c54f4006e89fc3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install R0 dependencies
        run: python -m pip install -r scripts/requirements-r0.txt
      - name: Verify Git LFS
        run: git lfs version
      - name: Repository Guard
        run: python scripts/check_repo.py

  python-core:
    name: python-core-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KODEPOIA_SOURCE_SHA: ea7eb038661ae4637680eb5ce5c54f4006e89fc3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install
        run: python -m pip install -e ".[dev,code]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate R7 integrated acceptance
        if: runner.os == 'Linux'
        run: python scripts/r7_integrated_acceptance.py --check-or-print docs/roadmap/R7_INTEGRATED_ACCEPTANCE.json
      - name: Validate R8 integrated acceptance
        if: runner.os == 'Linux'
        run: python scripts/r8_integrated_acceptance.py --check-or-print docs/roadmap/R8_INTEGRATED_ACCEPTANCE.json
      - name: Validate R9 integrated acceptance
        if: runner.os == 'Linux'
        run: python scripts/r9_integrated_acceptance.py --check-or-print docs/roadmap/R9_INTEGRATED_ACCEPTANCE.json
      - name: Validate PowerShell acceptance runner syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @(
            "scripts/r3_accept_local.ps1",
            "scripts/r5_accept_local.ps1",
            "scripts/r5_diagnose_godot_process.ps1",
            "scripts/r6_4_accept_local.ps1",
            "scripts/r6_5_accept_local.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Full Python Core
        run: pytest

  ui-smoke:
    name: kodestudio-ui-windows
    runs-on: windows-latest
    env:
      KODEPOIA_SOURCE_SHA: ea7eb038661ae4637680eb5ce5c54f4006e89fc3
      QT_QPA_PLATFORM: offscreen
      KODEPOIA_LOCALE: fr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install UI dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: KodeStudio UI Smoke
        run: pytest tests/test_kodestudio_smoke.py tests/test_r6_5_accessibility_ui.py tests/test_r6_6_localization_ui.py tests/test_r7_10_research_ui.py tests/test_r8_10_kodestudio.py tests/test_comfyui_r9_10_kodestudio.py

  r16-9:
    name: r16-9-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ea7eb038661ae4637680eb5ce5c54f4006e89fc3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['EVIDENCE_SHA']"
      - name: Install focused dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build exact-source wheel and sdist
        run: python -m build --wheel --sdist --outdir dist
      - name: Compile R16.9 sources
        run: python -m compileall -q src/kodepoia/quality/supply_chain.py scripts/r16_9_supply_chain_acceptance.py tests/test_supply_chain_r16_9.py
      - name: Ruff R16.9 sources
        run: python -m ruff check src/kodepoia/quality/supply_chain.py scripts/r16_9_supply_chain_acceptance.py tests/test_supply_chain_r16_9.py
      - name: Test R16.9
        run: python -m pytest -q tests/test_supply_chain_r16_9.py
      - name: Emit exact-source R16.9 acceptance
        run: python scripts/r16_9_supply_chain_acceptance.py --source-sha "${{ env.EVIDENCE_SHA }}" --platform "${{ runner.os }}" --output artifacts/r16_9_supply_chain_acceptance.json
      - name: Upload R16.9 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r16-9-end-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r16_9_supply_chain_acceptance.json
          if-no-files-found: error
          retention-days: 30

  r18-2-contract:
    name: r18-2-contract-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ea7eb038661ae4637680eb5ce5c54f4006e89fc3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['EVIDENCE_SHA']"
      - name: Install focused dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile R18.2 sources
        run: python -m compileall -q src/kodepoia/release scripts/build_release_bundle.py scripts/verify_release_bundle.py scripts/r18_2_release_bundle_acceptance.py tests/test_r18_release_bundle.py
      - name: Ruff R18.2 sources
        run: python -m ruff check src/kodepoia/release/bundle.py scripts/build_release_bundle.py scripts/verify_release_bundle.py scripts/r18_2_release_bundle_acceptance.py tests/test_r18_release_bundle.py
      - name: Test R18.2
        run: python -m pytest -q tests/test_r18_release_bundle.py
      - name: Emit synthetic exact-source R18.2 acceptance
        run: python scripts/r18_2_release_bundle_acceptance.py --source-sha "${{ env.EVIDENCE_SHA }}" --output artifacts/r18_2_synthetic_acceptance.json
      - name: Upload R18.2 contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-2-end-contract-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r18_2_synthetic_acceptance.json
          if-no-files-found: error
          retention-days: 30

  r18-2-windows-two-build:
    name: r18-2-windows-two-build
    runs-on: windows-latest
    env:
      EVIDENCE_SHA: ea7eb038661ae4637680eb5ce5c54f4006e89fc3
      KODEPOIA_LOCALE: fr
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = $env:EVIDENCE_SHA.Trim().ToLowerInvariant()
          if ($actual -ne $expected) { throw "Expected $expected, got $actual" }
      - name: Install build and test dependencies
        run: python -m pip install -e ".[dev,ui,code,packaging]"
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer and bundle one
        shell: pwsh
        run: |
          ./scripts/build_windows_installer.ps1 -SourceSha "$env:EVIDENCE_SHA"
          New-Item -ItemType Directory -Force -Path "artifacts/r18_2/build1" | Out-Null
          Copy-Item "dist/windows/KodepoiaSetup.exe" "artifacts/r18_2/build1/KodepoiaSetup.exe"
          Copy-Item "dist/windows/installer-manifest.json" "artifacts/r18_2/build1/installer-manifest.json"
          python scripts/build_release_bundle.py --installer "artifacts/r18_2/build1/KodepoiaSetup.exe" --installer-manifest "artifacts/r18_2/build1/installer-manifest.json" --source-sha "$env:EVIDENCE_SHA" --output-dir "artifacts/r18_2/bundle1"
      - name: Build installer and bundle two
        shell: pwsh
        run: |
          ./scripts/build_windows_installer.ps1 -SourceSha "$env:EVIDENCE_SHA"
          New-Item -ItemType Directory -Force -Path "artifacts/r18_2/build2" | Out-Null
          Copy-Item "dist/windows/KodepoiaSetup.exe" "artifacts/r18_2/build2/KodepoiaSetup.exe"
          Copy-Item "dist/windows/installer-manifest.json" "artifacts/r18_2/build2/installer-manifest.json"
          python scripts/build_release_bundle.py --installer "artifacts/r18_2/build2/KodepoiaSetup.exe" --installer-manifest "artifacts/r18_2/build2/installer-manifest.json" --source-sha "$env:EVIDENCE_SHA" --output-dir "artifacts/r18_2/bundle2"
      - name: Verify two bundles and emit acceptance
        shell: pwsh
        run: |
          $bundle1 = (Get-ChildItem "artifacts/r18_2/bundle1" -Filter "*.zip" | Select-Object -First 1).FullName
          $bundle2 = (Get-ChildItem "artifacts/r18_2/bundle2" -Filter "*.zip" | Select-Object -First 1).FullName
          if (-not $bundle1 -or -not $bundle2) { throw "Expected both release bundle ZIPs" }
          python scripts/verify_release_bundle.py $bundle1 --source-sha "$env:EVIDENCE_SHA"
          python scripts/verify_release_bundle.py $bundle2 --source-sha "$env:EVIDENCE_SHA"
          python scripts/r18_2_release_bundle_acceptance.py --source-sha "$env:EVIDENCE_SHA" --bundle-one $bundle1 --bundle-two $bundle2 --output "artifacts/r18_2/R18_2_WINDOWS_ACCEPTANCE.json"
      - name: Silent clean install, packaged UI smoke and uninstall
        shell: pwsh
        run: |
          $setup = Resolve-Path "artifacts/r18_2/build2/KodepoiaSetup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "Kodepoia-r18-2-end-installed"
          $smokeDir = Join-Path $env:RUNNER_TEMP "Kodepoia-r18-2-end-smoke-cwd"
          $smokeReport = Join-Path $env:RUNNER_TEMP "kodepoia-r18-2-end-packaged-smoke.txt"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeReport -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $process = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/MERGETASKS=!desktopicon","/DIR=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $exe = Join-Path $installDir "KodepoiaStudio.exe"
          $uninstall = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $exe)) { throw "Installed KodepoiaStudio.exe missing" }
          if (-not (Test-Path $uninstall)) { throw "Uninstaller missing" }
          $originalPath = $env:PATH
          $originalPythonHome = $env:PYTHONHOME
          $originalPythonPath = $env:PYTHONPATH
          $env:PATH = @((Join-Path $env:SystemRoot "System32"),$env:SystemRoot,(Join-Path $env:SystemRoot "System32\Wbem")) -join ";"
          $env:PYTHONHOME = $null
          $env:PYTHONPATH = $null
          try {
            if (Get-Command python.exe -ErrorAction SilentlyContinue) { throw "Developer Python visible during packaged smoke" }
            if (Get-Command pip.exe -ErrorAction SilentlyContinue) { throw "Developer pip visible during packaged smoke" }
            $smoke = Start-Process -FilePath $exe -ArgumentList @("--smoke-test","--smoke-report=$smokeReport") -WorkingDirectory $smokeDir -Wait -PassThru
            if ($smoke.ExitCode -ne 0) {
              if (Test-Path $smokeReport) { Get-Content $smokeReport }
              throw "Packaged KodeStudio smoke failed with $($smoke.ExitCode)"
            }
          }
          finally {
            $env:PATH = $originalPath
            $env:PYTHONHOME = $originalPythonHome
            $env:PYTHONPATH = $originalPythonPath
          }
          $uninstallProcess = Start-Process -FilePath $uninstall -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART") -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller failed with $($uninstallProcess.ExitCode)" }
          for ($attempt = 0; $attempt -lt 40 -and (Test-Path $exe); $attempt++) { Start-Sleep -Milliseconds 250 }
          if (Test-Path $exe) { throw "KodepoiaStudio.exe still exists after uninstall" }
      - name: Upload Windows two-build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-2-end-windows-two-build-${{ env.EVIDENCE_SHA }}
          path: artifacts/r18_2
          if-no-files-found: error
          retention-days: 30
