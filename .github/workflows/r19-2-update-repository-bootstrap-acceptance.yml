name: R19.2 Production/Beta Update Repository Bootstrap Acceptance

on:
  push:
    branches:
      - r19/02-update-repository-bootstrap
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r19-2-update-repository-bootstrap-acceptance.yml
      - configs/update_repository_r19_2.json
      - docs/release/R19_2_UPDATE_REPOSITORY_BOOTSTRAP.md
      - scripts/r19_2_update_repository_acceptance.py
      - src/kodepoia/update/**
      - tests/test_r19_2_update_repository_bootstrap.py
      - update-repository/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r19-2-update-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile R19.2 sources
        run: >-
          python -m compileall -q
          src/kodepoia/update/bootstrap.py
          src/kodepoia/update/repository_bootstrap.py
          scripts/r19_2_update_repository_acceptance.py
          tests/test_r19_2_update_repository_bootstrap.py

      - name: Run Ruff R19.2
        run: >-
          python -m ruff check
          src/kodepoia/update/__init__.py
          src/kodepoia/update/bootstrap.py
          src/kodepoia/update/repository_bootstrap.py
          scripts/r19_2_update_repository_acceptance.py
          tests/test_r19_2_update_repository_bootstrap.py

      - name: Run focused trust tests
        run: >-
          python -m pytest -q
          tests/test_r19_2_update_repository_bootstrap.py
          tests/test_r18_6_packaged_root.py
          tests/test_r18_6_update_trust.py

      - name: Emit exact-source R19.2 acceptance
        run: >-
          python scripts/r19_2_update_repository_acceptance.py
          --source-sha "${{ env.EVIDENCE_SHA }}"
          --output artifacts/r19_2/update-repository-acceptance.json

      - name: Assert active public trust bootstrap
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("artifacts/r19_2/update-repository-acceptance.json").read_text(encoding="utf-8")
          )
          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          if report["source_sha"] != expected:
              raise SystemExit("R19.2 acceptance source SHA mismatch")
          if report["cases_total"] != 12 or report["cases_passed"] != 12:
              raise SystemExit("R19.2 focused acceptance matrix is incomplete")
          if report["production_root_state"] != "active":
              raise SystemExit("R19.2 production Root is not active")
          if report["packaged_root_version"] != 1:
              raise SystemExit("R19.2 packaged trust-anchor version drifted")
          if report["packaged_root_sha256"] != (
              "892442754966aa643bbe15a2910aa3fef59032c8f5eade34fed62efd96aefee5"
          ):
              raise SystemExit("R19.2 packaged trust-anchor digest drifted")
          if report["public_root_version"] != 2:
              raise SystemExit("R19.2 current public Root is not accepted Root v2")
          if report["public_root_sha256"] != (
              "c92b2165bcbf39f74599fbdf8cc30e203f8c93cc2f24c5c74012821646850ee7"
          ):
              raise SystemExit("R19.2 current public Root v2 digest drifted")
          if not report["checks"]["public_root_trust_path_verified"]:
              raise SystemExit("R19.2 packaged Root v1 -> public Root v2 trust path failed")
          if report["synthetic_root_production_trust"]:
              raise SystemExit("synthetic Root unexpectedly claims production trust")
          if report["private_keys_persisted"] or report["private_keys_used_by_acceptance"]:
              raise SystemExit("private-key boundary was crossed by repository acceptance")
          if report["r19_3_started"]:
              raise SystemExit("R19.3 was unexpectedly started")

      - name: Verify public metadata contains public keys only
        shell: python
        run: |
          import json
          from pathlib import Path

          paths = [
              Path("src/kodepoia/update/trusted_root.production.json"),
              *sorted(Path("update-repository/metadata").glob("*.json")),
          ]
          markers = (
              "-----BEGIN " + "PRIVATE KEY-----",
              "-----BEGIN " + "ENCRYPTED PRIVATE KEY-----",
              "-----BEGIN " + "OPENSSH PRIVATE KEY-----",
              "-----BEGIN " + "RSA PRIVATE KEY-----",
              "-----BEGIN " + "EC PRIVATE KEY-----",
          )
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if any(marker in text for marker in markers):
                  raise SystemExit(f"private key PEM marker found in {path}")
          root = json.loads(Path("update-repository/metadata/root.json").read_text(encoding="utf-8"))
          for key_id, key in root["signed"]["keys"].items():
              if set(key["keyval"]) != {"public"}:
                  raise SystemExit(f"non-public key material found for {key_id}")

      - name: Build wheel with real public Root
        run: python -m build --wheel --outdir artifacts/r19_2/wheel

      - name: Verify wheel embeds exact production Root
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("artifacts/r19_2/wheel").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as archive:
              root = archive.read("kodepoia/update/trusted_root.production.json")
              archive.read("kodepoia/update/trusted_root.production.manifest.json")
          digest = hashlib.sha256(root).hexdigest()
          if digest != "892442754966aa643bbe15a2910aa3fef59032c8f5eade34fed62efd96aefee5":
              raise SystemExit("wheel production Root digest mismatch")

      - name: Upload R19.2 exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r19-2-update-repository-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r19_2/
          if-no-files-found: error
          retention-days: 30
