name: R15.15 Ruff cleanup helper

on:
  push:
    branches:
      - r15/15-cli-kodestudio-ux

permissions:
  contents: write

jobs:
  lint:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/15-cli-kodestudio-ux
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded Ruff cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/kodepoia/cli.py')
          text = path.read_text(encoding='utf-8')
          old = '    project.add_argument("--platform", action="append", choices=[item.value for item in Platform], default=None)\n'
          new = '''    project.add_argument(\n        "--platform",\n        action="append",\n        choices=[item.value for item in Platform],\n        default=None,\n    )\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m pip install 'ruff>=0.12,<1'
          python -m ruff check --fix src/kodepoia/kodestudio/r15_localization.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/r15-15-lint-helper.yml
          git add src/kodepoia/cli.py src/kodepoia/kodestudio/r15_localization.py
          git diff --cached --check
          git commit -m "fix(r15.15): satisfy focused Ruff acceptance"
          git push origin HEAD:r15/15-cli-kodestudio-ux
