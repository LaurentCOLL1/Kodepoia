name: R16.9 END Sync Helper

on:
  push:
    branches:
      - r16/09-supply-chain-provenance-hardening
    paths:
      - .github/workflows/r16-9-end-sync-helper.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R16.9 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: r16/09-supply-chain-provenance-hardening
          fetch-depth: 0

      - name: Patch bounded R16.9 END records
        shell: python
        run: |
          from pathlib import Path

          source = "026ddc91672c144977453c9852a5288e9533af22"
          focused = "R16.9 #7 / 33585517872"
          r0 = "R0 #2319 / 33585517967"
          python_core = "Python Core #2291 / 33585517983"
          ui = "KodeStudio UI Smoke #2256 / 33585518000"

          plan_path = Path("docs/roadmap/R16_PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          old_checkpoint = "**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + NORMALIZED. R16.1–R16.8 are COMPLETE + NORMALIZED. R16.9 is IN_PROGRESS from normalized `main` `9e62f7d8a85965c64d66cf317e028993b669f775` on dedicated branch `r16/09-supply-chain-provenance-hardening`. R16.10–R16.18 remain PLANNED."
          new_checkpoint = f"**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + NORMALIZED. R16.1–R16.8 are COMPLETE + NORMALIZED. R16.9 is COMPLETE on immutable technical source `{source}` with fresh technical acceptance recorded below; post-merge continuity normalization is still required before R16.10. R16.10–R16.18 remain PLANNED."
          assert plan.count(old_checkpoint) == 1
          plan = plan.replace(old_checkpoint, new_checkpoint, 1)

          old_row = "| R16.9 | Dependency/workflow/release supply-chain provenance hardening | IN_PROGRESS | NONE |"
          new_row = "| R16.9 | Dependency/workflow/release supply-chain provenance hardening | COMPLETE | NONE |"
          assert plan.count(old_row) == 1
          plan = plan.replace(old_row, new_row, 1)

          marker = "\n---\n\n# R16.10"
          assert plan.count(marker) == 1
          record = f'''\n## R16.9 implementation evidence\n\n- Clean START: `31249739d3b1a617bdf8aa2c8080d777875739c7` from normalized R16.8 `main` `9e62f7d8a85965c64d66cf317e028993b669f775`.\n- Immutable technical source: `{source}`.\n- Exact-source focused acceptance: {focused} SUCCESS on Ubuntu + Windows; exact checkout, wheel+sdist build, compile, Ruff, 24/24 focused tests and 19/19 acceptance/tamper cases PASS per OS.\n- Exact-source repository qualification: {r0} SUCCESS Ubuntu + Windows; {python_core} SUCCESS 5/5; {ui} SUCCESS.\n- Accepted scope: seven verified external action identities; twelve v1 promotion authority workflows pinned to full immutable commit SHAs with `contents: read`; forty-five historical workflows inventoried but non-authoritative for v1 promotion; deterministic 23-entry dependency/tool inventory; exact-source BuildManifest + BOM binding; fail-closed action drift/unapproved action, privileged permissions, `pull_request_target`, direct untrusted PR shell interpolation, artifact path escape, cross-source replay and serialized evidence tamper.\n- Evidence: policy `bee3cc2e13b43e5b6751913b45de6deed83ee4b4447cec71ca39bc5a004148ef`; semantic acceptance `3a115fd23a65085658a27c08a2f71cc0aa5a3f3157b091cca1091342ee06b0ce`; acceptance report `d4c44fb4dd6034e448fc1d63900721cb189dc33c97860bfb5e0573e0ef648fe5`; promotion manifest `3f4a487a52b087a26791080cb7b90ed333120cc87c98f53e9589fac28f951e81`; workflow audit `be9440ba570031b411389e7b85472ec05b043eace6e2d57b3a2540327ba5c743`; dependency inventory `b372e3383ee8ad1619a133c9e7de4cd274e3d3ca45dcc5247614642b85772ca2`.\n- Exact-source artifacts: Linux `9829927043 / sha256:c7af04d4cfd2e51419d57e9c4cef029bb75db7ddc1b48ec415e8f8955fe4141c`; Windows `9829937614 / sha256:0754ec9ab8eb1cc1d6a061437a0a1219ccb615efd3983fa8b161b4739866336b`.\n- External attestations remain optional provenance evidence and never a security verdict; core acceptance used no live credentials, signing key, network calls or destructive host actions. Manual state: **NONE**.\n- R16.10 remains blocked until this END-sync head passes fresh exact-head R16.9/R0/Python/UI gates, PR #351 merges with `expected_head_sha`, and the unique continuity-only post-merge normalization passes fresh R0/Python/UI and merges.\n'''
          plan = plan.replace(marker, record + marker, 1)
          plan_path.write_text(plan, encoding="utf-8", newline="\n")

          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          continuity = continuity_path.read_text(encoding="utf-8")
          old_top = "> Kodepoia, architecture v1.0 gelée. **R1–R15 COMPLETE + NORMALIZED. R16 planning ACCEPTED + NORMALIZED. R16.1–R16.8 COMPLETE + NORMALIZED. R16.9 IN_PROGRESS on `r16/09-supply-chain-provenance-hardening` from normalized `main` `9e62f7d8a85965c64d66cf317e028993b669f775`. R16.10–R16.18 remain PLANNED.**"
          new_top = f"> Kodepoia, architecture v1.0 gelée. **R1–R15 COMPLETE + NORMALIZED. R16 planning ACCEPTED + NORMALIZED. R16.1–R16.8 COMPLETE + NORMALIZED. R16.9 COMPLETE / NORMALIZATION PENDING on `r16/09-supply-chain-provenance-hardening`; immutable technical source `{source}` passed fresh technical exact-source gates. R16.10–R16.18 remain PLANNED and R16.10 stays blocked pending PR #351 exact-END re-gates, merge and unique post-merge continuity-only normalization.**"
          assert continuity.count(old_top) == 1
          continuity = continuity.replace(old_top, new_top, 1)

          old_line = "- R16.9 : **IN_PROGRESS** — normalized R16.8 `main` `9e62f7d8a85965c64d66cf317e028993b669f775`; dedicated branch `r16/09-supply-chain-provenance-hardening`; scope frozen to deterministic dependency/tool inventory, workflow permission/reference auditing, release-input integrity/provenance, BOM/license coverage and synthetic tamper rejection; manual NONE. R16.10 remains PLANNED."
          new_line = f"- R16.9 : **COMPLETE / NORMALIZATION PENDING** — normalized R16.8 `main` `9e62f7d8a85965c64d66cf317e028993b669f775`; clean START `31249739d3b1a617bdf8aa2c8080d777875739c7`; immutable technical source `{source}`; technical {focused} SUCCESS Ubuntu + Windows with 24/24 focused tests and 19/19 acceptance/tamper cases per OS; {r0} SUCCESS Ubuntu + Windows; {python_core} SUCCESS 5/5; {ui} SUCCESS. Policy `bee3cc2e13b43e5b6751913b45de6deed83ee4b4447cec71ca39bc5a004148ef`; semantic `3a115fd23a65085658a27c08a2f71cc0aa5a3f3157b091cca1091342ee06b0ce`; promotion manifest `3f4a487a52b087a26791080cb7b90ed333120cc87c98f53e9589fac28f951e81`; 12 v1 authority workflows full-SHA/read-only, 45 legacy workflows inventoried/non-authoritative, 23 deterministic dependency inputs, BuildManifest+BOM exact-source binding, tamper/replay/privilege/PR-shell/artifact-path fail-closed. External attestations remain provenance-only, not a security verdict. PR #351 open pending fresh exact-END-head gates; manual NONE. R16.10 remains blocked until merge plus unique continuity-only normalization."
          assert continuity.count(old_line) == 1
          continuity = continuity.replace(old_line, new_line, 1)
          continuity_path.write_text(continuity, encoding="utf-8", newline="\n")

      - name: Validate bounded END sync
        shell: bash
        run: |
          git diff --check -- docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          python scripts/check_repo.py

      - name: Commit END sync and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r16-9-end-sync-helper.yml
          git add docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          expected=$'.github/workflows/r16-9-end-sync-helper.yml\ndocs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R16_PLAN.md'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git commit -m "docs(r16.9): synchronize accepted technical source"
          git push origin HEAD:r16/09-supply-chain-provenance-hardening
