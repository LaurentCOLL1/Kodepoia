name: R15.3 post-merge normalization helper
on:
  push:
    branches: [r15/03-post-merge-normalization]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/03-post-merge-normalization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-r0.txt
      - run: python scripts/r15_3_normalize.py
      - run: git diff --check
      - run: python scripts/check_repo.py
      - name: Commit continuity-only normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15_3_post_merge_normalization.yml scripts/r15_3_normalize.py
          test "$(git diff --name-only 4b37d7735194e9b4b21899d44ad4224c418979ed -- | tr '\n' ' ')" = "docs/continuity/KODEPOIA_CONTINUITY.md "
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git commit -m "docs(r15.3): normalize post-merge continuity"
          git push origin HEAD:r15/03-post-merge-normalization
