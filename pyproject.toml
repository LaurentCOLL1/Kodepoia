[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kodepoia"
version = "1.1.0rc1"
description = "Local-first AI development environment for games and applications"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "All rights reserved - private development"}
authors = [{name = "LaurentCOLL1"}]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "keyring>=25.7,<26",
  "Pillow>=12.3,<12.4",
]

[project.optional-dependencies]
ui = ["PySide6>=6.10,<7"]
postgres = ["psycopg[binary]>=3.2,<4"]
code = [
  "tree-sitter>=0.26,<0.27",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23.2,<0.24",
]
packaging = ["nuitka>=4.1,<5"]
tuning = [
  "torch>=2.4,<3",
  "transformers>=4.56,<6",
  "accelerate>=1.10,<2",
  "datasets>=3,<5",
  "peft>=0.17,<1",
  "trl>=0.20,<1",
  "safetensors>=0.6,<1",
]
tuning-bnb = ["bitsandbytes>=0.47,<1"]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
kodepoia = "kodepoia.cli:main"
kodepoia-studio = "kodepoia.kodestudio.app_v11:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kodepoia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
