name: R14.9 Anchored END Sync Repair

on:
  push:
    branches:
      - r14/09-progression-leaderboards
    paths:
      - .github/workflows/r14-9-end-sync-repair.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/09-progression-leaderboards
          fetch-depth: 0
      - name: Apply anchored R14.9 END sync
        run: python .github/r14_9_end_sync_repair.py
      - name: Commit END docs and remove all END helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/r14_9_end_sync.py .github/workflows/r14-9-end-sync.yml .github/r14_9_end_sync_repair.py .github/workflows/r14-9-end-sync-repair.yml
          git add docs/roadmap/R14_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          test "$(git diff --cached --name-only | sort)" = $'.github/r14_9_end_sync.py\n.github/r14_9_end_sync_repair.py\n.github/workflows/r14-9-end-sync-repair.yml\n.github/workflows/r14-9-end-sync.yml\ndocs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R14_PLAN.md'
          git commit -m "docs(r14.9): END-sync technical acceptance"
          git push origin HEAD:r14/09-progression-leaderboards
