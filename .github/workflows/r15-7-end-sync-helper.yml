name: R15.7 END Sync Helper

on:
  push:
    branches:
      - r15/07-gap-diagnosis-train-decision
    paths:
      - scripts/r15_7_end_sync_temp.py

permissions:
  contents: write

jobs:
  end-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: r15/07-gap-diagnosis-train-decision
      - name: Apply bounded R15.7 END synchronization
        shell: bash
        run: |
          python scripts/r15_7_end_sync_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/R15_7_DESIGN.md docs/roadmap/R15_7_ACCEPTANCE.md docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          changed=$(git diff --cached --name-only | sort)
          printf '%s\n' "$changed"
          for expected in docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R15_7_ACCEPTANCE.md docs/roadmap/R15_7_DESIGN.md docs/roadmap/R15_PLAN.md; do
            printf '%s\n' "$changed" | grep -Fx "$expected" >/dev/null || { echo "missing expected change: $expected"; exit 1; }
          done
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 4
          git rm scripts/r15_7_end_sync_temp.py .github/workflows/r15-7-end-sync-helper.yml
          git commit -m "docs(r15.7): synchronize END authority"
          git push origin HEAD:r15/07-gap-diagnosis-train-decision
