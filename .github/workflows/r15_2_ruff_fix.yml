name: R15.2 exact Ruff fix helper

on:
  push:
    branches:
      - r15/02-validated-experience-capture

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/02-validated-experience-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply only reported UP012 fixes and validate
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("src/kodepoia/experience/collector.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'f"{workspace_id}\\0{project_id}".encode("utf-8")': 'f"{workspace_id}\\0{project_id}".encode()',
              'f"{workspace_id}\\0{project_id}\\0{event_id}".encode("utf-8")': 'f"{workspace_id}\\0{project_id}\\0{event_id}".encode()',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          subprocess.run(
              [
                  "python", "-m", "ruff", "check",
                  "src/kodepoia/experience",
                  "tests/test_experience_contracts.py",
                  "tests/test_experience_collector.py",
              ],
              check=True,
          )
          subprocess.run(
              [
                  "python", "-m", "pytest", "-q",
                  "tests/test_experience_contracts.py",
                  "tests/test_experience_collector.py",
              ],
              check=True,
          )
          subprocess.run(["python", "-m", "compileall", "-q", "src/kodepoia/experience"], check=True)
      - name: Commit fixed source and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15_2_ruff_fix.yml
          git add src/kodepoia/experience/collector.py
          git commit -m "style(r15.2): satisfy experience Ruff gate"
          git push origin HEAD:r15/02-validated-experience-capture
