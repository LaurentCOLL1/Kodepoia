name: R18.6 TUF Anti-Rollback Freeze Acceptance

on:
  push:
    branches:
      - r18/06-tuf-rollback-freeze-verification
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r18-6-tuf-acceptance.yml
      - pyproject.toml
      - src/kodepoia/release/tuf_security.py
      - src/kodepoia/update/**
      - scripts/r18_6_generate_packaged_root.py
      - scripts/r18_6_tuf_acceptance.py
      - scripts/r18_6_verify_wheel_root.py
      - tests/test_r18_6_tuf_security.py
      - tests/test_r18_6_update_trust.py
      - tests/test_r18_6_packaged_root.py
      - docs/release/R18_6_TUF_SECURITY.md
      - configs/r16_supply_chain_policy.json
      - tests/test_supply_chain_r16_9.py
      - docs/roadmap/R18_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r18-6-tuf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tuf-contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile R18.6 sources
        run: >-
          python -m compileall -q
          src/kodepoia/release/tuf_security.py
          src/kodepoia/update
          scripts/r18_6_generate_packaged_root.py
          scripts/r18_6_tuf_acceptance.py
          scripts/r18_6_verify_wheel_root.py
          tests/test_r18_6_tuf_security.py
          tests/test_r18_6_update_trust.py
          tests/test_r18_6_packaged_root.py

      - name: Collect Ruff R18.6 diagnostics
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path

          output = Path("artifacts/r18_6")
          output.mkdir(parents=True, exist_ok=True)
          command = [
              sys.executable,
              "-m",
              "ruff",
              "check",
              "--output-format",
              "json",
              "src/kodepoia/release/tuf_security.py",
              "src/kodepoia/update",
              "scripts/r18_6_generate_packaged_root.py",
              "scripts/r18_6_tuf_acceptance.py",
              "scripts/r18_6_verify_wheel_root.py",
              "tests/test_r18_6_tuf_security.py",
              "tests/test_r18_6_update_trust.py",
              "tests/test_r18_6_packaged_root.py",
          ]
          result = subprocess.run(command, text=True, capture_output=True, check=False)
          (output / "ruff.json").write_text(result.stdout or "[]\n", encoding="utf-8")
          (output / "ruff-exit-code.txt").write_text(
              f"{result.returncode}\n", encoding="utf-8"
          )
          if result.stderr:
              (output / "ruff-stderr.txt").write_text(result.stderr, encoding="utf-8")
          if result.returncode not in {0, 1}:
              raise SystemExit(
                  f"Ruff execution failed unexpectedly with exit code {result.returncode}"
              )

      - name: Run focused R18.6 tests
        run: >-
          python -m pytest -q
          tests/test_r18_6_tuf_security.py
          tests/test_r18_6_update_trust.py
          tests/test_r18_6_packaged_root.py

      - name: Build wheel for packaged-root evidence
        run: python -m build --wheel --outdir artifacts/r18_6/wheel

      - name: Verify wheel embeds exact synthetic root resources
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path

          wheels = sorted(Path("artifacts/r18_6/wheel").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one R18.6 wheel, found {len(wheels)}")
          subprocess.check_call(
              [sys.executable, "scripts/r18_6_verify_wheel_root.py", str(wheels[0])]
          )

      - name: Generate fresh synthetic root evidence
        run: >-
          python scripts/r18_6_generate_packaged_root.py
          --output artifacts/r18_6/trusted_root.synthetic.generated.json
          --manifest artifacts/r18_6/trusted_root.synthetic.generated.manifest.json

      - name: Emit exact-source R18.6 acceptance
        run: >-
          python scripts/r18_6_tuf_acceptance.py
          --source-sha "${{ env.EVIDENCE_SHA }}"
          --output artifacts/r18_6/tuf-acceptance.json

      - name: Assert complete offline security matrix
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("artifacts/r18_6/tuf-acceptance.json").read_text(encoding="utf-8")
          )
          generated_root_manifest = json.loads(
              Path("artifacts/r18_6/trusted_root.synthetic.generated.manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          if report["source_sha"] != expected:
              raise SystemExit("R18.6 acceptance source SHA mismatch")
          if report["core_cases_total"] != 7 or report["core_cases_passed"] != 7:
              raise SystemExit("R18.6 core TUF acceptance matrix is incomplete")
          if report["product_cases_total"] != 7 or report["product_cases_passed"] != 7:
              raise SystemExit("R18.6 product update acceptance matrix is incomplete")
          if not report["trusted_state_persistent"]:
              raise SystemExit("R18.6 trusted state persistence was not established")
          if not report["channel_platform_bound"]:
              raise SystemExit("R18.6 target selection is not channel/platform bound")
          if not report["offline_cache_non_blocking"]:
              raise SystemExit("R18.6 offline cache behavior is not non-blocking")
          if report["library_contract"]["network_required"]:
              raise SystemExit("R18.6 acceptance unexpectedly requires network access")
          if report["library_contract"]["production_keys_used"]:
              raise SystemExit("R18.6 acceptance unexpectedly used production keys")
          packaged = report["packaged_root"]
          if packaged["purpose"] != "synthetic-acceptance-only":
              raise SystemExit("R18.6 embedded root is not explicitly synthetic")
          if packaged["version"] != 1:
              raise SystemExit("R18.6 embedded root version is not 1")
          if packaged["sha256"] != (
              "885bc87c3a5e9fe8b378cac85eb89fc37f99fcd8ba0bc7c494ee1e407da96670"
          ):
              raise SystemExit("R18.6 embedded root digest drifted")
          if packaged["production_trust_claim"] or packaged["private_keys_persisted"]:
              raise SystemExit("R18.6 embedded synthetic root safety flags are invalid")
          if generated_root_manifest["purpose"] != "synthetic-acceptance-only":
              raise SystemExit("R18.6 generated root evidence is not explicitly synthetic")
          if generated_root_manifest["production_trust_claim"]:
              raise SystemExit("R18.6 generated root unexpectedly claims production trust")
          if generated_root_manifest["private_keys_persisted"]:
              raise SystemExit("R18.6 synthetic root generator persisted private keys")
          if report["public_release_created"]:
              raise SystemExit("R18.6 acceptance unexpectedly created a public release")
          if report["production_signing_triggered"]:
              raise SystemExit("R18.6 acceptance unexpectedly triggered production signing")
          if report["public_winget_submission_triggered"]:
              raise SystemExit("R18.6 acceptance unexpectedly submitted to WinGet")

      - name: Upload R18.6 contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-6-tuf-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r18_6/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Ruff clean verdict
        if: always()
        shell: python
        run: |
          from pathlib import Path

          status = Path("artifacts/r18_6/ruff-exit-code.txt")
          if not status.is_file():
              raise SystemExit("Ruff diagnostic status is missing")
          code = int(status.read_text(encoding="utf-8").strip())
          if code != 0:
              raise SystemExit(f"Ruff reported diagnostics (exit code {code})")
