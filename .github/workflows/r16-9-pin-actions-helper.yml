name: R16.9 Pin External Actions Helper

on:
  push:
    branches:
      - r16/09-supply-chain-provenance-hardening
    paths:
      - configs/r16_supply_chain_policy.json

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: r16/09-supply-chain-provenance-hardening
          fetch-depth: 0
      - name: Pin all permanent external action references
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'actions/checkout@v4': 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262',
              'actions/setup-python@v5': 'actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065',
              'actions/setup-dotnet@v4': 'actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9',
              'actions/setup-java@v4': 'actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3',
              'actions/upload-artifact@v4': 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02',
              'android-actions/setup-android@v3': 'android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407',
              'gradle/actions/setup-gradle@v4': 'gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a',
          }
          expected_counts = {
              'actions/checkout@v4': 62,
              'actions/setup-python@v5': 62,
              'actions/setup-dotnet@v4': 4,
              'actions/setup-java@v4': 4,
              'actions/upload-artifact@v4': 40,
              'android-actions/setup-android@v3': 4,
              'gradle/actions/setup-gradle@v4': 4,
          }
          workflows = Path('.github/workflows')
          targets = [p for p in sorted(workflows.glob('*.y*ml')) if p.name != 'r16-9-pin-actions-helper.yml']
          observed = {key: 0 for key in replacements}
          changed = []
          for path in targets:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  count = text.count(old)
                  observed[old] += count
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8', newline='\n')
                  changed.append(path.as_posix())
          if observed != expected_counts:
              raise SystemExit(f'unexpected action reference inventory: {observed!r}')
          print(f'pinned workflows: {len(changed)}')
          print('\n'.join(changed))
      - name: Remove obsolete write-capable R15 helper and commit
        shell: bash
        run: |
          test -f .github/workflows/r15-5-end-sync-helper.yml
          git rm -f .github/workflows/r15-5-end-sync-helper.yml
          git rm .github/workflows/r16-9-pin-actions-helper.yml
          git add .github/workflows
          git diff --cached --check
          if git grep -nE 'uses: +[^ ]+@(v[0-9]+|main|master|latest)([[:space:]#]|$)' -- '.github/workflows/*.yml' '.github/workflows/*.yaml'; then
            echo 'mutable external action reference remains' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security(r16.9): pin workflow actions and remove stale write helper"
          git push origin HEAD:r16/09-supply-chain-provenance-hardening
