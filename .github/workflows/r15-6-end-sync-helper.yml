name: R15.6 END Sync Helper

on:
  push:
    branches:
      - r15/06-kodebench-v2
    paths:
      - scripts/r15_6_end_sync_temp.py

permissions:
  contents: write

jobs:
  end-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: r15/06-kodebench-v2
      - name: Apply bounded R15.6 END synchronization
        shell: bash
        run: |
          python scripts/r15_6_end_sync_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R15_6_ACCEPTANCE.md docs/roadmap/R15_6_DESIGN.md docs/roadmap/R15_PLAN.md
          changed=$(git diff --cached --name-only | sort)
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 4
          git rm scripts/r15_6_end_sync_temp.py .github/workflows/r15-6-end-sync-helper.yml
          git commit -m "docs(r15.6): synchronize END authority"
          git push origin HEAD:r15/06-kodebench-v2
