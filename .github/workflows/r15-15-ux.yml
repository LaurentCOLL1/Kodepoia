name: R15.15 CLI KodeStudio UX Acceptance

on:
  push:
    branches:
      - r15/15-cli-kodestudio-ux
  pull_request:
    paths:
      - .github/workflows/r15-15-ux.yml
      - src/kodepoia/tuning/r15_ux.py
      - src/kodepoia/tuning/r15_cli.py
      - src/kodepoia/kodestudio/r15_localization.py
      - src/kodepoia/kodestudio/r15_tuning_panel.py
      - src/kodepoia/cli.py
      - src/kodepoia/kodestudio/app.py
      - tests/test_r15_15_ux.py
      - tests/test_r15_15_cli.py
      - tests/test_r15_15_kodestudio.py
      - docs/roadmap/R15_PLAN.md
      - docs/roadmap/R15_15_ACCEPTANCE.md
      - docs/continuity/KODEPOIA_CONTINUITY.md

permissions:
  contents: read

jobs:
  ux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Ubuntu Qt runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project development and UI dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Compile R15.15 surface
        run: >-
          python -m compileall -q
          src/kodepoia/tuning/r15_ux.py
          src/kodepoia/tuning/r15_cli.py
          src/kodepoia/kodestudio/r15_localization.py
          src/kodepoia/kodestudio/r15_tuning_panel.py
          src/kodepoia/cli.py
          src/kodepoia/kodestudio/app.py
      - name: Run focused R15.15 acceptance
        run: >-
          python -m pytest -q
          tests/test_r15_15_ux.py
          tests/test_r15_15_cli.py
          tests/test_r15_15_kodestudio.py
      - name: Ruff R15.15-owned surface
        run: >-
          python -m ruff check
          src/kodepoia/tuning/r15_ux.py
          src/kodepoia/tuning/r15_cli.py
          src/kodepoia/kodestudio/r15_localization.py
          src/kodepoia/kodestudio/r15_tuning_panel.py
          src/kodepoia/cli.py
          src/kodepoia/kodestudio/app.py
          tests/test_r15_15_ux.py
          tests/test_r15_15_cli.py
          tests/test_r15_15_kodestudio.py
