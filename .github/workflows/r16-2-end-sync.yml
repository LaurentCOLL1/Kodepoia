name: R16.2 END Sync

on:
  push:
    branches:
      - r16/02-prompt-injection-untrusted-content
    paths:
      - .github/workflows/r16-2-end-sync.yml

permissions:
  contents: write

jobs:
  end-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R16.2 branch
        uses: actions/checkout@v4
        with:
          ref: r16/02-prompt-injection-untrusted-content
          fetch-depth: 0

      - name: Synchronize R16.2 END authority
        shell: python
        run: |
          from pathlib import Path
          import re

          plan_path = Path("docs/roadmap/R16_PLAN.md")
          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          plan = plan_path.read_text(encoding="utf-8")
          continuity = continuity_path.read_text(encoding="utf-8")

          checkpoint = (
              "**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + "
              "NORMALIZED. R16.1 is COMPLETE + NORMALIZED on exact `main` "
              "`ad7ec8339ea3e61fefa29fad6693a0e476b6bc58`. R16.2 is COMPLETE at mandatory END-sync; "
              "fresh exact-END R16.2/R0/Python/UI re-gates are required before protected merge. "
              "R16.3–R16.18 remain PLANNED."
          )
          plan, count = re.subn(r"^\*\*Execution checkpoint:\*\*.*$", checkpoint, plan, count=1, flags=re.M)
          if count != 1:
              raise SystemExit("R16 plan checkpoint replacement failed")

          old_row = "| R16.2 | Prompt-injection and untrusted-content hardening | IN_PROGRESS | NONE |"
          new_row = "| R16.2 | Prompt-injection and untrusted-content hardening | COMPLETE | NONE |"
          if plan.count(old_row) != 1:
              raise SystemExit("R16.2 subdivision row replacement failed")
          plan = plan.replace(old_row, new_row, 1)

          end_lines = [
              "",
              "## R16.2 END acceptance authority",
              "",
              "- Normalized branch point: `main` `ad7ec8339ea3e61fefa29fad6693a0e476b6bc58`; clean START `c3095e36bde1d580f4496397c280304384157aa9`; immutable technical source `6d4aee8947f2350a16e2316aae217030195cb68f`.",
              "- Technical-source gates: R16.2 #12 / `33441078478` SUCCESS Ubuntu + Windows; R0 #2270 / `33441078505` SUCCESS Ubuntu + Windows; Python Core #2242 / `33441078446` SUCCESS 5/5; UI Smoke #2207 / `33441078170` SUCCESS.",
              "- Cross-platform acceptance content is byte-identical: JSON SHA-256 `daa1714932a36fb24ba2050e607c99e48d6d5f7fe9b3ef8eb72c57f6667b0ced`; semantic `17e3d997642f3d52e0f3e6fc2c792ef91d83d8566876596936630c249198a434`; policy `97878fe69267c6fa6f2266d5bdcc87793385a315ca0b18d699d773fc31a2b990`; canonical R16 corpus `faa7f8bafa48438351a7435c3a55946f0a42ab8695540935a070865659189a51`; R16 case-set `8aca9cb7fd1f3cfe5445bebaee48569f7dbb21a63ca35567dc636a84f9c22963`; targeted prompt/ingestion set `138328e20a43b6501f2413eb248bd4de29fadbc98a67ac975893ababf0d087ca`; supplemental R16.2 set `d2a31a206689f51668609812b32c4c9d7b3f247de7ac3dedeb29fabb7ea1ab8e`.",
              "- Acceptance exercises 18/18 cases with `security_claim=true`, `critical_veto=false`, synthetic-only fixtures, no live secrets and no destructive host actions. Linux artifact `9776303161` archive SHA-256 `9a248e5e71cb7ce92a7b06b67a3055d8956dda672ec858d043c191f520ba5bf7`; Windows artifact `9776290305` archive SHA-256 `39d1ea79415a7d15095461b6bd2f1c01eb28e8f8d0ab3c45d022a3c7c8b2cd7e`.",
              "- Compatibility regression found by full Python Core was corrected before acceptance: `ResearchGuard` retains its public R7.1 guard/schema version `1`; R16.2 trust provenance is additive and does not force a legacy schema migration.",
              "- Manual NONE. R16.2 is COMPLETE at END-sync. Fresh exact-END R16.2/R0/Python/UI re-gates are mandatory before protected merge; R16.3 remains PLANNED until the implementation merge and its unique post-merge continuity-only normalization complete.",
              "",
          ]
          marker = "\n---\n\n# R16.3 — Malicious repository/workspace quarantine and safe bootstrap"
          if plan.count(marker) != 1:
              raise SystemExit("R16.3 insertion marker missing or ambiguous")
          plan = plan.replace(marker, "\n".join(end_lines) + marker, 1)

          continuity, count = re.subn(
              r"R16\.2 IN_PROGRESS on `r16/02-prompt-injection-untrusted-content` from that exact normalized main; R16\.3–R16\.18 remain PLANNED\.",
              "R16.2 COMPLETE at mandatory END-sync on `r16/02-prompt-injection-untrusted-content`; fresh exact-END re-gates are required before protected merge, and R16.3–R16.18 remain PLANNED.",
              continuity,
              count=1,
          )
          if count != 1:
              raise SystemExit("continuity header replacement failed")

          continuity_entry = (
              "- R16.2 : **COMPLETE** — normalized R16.1 `main` `ad7ec8339ea3e61fefa29fad6693a0e476b6bc58`; "
              "clean START `c3095e36bde1d580f4496397c280304384157aa9`; immutable technical source "
              "`6d4aee8947f2350a16e2316aae217030195cb68f`; technical R16.2 #12 / `33441078478` SUCCESS Ubuntu + Windows, "
              "R0 #2270 / `33441078505` SUCCESS Ubuntu + Windows, Python Core #2242 / `33441078446` SUCCESS 5/5 and UI #2207 / "
              "`33441078170` SUCCESS. Cross-platform acceptance JSON SHA-256 `daa1714932a36fb24ba2050e607c99e48d6d5f7fe9b3ef8eb72c57f6667b0ced`; "
              "semantic `17e3d997642f3d52e0f3e6fc2c792ef91d83d8566876596936630c249198a434`; policy "
              "`97878fe69267c6fa6f2266d5bdcc87793385a315ca0b18d699d773fc31a2b990`; corpus `faa7f8bafa48438351a7435c3a55946f0a42ab8695540935a070865659189a51`; "
              "case-set `8aca9cb7fd1f3cfe5445bebaee48569f7dbb21a63ca35567dc636a84f9c22963`; targeted set "
              "`138328e20a43b6501f2413eb248bd4de29fadbc98a67ac975893ababf0d087ca`; supplemental set `d2a31a206689f51668609812b32c4c9d7b3f247de7ac3dedeb29fabb7ea1ab8e`; "
              "18/18 PASS, `critical_veto=false`, manual NONE. `ResearchGuard` remains schema-compatible at public guard version 1. Linux artifact `9776303161` / "
              "`9a248e5e71cb7ce92a7b06b67a3055d8956dda672ec858d043c191f520ba5bf7`; Windows artifact `9776290305` / "
              "`39d1ea79415a7d15095461b6bd2f1c01eb28e8f8d0ab3c45d022a3c7c8b2cd7e`. Fresh exact-END R16.2/R0/Python/UI re-gates are mandatory before PR #337 may merge; R16.3 remains PLANNED until post-merge normalization."
          )
          continuity, count = re.subn(
              r"^- R16\.2 : \*\*IN_PROGRESS\*\* — .*?Manual \*\*NONE\*\*\.$",
              continuity_entry,
              continuity,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit("continuity R16.2 entry replacement failed")

          plan_path.write_text(plan, encoding="utf-8", newline="\n")
          continuity_path.write_text(continuity, encoding="utf-8", newline="\n")

      - name: Verify END sync scope
        shell: bash
        run: |
          git rm .github/workflows/r16-2-end-sync.yml
          git add docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/r16-2-end-sync.yml' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R16_PLAN.md' | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Commit clean END sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(r16.2): synchronize END acceptance"
          git push origin HEAD:r16/02-prompt-injection-untrusted-content
