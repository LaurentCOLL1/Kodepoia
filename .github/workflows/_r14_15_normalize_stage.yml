name: R14.15 normalization staging

on:
  push:
    branches:
      - r14/15-normalize-stage
    paths:
      - .github/workflows/_r14_15_normalize_stage.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard staging parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "r14/15-normalize-stage"
          test "$(git rev-parse HEAD^)" = "001c9751b88a40019263a1a9240db0c27fc9b69f"
          test -f scripts/_r14_15_normalize_stage.py

      - name: Apply continuity transform
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_r14_15_normalize_stage.py
          git diff --check -- docs/continuity/KODEPOIA_CONTINUITY.md
          test "$(git status --porcelain | wc -l)" -eq 1
          test "$(git status --porcelain | sed 's/^...//')" = "docs/continuity/KODEPOIA_CONTINUITY.md"

      - name: Commit staged continuity only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          test "$(git diff --cached --name-only)" = "docs/continuity/KODEPOIA_CONTINUITY.md"
          git commit -m "docs(r14.15): stage continuity normalization"
          git push origin HEAD:r14/15-normalize-stage
