name: R16.9 Continuity Normalization Helper

on:
  push:
    branches:
      - r16/09-continuity-normalization
    paths:
      - .github/workflows/r16-9-normalization-helper.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout normalization branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: r16/09-continuity-normalization
          fetch-depth: 0
      - name: Patch bounded continuity authority
        run: python .github/r16_9_normalize.py
      - name: Validate continuity-only normalization
        run: |
          git diff --check -- docs/continuity/KODEPOIA_CONTINUITY.md
          python scripts/check_repo.py
          test -z "$(git diff --name-only -- docs/roadmap/R16_PLAN.md)"
      - name: Commit normalization and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r16-9-normalization-helper.yml .github/r16_9_normalize.py
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          expected=$'.github/r16_9_normalize.py\n.github/workflows/r16-9-normalization-helper.yml\ndocs/continuity/KODEPOIA_CONTINUITY.md'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git commit -m "docs(r16.9): normalize post-merge continuity"
          git push origin HEAD:r16/09-continuity-normalization
