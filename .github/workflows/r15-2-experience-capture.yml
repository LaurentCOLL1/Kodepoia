name: R15.2 Validated Experience Capture Acceptance

on:
  push:
    branches:
      - 'r15/**'
    paths:
      - 'src/kodepoia/experience/**'
      - 'schemas/experience-record-v1.schema.json'
      - 'schemas/experience-capture-v1.schema.json'
      - 'tests/test_experience_contracts.py'
      - 'tests/test_experience_collector.py'
      - '.github/workflows/r15-2-experience-capture.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/kodepoia/experience/**'
      - 'schemas/experience-record-v1.schema.json'
      - 'schemas/experience-capture-v1.schema.json'
      - 'tests/test_experience_contracts.py'
      - 'tests/test_experience_collector.py'
      - '.github/workflows/r15-2-experience-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: R15.1 contract regression + R15.2 capture tests
        run: >-
          python -m pytest -q
          tests/test_experience_contracts.py
          tests/test_experience_collector.py
      - name: Ruff experience capture surface
        run: >-
          python -m ruff check
          src/kodepoia/experience
          tests/test_experience_contracts.py
          tests/test_experience_collector.py
      - name: Compile experience package
        run: python -m compileall -q src/kodepoia/experience
