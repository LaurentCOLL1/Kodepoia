name: R15.3 START-sync helper
on:
  push:
    branches: [r15/03-sanitization-governance]
permissions:
  contents: write
jobs:
  start-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/03-sanitization-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-r0.txt
      - name: Synchronize R15.3 START state
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          base = 'ac1101d9e67f5e0b36d8daaca2287e625d88787b'
          plan = Path('docs/roadmap/R15_PLAN.md')
          text = plan.read_text(encoding='utf-8')
          old = '**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. R15.1 is COMPLETE + NORMALIZED on `main` `f6681cdc072fdbd9eb8ebcf2c109859df31fb30f`; R15.2 is COMPLETE with immutable technical source `48b519c09fa50f5407cc4a55a0b76baf6f8e8ffd`; implementation merge + unique post-merge continuity-only normalization are pending. R15.3–R15.17 remain PLANNED.'
          new = f'**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. R15.1–R15.2 are COMPLETE + NORMALIZED; normalized R15.2 `main` is `{base}`. R15.3 is IN_PROGRESS on dedicated branch `r15/03-sanitization-governance`; R15.4–R15.17 remain PLANNED.'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          row = '| R15.3 | Sanitization, secret/privacy filtering, license/provenance policy + revocation | PLANNED | NONE | R15.1–R15.2 + R6/R7/R8 |'
          assert text.count(row) == 1
          text = text.replace(row, row.replace(' | PLANNED | ', ' | IN_PROGRESS | '), 1)
          plan.write_text(text, encoding='utf-8', newline='\n')

          c = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          lines = c.read_text(encoding='utf-8').splitlines()
          lines[0] = f'> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1–R15.2 COMPLETE + NORMALIZED; R15.3 IN_PROGRESS; R15.4–R15.17 PLANNED.** R15.3 starts from normalized R15.2 `main` `{base}` on `r15/03-sanitization-governance`; scope is deterministic sanitization, secret/privacy filtering, fail-closed license/provenance policy and revocation propagation; manual NONE.'
          r152 = next(i for i, line in enumerate(lines) if line.startswith('- R15.2 : **COMPLETE + NORMALIZED**'))
          assert not any(line.startswith('- R15.3 :') for line in lines)
          lines.insert(r152 + 1, f'- R15.3 : **IN_PROGRESS** — dedicated branch `r15/03-sanitization-governance` from normalized R15.2 `main` `{base}`. START scope: deterministic sanitizer/redaction + transformation digests, source/privacy/provenance/license decisions fail-closed, SPDX-compatible expression handling, safe reports and lineage-aware revocation; manual NONE. R15.4+ remain unauthorized.')
          idx = next(i for i, line in enumerate(lines) if line == '| R15.3 | PLANNED | NONE |')
          lines[idx] = '| R15.3 | IN_PROGRESS | NONE |'
          action = next(i for i, line in enumerate(lines) if line.startswith('**R15.2 normalization is staged continuity-only.'))
          lines[action] = '**R15.3 START-sync is active on `r15/03-sanitization-governance`. Implement and accept only R15.3; R15.4+ remain unauthorized until R15.3 merge + unique post-merge continuity normalization.**'
          c.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          subprocess.run(['git','diff','--check'], check=True)
          subprocess.run(['python','scripts/check_repo.py'], check=True)
      - name: Commit START-sync and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15_3_start_sync.yml
          git add docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git commit -m "docs(r15.3): synchronize START state"
          git push origin HEAD:r15/03-sanitization-governance
