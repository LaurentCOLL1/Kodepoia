name: R15.14 Specialized Model Registry Acceptance

on:
  push:
    branches:
      - r15/14-specialized-model-registry
  pull_request:
    paths:
      - src/kodepoia/tuning/model_registry.py
      - tests/test_model_registry_r15_14.py
      - schemas/r15-14-model-registry.schema.json
      - .github/workflows/r15-14-model-registry.yml
      - src/kodepoia/models/router.py
      - src/kodepoia/models/catalog.py
      - docs/roadmap/R15_PLAN.md
      - docs/roadmap/R15_14_ACCEPTANCE.md
      - docs/continuity/KODEPOIA_CONTINUITY.md

permissions:
  contents: read

jobs:
  registry:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core development dependencies
        run: python -m pip install -e ".[dev]"
      - name: R15.14 focused acceptance
        run: python -m pytest -q tests/test_model_registry_r15_14.py
      - name: Ruff R15.14-owned surface
        run: python -m ruff check src/kodepoia/tuning/model_registry.py tests/test_model_registry_r15_14.py
      - name: Compile R15.14 surface
        run: python -m compileall -q src/kodepoia/tuning/model_registry.py
      - name: Validate R15.14 JSON schema
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          path = Path('schemas/r15-14-model-registry.schema.json')
          Draft202012Validator.check_schema(
              json.loads(path.read_text(encoding='utf-8'))
          )
          PY
