name: R16.5 START Sync

on:
  push:
    branches:
      - r16/05-plugin-mcp-tool-trust-hardening
    paths:
      - .github/workflows/r16-5-start-sync.yml

permissions:
  contents: write

jobs:
  start-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R16.5 branch
        uses: actions/checkout@v4
        with:
          ref: r16/05-plugin-mcp-tool-trust-hardening
          fetch-depth: 0

      - name: Synchronize R16.5 START authority
        shell: python
        run: |
          from pathlib import Path
          import re

          plan_path = Path("docs/roadmap/R16_PLAN.md")
          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          plan = plan_path.read_text(encoding="utf-8")
          continuity = continuity_path.read_text(encoding="utf-8")

          checkpoint = (
              "**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + "
              "NORMALIZED. R16.1–R16.4 are COMPLETE + NORMALIZED. R16.5 is IN_PROGRESS on "
              "`r16/05-plugin-mcp-tool-trust-hardening` from normalized `main` "
              "`eb62c9087dcb463917487ceb228d6926d6f9bb26`; R16.6–R16.18 remain PLANNED."
          )
          plan, count = re.subn(r"^\*\*Execution checkpoint:\*\*.*$", checkpoint, plan, count=1, flags=re.M)
          if count != 1:
              raise SystemExit("R16 checkpoint replacement failed")

          replacements = {
              "| R16.3 | Malicious repository/workspace quarantine and safe bootstrap | COMPLETE | NONE |":
                  "| R16.3 | Malicious repository/workspace quarantine and safe bootstrap | COMPLETE + NORMALIZED | NONE |",
              "| R16.4 | Secrets, privacy and exfiltration hardening | COMPLETE | NONE |":
                  "| R16.4 | Secrets, privacy and exfiltration hardening | COMPLETE + NORMALIZED | NONE |",
              "| R16.5 | Plugin/MCP/tool trust, authorization and supply-chain boundary | PLANNED | NONE |":
                  "| R16.5 | Plugin/MCP/tool trust, authorization and supply-chain boundary | IN_PROGRESS | NONE |",
          }
          for old, new in replacements.items():
              if plan.count(old) != 1:
                  raise SystemExit(f"plan row missing/ambiguous: {old}")
              plan = plan.replace(old, new, 1)

          header_pattern = r"^> Kodepoia, architecture v1\.0 gelée\. \*\*.*?\*\* R15\.17 immutable technical source"
          header_prefix = (
              "> Kodepoia, architecture v1.0 gelée. **R1–R15 COMPLETE + NORMALIZED. R16 planning ACCEPTED + NORMALIZED. "
              "R16.1–R16.4 COMPLETE + NORMALIZED. R16.5 IN_PROGRESS on `r16/05-plugin-mcp-tool-trust-hardening` "
              "from normalized `main` `eb62c9087dcb463917487ceb228d6926d6f9bb26`. R16.6–R16.18 remain PLANNED.** "
              "R15.17 immutable technical source"
          )
          continuity, count = re.subn(header_pattern, header_prefix, continuity, count=1, flags=re.M)
          if count != 1:
              raise SystemExit("continuity header replacement failed")

          marker = "- R16.4 : **COMPLETE + NORMALIZED**"
          pos = continuity.find(marker)
          if pos < 0:
              raise SystemExit("R16.4 continuity marker missing")
          line_end = continuity.find("\n", pos)
          if line_end < 0:
              raise SystemExit("R16.4 continuity line end missing")
          r16_5_line = (
              "\n- R16.5 : **IN_PROGRESS** — normalized R16.4 `main` "
              "`eb62c9087dcb463917487ceb228d6926d6f9bb26`; branch "
              "`r16/05-plugin-mcp-tool-trust-hardening`; START-sync only, before functional implementation. "
              "Core acceptance remains synthetic/local with manual NONE. Discovery metadata, descriptions, schemas and annotations "
              "are untrusted; trust/authorization/invocation remain separate; identities, versions/digests, requested capabilities, "
              "credential audience and initiating intent must be bound before invocation."
          )
          if "- R16.5 : **IN_PROGRESS**" in continuity:
              raise SystemExit("R16.5 continuity entry already exists")
          continuity = continuity[:line_end] + r16_5_line + continuity[line_end:]

          plan_path.write_text(plan, encoding="utf-8", newline="\n")
          continuity_path.write_text(continuity, encoding="utf-8", newline="\n")

      - name: Verify START sync scope
        shell: bash
        run: |
          git rm .github/workflows/r16-5-start-sync.yml
          git add docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/r16-5-start-sync.yml' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R16_PLAN.md' | sort)"
          test "$actual" = "$expected"

      - name: Commit clean START sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(r16.5): synchronize START authority"
          git push origin HEAD:r16/05-plugin-mcp-tool-trust-hardening
