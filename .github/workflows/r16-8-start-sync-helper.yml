name: R16.8 START Sync Helper

on:
  push:
    branches:
      - r16/08-fault-injection-recovery-drills
    paths:
      - .github/workflows/r16-8-start-sync-helper.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: r16/08-fault-injection-recovery-drills
          fetch-depth: 0

      - name: Assert normalized R16.7 parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "951c53959956d1b88b3c9c3a8c4c328c1127236b"

      - name: Apply bounded R16.8 START synchronization
        shell: python
        run: |
          from pathlib import Path

          base = "951c53959956d1b88b3c9c3a8c4c328c1127236b"
          branch = "r16/08-fault-injection-recovery-drills"

          plan_path = Path("docs/roadmap/R16_PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          old_checkpoint = (
              "**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + NORMALIZED. "
              "R16.1–R16.6 are COMPLETE + NORMALIZED. R16.7 is COMPLETE on immutable technical source "
              "`f095781fde179045fcbcf7fb89661f72f9c51c46` with fresh technical acceptance recorded below; "
              "post-merge continuity normalization is still required before R16.8. R16.8–R16.18 remain PLANNED."
          )
          new_checkpoint = (
              "**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + NORMALIZED. "
              "R16.1–R16.7 are COMPLETE + NORMALIZED. R16.8 is IN_PROGRESS from normalized R16.7 `main` "
              f"`{base}` on dedicated branch `{branch}`; R16.9–R16.18 remain PLANNED."
          )
          if plan.count(old_checkpoint) != 1:
              raise SystemExit("R16 plan checkpoint precondition failed")
          plan = plan.replace(old_checkpoint, new_checkpoint, 1)
          old_rows = (
              "| R16.7 | Memory/context poisoning detection, quarantine and rebuild | COMPLETE | NONE |\n"
              "| R16.8 | Fault injection, KillSwitch, backup and recovery drills | PLANNED | NONE |"
          )
          new_rows = (
              "| R16.7 | Memory/context poisoning detection, quarantine and rebuild | COMPLETE + NORMALIZED | NONE |\n"
              "| R16.8 | Fault injection, KillSwitch, backup and recovery drills | IN_PROGRESS | NONE |"
          )
          if plan.count(old_rows) != 1:
              raise SystemExit("R16 subdivision table precondition failed")
          plan = plan.replace(old_rows, new_rows, 1)
          plan_path.write_text(plan, encoding="utf-8", newline="\n")

          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          continuity = continuity_path.read_text(encoding="utf-8")
          old_header = (
              "R16.1–R16.7 COMPLETE + NORMALIZED. R16.8–R16.18 remain PLANNED. "
              "R16.8 START-sync is authorized only from the normalized `main` produced by the unique R16.7 "
              "post-merge continuity-only normalization."
          )
          new_header = (
              "R16.1–R16.7 COMPLETE + NORMALIZED. R16.8 IN_PROGRESS. R16.9–R16.18 remain PLANNED. "
              f"R16.8 START-sync is bound to normalized `main` `{base}` and dedicated branch `{branch}`."
          )
          if continuity.count(old_header) != 1:
              raise SystemExit("continuity header precondition failed")
          continuity = continuity.replace(old_header, new_header, 1)
          if "- R16.8 : **IN_PROGRESS**" in continuity:
              raise SystemExit("R16.8 continuity row already exists")
          lines = continuity.splitlines()
          index = next(
              (i for i, line in enumerate(lines) if line.startswith("- R16.7 : **COMPLETE + NORMALIZED**")),
              None,
          )
          if index is None:
              raise SystemExit("R16.7 normalized continuity authority not found")
          row = (
              f"- R16.8 : **IN_PROGRESS** — normalized R16.7 `main` `{base}`; dedicated branch `{branch}`; "
              "START synchronization performed before implementation; manual NONE. Scope remains frozen to "
              "deterministic fault injection across KillSwitch, ProcessSandbox, SafeChange, backup/recovery, "
              "interrupted writes, subprocess crash/hang, bounded resource-denial simulation, corrupted "
              "checkpoint/state, cancellation and restart."
          )
          lines.insert(index + 1, row)
          continuity_path.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")

      - name: Validate bounded documentation diff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_repo.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'docs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R16_PLAN.md'
          test "$changed" = "$expected"

      - name: Commit START sync and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git rm .github/workflows/r16-8-start-sync-helper.yml
          git diff --cached --check
          git commit -m "docs(r16.8): synchronize subdivision start"
          git push origin HEAD:r16/08-fault-injection-recovery-drills
