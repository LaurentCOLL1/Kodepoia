name: R15.6 START Sync Helper

on:
  push:
    branches:
      - r15/06-kodebench-v2
    paths:
      - .github/workflows/r15-6-start-sync-helper.yml

permissions:
  contents: write

jobs:
  start-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: r15/06-kodebench-v2
      - name: Apply exact R15.6 START sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          text = path.read_text(encoding='utf-8')

          old_header = 'R15.1–R15.5 COMPLETE + NORMALIZED; R15.6–R15.17 PLANNED.'
          new_header = 'R15.1–R15.5 COMPLETE + NORMALIZED; R15.6 IN_PROGRESS; R15.7–R15.17 PLANNED.'
          if text.count(old_header) != 1:
              raise SystemExit(f'expected one header marker, found {text.count(old_header)}')
          text = text.replace(old_header, new_header, 1)

          old_sentence = 'This record is the unique post-merge continuity-only R15.5 normalization candidate; R15.6 START-sync is authorized only after fresh exact-head R0/Python/UI on this branch and expected-head merge to `main`.'
          new_sentence = 'Normalization PR #306 head `ac4a9efd803d9a45cb62cbf97d9387e6f61b5d28` passed R0 #2122 / `33290089490`, Python Core #2097 / `33290089540` 5/5 and UI #2062 / `33290089546`, then merged with `expected_head_sha` as normalized `main` `097e99db28508cd1c53eadfe00b2b33576a445af`. This is the unique post-merge continuity-only R15.5 normalization authority; R15.6 START-sync is authorized from that exact normalized main.'
          if text.count(old_sentence) != 1:
              raise SystemExit(f'expected one R15.5 normalization sentence, found {text.count(old_sentence)}')
          text = text.replace(old_sentence, new_sentence, 1)

          anchor = '- R14.1–R14.9 : **COMPLETE + NORMALIZED**.'
          r156 = ('- R15.6 : **IN_PROGRESS** — clean START / branch point `097e99db28508cd1c53eadfe00b2b33576a445af` from normalized R15.5 `main`; dedicated branch `r15/06-kodebench-v2`; scope frozen to KodeBench v2 registry, stable suite/task/scorer identities, domain/critical scoring, reproducibility, resource metrics, R3 `BaselineBench` compatibility, R15.4 protected-holdout integration and comparative reports. START-sync occurs before implementation bytes. Manual NONE.\n')
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one insertion anchor, found {text.count(anchor)}')
          text = text.replace(anchor, r156 + anchor, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff -- docs/continuity/KODEPOIA_CONTINUITY.md
          git rm .github/workflows/r15-6-start-sync-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git commit -m "docs(r15.6): synchronize START authority"
          git push origin HEAD:r15/06-kodebench-v2
