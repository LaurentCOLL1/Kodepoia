name: R15.16 continuity normalization helper

on:
  push:
    branches:
      - r15/16-normalize
    paths:
      - .github/workflows/r15-16-normalize-helper.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/16-normalize
          fetch-depth: 0
      - name: Normalize R15.16 continuity
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')).decode())"
          rm .github/workflows/r15-16-normalize-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r15-16-normalize-helper.yml
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 2
          printf '%s\n' "${staged[@]}" | grep -Fx 'docs/continuity/KODEPOIA_CONTINUITY.md'
          printf '%s\n' "${staged[@]}" | grep -Fx '.github/workflows/r15-16-normalize-helper.yml'
          git commit -m "docs(r15.16): normalize continuity"
          git push origin HEAD:r15/16-normalize
