name: KodeStudio UI Smoke

on:
  push:
    branches:
      - main
      - develop
      - "agent/**"
      - "feature/**"
      - "fix/**"
      - "r14/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: kodestudio-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: kodestudio-ui-windows
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact checkout provenance
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install UI and test dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run KodeStudio smoke tests
        run: pytest tests/test_kodestudio_smoke.py tests/test_r6_5_accessibility_ui.py tests/test_r6_6_localization_ui.py tests/test_r7_10_research_ui.py tests/test_r8_10_kodestudio.py tests/test_comfyui_r9_10_kodestudio.py
