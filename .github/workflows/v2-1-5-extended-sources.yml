name: V2.1.5 Extended Sources Acceptance

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: v2-1-5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: v2-1-5-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact checkout provenance
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,code]"
      - name: Compile V2.1.5 sources
        run: python -m compileall -q src tests scripts/v2_1_5_acceptance.py
      - name: Run exact-head V2.1.5 acceptance
        run: python scripts/v2_1_5_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_1_5/extended-sources.json
      - name: Upload V2.1.5 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-1-5-extended-sources-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_1_5/extended-sources.json
          if-no-files-found: error
          retention-days: 30
