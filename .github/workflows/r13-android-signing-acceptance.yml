name: R13 Android Signing Acceptance

on:
  push:
    branches:
      - "r13/**"

permissions:
  contents: write

jobs:
  evidence-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: r13/17-integrated-release-readiness
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Generate end-sync evidence
        run: python scripts/r13_17_end_sync_temp.py

      - name: Normalize generated documentation whitespace and rebuild report
        shell: bash
        run: |
          sed -i 's/[[:blank:]]\+$//' docs/roadmap/R13_17_ACCEPTANCE.md docs/roadmap/R13_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          python scripts/r13_17_build_integrated_report.py --source-sha 56f829f4395138bf90a1a8e0003bff95b67dd878

      - name: Validate R13.17
        run: python -m pytest tests/test_mobile_r13_17_integrated_acceptance.py -q

      - name: Validate diff
        run: git diff --check

      - name: Commit final evidence
        shell: bash
        run: |
          rm -f scripts/r13_17_end_sync_temp.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/r13-android-signing-acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "R13.17 end-sync integrated acceptance evidence"
          git push origin HEAD:r13/17-integrated-release-readiness
