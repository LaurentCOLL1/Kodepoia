name: Scratch R18.1 strict zip fix

on:
  push:
    branches:
      - r18/01-release-identity

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact helper source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fix strict adjacent-pair iteration
        shell: python
        run: |
          from pathlib import Path

          old = "zip(ordered, ordered[1:], strict=True)"
          new = "zip(ordered[:-1], ordered[1:], strict=True)"
          for name in (
              "tests/test_r18_release_identity.py",
              "scripts/r18_1_release_identity_acceptance.py",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one strict-zip target in {name}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

      - name: Commit fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/scratch-r18-1-zip-fix.yml
          git add tests/test_r18_release_identity.py scripts/r18_1_release_identity_acceptance.py
          git commit -m "fix(r18.1): validate adjacent version pairs strictly"
          git push origin HEAD:r18/01-release-identity
