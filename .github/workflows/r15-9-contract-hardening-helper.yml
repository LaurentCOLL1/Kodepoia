name: R15.9 Contract Hardening Helper

on:
  push:
    paths:
      - '.github/workflows/r15-9-contract-hardening-helper.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/09-qlora-sft
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact contract hardening
        shell: python
        run: |
          from pathlib import Path

          training = Path('src/kodepoia/tuning/training.py')
          text = training.read_text(encoding='utf-8')

          old = '''@dataclass(frozen=True, slots=True)\nclass ModelBinding:\n    model_ref: str\n    model_revision: str\n    model_digest: str\n    tokenizer_ref: str\n    tokenizer_digest: str\n\n    def __post_init__(self) -> None:\n        object.__setattr__(self, "model_ref", _safe_ref("model_ref", self.model_ref))\n        object.__setattr__(self, "model_revision", _safe_ref("model_revision", self.model_revision))\n        object.__setattr__(self, "tokenizer_ref", _safe_ref("tokenizer_ref", self.tokenizer_ref))\n        _require_digest("model_digest", self.model_digest)\n        _require_digest("tokenizer_digest", self.tokenizer_digest)\n\n    def to_dict(self) -> dict[str, str]:\n        return {\n            "model_digest": self.model_digest,\n            "model_ref": self.model_ref,\n            "model_revision": self.model_revision,\n            "tokenizer_digest": self.tokenizer_digest,\n            "tokenizer_ref": self.tokenizer_ref,\n        }\n'''
          new = '''@dataclass(frozen=True, slots=True)\nclass ModelBinding:\n    model_ref: str\n    model_revision: str\n    model_digest: str\n    tokenizer_ref: str\n    tokenizer_revision: str\n    tokenizer_digest: str\n    assistant_mask_capable: bool | None = None\n\n    def __post_init__(self) -> None:\n        object.__setattr__(self, "model_ref", _safe_ref("model_ref", self.model_ref))\n        object.__setattr__(self, "model_revision", _safe_ref("model_revision", self.model_revision))\n        object.__setattr__(self, "tokenizer_ref", _safe_ref("tokenizer_ref", self.tokenizer_ref))\n        object.__setattr__(\n            self,\n            "tokenizer_revision",\n            _safe_ref("tokenizer_revision", self.tokenizer_revision),\n        )\n        _require_digest("model_digest", self.model_digest)\n        _require_digest("tokenizer_digest", self.tokenizer_digest)\n        if self.assistant_mask_capable is not None and not isinstance(self.assistant_mask_capable, bool):\n            raise TrainingError("assistant_mask_capable must be bool or null")\n\n    def to_dict(self) -> dict[str, object]:\n        return {\n            "assistant_mask_capable": self.assistant_mask_capable,\n            "model_digest": self.model_digest,\n            "model_ref": self.model_ref,\n            "model_revision": self.model_revision,\n            "tokenizer_digest": self.tokenizer_digest,\n            "tokenizer_ref": self.tokenizer_ref,\n            "tokenizer_revision": self.tokenizer_revision,\n        }\n'''
          if text.count(old) != 1:
              raise SystemExit('ModelBinding marker count != 1')
          text = text.replace(old, new, 1)

          old = '''    train_rows: int\n    validation_rows: int\n    train_path: str | None = None\n    validation_path: str | None = None\n'''
          new = '''    train_rows: int\n    validation_rows: int\n    format: str = "prompt_completion"\n    train_path: str | None = None\n    validation_path: str | None = None\n'''
          if text.count(old) != 1:
              raise SystemExit('DatasetBinding fields marker count != 1')
          text = text.replace(old, new, 1)

          old = '''        _bounded_int("train_rows", self.train_rows, minimum=1, maximum=10_000_000_000)\n        _bounded_int("validation_rows", self.validation_rows, minimum=1, maximum=10_000_000_000)\n        if self.train_export_digest == self.validation_export_digest:\n'''
          new = '''        _bounded_int("train_rows", self.train_rows, minimum=1, maximum=10_000_000_000)\n        _bounded_int("validation_rows", self.validation_rows, minimum=1, maximum=10_000_000_000)\n        if self.format not in {"text", "prompt_completion", "conversational"}:\n            raise TrainingError("dataset format must be text, prompt_completion or conversational")\n        if self.train_export_digest == self.validation_export_digest:\n'''
          if text.count(old) != 1:
              raise SystemExit('DatasetBinding validation marker count != 1')
          text = text.replace(old, new, 1)

          old = '''            "dataset_digest": self.dataset_digest,\n            "dataset_id": self.dataset_id,\n            "manifest_digest": self.manifest_digest,\n'''
          new = '''            "dataset_digest": self.dataset_digest,\n            "dataset_id": self.dataset_id,\n            "format": self.format,\n            "manifest_digest": self.manifest_digest,\n'''
          if text.count(old) != 1:
              raise SystemExit('DatasetBinding descriptor marker count != 1')
          text = text.replace(old, new, 1)

          old = '''        if self.mode is TrainingMode.SFT and self.quantization is not QuantizationMode.NONE:\n            raise TrainingError("non-QLoRA SFT must not silently enable quantization")\n'''
          new = '''        if self.mode is TrainingMode.SFT and self.quantization is not QuantizationMode.NONE:\n            raise TrainingError("non-QLoRA SFT must not silently enable quantization")\n        if self.sft.assistant_only_loss:\n            if self.dataset.format != "conversational":\n                raise TrainingError("assistant_only_loss requires a conversational dataset")\n            if self.model.assistant_mask_capable is not True:\n                raise TrainingError("assistant_only_loss requires verified generation-mask capability")\n        if self.sft.completion_only_loss and self.dataset.format != "prompt_completion":\n            raise TrainingError("completion_only_loss requires a prompt_completion dataset")\n'''
          if text.count(old) != 1:
              raise SystemExit('TrainingPlan loss validation marker count != 1')
          text = text.replace(old, new, 1)

          old = '''    def _load_checkpoint(self, path: Path) -> CheckpointRecord:\n        payload = json.loads(path.read_text(encoding="utf-8"))\n        return CheckpointRecord.from_dict(payload)\n'''
          new = '''    def _load_checkpoint(self, path: Path) -> CheckpointRecord:\n        payload = json.loads(path.read_text(encoding="utf-8"))\n        record = CheckpointRecord.from_dict(payload)\n        artifact = self._inside(record.artifact_path)\n        if hashlib.sha256(artifact.read_bytes()).hexdigest() != record.artifact_digest:\n            raise TrainingError("resume checkpoint artifact digest mismatch")\n        return record\n'''
          if text.count(old) != 1:
              raise SystemExit('checkpoint validation marker count != 1')
          text = text.replace(old, new, 1)
          training.write_text(text, encoding='utf-8', newline='\n')

          worker = Path('src/kodepoia/tuning/train_worker.py')
          text = worker.read_text(encoding='utf-8')
          old = '''        model_cfg["tokenizer_ref"],\n        revision=model_cfg["model_revision"],\n'''
          new = '''        model_cfg["tokenizer_ref"],\n        revision=model_cfg["tokenizer_revision"],\n'''
          if text.count(old) != 1:
              raise SystemExit('tokenizer revision worker marker count != 1')
          worker.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          tests = Path('tests/test_tuning_r15_9.py')
          text = tests.read_text(encoding='utf-8')
          old = '''        tokenizer_ref="fixture/tokenizer",\n        tokenizer_digest=B,\n'''
          new = '''        tokenizer_ref="fixture/tokenizer",\n        tokenizer_revision="fixture-tokenizer-rev-1",\n        tokenizer_digest=B,\n        assistant_mask_capable=True,\n'''
          if text.count(old) != 1:
              raise SystemExit('test model marker count != 1')
          text = text.replace(old, new, 1)
          old = '''def test_sft_loss_mode_and_seed_configuration_are_digest_bound() -> None:\n    base = _plan()\n    assistant = replace(base, sft=replace(base.sft, assistant_only_loss=True))\n    full_sequence = replace(base, sft=replace(base.sft, completion_only_loss=False))\n    different_data_seed = replace(base, seeds=replace(base.seeds, data_seed=99))\n    assert len({base.digest, assistant.digest, full_sequence.digest, different_data_seed.digest}) == 4\n'''
          new = '''def test_sft_loss_mode_and_seed_configuration_are_digest_bound() -> None:\n    base = _plan()\n    conversational = replace(base.dataset, format="conversational")\n    assistant = replace(\n        base,\n        dataset=conversational,\n        sft=replace(base.sft, assistant_only_loss=True, completion_only_loss=False),\n    )\n    full_sequence = replace(base, sft=replace(base.sft, completion_only_loss=False))\n    different_data_seed = replace(base, seeds=replace(base.seeds, data_seed=99))\n    assert len({base.digest, assistant.digest, full_sequence.digest, different_data_seed.digest}) == 4\n'''
          if text.count(old) != 1:
              raise SystemExit('test loss mode marker count != 1')
          text = text.replace(old, new, 1)

          insert_after = '''def test_train_and_validation_must_be_distinct() -> None:\n    with pytest.raises(TrainingError, match="exports must be distinct"):\n        replace(_dataset(), validation_export_digest=A)\n    with pytest.raises(TrainingError, match="paths must be distinct"):\n        replace(_dataset(), train_path="data/same.jsonl", validation_path="data/same.jsonl")\n\n\n'''
          addition = '''def test_loss_modes_fail_closed_without_compatible_dataset_or_template_capability() -> None:\n    base = _plan()\n    with pytest.raises(TrainingError, match="conversational dataset"):\n        replace(base, sft=replace(base.sft, assistant_only_loss=True))\n    conversational = replace(base.dataset, format="conversational")\n    incapable = replace(base.model, assistant_mask_capable=False)\n    with pytest.raises(TrainingError, match="generation-mask capability"):\n        replace(\n            base,\n            model=incapable,\n            dataset=conversational,\n            sft=replace(base.sft, assistant_only_loss=True, completion_only_loss=False),\n        )\n    with pytest.raises(TrainingError, match="prompt_completion"):\n        replace(base, dataset=replace(base.dataset, format="text"))\n\n\n'''
          if text.count(insert_after) != 1:
              raise SystemExit('test insertion marker count != 1')
          text = text.replace(insert_after, insert_after + addition, 1)
          tests.write_text(text, encoding='utf-8', newline='\n')
      - name: Install core development dependencies only
        run: python -m pip install -e '.[dev]'
      - name: Format lint compile and test
        run: |
          ruff format src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py tests/test_tuning_r15_9.py
          ruff check --unsafe-fixes --fix src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py tests/test_tuning_r15_9.py
          ruff check src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py tests/test_tuning_r15_9.py
          python -m compileall -q src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py
          pytest -q tests/test_tuning_r15_8.py tests/test_tuning_r15_9.py
      - name: Commit hardening and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/r15-9-contract-hardening-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py tests/test_tuning_r15_9.py .github/workflows/r15-9-contract-hardening-helper.yml
          git diff --cached --check
          git commit -m 'feat(r15.9): harden model dataset and resume contracts'
          git push origin HEAD:r15/09-qlora-sft
