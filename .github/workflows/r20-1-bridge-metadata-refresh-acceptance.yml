name: R20.1 Bridge Metadata Refresh Acceptance

on:
  push:
    branches:
      - r20/01-bridge-metadata-refresh
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r20-1-bridge-metadata-refresh-acceptance.yml
      - configs/r16_supply_chain_policy.json
      - docs/continuity/KODEPOIA_CONTINUITY_R20.md
      - scripts/r20_1_bridge_refresh.py
      - src/kodepoia/update/bridge_refresh.py
      - tests/test_r20_1_bridge_refresh.py
      - update-repository/metadata/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r20-1-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile R20.1 sources
        run: >-
          python -m compileall -q
          src/kodepoia/update/bridge_refresh.py
          scripts/r20_1_bridge_refresh.py
          tests/test_r20_1_bridge_refresh.py

      - name: Run Ruff R20.1
        run: >-
          python -m ruff check
          src/kodepoia/update/bridge_refresh.py
          scripts/r20_1_bridge_refresh.py
          tests/test_r20_1_bridge_refresh.py

      - name: Run focused bridge and discovery regression tests
        run: >-
          python -m pytest -q
          tests/test_r20_1_bridge_refresh.py
          tests/test_r18_6_update_trust.py
          tests/test_r18_7_update_discovery.py

      - name: Assert production bridge preconditions
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("update-repository/metadata/root.json").read_bytes()
          targets = Path("update-repository/metadata/targets.json").read_bytes()
          snapshot = json.loads(Path("update-repository/metadata/snapshot.json").read_text(encoding="utf-8"))
          timestamp = json.loads(Path("update-repository/metadata/timestamp.json").read_text(encoding="utf-8"))
          if hashlib.sha256(root).hexdigest() != "892442754966aa643bbe15a2910aa3fef59032c8f5eade34fed62efd96aefee5":
              raise SystemExit("production Root changed before the R20.1 bridge ceremony")
          if hashlib.sha256(targets).hexdigest() != "0b65bf34e50d43ed1f82f0f4a17875fb0a4bb597ed5b6066749dc9352e504e3f":
              raise SystemExit("production Targets changed before the R20.1 bridge ceremony")
          if snapshot["signed"]["version"] != 2 or timestamp["signed"]["version"] != 2:
              raise SystemExit("R20.1 pre-signing branch must still contain Snapshot/Timestamp v2")
          report = {
              "format": "kodepoia-r20-1-bridge-pre-signing-acceptance",
              "schema_version": 1,
              "source_sha": os.environ["EVIDENCE_SHA"].strip().lower(),
              "root_version": 1,
              "targets_version": 2,
              "snapshot_version": 2,
              "timestamp_version": 2,
              "bridge_target_snapshot_version": 3,
              "bridge_target_timestamp_version": 3,
              "bridge_expiry_days": 30,
              "private_keys_used": False,
              "manual_boundary_reached": True,
          }
          output = Path("artifacts/r20_1/bridge-pre-signing-acceptance.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2, sort_keys=True))

      - name: Upload R20.1 pre-signing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r20-1-bridge-pre-signing-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r20_1/
          if-no-files-found: error
          retention-days: 30
