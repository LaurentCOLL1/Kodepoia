name: R12 Integrated Windows Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r12-integrated-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wizard-to-windows:
    runs-on: windows-latest
    env:
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Kodepoia
        run: python -m pip install -e ".[dev]"
      - name: Set up accepted .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run Wizard-to-Windows integrated acceptance
        run: python scripts/r12_16_windows_ci_acceptance.py --source-sha $env:KODEPOIA_SOURCE_SHA --output .kodepoia/evidence/R12_16_WINDOWS_CI_ACCEPTANCE.json
      - name: Validate Windows CI evidence schema
        run: python -c "import json; from pathlib import Path; from jsonschema import Draft202012Validator; Draft202012Validator(json.loads(Path('schemas/r12/r12-windows-ci-acceptance.schema.json').read_text(encoding='utf-8'))).validate(json.loads(Path('.kodepoia/evidence/R12_16_WINDOWS_CI_ACCEPTANCE.json').read_text(encoding='utf-8')))"
      - name: Upload R12.16 Windows CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-16-windows-ci-${{ github.event.pull_request.head.sha || github.sha }}
          path: .kodepoia/evidence/R12_16_WINDOWS_CI_ACCEPTANCE.json
          if-no-files-found: error
