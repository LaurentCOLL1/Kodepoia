name: Python Core

on:
  push:
    branches:
      - main
      - develop
      - "agent/**"
      - "feature/**"
      - "fix/**"
      - "r14/**"
      - "r20/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: python-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python-core-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact checkout provenance
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install
        run: python -m pip install -e ".[dev,code]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate or emit R7 integrated acceptance
        if: runner.os == 'Linux'
        run: python scripts/r7_integrated_acceptance.py --check-or-print docs/roadmap/R7_INTEGRATED_ACCEPTANCE.json
      - name: Validate or emit R8 integrated acceptance
        if: runner.os == 'Linux'
        run: python scripts/r8_integrated_acceptance.py --check-or-print docs/roadmap/R8_INTEGRATED_ACCEPTANCE.json
      - name: Validate or emit R9 integrated acceptance
        if: runner.os == 'Linux'
        run: python scripts/r9_integrated_acceptance.py --check-or-print docs/roadmap/R9_INTEGRATED_ACCEPTANCE.json
      - name: Run V2.0 capability truth exact-head acceptance
        run: python scripts/v2_0_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_0/capability-truth.json
      - name: Upload V2.0 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-0-capability-truth-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_0/capability-truth.json
          if-no-files-found: error
          retention-days: 30
      - name: Run V2.1.1 honest Research UX exact-head acceptance
        run: python scripts/v2_1_1_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_1_1/honest-research-ux.json
      - name: Upload V2.1.1 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-1-1-honest-research-ux-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_1_1/honest-research-ux.json
          if-no-files-found: error
          retention-days: 30
      - name: Run V2.1.2 discovery providers exact-head acceptance
        run: python scripts/v2_1_2_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_1_2/discovery-providers.json
      - name: Upload V2.1.2 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-1-2-discovery-providers-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_1_2/discovery-providers.json
          if-no-files-found: error
          retention-days: 30
      - name: Run V2.1.3 evidence workspace exact-head acceptance
        run: python scripts/v2_1_3_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_1_3/evidence-workspace.json
      - name: Upload V2.1.3 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-1-3-evidence-workspace-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_1_3/evidence-workspace.json
          if-no-files-found: error
          retention-days: 30
      - name: Run V2.1.4 cited synthesis exact-head acceptance
        run: python scripts/v2_1_4_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_1_4/cited-synthesis.json
      - name: Upload V2.1.4 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-1-4-cited-synthesis-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_1_4/cited-synthesis.json
          if-no-files-found: error
          retention-days: 30
      - name: Run V2.1.5 extended sources exact-head acceptance
        run: python scripts/v2_1_5_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_1_5/extended-sources.json
      - name: Upload V2.1.5 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-1-5-extended-sources-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_1_5/extended-sources.json
          if-no-files-found: error
          retention-days: 30
      - name: Run V2.1.6 ResearchGuard hardening exact-head acceptance
        run: python scripts/v2_1_6_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_1_6/researchguard-hardening.json
      - name: Upload V2.1.6 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-1-6-researchguard-hardening-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_1_6/researchguard-hardening.json
          if-no-files-found: error
          retention-days: 30
      - name: Run V2.2.1 Project Knowledge exact-head acceptance
        run: python scripts/v2_2_1_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_2_1/project-knowledge.json
      - name: Upload V2.2.1 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-2-1-project-knowledge-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_2_1/project-knowledge.json
          if-no-files-found: error
          retention-days: 30
      - name: Run V2.2.2 semantic retrieval exact-head acceptance
        run: python scripts/v2_2_2_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_2_2/semantic-retrieval.json
      - name: Upload V2.2.2 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-2-2-semantic-retrieval-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_2_2/semantic-retrieval.json
          if-no-files-found: error
          retention-days: 30
      - name: Run V2.2.3 explainable context exact-head acceptance
        run: python scripts/v2_2_3_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_2_3/explainable-context.json
      - name: Upload V2.2.3 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-2-3-explainable-context-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_2_3/explainable-context.json
          if-no-files-found: error
          retention-days: 30
      - name: Run V2.2.4 version-aware lifecycle exact-head acceptance
        run: python scripts/v2_2_4_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_2_4/version-aware-lifecycle.json
      - name: Upload V2.2.4 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-2-4-version-aware-lifecycle-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_2_4/version-aware-lifecycle.json
          if-no-files-found: error
          retention-days: 30
      - name: Run V2.2.5 project workspace exact-head acceptance
        run: python scripts/v2_2_5_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_2_5/project-workspace.json
      - name: Upload V2.2.5 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-2-5-project-workspace-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_2_5/project-workspace.json
          if-no-files-found: error
          retention-days: 30
      - name: Run V2.2.6 Project Knowledge hardening exact-head acceptance
        run: python scripts/v2_2_6_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_2_6/project-knowledge-hardening.json
      - name: Upload V2.2.6 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-2-6-project-knowledge-hardening-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_2_6/project-knowledge-hardening.json
          if-no-files-found: error
          retention-days: 30
      - name: Run V2.3.1 Model Lab shell exact-head acceptance
        run: python scripts/v2_3_1_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_3_1/model-lab-shell.json
      - name: Upload V2.3.1 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-3-1-model-lab-shell-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_3_1/model-lab-shell.json
          if-no-files-found: error
          retention-days: 30
      - name: Run V2.3.2 governed curation exact-head acceptance
        run: python scripts/v2_3_2_acceptance.py --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}" --output artifacts/v2_3_2/governed-curation.json
      - name: Upload V2.3.2 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-3-2-governed-curation-${{ matrix.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          path: artifacts/v2_3_2/governed-curation.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate PowerShell acceptance runner syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @(
            "scripts/r3_accept_local.ps1",
            "scripts/r5_accept_local.ps1",
            "scripts/r5_diagnose_godot_process.ps1",
            "scripts/r6_4_accept_local.ps1",
            "scripts/r6_5_accept_local.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Test
        run: pytest

  ui-smoke:
    name: kodestudio-ui-windows
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact checkout provenance
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install UI and test dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: KodeStudio smoke
        run: pytest tests/test_kodestudio_smoke.py tests/test_r6_5_accessibility_ui.py tests/test_r6_6_localization_ui.py tests/test_r7_10_research_ui.py tests/test_r8_10_kodestudio.py tests/test_v2_0_research_ui.py tests/test_v2_1_1_research_ux.py tests/test_v2_1_2_research_ui.py tests/test_v2_1_3_research_ui.py tests/test_v2_1_4_research_ui.py tests/test_v2_1_5_research_ui.py tests/test_v2_2_4_lifecycle_ui.py tests/test_v2_2_5_workspace_ui.py tests/test_v2_2_6_hardening_ui.py tests/test_v2_3_1_model_lab_ui.py tests/test_v2_3_2_curation_ui.py

  package-build:
    name: package-build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KODEPOIA_BUILD_PLATFORM: ${{ matrix.os }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact checkout provenance
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install build evidence dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build wheel and sdist
        run: python -m build --wheel --sdist --outdir dist
      - name: Collect and validate build evidence
        run: python scripts/r6_8_collect_build.py
      - name: Upload package and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kodepoia-build-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*
            .kodepoia/releases/${{ matrix.os }}/latest.json
            .kodepoia/workflows/r6-8-package-build/latest.json
