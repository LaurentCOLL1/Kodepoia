name: R15.2 END-sync corrected helper

on:
  push:
    branches:
      - r15/02-validated-experience-capture

permissions:
  contents: write

jobs:
  end-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/02-validated-experience-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install R0 dependencies
        run: python -m pip install -r scripts/requirements-r0.txt
      - name: Apply R15.2 END-sync
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          technical = "48b519c09fa50f5407cc4a55a0b76baf6f8e8ffd"
          start = "135fd085002bf8074d87308beca35ab33c35ed47"
          base = "f6681cdc072fdbd9eb8ebcf2c109859df31fb30f"

          plan = Path("docs/roadmap/R15_PLAN.md")
          text = plan.read_text(encoding="utf-8")
          old = (
              "**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. "
              "R15.1 is COMPLETE + NORMALIZED on `main` `f6681cdc072fdbd9eb8ebcf2c109859df31fb30f`; "
              "R15.2 is IN_PROGRESS on dedicated branch `r15/02-validated-experience-capture`; "
              "R15.3–R15.17 remain PLANNED."
          )
          new = (
              "**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. "
              "R15.1 is COMPLETE + NORMALIZED on `main` `f6681cdc072fdbd9eb8ebcf2c109859df31fb30f`; "
              f"R15.2 is COMPLETE with immutable technical source `{technical}`; implementation merge + unique "
              "post-merge continuity-only normalization are pending. R15.3–R15.17 remain PLANNED."
          )
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old_row = "| R15.2 | Governed validated-experience capture, outcome labeling + opt-in/source scope | IN_PROGRESS | NONE | R15.1 + R1/R6/R8 |"
          assert text.count(old_row) == 1
          text = text.replace(old_row, old_row.replace("IN_PROGRESS", "COMPLETE"), 1)
          plan.write_text(text, encoding="utf-8", newline="\n")

          continuity = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          lines = continuity.read_text(encoding="utf-8").splitlines()
          lines[0] = (
              "> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. "
              "R15.1 COMPLETE + NORMALIZED; R15.2 COMPLETE — implementation merge pending; R15.3–R15.17 PLANNED.** "
              f"R15.2 immutable technical source `{technical}` from clean START `{start}`; exact technical R15.2 #4 / "
              "`33272926744`, R0 #2069 / `33272926687`, Python #2044 / `33272926696`, UI #2009 / "
              "`33272926737` all SUCCESS; manual NONE. Fresh exact END-head re-gates remain mandatory before merge."
          )
          r151 = next(i for i, line in enumerate(lines) if line.startswith("- R15.1 : **COMPLETE + NORMALIZED**"))
          assert not any(line.startswith("- R15.2 :") for line in lines)
          lines.insert(
              r151 + 1,
              "- R15.2 : **COMPLETE — IMPLEMENTATION MERGE PENDING** — clean START "
              f"`{start}` from normalized R15.1 `main` `{base}`; immutable technical source `{technical}`; "
              "exact technical R15.2 #4 / `33272926744` SUCCESS Ubuntu + Windows with 33 focused/regression "
              "tests per OS + Ruff + compile, R15.1 #19 / `33272926691` SUCCESS, R0 #2069 / `33272926687` "
              "SUCCESS, Python #2044 / `33272926696` SUCCESS 5/5, UI #2009 / `33272926737` SUCCESS; manual NONE. "
              "Capture is disabled by default, explicit project/source opt-in + terminal validation are mandatory, "
              "accepted/corrected enter OBSERVED only, explicit diagnostic failed/rejected enter QUARANTINED, "
              "training authorization stays UNKNOWN, raw objects are physically workspace/project scoped, replay "
              "is idempotent/conflict-safe, quotas are bounded, and raw payload/storage paths are excluded from "
              "audit/status/summary. Final clean END-head must receive fresh R15.2/R0/Python/UI before merge; "
              "R15.3 remains unauthorized until the unique post-merge continuity normalization merges."
          )
          idx = next(i for i, line in enumerate(lines) if line == "| R15.2 | IN_PROGRESS | NONE |")
          lines[idx] = "| R15.2 | COMPLETE | NONE |"
          idx = next(i for i, line in enumerate(lines) if line.startswith("**R15.2 START-sync is active"))
          lines[idx] = (
              "**R15.2 END-sync is complete on `r15/02-validated-experience-capture`. Produce one clean END-head "
              "with no helper/marker, require fresh exact-head R15.2 focused + R0 Repository Guard + full Python "
              "Core + KodeStudio UI Smoke, then merge only with `expected_head_sha`. After that merge, perform "
              "exactly one continuity-only post-merge normalization with fresh R0/Python/UI. R15.3 remains "
              "unauthorized until that normalized `main` exists.**"
          )
          continuity.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")

          design = Path("docs/roadmap/R15_2_DESIGN.md")
          text = design.read_text(encoding="utf-8")
          old = "**Status:** TECHNICAL SOURCE ACCEPTED / END-SYNC PENDING  \n"
          new = "**Status:** END-SYNC COMPLETE / EXACT END-HEAD RE-GATES PENDING\n"
          assert text.count(old) == 1
          design.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          acceptance = Path("docs/roadmap/R15_2_ACCEPTANCE.md")
          text = acceptance.read_text(encoding="utf-8")
          old = "**Acceptance state:** TECHNICAL SOURCE ACCEPTED / END-HEAD RE-GATES PENDING  \n"
          new = "**Acceptance state:** END-SYNC COMPLETE / EXACT END-HEAD RE-GATES PENDING\n"
          assert text.count(old) == 1
          acceptance.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          subprocess.run(["git", "diff", "--check"], check=True)
          subprocess.run(["python", "scripts/check_repo.py"], check=True)
      - name: Commit END-sync and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15_2_end_sync.yml .github/workflows/r15_2_end_sync_fix.yml
          git add docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R15_2_DESIGN.md docs/roadmap/R15_2_ACCEPTANCE.md
          git commit -m "docs(r15.2): synchronize END state"
          git push origin HEAD:r15/02-validated-experience-capture
