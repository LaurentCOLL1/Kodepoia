name: R16.8 Post-Merge Continuity Normalization

on:
  push:
    branches:
      - r16/08-continuity-normalization

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact normalization branch
        uses: actions/checkout@v5
        with:
          ref: r16/08-continuity-normalization
          fetch-depth: 0

      - name: Normalize R16.8 continuity authority only
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          text = path.read_text(encoding='utf-8')

          old_top = (
              'R16.1–R16.7 COMPLETE + NORMALIZED. R16.8 COMPLETE on immutable technical source '
              '`9bea715e7f575696ba66240d6ff127e72e85f82e`; exact-END re-gates and the unique '
              'post-merge continuity normalization remain required before R16.9. R16.9–R16.18 remain PLANNED.'
          )
          new_top = (
              'R16.1–R16.8 COMPLETE + NORMALIZED. R16.9–R16.18 remain PLANNED. '
              'R16.9 START-sync is authorized only from the normalized `main` produced by the unique '
              'R16.8 post-merge continuity-only normalization.'
          )
          if text.count(old_top) != 1:
              raise SystemExit('expected exactly one pre-normalization top authority fragment')
          text = text.replace(old_top, new_top, 1)

          new_r16_8 = (
              '- R16.8 : **COMPLETE + NORMALIZED** — normalized R16.7 `main` '
              '`951c53959956d1b88b3c9c3a8c4c328c1127236b`; clean START '
              '`692b0ab931d3d59bf9f14aef7643ad83cbedc412`; immutable technical source '
              '`9bea715e7f575696ba66240d6ff127e72e85f82e`; technical R16.8 #3 / `33561149190` '
              'SUCCESS Ubuntu + Windows; final exact-END head `31407e53501e7254eba661bb29b731e8a9b96d3f` '
              'passed fresh R16.8 #14 / `33577970004` SUCCESS Ubuntu + Windows, R0 #2315 / '
              '`33577969753` SUCCESS Ubuntu + Windows, Python Core #2287 / `33577969972` SUCCESS 5/5 '
              'and UI #2252 / `33577969981` SUCCESS; PR #349 merged with '
              '`expected_head_sha=31407e53501e7254eba661bb29b731e8a9b96d3f` as implementation/evidence `main` '
              '`25199a7dfc8f66155b7ab14df661ec9fca8492ed`. Cross-platform semantic acceptance '
              '`f94ccc46356a24a8be2726a724191e1dc2eb148c049e184f38431be2f4af8c26`; 16/16 PASS, '
              '`security_claim=true`, `critical_veto=false`, synthetic-only, no live secrets/network/destructive '
              'host actions, manual NONE. Exact-END artifacts: Linux `9827442654 / '
              'sha256:402242f555da8c5585f9a9f3e4040c8e2795f6ae8eec68b34338dbd56868355b`; Windows '
              '`9827389161 / sha256:6e8c792547a5d4a3829882bc60b733fbfb2e14d2e37fbae870ded701380a6408`. '
              'Recovery is integrity/task-bound and fail-closed under partial writes, resource denial, KillSwitch, '
              'timeout and corrupted checkpoint/snapshot/backup; restoration is verified and narrow, and '
              'repository-local RPO semantics make no production DR claim. This record is the unique post-merge '
              'continuity-only R16.8 normalization authority when its PR merges; R16.9 START-sync is authorized '
              'only from the resulting normalized `main`.'
          )
          text, count = re.subn(r'^- R16\.8 : \*\*COMPLETE\*\* — .*$', new_r16_8, text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit('expected exactly one R16.8 COMPLETE authority line')

          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit continuity-only normalization and self-delete helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r16-8-post-merge-normalization.yml
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/r16-8-post-merge-normalization.yml docs/continuity/KODEPOIA_CONTINUITY.md "
          git commit -m "docs(r16.8): post-merge continuity normalization"
          git push origin HEAD:r16/08-continuity-normalization
