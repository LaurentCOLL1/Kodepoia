name: R16.1 START Sync Stage

on:
  push:
    branches:
      - r16/01-threat-model-red-team-harness
    paths:
      - .github/workflows/r16-1-start-sync-stage.yml

permissions:
  contents: write

jobs:
  start-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R16.1 branch
        uses: actions/checkout@v4
        with:
          ref: r16/01-threat-model-red-team-harness
          fetch-depth: 0

      - name: Apply mandatory R16.1 START sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          base = "fcb8d3c532949ce8e8d728e6bb1171e7132af342"
          branch = "r16/01-threat-model-red-team-harness"

          plan_path = Path("docs/roadmap/R16_PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")

          old_status = "**Status:** PLANNING_IN_PROGRESS  "
          new_status = "**Status:** IN_PROGRESS  "
          assert plan.count(old_status) == 1, "unexpected R16 phase status"
          plan = plan.replace(old_status, new_status, 1)

          old_checkpoint = "**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is the only authorized action. R16.1–R16.18 are PLANNED and no R16 implementation is authorized before this planning authority and its single planning continuity normalization are accepted, exact-head gated and merged."
          new_checkpoint = f"**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + NORMALIZED on `main` `{base}`. R16.1 is IN_PROGRESS on dedicated branch `{branch}` from that exact normalized main; R16.2–R16.18 remain PLANNED. R16.2 is not authorized before R16.1 is COMPLETE + NORMALIZED."
          assert plan.count(old_checkpoint) == 1, "unexpected R16 execution checkpoint"
          plan = plan.replace(old_checkpoint, new_checkpoint, 1)

          old_index = "| R16.1 | Threat model, adversarial corpus and red-team harness | PLANNED | NONE |"
          new_index = "| R16.1 | Threat model, adversarial corpus and red-team harness | IN_PROGRESS | NONE |"
          assert plan.count(old_index) == 1, "unexpected R16.1 plan index"
          plan = plan.replace(old_index, new_index, 1)
          plan_path.write_text(plan, encoding="utf-8", newline="\n")

          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          continuity = continuity_path.read_text(encoding="utf-8")

          old_top = "**R1–R15 COMPLETE + NORMALIZED. R16 planning ACCEPTED + NORMALIZED on the normalized `main` produced when this unique planning continuity normalization PR merges; R16.1 START-sync is authorized only from that normalized `main`; R16.2–R16.18 remain PLANNED.**"
          new_top = f"**R1–R15 COMPLETE + NORMALIZED. R16 planning ACCEPTED + NORMALIZED on exact `main` `{base}`. R16.1 IN_PROGRESS on `{branch}` from that normalized main; R16.2–R16.18 remain PLANNED.**"
          assert continuity.count(old_top) == 1, "unexpected continuity top R16 state"
          continuity = continuity.replace(old_top, new_top, 1)

          old_global = "- R16 planning : **ACCEPTED + NORMALIZED** — branch point `b83c5cf0354f675e468e3ab37c2eefa66aaa9d56`; clean planning head `83cf6fb903aed458bb753f40259adcad52446b8c`; exact-head R0 #2256 / `33422594947` SUCCESS Ubuntu + Windows, Python Core #2228 / `33422594702` SUCCESS 5/5, KodeStudio UI Smoke #2193 / `33422595046` SUCCESS; planning PR #333 merged with `expected_head_sha=83cf6fb903aed458bb753f40259adcad52446b8c` as `6c9078a8b6b7e233a56ee4b157ce09079991dcaa`. This record is the unique post-merge R16 planning continuity-only normalization authority when its PR merges; only the resulting normalized `main` authorizes R16.1 START-sync."
          new_global = "- R16 planning : **ACCEPTED + NORMALIZED** — branch point `b83c5cf0354f675e468e3ab37c2eefa66aaa9d56`; clean planning head `83cf6fb903aed458bb753f40259adcad52446b8c`; planning R0 #2256 / `33422594947` SUCCESS Ubuntu + Windows, Python Core #2228 / `33422594702` SUCCESS 5/5, KodeStudio UI Smoke #2193 / `33422595046` SUCCESS; planning PR #333 merged exact head as `6c9078a8b6b7e233a56ee4b157ce09079991dcaa`; unique planning-normalization head `ed0af37538f5f973a395bd1a7afb3ff711e4144f` passed fresh R0 #2258 / `33423996945` SUCCESS Ubuntu + Windows, Python Core #2230 / `33423996825` SUCCESS 5/5 and UI #2195 / `33423996743` SUCCESS, then normalization PR #334 merged with exact expected head as normalized `main` `fcb8d3c532949ce8e8d728e6bb1171e7132af342`. R16.1 START-sync is authorized only from that exact normalized main."
          assert continuity.count(old_global) == 1, "unexpected global R16 planning authority"
          continuity = continuity.replace(old_global, new_global, 1)

          old_acceptance = "- Planning acceptance technical authority: clean planning head `83cf6fb903aed458bb753f40259adcad52446b8c`; R0 Repository Guard #2256 / `33422594947` SUCCESS Ubuntu + Windows; full Python Core #2228 / `33422594702` SUCCESS 5/5; KodeStudio UI Smoke #2193 / `33422595046` SUCCESS; planning PR #333 merged with exact expected head as `6c9078a8b6b7e233a56ee4b157ce09079991dcaa`. Exactly one continuity-only planning normalization is permitted; it must receive fresh exact-head R0/Python/UI and protected merge before R16.1 START-sync is authorized."
          new_acceptance = "- Planning acceptance + normalization closure: planning head `83cf6fb903aed458bb753f40259adcad52446b8c`; R0 #2256 / `33422594947`, Python #2228 / `33422594702`, UI #2193 / `33422595046` SUCCESS; PR #333 -> `6c9078a8b6b7e233a56ee4b157ce09079991dcaa`; unique continuity-only normalization head `ed0af37538f5f973a395bd1a7afb3ff711e4144f`; fresh R0 #2258 / `33423996945`, Python #2230 / `33423996825`, UI #2195 / `33423996743` SUCCESS; PR #334 -> normalized `main` `fcb8d3c532949ce8e8d728e6bb1171e7132af342`. No second planning normalization is authorized."
          assert continuity.count(old_acceptance) == 1, "unexpected planning acceptance line"
          continuity = continuity.replace(old_acceptance, new_acceptance, 1)

          old_index = "| R16.1 | PLANNED | NONE |"
          new_index = "| R16.1 | IN_PROGRESS | NONE |"
          assert continuity.count(old_index) == 1, "unexpected continuity R16.1 index"
          continuity = continuity.replace(old_index, new_index, 1)

          old_next = "Start **R16.1** with its mandatory START-sync on a dedicated branch from the normalized `main` produced when this unique R16 planning continuity-only normalization PR merges. Do **not** begin R16.1 before this normalization has fresh exact-head R0/Python/UI SUCCESS and merges with exact `expected_head_sha`; do not begin R16.2 before R16.1 is COMPLETE + NORMALIZED."
          new_next = f"Implement and accept **R16.1** only on `{branch}` from normalized `main` `{base}`. Freeze the technical source before exact-head R16.1/R0/Python/UI gates; do **not** begin R16.2 before R16.1 is COMPLETE + NORMALIZED."
          assert continuity.count(old_next) == 1, "unexpected continuity next action"
          continuity = continuity.replace(old_next, new_next, 1)

          anchor = "## R16 status index\n"
          start_record = f"## R16.1 START authority\n\n- Dedicated branch: `{branch}`.\n- Exact normalized branch point: `main` `{base}`.\n- State at START: R1–R15 COMPLETE + NORMALIZED; R16 planning ACCEPTED + NORMALIZED; R16.1 IN_PROGRESS; R16.2–R16.18 PLANNED.\n- Scope is frozen by `docs/roadmap/R16_PLAN.md`: threat model, immutable synthetic adversarial corpus, deterministic mutation-free red-team/fault harness, exact-source/case-set/policy digests, critical-veto and coverage assertions.\n- Manual state: **NONE**. Live malware, live secrets, destructive host actions and production targets remain excluded.\n- No R16.1 implementation preceded this START-sync.\n\n"
          assert continuity.count(anchor) == 1
          continuity = continuity.replace(anchor, start_record + anchor, 1)

          continuity_path.write_text(continuity, encoding="utf-8", newline="\n")

          p = plan_path.read_text(encoding="utf-8")
          c = continuity_path.read_text(encoding="utf-8")
          assert "**Status:** IN_PROGRESS" in p
          assert p.count("| R16.1 | Threat model, adversarial corpus and red-team harness | IN_PROGRESS | NONE |") == 1
          assert c.count("| R16.1 | IN_PROGRESS | NONE |") == 1
          assert "## R16.1 START authority" in c
          assert base in c and branch in c
          assert "| R16.2 | PLANNED | NONE |" in c
          assert "| R16.18 | PLANNED | CONDITIONAL |" in c
          PY

      - name: Stage exact START-sync commit and verify scope
        shell: bash
        run: |
          git rm .github/workflows/r16-1-start-sync-stage.yml
          git add docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' '.github/workflows/r16-1-start-sync-stage.yml' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R16_PLAN.md' | sort)"
          actual="$(printf '%s\n' "$changed" | sed '/^$/d' | sort)"
          test "$actual" = "$expected"

      - name: Commit mandatory START sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(r16.1): mandatory START sync"
          git push origin HEAD:r16/01-threat-model-red-team-harness
