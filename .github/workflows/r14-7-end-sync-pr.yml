name: R14.7 END Sync PR

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/r14-7-end-sync.yml
      - .github/workflows/r14-7-end-sync-pr.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  end-sync:
    if: github.head_ref == 'r14/07-matchmaking-lobby-presence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/07-matchmaking-lobby-presence
          fetch-depth: 0
      - name: Execute deterministic END-sync payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, textwrap
          source = Path('.github/workflows/r14-7-end-sync.yml').read_text(encoding='utf-8')
          match = re.search(
              r"      - name: Synchronize R14\.7 END documentation\n        shell: bash\n        run: \|\n((?:          .*\n)+?)      - name: Remove temporary END-sync workflow",
              source,
              re.S,
          )
          if not match:
              raise SystemExit('embedded END-sync payload not found')
          payload = textwrap.dedent(match.group(1))
          subprocess.run(['bash', '-lc', payload], check=True)
          PY
      - name: Remove temporary synchronization helpers
        run: git rm .github/workflows/r14-7-end-sync.yml .github/workflows/r14-7-end-sync-pr.yml
      - name: Commit and push END synchronization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/R14_PLAN.md docs/roadmap/R14_7_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --name-only
          git commit -m "docs(r14.7): synchronize accepted technical evidence"
          git push origin HEAD:r14/07-matchmaking-lobby-presence
