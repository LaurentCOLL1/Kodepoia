name: R16.13 END Sync Helper

on:
  push:
    branches:
      - "r16/13-end-sync-helper"

permissions:
  contents: read

jobs:
  build-end-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "r16/13-end-sync-helper"
          fetch-depth: 0

      - name: Generate verified documentation-only END sync
        run: python .github/r16_13_end_sync_helper.py

      - name: Upload verified END-sync files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r16-13-end-sync-files-ef48343a0967920776a2c9849949f3203f5379b6
          path: out
          if-no-files-found: error
          retention-days: 7
