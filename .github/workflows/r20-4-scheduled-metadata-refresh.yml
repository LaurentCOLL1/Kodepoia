name: R20.4 Scheduled Metadata Refresh

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r20-4-production-metadata-refresh
  cancel-in-progress: false

jobs:
  freshness-check:
    name: r20-4-freshness-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      refresh_required: ${{ steps.check.outputs.refresh_required }}
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["SOURCE_SHA"].strip().lower()
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused runtime dependencies
        run: python -m pip install -e .

      - name: Record immutable source SHA
        id: source
        shell: bash
        run: echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate current metadata and determine refresh need
        id: check
        run: python scripts/r20_4_scheduled_metadata_refresh.py --mode check

  sign-and-publish:
    name: r20-4-sign-and-publish
    needs: freshness-check
    if: needs.freshness-check.outputs.refresh_required == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: tuf-production-signing
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      BASE_SHA: ${{ needs.freshness-check.outputs.source_sha }}
      TUF_SNAPSHOT_ED25519_SEED_B64: ${{ secrets.TUF_SNAPSHOT_ED25519_SEED_B64 }}
      TUF_TIMESTAMP_ED25519_SEED_B64: ${{ secrets.TUF_TIMESTAMP_ED25519_SEED_B64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact freshness-check source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert main has not advanced before signing
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" != "$BASE_SHA" ]]; then
            echo "main advanced from $BASE_SHA to $current_main; refusing stale refresh" >&2
            exit 1
          fi

      - name: Install focused runtime dependencies
        run: python -m pip install -e .

      - name: Restore exact tracked source after dependency installation
        shell: bash
        run: |
          git reset --hard "$BASE_SHA"
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Unable to restore exact tracked source before signing" >&2
            git status --porcelain --untracked-files=no >&2
            exit 1
          fi

      - name: Sign one steady-state Snapshot/Timestamp pair
        run: python scripts/r20_4_scheduled_metadata_refresh.py --mode refresh

      - name: Assert only online metadata changed
        shell: python
        run: |
          import subprocess

          changed = sorted(
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only", "--"], text=True
              ).splitlines()
              if line.strip()
          )
          expected = [
              "update-repository/metadata/snapshot.json",
              "update-repository/metadata/timestamp.json",
          ]
          if changed != expected:
              raise SystemExit(f"unexpected refresh changes: {changed!r}")

      - name: Commit pair on isolated publication branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/r20-4-metadata-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-repository/metadata/snapshot.json update-repository/metadata/timestamp.json
          git diff --cached --check
          git commit -m "R20.4 — refresh Snapshot and Timestamp metadata"
          refresh_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$refresh_sha" >> "$GITHUB_OUTPUT"

      - name: Open protected publication pull request
        id: pr
        shell: bash
        env:
          REFRESH_BRANCH: ${{ steps.commit.outputs.branch }}
          REFRESH_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          pr_number="$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f title="R20.4 automated metadata freshness refresh" \
            -f head="$REFRESH_BRANCH" \
            -f base="main" \
            -f body="Automated R20.4 refresh of Snapshot/Timestamp only. Source main: $BASE_SHA. Refresh head: $REFRESH_SHA. No release assets or offline-authority metadata are modified." \
            --jq '.number')"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=$pr_number" >> "$GITHUB_ENV"

      - name: Dispatch exact required Repository Guard checks
        shell: bash
        env:
          REFRESH_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/r0-bootstrap.yml/dispatches" \
            -f ref="$REFRESH_BRANCH"

      - name: Wait for exact-head required checks
        shell: python
        env:
          REFRESH_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          import json
          import os
          import subprocess
          import time

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["REFRESH_SHA"]
          required = {
              "repository-bootstrap-ubuntu-latest",
              "repository-bootstrap-windows-latest",
          }
          actions_app_id = 15368
          deadline = time.monotonic() + 20 * 60
          while time.monotonic() < deadline:
              payload = subprocess.check_output(
                  [
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      f"repos/{repository}/commits/{sha}/check-runs?per_page=100",
                  ],
                  text=True,
              )
              runs = json.loads(payload).get("check_runs", [])
              states = {}
              for run in runs:
                  app = run.get("app") or {}
                  name = run.get("name")
                  if name in required and app.get("id") == actions_app_id:
                      states[name] = (run.get("status"), run.get("conclusion"))
              if required.issubset(states):
                  failed = {
                      name: state
                      for name, state in states.items()
                      if state[0] == "completed" and state[1] != "success"
                  }
                  if failed:
                      raise SystemExit(f"required Repository Guard check failed: {failed!r}")
                  if all(states[name] == ("completed", "success") for name in required):
                      print(json.dumps(states, indent=2, sort_keys=True))
                      break
              time.sleep(15)
          else:
              raise SystemExit("timed out waiting for exact-head Repository Guard checks")

      - name: Revalidate unchanged main and merge through ruleset
        shell: bash
        env:
          REFRESH_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" != "$BASE_SHA" ]]; then
            echo "main advanced from $BASE_SHA to $current_main before merge; refusing stale publication" >&2
            exit 1
          fi
          result="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha="$REFRESH_SHA" \
            -f merge_method="merge")"
          merged="$(printf '%s' "$result" | jq -r '.merged')"
          if [[ "$merged" != "true" ]]; then
            printf '%s\n' "$result" >&2
            exit 1
          fi

      - name: Remove merged publication branch
        if: success()
        shell: bash
        env:
          REFRESH_BRANCH: ${{ steps.commit.outputs.branch }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$REFRESH_BRANCH"

      - name: Close abandoned publication PR
        if: failure() && env.PR_NUMBER != ''
        shell: bash
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -f state=closed || true
