name: R16.4 Continuity Normalization

on:
  push:
    branches:
      - r16/04-continuity-normalization
    paths:
      - .github/workflows/r16-4-normalize-continuity.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout normalization branch
        uses: actions/checkout@v4
        with:
          ref: r16/04-continuity-normalization
          fetch-depth: 0

      - name: Normalize R16.4 continuity only
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          text = path.read_text(encoding="utf-8")

          old_header = (
              "R16.4 COMPLETE at mandatory END-sync on `r16/04-secrets-privacy-exfiltration-hardening`; "
              "fresh exact-END re-gates are required before protected merge, and R16.5–R16.18 remain PLANNED."
          )
          new_header = (
              "R16.4 COMPLETE + NORMALIZED through implementation/evidence merge "
              "`0b4eae636a0446143a32ab56e02390a4302f3312` and this unique continuity-only normalization branch "
              "`r16/04-continuity-normalization` when merged. R16.5–R16.18 remain PLANNED; R16.5 START-sync is "
              "authorized only from the normalized `main` produced by this normalization PR."
          )
          if text.count(old_header) != 1:
              raise SystemExit("R16.4 header authority replacement failed")
          text = text.replace(old_header, new_header, 1)

          replacement = (
              "- R16.4 : **COMPLETE + NORMALIZED** — normalized R16.3 `main` `cb6ec02629fd94f9d23b04ebfed525571c8482d9`; "
              "clean START `d244d98e6699b1872d2d9457fb87ca39cb58eaad`; immutable technical source "
              "`f4dfa88870ee25956edf99476f5bd130a1cec471`; technical R16.4 #3 / `33514844394` SUCCESS Ubuntu + Windows; "
              "final exact-END head `5ce610f36caa2d104a5024397f74e497e38eec85` passed fresh R16.4 #7 / `33515438543` SUCCESS Ubuntu + Windows, "
              "R0 #2281 / `33515438357` SUCCESS Ubuntu + Windows, Python Core #2253 / `33515438772` SUCCESS 5/5 and UI #2218 / `33515438559` SUCCESS; "
              "PR #341 merged with `expected_head_sha=5ce610f36caa2d104a5024397f74e497e38eec85` as implementation/evidence `main` `0b4eae636a0446143a32ab56e02390a4302f3312`. "
              "Cross-platform acceptance JSON SHA-256 `8fb41bde8798b0b0734d19f582e298da20f8af40b88c2d02faa72b8279c7fac1`; semantic "
              "`7f5101b4371a531b6b1e610b1908f6b54e0123b111de1e4343f41887f57cfa0f`; 10/10 PASS, `security_claim=true`, "
              "`critical_veto=false`, synthetic-only, no live secrets/destructive host actions/network calls, manual NONE. "
              "Linux technical artifact `9803136169` / `041fb37ee017329c23c062ae26a81a29fcd83d40f6b0e08a9eebbcba9b93f43f`; Windows technical artifact "
              "`9803152318` / `e82cb50a838704931fa99c038d32f353410b5c70a900285f0ec1e3f5093724bb`. `SecretRef` stays durable/non-tainted; "
              "secret values remain narrow-use only, redacted across output/evidence, denied in argv/ordinary env and URLs, artifact-scanned, destination-gated, and re-resolved for rotation/revocation. "
              "This record is the unique post-merge continuity-only R16.4 normalization authority when its PR merges; R16.5 START-sync is authorized only from the resulting normalized `main`."
          )
          pattern = r"^- R16\.4 : \*\*COMPLETE\*\* — .*?$"
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit("R16.4 continuity record replacement failed")

          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Verify continuity-only scope
        shell: bash
        run: |
          git rm .github/workflows/r16-4-normalize-continuity.yml
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/r16-4-normalize-continuity.yml' 'docs/continuity/KODEPOIA_CONTINUITY.md' | sort)"
          test "$actual" = "$expected"

      - name: Commit clean continuity normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(r16.4): normalize post-merge continuity"
          git push origin HEAD:r16/04-continuity-normalization
