name: R15 Planning Sync Helper

on:
  push:
    branches:
      - r15/00-phase-plan
    paths:
      - .github/workflows/r15-planning-sync-helper.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          ref: r15/00-phase-plan
          fetch-depth: 0

      - name: Synchronize R15 planning continuity and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          text = path.read_text(encoding='utf-8')

          old_header = '> Kodepoia, architecture v1.0 gelée. **R1–R13 COMPLETE + NORMALIZED. R14 planning ACCEPTED + NORMALIZED. R14.1–R14.17 COMPLETE + NORMALIZED. R14 COMPLETE + NORMALIZED. R15 planning AUTHORIZED on the normalized main produced by this unique phase normalization.**'
          new_header = '> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning IN_PROGRESS from normalized `main` `3f10bc62059e120d5ff467d00e39a0a7f9219cb9`; R15.1–R15.17 PLANNED; no R15 implementation is authorized before planning ACCEPTED + NORMALIZED.**'
          if old_header not in text:
              raise SystemExit('R15 planning header anchor missing')
          text = text.replace(old_header, new_header, 1)

          global_anchor = '- R14 : **COMPLETE + NORMALIZED** — canonical integrated digest `06dbdc830b20fd4b2966b11cbacfd4b010f93101b071d827766c8b9cbfd45189`; implementation/evidence merge `3327913047625ca26a70b5c96beb3f1608ff7720`; this record is the unique post-merge continuity-only phase normalization authority. R15 planning is the next authorized phase action after this normalization PR merges.\n'
          global_add = global_anchor + '- R15 planning : **IN_PROGRESS** — branch `r15/00-phase-plan` from normalized R14 main `3f10bc62059e120d5ff467d00e39a0a7f9219cb9`; exhaustive `docs/roadmap/R15_PLAN.md` freezes R15.1–R15.17 before implementation; planning acceptance and its one continuity-only normalization remain pending.\n'
          if global_anchor not in text:
              raise SystemExit('R15 global-state anchor missing')
          text = text.replace(global_anchor, global_add, 1)

          rule_anchor = '## Permanent R-phase execution rule\n'
          planning_block = '''## R15 planning authority\n\n- Exact branch point: normalized R14 `main` `3f10bc62059e120d5ff467d00e39a0a7f9219cb9`.\n- Dedicated planning branch: `r15/00-phase-plan`.\n- Frozen-roadmap title: **Experience / Bench / Fine-tuning**.\n- Roadmap chain: validated experiences → cleaning/dedup/license/governance → gap benchmark → QLoRA only if useful → GGUF/Ollama → KodeBench before/after; any critical-domain regression vetoes promotion.\n- Exhaustive plan: `docs/roadmap/R15_PLAN.md`; subdivision set **R15.1–R15.17** is PLANNED and no R15 implementation is present in the planning authority.\n- Training data is opt-in/eligibility-gated, provenance/license-bound, secret/private-data sanitized, deduplicated and protected by a train/benchmark contamination firewall.\n- Fine-tuning is fail-closed and conditional: `NO_TRAIN`, `FIX_SYSTEM_FIRST`, `INSUFFICIENT_DATA`, `UNSUPPORTED`, `LICENSE_BLOCKED`, `BUDGET_BLOCKED` and `INCONCLUSIVE` are truthful outcomes where evidence does not justify training.\n- QLoRA/PEFT/TRL/bitsandbytes, llama.cpp/GGUF and real Ollama specialization are optional capability-probed tools, not unconditional base-package or hardware prerequisites.\n- Manual state for planning: **NONE**. Later R15.8/R15.9/R15.12/R15.13/R15.16/R15.17 carry CONDITIONAL hardware/tool gates as frozen in the plan; if one triggers during implementation, execution stops before the following subdivision until exact evidence is reviewed.\n- Planning acceptance requires fresh exact-head R0 Repository Guard + full Python Core + KodeStudio UI Smoke, planning PR merge with exact `expected_head_sha`, then exactly one continuity-only planning normalization with fresh exact-head R0/Python/UI and protected merge. Only the resulting normalized `main` authorizes R15.1.\n\n## R15 status index\n\n| ID | Status | Manual |\n| --- | --- | --- |\n| R15.1 | PLANNED | NONE |\n| R15.2 | PLANNED | NONE |\n| R15.3 | PLANNED | NONE |\n| R15.4 | PLANNED | NONE |\n| R15.5 | PLANNED | NONE |\n| R15.6 | PLANNED | NONE |\n| R15.7 | PLANNED | NONE |\n| R15.8 | PLANNED | CONDITIONAL |\n| R15.9 | PLANNED | CONDITIONAL |\n| R15.10 | PLANNED | NONE |\n| R15.11 | PLANNED | NONE |\n| R15.12 | PLANNED | CONDITIONAL |\n| R15.13 | PLANNED | CONDITIONAL |\n| R15.14 | PLANNED | NONE |\n| R15.15 | PLANNED | NONE |\n| R15.16 | PLANNED | CONDITIONAL |\n| R15.17 | PLANNED | CONDITIONAL |\n\n## Next authorized action\n\nComplete and re-gate the exhaustive R15 planning authority. Do **not** start R15.1 before the planning PR and its unique planning continuity normalization are both merged successfully.\n\n'''
          if rule_anchor not in text:
              raise SystemExit('Permanent rule anchor missing')
          if '## R15 planning authority' in text:
              raise SystemExit('R15 planning authority already present')
          text = text.replace(rule_anchor, planning_block + rule_anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git rm .github/workflows/r15-planning-sync-helper.yml
          git commit -m 'docs(r15): synchronize exhaustive planning continuity'
          git push origin HEAD:r15/00-phase-plan
