name: R15.9 Implementation Validate Helper

on:
  push:
    paths:
      - '.github/workflows/r15-9-impl-validate-helper.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/09-qlora-sft
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded implementation fixes
        shell: python
        run: |
          from pathlib import Path

          training = Path('src/kodepoia/tuning/training.py')
          text = training.read_text(encoding='utf-8')
          replacements = {
              'import os\n': '',
              'run_dir = self.root / ".kodepoia" / "tuning" / "runs" / plan.run_id': 'run_dir = self.root / "tuning-runs" / plan.run_id',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'training marker count != 1: {old!r}')
              text = text.replace(old, new, 1)
          training.write_text(text, encoding='utf-8', newline='\n')

          tests = Path('tests/test_tuning_r15_9.py')
          text = tests.read_text(encoding='utf-8')
          old = 'Path(".kodepoia")\n        / "tuning"\n        / "runs"'
          new = 'Path("tuning-runs")'
          if text.count(old) != 1:
              raise SystemExit('test checkpoint path marker count != 1')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          worker = Path('src/kodepoia/tuning/train_worker.py')
          text = worker.read_text(encoding='utf-8')
          if text.count('import os\n') != 1:
              raise SystemExit('worker os import marker count != 1')
          text = text.replace('import os\n', '', 1)
          old = 'trainer.train(resume_from_checkpoint=None if not resume else str(_inside(root, str(resume))))'
          new = '''trainer.train(\n        resume_from_checkpoint=(\n            None\n            if not resume\n            else str(_inside(root, str(resume)).parent if str(resume).endswith(".json") else _inside(root, str(resume)))\n        )\n    )'''
          if text.count(old) != 1:
              raise SystemExit('real resume marker count != 1')
          worker.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
      - name: Install core development dependencies only
        run: python -m pip install -e '.[dev]'
      - name: Format and lint R15.9-owned surface
        run: |
          ruff format src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py tests/test_tuning_r15_9.py
          ruff check --fix src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py tests/test_tuning_r15_9.py
          ruff check src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py tests/test_tuning_r15_9.py
      - name: Compile R15.9 surface
        run: python -m compileall -q src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py tests/test_tuning_r15_9.py
      - name: Run R15.8 and R15.9 focused tests
        run: pytest -q tests/test_tuning_r15_8.py tests/test_tuning_r15_9.py
      - name: Commit validated implementation and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/r15-9-impl-validate-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kodepoia/tuning/training.py src/kodepoia/tuning/train_worker.py tests/test_tuning_r15_9.py .github/workflows/r15-9-impl-validate-helper.yml
          git diff --cached --check
          git commit -m 'feat(r15.9): validate fixture training orchestration'
          git push origin HEAD:r15/09-qlora-sft
