name: R16.17 Implementation Helper

on:
  push:
    branches:
      - "r16/17-implementation-helper"

permissions:
  contents: write

jobs:
  build-r16-9-pin-integrity-fix:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: "a81134543fd35fa3755a13a26e0a66d95e577006"
    steps:
      - name: Checkout helper source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false

      - name: Preserve isolated R16.9 acceptance patch
        shell: bash
        run: cp .github/helpers/r16_17_r16_9_pin_integrity_fix.py /tmp/r16_17_r16_9_pin_integrity_fix.py

      - name: Checkout exact failed technical head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          lfs: false
          clean: true

      - name: Assert exact fix base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git reset --mixed HEAD

      - name: Apply exact R16.9 policy-integrity fix
        run: python /tmp/r16_17_r16_9_pin_integrity_fix.py

      - name: Assert bounded one-file diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "scripts/r16_9_supply_chain_acceptance.py"
          test -z "$(git diff --name-only -- docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md)"
          grep -Fq '"actions/download-artifact": "634f93cb2916e3fdff6788551b99b062d0335ce0"' scripts/r16_9_supply_chain_acceptance.py

      - name: Install focused validation dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff R16.9 acceptance source
        run: python -m ruff check scripts/r16_9_supply_chain_acceptance.py

      - name: Run R16.9 regression tests
        run: python -m pytest -q tests/test_supply_chain_r16_9.py

      - name: Build exact candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/r16_9_supply_chain_acceptance.py
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --check
          git commit -m "fix(r16.17): bind R16.9 acceptance to eight action pins"
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "scripts/r16_9_supply_chain_acceptance.py"

      - name: Build exact-source package evidence
        run: python -m build --wheel --sdist --outdir dist

      - name: Prove R16.9 acceptance on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          python scripts/r16_9_supply_chain_acceptance.py \
            --source-sha "$candidate" \
            --platform "Helper-Linux" \
            --output artifacts/r16_9_supply_chain_acceptance.json

      - name: Publish exact validated candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          git push --force origin HEAD:refs/heads/r16/17-r16-9-pin-integrity-fix-transport
