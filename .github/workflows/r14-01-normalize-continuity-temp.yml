name: R14.1 Continuity Normalization Temp
on:
  push:
    paths:
      - 'docs/roadmap/R14_1_NORMALIZATION_TRIGGER.md'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout normalization branch
        uses: actions/checkout@v4
        with:
          ref: r14/01-continuity-normalization
          fetch-depth: 0
      - name: Apply deterministic R14.1 normalization
        run: python scripts/r14_1_normalize_continuity.py
      - name: Prepare continuity-only final tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm -f scripts/r14_1_normalize_continuity.py .github/workflows/r14-01-normalize-continuity-temp.yml docs/roadmap/R14_1_NORMALIZATION_TRIGGER.md
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R14.1 continuity-only normalization'
          BASE=6059b6d706d1208fdcad102c9fa217abaf31d099
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'docs/continuity/KODEPOIA_CONTINUITY.md'
          git push origin HEAD:r14/01-continuity-normalization
