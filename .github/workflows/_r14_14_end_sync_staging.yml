## END-sync rule

The immutable technical source remains `{source_sha}`. The final R14.14 END-head is acceptable only if its cumulative diff from that source contains exactly:

- `docs/roadmap/R14_PLAN.md`
- `docs/roadmap/R14_14_ACCEPTANCE.md`
- `docs/continuity/KODEPOIA_CONTINUITY.md`

That END-head must then pass fresh exact-head R0 Repository Guard, full Python Core, KodeStudio UI Smoke and R14 LiveOps Acceptance (Ubuntu + Windows) on the same SHA. Merge is permitted only with `expected_head_sha`. R14.15 remains unauthorized until exactly one post-merge continuity-only normalization passes fresh R0/Python/UI and merges.
"""
          acceptance_path.write_text(acceptance, encoding="utf-8")
          PY

      - name: Verify exact three-file staging surface and self-clean
        shell: bash
        env:
          SOURCE_SHA: bd7d0130b5241047e5583bd31e0a183be1a1e6f1
          WORKFLOW: .github/workflows/_r14_14_end_sync_staging.yml
        run: |
          set -euo pipefail
          git rm "$WORKFLOW"
          git add docs/roadmap/R14_PLAN.md docs/roadmap/R14_14_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md
          mapfile -t changed < <(git diff "$SOURCE_SHA" --name-only | sort)
          expected=(
            docs/continuity/KODEPOIA_CONTINUITY.md
            docs/roadmap/R14_14_ACCEPTANCE.md
            docs/roadmap/R14_PLAN.md
          )
          printf 'Changed from source:\n'; printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          git diff --check "$SOURCE_SHA"

      - name: Commit staging tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(r14.14): stage END synchronization tree'
          git push origin HEAD:r14/14-end-sync-staging
