name: R14.15 guarded technical apply

on:
  push:
    branches:
      - r14/15-service-operations-resilience
    paths:
      - .github/workflows/_r14_15_apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard exact apply parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "r14/15-service-operations-resilience"
          test "$(git rev-parse HEAD^)" = "309a1c63e3c0fc9f1d7d2f44248eba10d4b3c5b9"

      - name: Apply exact R14.15 implementation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_r14_15_apply.py

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate focused implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/kodepoia/backend/resilience.py \
            src/kodepoia/backend/__init__.py \
            scripts/r14_15_resilience_acceptance.py \
            tests/test_r14_15_resilience.py \
            tests/test_r14_15_backend_exports.py
          python -m pytest -q tests/test_r14_15_resilience.py tests/test_r14_15_backend_exports.py
          python scripts/r14_15_resilience_acceptance.py \
            --source-sha aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --output /tmp/r14_15_evidence.json
          python -c "import json; from pathlib import Path; from jsonschema import Draft202012Validator; e=json.loads(Path('/tmp/r14_15_evidence.json').read_text()); s=json.loads(Path('schemas/r14/backend-resilience-evidence.schema.json').read_text()); Draft202012Validator.check_schema(s); Draft202012Validator(s).validate(e); assert e['status']=='pass'; assert all(e['checks'].values())"
          git diff --check

      - name: Commit technical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(r14.15): add service operations resilience"
          git push origin HEAD:r14/15-service-operations-resilience
