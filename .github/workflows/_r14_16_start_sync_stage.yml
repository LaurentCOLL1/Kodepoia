name: R14.16 START sync staging

on:
  push:
    branches:
      - r14/16-start-sync-stage
    paths:
      - .github/workflows/_r14_16_start_sync_stage.yml

permissions:
  contents: write

jobs:
  start-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard staging source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "r14/16-start-sync-stage"
          test "$(git rev-parse HEAD^)" = "7f96add6fb8f2fea6e3e0d7ebfd536e030f4b7d4"
          test -f scripts/_r14_16_start_sync_stage.py

      - name: Apply R14.16 START sync
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_r14_16_start_sync_stage.py")
          text = path.read_text(encoding="utf-8")
          old = "and its unique continuity-only normalization are complete.\"\nif continuity.count(old_next)"
          new = "and its unique continuity-only normalization are complete.\"\"\"\nif continuity.count(old_next)"
          if text.count(old) != 1:
              raise SystemExit(f"staging syntax marker count={text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
          python scripts/_r14_16_start_sync_stage.py
          git diff --check -- docs/roadmap/R14_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git add docs/roadmap/R14_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R14_PLAN.md "

      - name: Commit staged START-sync blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(r14.16): stage START authority"
          git push origin HEAD:r14/16-start-sync-stage