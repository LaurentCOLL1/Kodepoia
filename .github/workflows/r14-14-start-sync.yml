name: R14.14 START Synchronization

on:
  push:
    branches:
      - r14/14-liveops-campaigns-schedules

permissions:
  contents: write

jobs:
  start-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact START branch
        uses: actions/checkout@v4
        with:
          ref: r14/14-liveops-campaigns-schedules
          fetch-depth: 5

      - name: Assert exact normalized R14.13 ancestry and transient surface
        shell: bash
        run: |
          set -euo pipefail
          BASE="b56162e0903bf2dc29505dfb6385030ed5d4b9d4"
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/_r14_14_start_sync.py'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/r14-14-start-sync.yml'
          test -f scripts/_r14_14_start_sync.py
          test -f .github/workflows/r14-14-start-sync.yml

      - name: Apply anchored R14.14 START synchronization
        run: python scripts/_r14_14_start_sync.py

      - name: Validate and commit clean START authority
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm scripts/_r14_14_start_sync.py
          rm .github/workflows/r14-14-start-sync.yml
          git add -A
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/roadmap/R14_PLAN.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/continuity/KODEPOIA_CONTINUITY.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/_r14_14_start_sync.py'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/r14-14-start-sync.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(r14.14): synchronize START authority'
          git push origin HEAD:r14/14-liveops-campaigns-schedules
