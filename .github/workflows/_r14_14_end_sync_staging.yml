name: R14.14 END-sync staging

on:
  push:
    branches:
      - r14/14-end-sync-staging
    paths:
      - .github/workflows/_r14_14_end_sync_staging.yml

permissions:
  contents: write

jobs:
  stage-end-sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: r14/14-end-sync-staging
          fetch-depth: 0

      - name: Apply guarded R14.14 END synchronization
        shell: bash
        env:
          SOURCE_SHA: bd7d0130b5241047e5583bd31e0a183be1a1e6f1
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          source_sha = "bd7d0130b5241047e5583bd31e0a183be1a1e6f1"
          plan_path = Path("docs/roadmap/R14_PLAN.md")
          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          acceptance_path = Path("docs/roadmap/R14_14_ACCEPTANCE.md")

          plan = plan_path.read_text(encoding="utf-8")
          continuity = continuity_path.read_text(encoding="utf-8")

          checkpoint = (
              "**Execution checkpoint:** R1–R13 are COMPLETE + NORMALIZED; R14 planning is ACCEPTED + NORMALIZED. "
              "R14.1–R14.13 are COMPLETE + NORMALIZED on normalized `main` `b56162e0903bf2dc29505dfb6385030ed5d4b9d4`. "
              "R14.14 is COMPLETE at technical/evidence level on immutable source `bd7d0130b5241047e5583bd31e0a183be1a1e6f1`; "
              "its END-sync is pending fresh exact-head R0 Repository Guard, full Python Core, KodeStudio UI Smoke and R14 LiveOps Acceptance. "
