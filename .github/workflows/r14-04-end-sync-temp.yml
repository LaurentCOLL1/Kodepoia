name: R14.4 END Sync Temp
on:
  push:
    branches: [r14/04-auth-identity-sessions]
    paths: [.r14_4_end_trigger]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/04-auth-identity-sessions
          fetch-depth: 0
      - name: Apply deterministic END-sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          plan = Path('docs/roadmap/R14_PLAN.md')
          s = plan.read_text(encoding='utf-8')
          old = '| R14.4 | Auth, identity, sessions, tokens, passkeys/OIDC provider-neutral boundary | IN_PROGRESS | CONDITIONAL / NOT TRIGGERED | R14.1–R14.3 + R1/R6/R7 |'
          new = '| R14.4 | Auth, identity, sessions, tokens, passkeys/OIDC provider-neutral boundary | COMPLETE | CONDITIONAL / NOT TRIGGERED | R14.1–R14.3 + R1/R6/R7 |'
          if old not in s: raise SystemExit('R14.4 index marker missing')
          s = s.replace(old, new, 1)
          old = '## Completion record\n\nTo be appended when accepted.\n\n---\n\n# R14.5 — PostgreSQL authoritative persistence, migrations, transactions + concurrency'
          new = '''## Completion record\n\n- Accepted immutable technical head: `3660f351649e85450324df25888d577afb02b19a`.\n- Technical exact-head gates: R0 Repository Guard #1779 / `33187747722` SUCCESS; Python Core #1753 / `33187747723` SUCCESS; KodeStudio UI Smoke #1720 / `33187747872` SUCCESS.\n- Ubuntu full Python suite: 1494 passed, 13 skipped, 46 warnings; Windows Core suite also SUCCESS; both package builds and Python internal UI smoke SUCCESS.\n- Cross-platform focused prevalidation `33187554520`: 29 R14.4/R14.3 tests passed on Ubuntu and Windows after compileall.\n- Standards evidence: RFC 9700 OAuth 2.0 Security BCP; OpenID Connect Core validation semantics; W3C WebAuthn Level 3 Candidate Recommendation Snapshot dated 26 May 2026; OWASP session guidance.\n- Manual intervention: CONDITIONAL / NOT TRIGGERED. Core acceptance used deterministic local providers only.\n- Current subdivision status: `COMPLETE` at technical/evidence level. R14.5 remains `PLANNED` until final END re-gates, PR #263 merge and one continuity-only normalization.\n\n---\n\n# R14.5 — PostgreSQL authoritative persistence, migrations, transactions + concurrency'''
          if old not in s: raise SystemExit('R14.4 completion marker missing')
          s = s.replace(old, new, 1)
          plan.write_text(s, encoding='utf-8', newline='\n')

          acc = Path('docs/roadmap/R14_4_ACCEPTANCE.md')
          a = acc.read_text(encoding='utf-8')
          a = a.replace('**Status: IMPLEMENTATION_CANDIDATE_PENDING**', '**Status: TECHNICAL_ACCEPTED_FINAL_REGATES_PENDING**', 1)
          marker = '## Required technical candidate gates\n\nAfter focused prevalidation, the accepted immutable implementation candidate must bind one unchanged SHA to fresh:\n\n1. R0 Repository Guard — COMPLETED / SUCCESS.\n2. full Python Core — COMPLETED / SUCCESS, including Ubuntu/Windows core, both package builds and internal KodeStudio smoke.\n3. KodeStudio UI Smoke — COMPLETED / SUCCESS.\n\nThen END-sync may change only `R14_PLAN.md`, this ledger and continuity before fresh exact-head re-gates, merge with expected-head protection and exactly one continuity-only post-merge normalization.\n'
          replacement = marker + '''\n## Accepted technical source\n\n- SHA: `3660f351649e85450324df25888d577afb02b19a`.\n- R0 Repository Guard #1779 / `33187747722`: SUCCESS.\n- Python Core #1753 / `33187747723`: SUCCESS.\n- KodeStudio UI Smoke #1720 / `33187747872`: SUCCESS.\n- Ubuntu full suite: 1494 passed, 13 skipped, 46 warnings. Windows Core, both package builds and Python internal UI smoke also SUCCESS.\n- Focused cross-platform prevalidation `33187554520`: 29 tests passed on Ubuntu and Windows.\n- The technical tree is immutable. This END-sync changes documentation/evidence only.\n'''
          if marker not in a: raise SystemExit('acceptance gates marker missing')
          a = a.replace(marker, replacement, 1)
          acc.write_text(a, encoding='utf-8', newline='\n')

          cont = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          c = cont.read_text(encoding='utf-8')
          old = '> Kodepoia, architecture v1.0 gelée. **R1–R13 COMPLETE + NORMALIZED. R14 planning ACCEPTED + NORMALIZED. R14.1–R14.3 COMPLETE + NORMALIZED. R14.4 IN_PROGRESS on `r14/04-auth-identity-sessions`; R14.5–R14.17 remain PLANNED.** R14.3 final END-head `8411ce92da962a37cb9a5936bdac740d9a132204` passed R0 #1775 / `33146496788`, Python #1749 / `33146496859`, UI #1716 / `33146496739`; PR #261 merged as `d288772a90d5877cabe35adb6e71f0ede32f6b8d`; normalization head `b8151f3729d2648d5f1e4d6ecd3bc9afb3c3c401` passed R0 #1777 / `33186628042`, Python #1751 / `33186628118`, UI #1718 / `33186628151`; PR #262 merged as normalized `main` `f28e6762830ec9a2b22ddedc24bdc9a446e5f4b2`. R14.4 starts exactly there. Manual state: CONDITIONAL / NOT TRIGGERED.'
          new = '> Kodepoia, architecture v1.0 gelée. **R1–R13 COMPLETE + NORMALIZED. R14 planning ACCEPTED + NORMALIZED. R14.1–R14.3 COMPLETE + NORMALIZED. R14.4 COMPLETE at technical/evidence level on `r14/04-auth-identity-sessions`; R14.5–R14.17 remain PLANNED.** R14.4 immutable technical source `3660f351649e85450324df25888d577afb02b19a` passed R0 #1779 / `33187747722`, Python Core #1753 / `33187747723`, and UI #1720 / `33187747872`, all SUCCESS; Ubuntu full suite recorded 1494 passed / 13 skipped / 46 warnings; cross-platform focused prevalidation `33187554520` passed 29 tests on Ubuntu and Windows. Final END-sync may change only plan/R14.4 acceptance/continuity, then fresh R0/Python/UI, PR #263 merge and one continuity-only normalization are required before R14.5. Manual state: CONDITIONAL / NOT TRIGGERED.'
          if old not in c: raise SystemExit('continuity prompt marker missing')
          c = c.replace(old, new, 1)
          old = '- R14 planning: **ACCEPTED + NORMALIZED**. R14.1–R14.3 are **COMPLETE + NORMALIZED**. R14.3 normalization head **`b8151f3729d2648d5f1e4d6ecd3bc9afb3c3c401`** passed R0 #1777 / `33186628042`, Python #1751 / `33186628118`, UI #1718 / `33186628151`; PR #262 merged as normalized **`main` `f28e6762830ec9a2b22ddedc24bdc9a446e5f4b2`**. R14.4 is **IN_PROGRESS** on `r14/04-auth-identity-sessions`; R14.5–R14.17 remain PLANNED. Manual **CONDITIONAL / NOT TRIGGERED**.'
          new = '- R14 planning: **ACCEPTED + NORMALIZED**. R14.1–R14.3 are **COMPLETE + NORMALIZED**. R14.4 immutable technical source **`3660f351649e85450324df25888d577afb02b19a`** passed R0 #1779 / `33187747722`, Python #1753 / `33187747723`, UI #1720 / `33187747872`; R14.4 is **COMPLETE / FINAL_DOCUMENTATION_REGATES_PENDING** on `r14/04-auth-identity-sessions`. R14.5–R14.17 remain PLANNED. Manual **CONDITIONAL / NOT TRIGGERED**.'
          if old not in c: raise SystemExit('continuity global marker missing')
          c = c.replace(old, new, 1)
          old = '- Frozen R14.4 scope: typed auth/account/realm identities, deterministic local provider, session/access/refresh lifecycle, rotation/revocation, PKCE/state/nonce/redirect/issuer/audience/algorithm policy, passkey public-credential contracts and explicit OIDC adapter boundary; no external tenant provisioning or generalized federation.\n'
          new = old + '- Accepted immutable technical source: `3660f351649e85450324df25888d577afb02b19a`. Technical gates: R0 #1779 / `33187747722`, Python Core #1753 / `33187747723`, UI #1720 / `33187747872`, all SUCCESS. Ubuntu full suite: 1494 passed / 13 skipped / 46 warnings; focused `33187554520`: 29 tests passed on Ubuntu and Windows.\n- R14.4 is COMPLETE at technical/evidence level; R14.5 remains PLANNED pending final END re-gates, PR #263 merge and one continuity-only normalization.\n'
          if old not in c: raise SystemExit('R14.4 authority marker missing')
          c = c.replace(old, new, 1)
          cont.write_text(c, encoding='utf-8', newline='\n')
          PY
          rm -f .github/workflows/r14-04-end-sync-temp.yml .r14_4_end_trigger
          git add -- docs/roadmap/R14_PLAN.md docs/roadmap/R14_4_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md
          git add -u -- .github/workflows/r14-04-end-sync-temp.yml .r14_4_end_trigger
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R14.4 END-sync acceptance plan and continuity'
          cumulative=$(git diff --ignore-space-at-eol --name-only 3660f351649e85450324df25888d577afb02b19a HEAD -- | sort)
          expected=$(printf '%s\n' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R14_4_ACCEPTANCE.md' 'docs/roadmap/R14_PLAN.md' | sort)
          test "$cumulative" = "$expected"
          git push origin HEAD:r14/04-auth-identity-sessions
