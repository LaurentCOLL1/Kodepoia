name: R16.14 START Sync Helper

on:
  push:
    branches:
      - "r16/14-start-sync-helper"

permissions:
  contents: write

jobs:
  publish-start-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "r16/14-start-sync-helper"
          path: helper
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout R16.14 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "r16/14-representative-audio-voice-cinematic-beta-workflow"
          path: repo
          fetch-depth: 0

      - name: Generate and publish exact START-sync
        shell: bash
        run: |
          set -euo pipefail
          BASE=429a018192bcb00221f9fc4e6ae64d0fdbc40cfd
          test "$(git -C repo rev-parse HEAD)" = "$BASE"
          cp helper/.github/r16_14_start_sync_helper.py /tmp/r16_14_start_sync_helper.py
          cd repo
          python /tmp/r16_14_start_sync_helper.py
          git add -- docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=("docs/continuity/KODEPOIA_CONTINUITY.md" "docs/roadmap/R16_PLAN.md")
          test "${staged[*]}" = "${expected[*]}"
          git diff --cached --check
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'docs(r16.14): synchronize START authority' | git commit-tree "$tree" -p "$BASE")
          mapfile -t committed < <(git diff-tree --no-commit-id --name-only -r "$commit" | sort)
          test "${committed[*]}" = "${expected[*]}"
          echo "START_SYNC_HEAD=$commit"
          git push origin "$commit":refs/heads/r16/14-representative-audio-voice-cinematic-beta-workflow
