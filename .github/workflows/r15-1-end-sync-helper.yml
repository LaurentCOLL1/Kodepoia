name: R15.1 END Sync Helper

on:
  push:
    branches:
      - 'r15/01-experience-contracts'
    paths:
      - '.github/workflows/r15-1-end-sync-helper.yml'

permissions:
  contents: write

jobs:
  end-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/01-experience-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install R0 helper requirements
        run: python -m pip install -r scripts/requirements-r0.txt
      - name: Apply deterministic R15.1 END sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          plan_path = Path('docs/roadmap/R15_PLAN.md')
          plan = plan_path.read_text(encoding='utf-8')
          replacements = {
              "**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED on `main` `29ae0ffabb7ffa974c4d544e33bfe54f0fa403f1`. R15.1 is IN_PROGRESS on dedicated branch `r15/01-experience-contracts`; R15.2–R15.17 remain PLANNED.":
              "**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED on `main` `29ae0ffabb7ffa974c4d544e33bfe54f0fa403f1`. R15.1 is COMPLETE with immutable technical source `2da5e5d5aa712462c898270c41c5cafb42e6aeaa`; implementation merge + unique post-merge normalization are pending. R15.2–R15.17 remain PLANNED.",
              "| R15.1 | Experience contracts, eligibility state machine + training-data trust boundary | IN_PROGRESS | NONE | R14 COMPLETE + normalized R15 planning |":
              "| R15.1 | Experience contracts, eligibility state machine + training-data trust boundary | COMPLETE | NONE | R14 COMPLETE + normalized R15 planning |",
          }
          for old, new in replacements.items():
              if plan.count(old) != 1:
                  raise SystemExit(f'plan anchor count != 1: {old[:80]!r}')
              plan = plan.replace(old, new, 1)

          section_start = plan.index('# R15.1 —')
          section_end = plan.index('\n---\n\n# R15.2 —', section_start)
          section = plan[section_start:section_end]
          old_completion = "## Completion record\n\nTo be appended when accepted."
          new_completion = "\n".join([
              "## Completion record",
              "",
              "**COMPLETE — technical acceptance recorded.**",
              "",
              "- clean START-head: `a474d0c85d27ca7113a8044b2c29a5e664ebd352`;",
              "- immutable technical source: `2da5e5d5aa712462c898270c41c5cafb42e6aeaa`;",
              "- R15.1 Acceptance #6 / `33271323481`: SUCCESS Ubuntu + Windows, 18 focused tests + Ruff + compileall on both;",
              "- R0 #2057 / `33271323508`: SUCCESS;",
              "- Python Core #2032 / `33271323458`: SUCCESS 5/5; Ubuntu 1778 passed / 14 skipped / 46 warnings;",
              "- KodeStudio UI Smoke #1997 / `33271323468`: SUCCESS;",
              "- manual state: `NONE`;",
              "- redaction/sanitization cannot convert a denied/unknown/review source authorization into training eligibility;",
              "- rejected evidence candidates: `77f3ce9a935ea6c1816f3f6095d0d2b62db527aa` (synthetic PR-merge checkout) and `ea57df89e172d97f91498d758373e13048d7e707` (Ruff E501 failure).",
              "",
              "Implementation merge and the unique continuity-only normalization remain required before R15.2 is authorized.",
          ])
          if section.count(old_completion) != 1:
              raise SystemExit('R15.1 completion anchor count != 1')
          section = section.replace(old_completion, new_completion, 1)
          plan = plan[:section_start] + section + plan[section_end:]
          plan_path.write_text(plan, encoding='utf-8')

          cont_path = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          cont = cont_path.read_text(encoding='utf-8')
          old_top = "> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1 IN_PROGRESS on `r15/01-experience-contracts` from normalized `main` `29ae0ffabb7ffa974c4d544e33bfe54f0fa403f1`; R15.2–R15.17 PLANNED.**"
          new_top = "> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1 COMPLETE on `r15/01-experience-contracts`, immutable technical source `2da5e5d5aa712462c898270c41c5cafb42e6aeaa`; implementation merge + unique normalization pending; R15.2–R15.17 PLANNED.**"
          if cont.count(old_top) != 1:
              raise SystemExit('continuity top anchor count != 1')
          cont = cont.replace(old_top, new_top, 1)

          planning_line = "- R15 planning : **ACCEPTED + NORMALIZED** — branch point `3f10bc62059e120d5ff467d00e39a0a7f9219cb9`; clean planning head `5856021b73edeaa29f124fab90275a8cd89e956f`; exact-head R0 #2051 / `33268871882` SUCCESS Ubuntu + Windows, Python Core #2026 / `33268871682` SUCCESS 5/5, KodeStudio UI Smoke #1991 / `33268871753` SUCCESS; planning PR #292 merged with exact expected head as `e464260edbc4ef1d7962fdfe7401667600a2b50d`; this record is the unique post-merge planning continuity-only normalization authority. R15.1 is authorized only on the normalized main produced when this normalization PR merges."
          r151_line = "- R15.1 : **COMPLETE — IMPLEMENTATION MERGE PENDING** — clean START `a474d0c85d27ca7113a8044b2c29a5e664ebd352`; immutable source `2da5e5d5aa712462c898270c41c5cafb42e6aeaa`; R15.1 #6 / `33271323481` SUCCESS Ubuntu + Windows; R0 #2057 / `33271323508` SUCCESS; Python #2032 / `33271323458` SUCCESS 5/5 with Ubuntu 1778 passed / 14 skipped / 46 warnings; UI #1997 / `33271323468` SUCCESS; manual NONE. Non-laundering is normative: sanitizer/redaction PASS never overrides denied/unknown/review source, consent, provenance, license or privacy authorization. R15.2 remains unauthorized until merge + unique continuity-only normalization."
          if cont.count(planning_line) != 1:
              raise SystemExit('planning authority anchor count != 1')
          cont = cont.replace(planning_line, planning_line + '\n' + r151_line, 1)

          old_status = "| R15.1 | IN_PROGRESS | NONE |"
          new_status = "| R15.1 | COMPLETE | NONE |"
          if cont.count(old_status) != 1:
              raise SystemExit('R15.1 continuity status anchor count != 1')
          cont = cont.replace(old_status, new_status, 1)

          old_next = "**R15.1 implementation + focused/adversarial acceptance is the only authorized phase action** on branch `r15/01-experience-contracts` from normalized base `29ae0ffabb7ffa974c4d544e33bfe54f0fa403f1`. Do not begin R15.2 before R15.1 implementation/evidence merge and its single post-merge continuity-only normalization both succeed."
          new_next = "**R15.1 implementation merge + its single post-merge continuity-only normalization are the only authorized phase actions.** Immutable technical source is `2da5e5d5aa712462c898270c41c5cafb42e6aeaa`. Do not begin R15.2 until the exact END-head merges and the unique normalization passes fresh R0/Python/UI and merges."
          if cont.count(old_next) != 1:
              raise SystemExit('next-action anchor count != 1')
          cont = cont.replace(old_next, new_next, 1)
          cont_path.write_text(cont, encoding='utf-8')
          PY
          git diff --check
          python scripts/check_repo.py
      - name: Commit END sync and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15-1-end-sync-helper.yml
          git add docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          git commit -m "R15.1 END sync technical acceptance"
          git push origin HEAD:r15/01-experience-contracts
