name: R14 Authority Acceptance

on:
  pull_request:
    paths:
      - "src/kodepoia/backend/authority.py"
      - "src/kodepoia/backend/__init__.py"
      - "tests/test_r14_6_authoritative_server.py"
      - "scripts/r14_6_authority_acceptance.py"
      - "schemas/r14/backend-authority-*.schema.json"
      - ".github/workflows/r14-authority-acceptance.yml"
      - "docs/roadmap/R14_6_*.md"
  push:
    branches: ["r14/06-authoritative-server-state"]
    paths:
      - "src/kodepoia/backend/authority.py"
      - "src/kodepoia/backend/__init__.py"
      - "tests/test_r14_6_authoritative_server.py"
      - "scripts/r14_6_authority_acceptance.py"
      - "schemas/r14/backend-authority-*.schema.json"
      - ".github/workflows/r14-authority-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-acceptance:
    name: authority-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_PATH: docs/roadmap/R14_6_AUTHORITY_ACCEPTANCE-${{ matrix.os }}.json
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install acceptance dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests/test_r14_6_authoritative_server.py scripts/r14_6_authority_acceptance.py
      - name: Focused authority regression suite
        run: python -m pytest -q tests/test_r14_6_authoritative_server.py tests/test_r14_5_postgresql_persistence.py tests/test_r14_4_auth_identity_sessions.py
      - name: Deterministic multi-client acceptance
        run: python scripts/r14_6_authority_acceptance.py --source-sha "${{ env.EVIDENCE_SOURCE_SHA }}" --output "${{ env.EVIDENCE_PATH }}"
      - name: Validate evidence schema and exact source
        run: >-
          python -c "import json,os; from pathlib import Path; from jsonschema import Draft202012Validator; e=json.loads(Path(os.environ['EVIDENCE_PATH']).read_text(encoding='utf-8')); s=json.loads(Path('schemas/r14/backend-authority-evidence.schema.json').read_text(encoding='utf-8')); Draft202012Validator.check_schema(s); Draft202012Validator(s).validate(e); assert e['source_sha']==os.environ['EVIDENCE_SOURCE_SHA']; assert e['secrets_exposed'] is False"
      - name: Upload redacted authority evidence
        uses: actions/upload-artifact@v4
        with:
          name: r14-6-authority-evidence-${{ matrix.os }}-${{ env.EVIDENCE_SOURCE_SHA }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: error
