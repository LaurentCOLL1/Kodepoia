name: R16.13 Normalization Helper

on:
  push:
    branches:
      - "r16/13-end-sync-helper"

permissions:
  contents: write

jobs:
  publish-normalization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "r16/13-end-sync-helper"
          path: helper
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout R16.13 normalization branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "r16/13-continuity-normalization"
          path: repo
          fetch-depth: 0

      - name: Generate and publish exact continuity-only normalization
        shell: bash
        run: |
          set -euo pipefail
          BASE=38cd16fb7f99eaa46a11d83994a0fe50ce576f80
          test "$(git -C repo rev-parse HEAD)" = "$BASE"
          cp helper/.github/r16_13_normalization_helper.py /tmp/r16_13_normalization_helper.py
          cd repo
          python /tmp/r16_13_normalization_helper.py
          git add -- docs/continuity/KODEPOIA_CONTINUITY.md
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=("docs/continuity/KODEPOIA_CONTINUITY.md")
          test "${staged[*]}" = "${expected[*]}"
          git diff --cached --check
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'docs(r16.13): normalize post-merge continuity' | git commit-tree "$tree" -p "$BASE")
          mapfile -t committed < <(git diff-tree --no-commit-id --name-only -r "$commit" | sort)
          test "${committed[*]}" = "${expected[*]}"
          echo "NORMALIZATION_HEAD=$commit"
          git push origin "$commit":refs/heads/r16/13-continuity-normalization
