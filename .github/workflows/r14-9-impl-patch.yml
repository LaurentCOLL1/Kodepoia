name: R14.9 Progression Invariant Patch

on:
  push:
    branches:
      - r14/09-progression-leaderboards
    paths:
      - .github/workflows/r14-9-impl-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/09-progression-leaderboards
          fetch-depth: 0
      - name: Apply progression invariant patch
        run: python .github/r14_9_impl_patch.py
      - name: Commit implementation and self-remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/r14_9_impl_patch.py .github/workflows/r14-9-impl-patch.yml
          git add src/kodepoia/backend/progression.py src/kodepoia/backend/__init__.py
          test "$(git diff --cached --name-only | sort)" = $'.github/r14_9_impl_patch.py\n.github/workflows/r14-9-impl-patch.yml\nsrc/kodepoia/backend/__init__.py\nsrc/kodepoia/backend/progression.py'
          git commit -m "fix(r14.9): isolate recurring leaderboard period state"
          git push origin HEAD:r14/09-progression-leaderboards
