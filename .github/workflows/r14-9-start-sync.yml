name: R14.9 START Sync

on:
  push:
    branches:
      - r14/09-progression-leaderboards
    paths:
      - .github/workflows/r14-9-start-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/09-progression-leaderboards
          fetch-depth: 0
      - name: Apply targeted R14.9 START patch
        run: python .github/r14_9_start_sync.py
      - name: Self-remove helpers and commit plan START state
        shell: bash
        run: |
          rm .github/r14_9_start_sync.py .github/workflows/r14-9-start-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/R14_PLAN.md .github/r14_9_start_sync.py .github/workflows/r14-9-start-sync.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/r14_9_start_sync.py' '.github/workflows/r14-9-start-sync.yml' 'docs/roadmap/R14_PLAN.md' | sort)"
          test "$changed" = "$expected"
          git commit -m "docs(r14.9): START-sync progression plan"
          git push origin HEAD:r14/09-progression-leaderboards
