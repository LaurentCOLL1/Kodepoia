name: R16.17 Implementation Helper

on:
  push:
    branches:
      - "r16/17-implementation-helper"

permissions:
  contents: write

jobs:
  build-determinism-fix:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: "6ec43b584b386d8e36bc07238c0595e7c9602937"
    steps:
      - name: Checkout helper source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false

      - name: Checkout exact superseded technical head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          lfs: false
          clean: true

      - name: Assert exact fix base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git reset --mixed HEAD

      - name: Apply bounded cross-platform determinism fix
        shell: python
        run: |
          from __future__ import annotations

          import json
          from pathlib import Path

          attrs = Path(".gitattributes")
          if attrs.exists():
              raise SystemExit("unexpected pre-existing .gitattributes on exact fix base")
          attrs.write_text(
              "* text=auto eol=lf\n"
              "*.bat text eol=crlf\n"
              "*.cmd text eol=crlf\n"
              "*.ps1 text eol=crlf\n",
              encoding="utf-8",
          )

          policy_path = Path("configs/r16_supply_chain_policy.json")
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          pins = policy["external_action_pins"]
          if "actions/download-artifact" in pins:
              raise SystemExit("download-artifact pin already exists unexpectedly")
          pins["actions/download-artifact"] = {
              "source_ref": "v5",
              "commit_sha": "634f93cb2916e3fdff6788551b99b062d0335ce0",
          }
          policy["pin_resolution_date"] = "2026-09-03"
          policy_path.write_text(
              json.dumps(policy, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          test_path = Path("tests/test_supply_chain_r16_9.py")
          test_text = test_path.read_text(encoding="utf-8")
          old = '    assert len(policy.pins) == 7\n    assert len(policy.digest_sha256) == 64\n'
          new = (
              '    assert len(policy.pins) == 8\n'
              '    assert policy.pins["actions/download-artifact"].commit_sha == (\n'
              '        "634f93cb2916e3fdff6788551b99b062d0335ce0"\n'
              '    )\n'
              '    assert len(policy.digest_sha256) == 64\n'
          )
          if test_text.count(old) != 1:
              raise SystemExit("supply-chain pin-count test anchor drifted")
          test_path.write_text(test_text.replace(old, new), encoding="utf-8")

          workflow_path = Path(".github/workflows/r16-17-release-readiness-acceptance.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          checkout_anchor = "    steps:\n      - name: Checkout exact evidence source\n"
          checkout_replacement = (
              "    steps:\n"
              "      - name: Canonicalize checkout line endings\n"
              "        shell: python\n"
              "        run: |\n"
              "          import subprocess\n"
              "          subprocess.run([\"git\", \"config\", \"--global\", \"core.autocrlf\", \"false\"], check=True)\n"
              "          subprocess.run([\"git\", \"config\", \"--global\", \"core.eol\", \"lf\"], check=True)\n"
              "\n"
              "      - name: Checkout exact evidence source\n"
          )
          if workflow.count(checkout_anchor) != 1:
              raise SystemExit("R16.17 checkout anchor drifted")
          workflow = workflow.replace(checkout_anchor, checkout_replacement)

          aggregate = '''

  cross-platform-package-determinism:
    needs: release-readiness
    runs-on: ubuntu-latest
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Download exact-head RC evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: r16-17-release-readiness-*-${{ env.EVIDENCE_SHA }}
          path: downloaded

      - name: Assert Linux and Windows package bytes are identical
        shell: python
        run: |
          import json
          from pathlib import Path

          manifests = sorted(Path("downloaded").glob("*/artifacts/r16_17_baseline_build.json"))
          if len(manifests) != 2:
              raise SystemExit(f"expected two cross-platform package manifests, got {manifests}")
          payloads = []
          platforms = set()
          for path in manifests:
              artifact_name = path.parents[1].name
              if "-Linux-" in artifact_name:
                  platforms.add("Linux")
              if "-Windows-" in artifact_name:
                  platforms.add("Windows")
              payload = json.loads(path.read_text(encoding="utf-8"))
              artifacts = payload.get("artifacts")
              if not isinstance(artifacts, dict) or len(artifacts) != 2:
                  raise SystemExit(f"invalid package hash manifest: {path}")
              payloads.append(dict(sorted(artifacts.items())))
          if platforms != {"Linux", "Windows"}:
              raise SystemExit(f"missing expected platform evidence: {platforms}")
          if payloads[0] != payloads[1]:
              raise SystemExit(
                  "cross-platform package bytes differ: "
                  + json.dumps(payloads, sort_keys=True)
              )
          print(json.dumps({"cross_platform_identical": True, "artifacts": payloads[0]}, sort_keys=True))
'''
          if "cross-platform-package-determinism:" in workflow:
              raise SystemExit("aggregate determinism job already exists unexpectedly")
          workflow_path.write_text(workflow.rstrip() + aggregate + "\n", encoding="utf-8")

      - name: Assert bounded fix diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short | wc -l)" -eq 4
          test -z "$(git diff --name-only -- docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md)"
          grep -Fq 'actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0' .github/workflows/r16-17-release-readiness-acceptance.yml
          grep -Fq '* text=auto eol=lf' .gitattributes

      - name: Install focused validation dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff focused regression sources
        run: >-
          python -m ruff check
          tests/test_supply_chain_r16_9.py
          tests/test_r16_17_release_readiness.py

      - name: Run focused R16.17 and supply-chain regressions
        run: >-
          python -m pytest -q
          tests/test_r16_17_release_readiness.py
          tests/test_supply_chain_r16_9.py

      - name: Build and verify exact fix commit object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .gitattributes \
            .github/workflows/r16-17-release-readiness-acceptance.yml \
            configs/r16_supply_chain_policy.json \
            tests/test_supply_chain_r16_9.py
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --check
          git commit -m "fix(r16.17): enforce cross-platform RC package determinism"
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 4
          git diff HEAD^ HEAD --check

      - name: Publish validated determinism-fix transport
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          git reset --hard "$TARGET_SHA"
          git checkout "$candidate" -- \
            .gitattributes \
            configs/r16_supply_chain_policy.json \
            tests/test_supply_chain_r16_9.py
          transport="docs/release/R16_17_DETERMINISM_WORKFLOW.transport.txt"
          git show "$candidate:.github/workflows/r16-17-release-readiness-acceptance.yml" > "$transport"
          git add \
            .gitattributes \
            "$transport" \
            configs/r16_supply_chain_policy.json \
            tests/test_supply_chain_r16_9.py
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git diff --cached --check
          git commit -m "chore(r16.17): transport validated determinism fix"
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          git push --force origin HEAD:refs/heads/r16/17-determinism-fix-transport
