name: R16.3 END Sync

on:
  push:
    branches:
      - r16/03-malicious-repository-workspace-quarantine
    paths:
      - .github/workflows/r16-3-end-sync.yml

permissions:
  contents: write

jobs:
  end-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R16.3 branch
        uses: actions/checkout@v4
        with:
          ref: r16/03-malicious-repository-workspace-quarantine
          fetch-depth: 0

      - name: Synchronize R16.3 END authority
        shell: python
        run: |
          from pathlib import Path
          import re

          plan_path = Path("docs/roadmap/R16_PLAN.md")
          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          plan = plan_path.read_text(encoding="utf-8")
          continuity = continuity_path.read_text(encoding="utf-8")

          checkpoint = (
              "**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + "
              "NORMALIZED. R16.1–R16.2 are COMPLETE + NORMALIZED. R16.3 is COMPLETE at mandatory END-sync; "
              "fresh exact-END R16.3/R0/Python/UI re-gates are required before protected merge. "
              "R16.4–R16.18 remain PLANNED."
          )
          plan, count = re.subn(r"^\*\*Execution checkpoint:\*\*.*$", checkpoint, plan, count=1, flags=re.M)
          if count != 1:
              raise SystemExit("R16 plan checkpoint replacement failed")

          old_row = "| R16.3 | Malicious repository/workspace quarantine and safe bootstrap | IN_PROGRESS | NONE |"
          new_row = "| R16.3 | Malicious repository/workspace quarantine and safe bootstrap | COMPLETE | NONE |"
          if plan.count(old_row) != 1:
              raise SystemExit("R16.3 subdivision row replacement failed")
          plan = plan.replace(old_row, new_row, 1)

          end_lines = [
              "",
              "## R16.3 END acceptance authority",
              "",
              "- Normalized branch point: `main` `71e9ab8e2b56457e856109aa509a863c110d3fa3`; clean START `362bed9d2fc8ce3a12cbefaa1726e903fdb1469a`; immutable technical source `66a6e9466f97cbc8c30e3f51544d6d5b0a553e69`.",
              "- Technical-source gate: R16.3 #3 / `33467123726` SUCCESS Ubuntu + Windows after exact checkout provenance, compile, Ruff, focused tests and acceptance on the same SHA.",
              "- Cross-platform acceptance JSON is byte-identical: SHA-256 `68df97e7a33cba9f9596eeed06d8aa6eb16b098dfd69d55a5372e07551fd4f16`; semantic `40877687b4cefd11f5be78d6f32d09c963b12db1fbb74eaef4d9b692129e1eda`; 8/8 critical cases PASS with `security_claim=true`, `critical_veto=false`, `manual_state=NONE`, synthetic-only fixtures, no live secrets and no destructive host actions.",
              "- Linux artifact `9785244200` archive SHA-256 `5edb5ca2ada84c081ece142afb3a761d3856dbeb033ccf696905ffb757bb29d1`; Windows artifact `9785248696` archive SHA-256 `8e884c69f50d98e17bb5f7948b641d2fb0b2096722c3fbbd8fa89cda3cc0754d`.",
              "- Security boundary delivered: new/materially changed workspaces default to quarantine; parse/index/read remains usable; write/execute requires exact-fingerprint approval; material change invalidates approval; critical symlink escape/resource-bound findings fail closed; repository hooks/scripts/tasks/instructions/archives/external references remain discoverable but non-authoritative; risk summaries exclude repository contents and external destinations.",
              "- Manual NONE. R16.3 is COMPLETE at END-sync. Fresh exact-END R16.3/R0/Python/UI re-gates are mandatory before protected merge; R16.4 remains PLANNED until the implementation merge and unique post-merge continuity-only normalization complete.",
              "",
          ]
          marker = "\n---\n\n# R16.4 — Secrets, privacy and exfiltration hardening"
          if plan.count(marker) != 1:
              raise SystemExit("R16.4 insertion marker missing or ambiguous")
          plan = plan.replace(marker, "\n".join(end_lines) + marker, 1)

          header_old = (
              "R16.3 IN_PROGRESS on `r16/03-malicious-repository-workspace-quarantine` from that exact normalized main; "
              "R16.4–R16.18 remain PLANNED."
          )
          header_new = (
              "R16.3 COMPLETE at mandatory END-sync on `r16/03-malicious-repository-workspace-quarantine`; "
              "fresh exact-END re-gates are required before protected merge, and R16.4–R16.18 remain PLANNED."
          )
          if continuity.count(header_old) != 1:
              raise SystemExit("continuity header replacement failed")
          continuity = continuity.replace(header_old, header_new, 1)

          continuity_entry = (
              "- R16.3 : **COMPLETE** — normalized R16.2 `main` `71e9ab8e2b56457e856109aa509a863c110d3fa3`; "
              "clean START `362bed9d2fc8ce3a12cbefaa1726e903fdb1469a`; immutable technical source "
              "`66a6e9466f97cbc8c30e3f51544d6d5b0a553e69`; technical R16.3 #3 / `33467123726` SUCCESS Ubuntu + Windows; "
              "cross-platform JSON `68df97e7a33cba9f9596eeed06d8aa6eb16b098dfd69d55a5372e07551fd4f16`; semantic "
              "`40877687b4cefd11f5be78d6f32d09c963b12db1fbb74eaef4d9b692129e1eda`; 8/8 PASS, `security_claim=true`, "
              "`critical_veto=false`, synthetic-only, no live secrets/destructive host actions, manual NONE. Linux artifact `9785244200` / "
              "`5edb5ca2ada84c081ece142afb3a761d3856dbeb033ccf696905ffb757bb29d1`; Windows artifact `9785248696` / "
              "`8e884c69f50d98e17bb5f7948b641d2fb0b2096722c3fbbd8fa89cda3cc0754d`. Exact-fingerprint approval is invalidated "
              "by material workspace change; critical escapes/bounds fail closed; repository-controlled executable metadata stays non-authoritative. "
              "Fresh exact-END R16.3/R0/Python/UI re-gates are mandatory before merge; R16.4 remains PLANNED until post-merge normalization."
          )
          continuity, count = re.subn(
              r"^- R16\.3 : \*\*IN_PROGRESS\*\* — .*?Manual \*\*NONE\*\*; host-destructive execution excluded from acceptance\.$",
              continuity_entry,
              continuity,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit("continuity R16.3 entry replacement failed")

          plan_path.write_text(plan, encoding="utf-8", newline="\n")
          continuity_path.write_text(continuity, encoding="utf-8", newline="\n")

      - name: Verify END sync scope
        shell: bash
        run: |
          git rm .github/workflows/r16-3-end-sync.yml
          git add docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/r16-3-end-sync.yml' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R16_PLAN.md' | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Commit clean END sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(r16.3): synchronize END acceptance"
          git push origin HEAD:r16/03-malicious-repository-workspace-quarantine
