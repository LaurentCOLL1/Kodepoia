name: R19.2 Production/Beta Update Repository Bootstrap Acceptance

on:
  push:
    branches:
      - r19/02-update-repository-bootstrap
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r19-2-update-repository-bootstrap-acceptance.yml
      - configs/update_repository_r19_2.json
      - docs/release/R19_2_UPDATE_REPOSITORY_BOOTSTRAP.md
      - scripts/r19_2_update_repository_acceptance.py
      - src/kodepoia/update/__init__.py
      - src/kodepoia/update/bootstrap.py
      - src/kodepoia/update/repository_bootstrap.py
      - src/kodepoia/update/trusted_root.production.manifest.json
      - tests/test_r19_2_update_repository_bootstrap.py
      - update-repository/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r19-2-update-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile R19.2 sources
        run: >-
          python -m compileall -q
          src/kodepoia/update/bootstrap.py
          src/kodepoia/update/repository_bootstrap.py
          scripts/r19_2_update_repository_acceptance.py
          tests/test_r19_2_update_repository_bootstrap.py

      - name: Collect Ruff R19.2 diagnostics
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path

          output = Path("artifacts/r19_2")
          output.mkdir(parents=True, exist_ok=True)
          command = [
              sys.executable,
              "-m",
              "ruff",
              "check",
              "--output-format",
              "json",
              "src/kodepoia/update/__init__.py",
              "src/kodepoia/update/bootstrap.py",
              "src/kodepoia/update/repository_bootstrap.py",
              "scripts/r19_2_update_repository_acceptance.py",
              "tests/test_r19_2_update_repository_bootstrap.py",
          ]
          result = subprocess.run(command, text=True, capture_output=True, check=False)
          (output / "ruff.json").write_text(result.stdout or "[]\n", encoding="utf-8")
          (output / "ruff-exit-code.txt").write_text(
              f"{result.returncode}\n", encoding="utf-8"
          )
          if result.stderr:
              (output / "ruff-stderr.txt").write_text(result.stderr, encoding="utf-8")
          if result.returncode not in {0, 1}:
              raise SystemExit(
                  f"Ruff execution failed unexpectedly with exit code {result.returncode}"
              )

      - name: Run focused R19.2 and trust-separation tests
        run: >-
          python -m pytest -q
          tests/test_r19_2_update_repository_bootstrap.py
          tests/test_r18_6_packaged_root.py
          tests/test_r18_6_update_trust.py

      - name: Emit exact-source R19.2 acceptance
        run: >-
          python scripts/r19_2_update_repository_acceptance.py
          --source-sha "${{ env.EVIDENCE_SHA }}"
          --output artifacts/r19_2/update-repository-acceptance.json

      - name: Assert repository-safe R19.2 boundary
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("artifacts/r19_2/update-repository-acceptance.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          if report["source_sha"] != expected:
              raise SystemExit("R19.2 acceptance source SHA mismatch")
          if report["cases_total"] != 10 or report["cases_passed"] != 10:
              raise SystemExit("R19.2 focused acceptance matrix is incomplete")
          if report["production_root_state"] != "pending-real-key-bootstrap":
              raise SystemExit("R19.2 production Root is not at the expected manual boundary")
          if report["synthetic_root_production_trust"]:
              raise SystemExit("R19.2 synthetic Root unexpectedly claims production trust")
          if report["private_keys_persisted"] or report["production_keys_used"]:
              raise SystemExit("R19.2 repository-safe phase crossed the private-key boundary")
          if report["r19_3_started"]:
              raise SystemExit("R19.3 was unexpectedly started")

      - name: Scan R19.2 repository-safe files for private key PEM markers
        shell: python
        run: |
          from pathlib import Path

          markers = (
              "-----BEGIN " + "PRIVATE KEY-----",
              "-----BEGIN " + "ENCRYPTED PRIVATE KEY-----",
              "-----BEGIN " + "OPENSSH PRIVATE KEY-----",
              "-----BEGIN " + "RSA PRIVATE KEY-----",
              "-----BEGIN " + "EC PRIVATE KEY-----",
          )
          paths = [
              Path("configs/update_repository_r19_2.json"),
              Path("docs/release/R19_2_UPDATE_REPOSITORY_BOOTSTRAP.md"),
              Path("scripts/r19_2_update_repository_acceptance.py"),
              Path("src/kodepoia/update/bootstrap.py"),
              Path("src/kodepoia/update/repository_bootstrap.py"),
              Path("src/kodepoia/update/trusted_root.production.manifest.json"),
              Path("tests/test_r19_2_update_repository_bootstrap.py"),
          ]
          paths.extend(
              path for path in Path("update-repository").rglob("*") if path.is_file()
          )
          findings = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if any(marker in text for marker in markers):
                  findings.append(path.as_posix())
          if findings:
              raise SystemExit(f"private key PEM marker found in repository-safe files: {findings}")

      - name: Build wheel for production-root boundary evidence
        run: python -m build --wheel --outdir artifacts/r19_2/wheel

      - name: Verify wheel contains pending manifest but no fake production Root
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("artifacts/r19_2/wheel").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          manifest = "kodepoia/update/trusted_root.production.manifest.json"
          root = "kodepoia/update/trusted_root.production.json"
          if manifest not in names:
              raise SystemExit("pending production Root manifest is missing from the wheel")
          if root in names:
              raise SystemExit("repository-safe phase unexpectedly packages a production Root")

      - name: Upload R19.2 contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r19-2-update-repository-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r19_2/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Ruff clean verdict
        if: always()
        shell: python
        run: |
          from pathlib import Path

          status = Path("artifacts/r19_2/ruff-exit-code.txt")
          if not status.is_file():
              raise SystemExit("Ruff diagnostic status is missing")
          code = int(status.read_text(encoding="utf-8").strip())
          if code != 0:
              raise SystemExit(f"Ruff reported diagnostics (exit code {code})")
