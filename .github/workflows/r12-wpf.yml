name: R12 WPF Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r12-wpf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wpf-windows:
    runs-on: windows-latest
    env:
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Kodepoia
        run: python -m pip install -e ".[dev]"
      - name: Set up accepted .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Compile and runtime-test WPF fixture
        run: python scripts/r12_5_wpf_acceptance.py --output .kodepoia/evidence/R12_5_WPF_ACCEPTANCE.json
      - name: Upload WPF evidence
        uses: actions/upload-artifact@v4
        with:
          name: r12-5-wpf-${{ github.event.pull_request.head.sha || github.sha }}
          path: .kodepoia/evidence/R12_5_WPF_ACCEPTANCE.json
          if-no-files-found: error
