name: R18.1 Release Identity Acceptance

on:
  push:
    branches:
      - r18/01-release-identity
  pull_request:
    paths:
      - .github/workflows/r18-1-release-identity-acceptance.yml
      - pyproject.toml
      - packaging/windows/Kodepoia.iss
      - schemas/release_identity.schema.json
      - scripts/build_windows_installer.ps1
      - scripts/r18_1_release_identity_acceptance.py
      - src/kodepoia/__init__.py
      - src/kodepoia/cli.py
      - src/kodepoia/release/**
      - src/kodepoia/release_identity.py
      - src/kodepoia/kodestudio/app_v11.py
      - tests/test_r18_release_identity.py
      - docs/roadmap/R18_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-identity:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True, encoding="utf-8"
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused acceptance dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile focused R18.1 sources
        run: >-
          python -m compileall -q
          src/kodepoia/release
          src/kodepoia/release_identity.py
          src/kodepoia/cli.py
          src/kodepoia/kodestudio/app_v11.py
          scripts/r18_1_release_identity_acceptance.py
          tests/test_r18_release_identity.py

      - name: Ruff R18.1-owned Python sources
        run: >-
          python -m ruff check
          src/kodepoia/release
          src/kodepoia/release_identity.py
          src/kodepoia/cli.py
          scripts/r18_1_release_identity_acceptance.py
          tests/test_r18_release_identity.py

      - name: Run focused R18.1 tests
        run: python -m pytest -q tests/test_r18_release_identity.py

      - name: Verify packaged release identity
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          import zipfile

          out = pathlib.Path("artifacts/r18_1_wheel")
          out.mkdir(parents=True, exist_ok=True)
          subprocess.run(
              [sys.executable, "-m", "build", "--wheel", "--outdir", str(out)],
              check=True,
          )
          wheels = sorted(out.glob("kodepoia-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, got {len(wheels)}")
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = "kodepoia/release/release_identity.json"
          if required not in names:
              raise SystemExit(f"packaged canonical release identity missing: {required}")

      - name: Emit exact-source R18.1 acceptance
        run: >-
          python scripts/r18_1_release_identity_acceptance.py
          --source-sha "${{ env.EVIDENCE_SHA }}"
          --output artifacts/r18_1_release_identity_acceptance.json

      - name: Upload exact-source acceptance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-1-release-identity-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r18_1_release_identity_acceptance.json
          if-no-files-found: error
          retention-days: 30

      - name: Apply clean R18.1 END sync
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git checkout 8fda649829acfd5abae2ea31e9c744f8554b8d06 -- .github/workflows/r18-1-release-identity-acceptance.yml
          python scripts/r18_1_end_sync_transport.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(r18.1): END-sync canonical release identity"
          git push origin HEAD:r18/01-release-identity
