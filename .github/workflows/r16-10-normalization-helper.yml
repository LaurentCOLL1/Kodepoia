name: R16.10 Normalization Helper

on:
  push:
    branches:
      - r16/10-normalization-helper

permissions:
  contents: write

concurrency:
  group: r16-10-normalization-helper
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          lfs: false

      - name: Build clean continuity-only normalization candidate
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/r16_10_normalize_helper.py /tmp/r16_10_normalize_helper.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach e6c11e986ad2e0ee5b1cdd50c0ae2061117ca974
          git switch -c r16/10-continuity-normalization
          python /tmp/r16_10_normalize_helper.py
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          test "$(git diff --cached --name-only)" = "docs/continuity/KODEPOIA_CONTINUITY.md"
          git commit -m "docs(r16.10): normalize post-merge continuity"
          git push --force origin HEAD:refs/heads/r16/10-continuity-normalization
