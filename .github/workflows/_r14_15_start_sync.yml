name: R14.15 START synchronization

on:
  push:
    branches:
      - r14/15-service-operations-resilience
    paths:
      - .github/workflows/_r14_15_start_sync.yml

permissions:
  contents: write

jobs:
  start-sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout R14.15 branch
        uses: actions/checkout@v4
        with:
          ref: r14/15-service-operations-resilience
          fetch-depth: 0

      - name: Apply guarded START sync
        shell: bash
        run: python .github/r14_15_start_sync.py

      - name: Verify START tree, self-clean and push
        shell: bash
        env:
          BASE_SHA: 0078a75d473524688e6ab76ccf41b509e2146dea
        run: |
          set -euo pipefail
          git rm .github/r14_15_start_sync.py .github/workflows/_r14_15_start_sync.yml
          git add docs/roadmap/R14_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          mapfile -t changed < <(git diff --cached "$BASE_SHA" --name-only | sort)
          expected=(docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R14_PLAN.md)
          printf 'R14.15 START staged tree delta from normalized main:\n'; printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          git diff --cached "$BASE_SHA" --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(r14.15): synchronize START authority'
          git push origin HEAD:r14/15-service-operations-resilience
