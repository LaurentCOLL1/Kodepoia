name: R15.6 Technical Patch Helper

on:
  push:
    branches: [r15/06-kodebench-v2]
    paths:
      - '.github/workflows/r15-6-tech-patch-helper.yml'

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: r15/06-kodebench-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Patch R15.6 technical surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          kodebench = Path('src/kodepoia/bench/kodebench.py')
          text = kodebench.read_text(encoding='utf-8')
          marker = 'from typing import Any\n'
          if text.count(marker) != 1:
              raise SystemExit(f'unexpected Any import marker count: {text.count(marker)}')
          kodebench.write_text(text.replace(marker, '', 1), encoding='utf-8', newline='\n')

          test = Path('tests/test_kodebench_v2.py')
          text = test.read_text(encoding='utf-8')
          old = 'import pytest\n\nfrom kodepoia.bench.baseline import BenchTask\n'
          new = 'import pytest\nfrom jsonschema import Draft202012Validator\n\nfrom kodepoia.bench.baseline import BenchTask\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected test import marker count')
          text = text.replace(old, new, 1)
          old = 'prompt = str(getattr(messages[0], "content"))'
          if text.count(old) != 1:
              raise SystemExit('unexpected FakeBrain prompt marker count')
          text = text.replace(old, 'prompt = str(messages[0].content)', 1)
          old = '    assert first.scorer.digest == first.scorer.digest\n'
          new = '''    same = _exact_task(\n        "a",\n        "prompt-a",\n        "A",\n        domain="python",\n        critical=True,\n    )\n    assert first.scorer.digest == same.scorer.digest\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected scorer assertion marker count')
          text = text.replace(old, new, 1)
          schema_anchor = '''    payload = json.loads(text)\n    assert payload["protection_manifest_digest"] == suite.validate_protected_holdouts(\n        registry\n    )\n'''
          schema_block = '''    payload = json.loads(text)\n    schema = json.loads(\n        Path("schemas/kodebench-v2-report.schema.json").read_text(encoding="utf-8")\n    )\n    Draft202012Validator.check_schema(schema)\n    Draft202012Validator(schema).validate(payload)\n    assert payload["protection_manifest_digest"] == suite.validate_protected_holdouts(\n        registry\n    )\n'''
          if text.count(schema_anchor) != 1:
              raise SystemExit('unexpected schema validation anchor count')
          text = text.replace(schema_anchor, schema_block, 1)
          test.write_text(text, encoding='utf-8', newline='\n')

          cli = Path('src/kodepoia/cli.py')
          text = cli.read_text(encoding='utf-8')
          old = '''from kodepoia.assets.asset_cli import register_asset_commands\nfrom kodepoia.bench.baseline import BaselineBench, BenchmarkRole\nfrom kodepoia.blender3d.blender_cli import register_blender_commands\nfrom kodepoia.backend.r14_cli import register_r14_backend_commands\n'''
          new = '''from kodepoia.assets.asset_cli import register_asset_commands\nfrom kodepoia.backend.r14_cli import register_r14_backend_commands\nfrom kodepoia.bench.baseline import BaselineBench, BenchmarkRole\nfrom kodepoia.bench.kodebench import compare_saved_reports\nfrom kodepoia.blender3d.blender_cli import register_blender_commands\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected benchmark CLI import block count')
          text = text.replace(old, new, 1)

          anchor = '\ndef _r3_accept(args: argparse.Namespace) -> int:\n'
          function = '''\ndef _kodebench_compare(args: argparse.Namespace) -> int:\n    comparison = compare_saved_reports(\n        Path(args.base),\n        Path(args.candidate),\n        base_model=args.base_model,\n        candidate_model=args.candidate_model,\n    )\n    output = Path(args.output)\n    output.parent.mkdir(parents=True, exist_ok=True)\n    output.write_text(\n        json.dumps(comparison, ensure_ascii=False, indent=2, sort_keys=True),\n        encoding="utf-8",\n    )\n    print(json.dumps({"output": str(output), **comparison}, ensure_ascii=False, indent=2))\n    return 0\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('unexpected R3 function marker count')
          text = text.replace(anchor, function + anchor.lstrip('\n'), 1)

          parser_anchor = '''    bench.set_defaults(func=_bench_models)\n\n    r3 = commands.add_parser("r3-accept")\n'''
          parser_block = '''    bench.set_defaults(func=_bench_models)\n\n    compare = commands.add_parser("kodebench-compare")\n    compare.add_argument("--base", required=True)\n    compare.add_argument("--candidate", required=True)\n    compare.add_argument("--base-model", required=True)\n    compare.add_argument("--candidate-model", required=True)\n    compare.add_argument(\n        "--output",\n        default=".kodepoia/benchmarks/kodebench-comparison.json",\n    )\n    compare.set_defaults(func=_kodebench_compare)\n\n    r3 = commands.add_parser("r3-accept")\n'''
          if text.count(parser_anchor) != 1:
              raise SystemExit('unexpected bench parser marker count')
          text = text.replace(parser_anchor, parser_block, 1)
          cli.write_text(text, encoding='utf-8', newline='\n')

          init = Path('src/kodepoia/bench/__init__.py')
          init.write_text('''"""KodeBench public benchmark utilities."""\n\nfrom kodepoia.bench.baseline import BaselineBench, BenchmarkRole, BenchResult, BenchTask\nfrom kodepoia.bench.kodebench import (\n    BenchmarkSuite,\n    BenchmarkTaskSpec,\n    KodeBenchError,\n    KodeBenchReport,\n    KodeBenchRunner,\n    ModelIdentity,\n    OutcomeCategory,\n    RepositoryScorerRegistry,\n    RunConfig,\n    ScorerKind,\n    ScorerSpec,\n    baseline_compat_suite,\n    compare_report_payloads,\n    compare_saved_reports,\n)\n\n__all__ = [\n    "BaselineBench",\n    "BenchmarkRole",\n    "BenchmarkSuite",\n    "BenchmarkTaskSpec",\n    "BenchResult",\n    "BenchTask",\n    "KodeBenchError",\n    "KodeBenchReport",\n    "KodeBenchRunner",\n    "ModelIdentity",\n    "OutcomeCategory",\n    "RepositoryScorerRegistry",\n    "RunConfig",\n    "ScorerKind",\n    "ScorerSpec",\n    "baseline_compat_suite",\n    "compare_report_payloads",\n    "compare_saved_reports",\n]\n''', encoding='utf-8', newline='\n')
          PY
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Autoformat touched import blocks only
        run: python -m ruff check --select I --fix src/kodepoia/bench/__init__.py src/kodepoia/cli.py
      - name: R3 compatibility plus R15.6 focused tests
        run: python -m pytest -q tests/test_bench.py tests/test_kodebench_v2.py
      - name: Ruff R15.6-owned surface
        run: >-
          python -m ruff check
          src/kodepoia/bench/kodebench.py
          tests/test_kodebench_v2.py
      - name: Verify touched import blocks
        run: python -m ruff check --select I src/kodepoia/bench/__init__.py src/kodepoia/cli.py
      - name: Compile KodeBench surface
        run: python -m compileall -q src/kodepoia/bench src/kodepoia/cli.py
      - name: Commit validated patch and remove helper
        shell: bash
        run: |
          git rm .github/workflows/r15-6-tech-patch-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kodepoia/bench/__init__.py src/kodepoia/bench/kodebench.py src/kodepoia/cli.py tests/test_kodebench_v2.py
          git commit -m "feat(r15.6): expose validated KodeBench v2 surface"
          git push origin HEAD:r15/06-kodebench-v2
