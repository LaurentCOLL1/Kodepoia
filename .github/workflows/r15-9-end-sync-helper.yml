name: R15.9 END Sync Helper

on:
  push:
    paths:
      - '.github/workflows/r15-9-end-sync-helper.yml'

permissions:
  contents: write

jobs:
  end_sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/09-qlora-sft
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded END synchronization
        run: python .github/r15_9_end_sync.py
      - name: Verify and publish clean END head
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only a964bff54886cafe640fb583610e81055fbe3907 -- docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md)"
          printf '%s\n' "$changed"
          test "$changed" = $'docs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R15_PLAN.md'
          git diff --check -- docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          rm .github/workflows/r15-9-end-sync-helper.yml .github/r15_9_end_sync.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r15-9-end-sync-helper.yml .github/r15_9_end_sync.py
          git diff --cached --check
          git commit -m 'docs(r15.9): synchronize final completion evidence'
          git push origin HEAD:r15/09-qlora-sft
