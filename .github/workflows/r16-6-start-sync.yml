name: R16.6 START Sync

on:
  push:
    branches:
      - r16/06-destructive-command-excessive-agency-hardening
    paths:
      - .github/workflows/r16-6-start-sync.yml

permissions:
  contents: write

jobs:
  start-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R16.6 branch
        uses: actions/checkout@v4
        with:
          ref: r16/06-destructive-command-excessive-agency-hardening
          fetch-depth: 0

      - name: Synchronize R16.6 START authority
        shell: python
        run: |
          from pathlib import Path
          import re

          plan_path = Path("docs/roadmap/R16_PLAN.md")
          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          plan = plan_path.read_text(encoding="utf-8")
          continuity = continuity_path.read_text(encoding="utf-8")

          checkpoint = (
              "**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + "
              "NORMALIZED. R16.1–R16.5 are COMPLETE + NORMALIZED. R16.6 is IN_PROGRESS on "
              "`r16/06-destructive-command-excessive-agency-hardening` from normalized `main` "
              "`727b0717dea86425eb566b53b3b1cc38c9937169`; R16.7–R16.18 remain PLANNED."
          )
          plan, count = re.subn(r"^\*\*Execution checkpoint:\*\*.*$", checkpoint, plan, count=1, flags=re.M)
          if count != 1:
              raise SystemExit("R16 checkpoint replacement failed")

          replacements = {
              "| R16.5 | Plugin/MCP/tool trust, authorization and supply-chain boundary | COMPLETE | NONE |":
                  "| R16.5 | Plugin/MCP/tool trust, authorization and supply-chain boundary | COMPLETE + NORMALIZED | NONE |",
              "| R16.6 | Destructive-command, excessive-agency and confused-deputy hardening | PLANNED | NONE |":
                  "| R16.6 | Destructive-command, excessive-agency and confused-deputy hardening | IN_PROGRESS | NONE |",
          }
          for old, new in replacements.items():
              if plan.count(old) != 1:
                  raise SystemExit(f"plan row missing/ambiguous: {old}")
              plan = plan.replace(old, new, 1)

          old_header = (
              "R16.1–R16.5 COMPLETE + NORMALIZED. R16.6–R16.18 remain PLANNED. "
              "R16.6 START-sync is authorized only from the normalized `main` produced by the unique R16.5 post-merge continuity-only normalization."
          )
          new_header = (
              "R16.1–R16.5 COMPLETE + NORMALIZED. R16.6 IN_PROGRESS on "
              "`r16/06-destructive-command-excessive-agency-hardening` from normalized `main` "
              "`727b0717dea86425eb566b53b3b1cc38c9937169`. R16.7–R16.18 remain PLANNED."
          )
          if continuity.count(old_header) != 1:
              raise SystemExit("continuity header replacement failed")
          continuity = continuity.replace(old_header, new_header, 1)

          marker = "- R16.5 : **COMPLETE + NORMALIZED**"
          pos = continuity.find(marker)
          if pos < 0:
              raise SystemExit("R16.5 continuity marker missing")
          line_end = continuity.find("\n", pos)
          if line_end < 0:
              raise SystemExit("R16.5 continuity line end missing")
          if "- R16.6 : **IN_PROGRESS**" in continuity:
              raise SystemExit("R16.6 continuity entry already exists")
          r16_6_line = (
              "\n- R16.6 : **IN_PROGRESS** — normalized R16.5 `main` "
              "`727b0717dea86425eb566b53b3b1cc38c9937169`; branch "
              "`r16/06-destructive-command-excessive-agency-hardening`; START-sync only, before functional implementation. "
              "Core acceptance is synthetic and disposable with manual NONE. Unknown/unbounded destructive impact fails closed; "
              "high-impact approvals must bind exact operation/target/scope/action digest; lower-trust sources cannot widen higher-trust capability; "
              "privileged process boundaries use typed command/argument contracts rather than model-authored shell policy; reversible SafeChange/backup/cancellation boundaries remain authoritative."
          )
          continuity = continuity[:line_end] + r16_6_line + continuity[line_end:]

          plan_path.write_text(plan, encoding="utf-8", newline="\n")
          continuity_path.write_text(continuity, encoding="utf-8", newline="\n")

      - name: Verify START sync scope
        shell: bash
        run: |
          git rm .github/workflows/r16-6-start-sync.yml
          git add docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/r16-6-start-sync.yml' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R16_PLAN.md' | sort)"
          test "$actual" = "$expected"

      - name: Commit clean START sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(r16.6): synchronize START authority"
          git push origin HEAD:r16/06-destructive-command-excessive-agency-hardening
