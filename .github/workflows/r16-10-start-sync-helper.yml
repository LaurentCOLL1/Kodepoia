# cleanup validated START sync state with bounded diff scope
name: R16.10 START Sync Helper

on:
  push:
    branches:
      - r16/10-representative-godot-2d-beta-project
    paths:
      - .github/workflows/r16-10-start-sync-helper.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R16.10 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: r16/10-representative-godot-2d-beta-project
          fetch-depth: 0
      - name: Validate synchronized START authority
        run: |
          grep -Fq 'R16.10 is IN_PROGRESS from normalized `main` `3957a30053da791facb2de7fbbbb0614d0fa03d6`' docs/roadmap/R16_PLAN.md
          grep -Fq '| R16.9 | Dependency/workflow/release supply-chain provenance hardening | COMPLETE + NORMALIZED | NONE |' docs/roadmap/R16_PLAN.md
          grep -Fq '| R16.10 | Representative real Godot 2D beta project | IN_PROGRESS | NONE |' docs/roadmap/R16_PLAN.md
          grep -Fq '## R16.10 START authority' docs/continuity/KODEPOIA_CONTINUITY.md
          grep -Fq '| R16.10 | IN_PROGRESS | NONE |' docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --check 3957a30053da791facb2de7fbbbb0614d0fa03d6 -- docs/roadmap/R16_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          python scripts/check_repo.py
      - name: Remove helpers and freeze clean START
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r16-10-start-sync-helper.yml .github/r16_10_start_sync.py
          git diff --cached --check
          expected=$'docs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R16_PLAN.md'
          actual="$(git diff --name-only 3957a30053da791facb2de7fbbbb0614d0fa03d6 -- docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R16_PLAN.md .github/r16_10_start_sync.py .github/workflows/r16-10-start-sync-helper.yml | sort)"
          test "$actual" = "$expected"
          git commit -m "docs(r16.10): freeze clean START authority"
          git push origin HEAD:r16/10-representative-godot-2d-beta-project
