name: R14 Planning Continuity Normalization Temp

on:
  push:
    branches:
      - "r14/00-planning-continuity-normalization"
    paths:
      - ".r14_00_planning_normalization_trigger"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout normalization branch
        uses: actions/checkout@v4
        with:
          ref: r14/00-planning-continuity-normalization
          fetch-depth: 0

      - name: Apply deterministic planning normalization
        run: python scripts/r14_00_planning_normalize_temp.py

      - name: Prepare continuity-only final tree
        shell: bash
        run: |
          git diff --check docs/continuity/KODEPOIA_CONTINUITY.md
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git rm -f scripts/r14_00_planning_normalize_temp.py .r14_00_planning_normalization_trigger .github/workflows/r14-00-planning-normalization-temp.yml
          git diff --cached --check
          test "$(git diff --cached --name-only 808e5215e45a3a90d3037efb1a3749f01b285b9c | sort)" = "docs/continuity/KODEPOIA_CONTINUITY.md"

      - name: Commit normalized planning continuity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R14 planning continuity-only normalization"
          git push origin HEAD:r14/00-planning-continuity-normalization
