name: R14.3 END Sync Temp

on:
  push:
    branches:
      - r14/03-local-backend-runtime

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R14.3 branch
        uses: actions/checkout@v4
        with:
          ref: r14/03-local-backend-runtime
          fetch-depth: 0
      - name: Apply deterministic END-sync
        run: python scripts/_r14_3_end_sync_temp.py
      - name: Guard END-sync cumulative scope
        run: |
          git diff --check -- docs/roadmap/R14_PLAN.md docs/roadmap/R14_3_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md
          mapfile -t changed < <(git diff --name-only 4de5036e7a37f949ec64ae68d9ee45e57ac99631...HEAD; git diff --name-only)
          printf '%s\n' "${changed[@]}" | sed '/^$/d' | sort -u > /tmp/changed.txt
          actual=$(grep -v -E '^(.github/workflows/r14-03-end-sync-temp.yml|scripts/_r14_3_end_sync_temp.py|.r14_3_end_trigger|docs/roadmap/R10_7_LOCAL_ACCEPTANCE.json)$' /tmp/changed.txt || true)
          expected=$(printf '%s\n' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R14_3_ACCEPTANCE.md' 'docs/roadmap/R14_PLAN.md')
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected cumulative END-sync paths:'
            cat /tmp/changed.txt
            exit 1
          fi
      - name: Commit final END-sync tree
        run: |
          rm -f scripts/_r14_3_end_sync_temp.py .github/workflows/r14-03-end-sync-temp.yml .r14_3_end_trigger
          git add docs/roadmap/R14_PLAN.md docs/roadmap/R14_3_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md
          git add -u -- scripts/_r14_3_end_sync_temp.py .github/workflows/r14-03-end-sync-temp.yml .r14_3_end_trigger
          git diff --cached --check
          staged=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' '.github/workflows/r14-03-end-sync-temp.yml' '.r14_3_end_trigger' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R14_3_ACCEPTANCE.md' 'docs/roadmap/R14_PLAN.md' 'scripts/_r14_3_end_sync_temp.py' | sort)
          if [ "$staged" != "$expected" ]; then
            echo 'Unexpected staged paths:'
            printf '%s\n' "$staged"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R14.3 END-sync acceptance plan and continuity'
          git push origin HEAD:r14/03-local-backend-runtime
