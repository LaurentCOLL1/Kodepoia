name: R15.15 UX hardening helper

on:
  push:
    branches:
      - r15/15-cli-kodestudio-ux

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/15-cli-kodestudio-ux
          fetch-depth: 0
      - name: Harden redaction and nonblocking UI tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ux = Path('src/kodepoia/tuning/r15_ux.py')
          text = ux.read_text(encoding='utf-8')
          old = '''    key_l = (key or "").lower()\n    if any(token in key_l for token in _SENSITIVE_KEYS):\n        return "<redacted>"\n'''
          new = '''    key_l = (key or "").lower().replace("-", "_")\n    sensitive = key_l in _SENSITIVE_KEYS or key_l.endswith(\n        ("_api_key", "_password", "_private_key", "_secret", "_token")\n    )\n    if sensitive:\n        return "<redacted>"\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '    if isinstance(value, str) and key_l in _PATH_KEYS:\n'
          new = '    if isinstance(value, str) and (key_l in _PATH_KEYS or key_l.endswith("_path")):\n'
          assert text.count(old) == 1
          ux.write_text(text.replace(old, new, 1), encoding='utf-8')

          panel = Path('src/kodepoia/kodestudio/r15_tuning_panel.py')
          text = panel.read_text(encoding='utf-8')
          old = '''            try:\n                self.finished.emit(ux.execute(self.request))\n            except Exception as exc:  # UI boundary converts failures into redacted status text.\n                self.failed.emit(str(exc))\n'''
          new = '''            try:\n                self.finished.emit(ux.execute(self.request))\n            except R15UXPolicyError as exc:\n                self.failed.emit(str(exc))\n            except Exception:\n                self.failed.emit("unexpected backend failure")\n'''
          assert text.count(old) == 1
          panel.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_r15_15_kodestudio.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace('import os\n', 'import os\nimport time\n', 1)
          old = '''    thread = window.findChild(QWidget, "r15TuningPage")._r15_thread\n    assert thread is not None\n    assert thread.wait(3000)\n    QApplication.processEvents()\n'''
          new = '''    page = window.findChild(QWidget, "r15TuningPage")\n    assert page._r15_thread is not None\n    deadline = time.monotonic() + 3.0\n    while page._r15_thread is not None and time.monotonic() < deadline:\n        QApplication.processEvents()\n        time.sleep(0.01)\n    assert page._r15_thread is None\n    QApplication.processEvents()\n'''
          assert text.count(old) == 2
          test.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile src/kodepoia/tuning/r15_ux.py src/kodepoia/kodestudio/r15_tuning_panel.py tests/test_r15_15_kodestudio.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/r15-15-hardening-helper.yml
          git add src/kodepoia/tuning/r15_ux.py src/kodepoia/kodestudio/r15_tuning_panel.py tests/test_r15_15_kodestudio.py
          git diff --cached --check
          git commit -m "fix(r15.15): harden redaction and UI worker boundary"
          git push origin HEAD:r15/15-cli-kodestudio-ux
