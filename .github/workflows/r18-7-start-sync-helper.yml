name: R18.7 START Sync Transport

on:
  push:
    branches:
      - r18/07-kodestudio-update-discovery-channel-ux
    paths:
      - .github/workflows/r18-7-start-sync-helper.yml

permissions:
  contents: write

jobs:
  start-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: r18/07-kodestudio-update-discovery-channel-ux
          fetch-depth: 0
      - name: Apply START-sync
        run: python scripts/r18_7_start_sync_temp.py
      - name: Verify and commit docs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R18_PLAN.md' | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R18_PLAN.md
          git commit -m "R18.7 - START sync update discovery UX"
          git push origin HEAD:r18/07-kodestudio-update-discovery-channel-ux
