name: R18.8 Ruff cleanup helper (ephemeral)

on:
  push:
    branches:
      - r18/08-verified-download-install-rollback
    paths:
      - .github/workflows/r18-8-ruff-fix-helper.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          delivery = Path("src/kodepoia/update/delivery.py")
          text = delivery.read_text(encoding="utf-8")
          text = text.replace(
              "import hashlib\nimport json\nimport os\nimport subprocess\nimport sys\n",
              "import hashlib\nimport json\nimport os\nimport subprocess\nimport sys\nfrom collections.abc import Callable, Iterable\nfrom contextlib import suppress\n",
              1,
          )
          text = text.replace(
              "from pathlib import Path\nfrom typing import Callable, Iterable, Protocol\n",
              "from pathlib import Path\nfrom typing import Protocol\n",
              1,
          )
          old = "    def _unlink(path: Path) -> None:\n        try:\n            path.unlink()\n        except FileNotFoundError:\n            pass\n"
          new = "    def _unlink(path: Path) -> None:\n        with suppress(FileNotFoundError):\n            path.unlink()\n"
          if text.count(old) != 1:
              raise SystemExit("unlink anchor missing")
          text = text.replace(old, new, 1)
          delivery.write_text(text, encoding="utf-8", newline="\n")

          loc = Path("src/kodepoia/kodestudio/v11_localization.py")
          ltext = loc.read_text(encoding="utf-8")
          old = '            "Lancer l’installateur vérifié pour {version} ? Windows peut demander un consentement administrateur."\n'
          new = (
              '            "Lancer l’installateur vérifié pour {version} ? Windows peut demander "\n'
              '            "un consentement administrateur."\n'
          )
          if ltext.count(old) != 1:
              raise SystemExit("localization anchor missing")
          loc.write_text(ltext.replace(old, new, 1), encoding="utf-8", newline="\n")

          test = Path("tests/test_r18_8_verified_delivery.py")
          ttext = test.read_text(encoding="utf-8")
          old = "def _downloader(tmp_path: Path, *, auth: bool = True, identity: bool = True, max_bytes: int = 1024) -> VerifiedUpdateDownloader:\n"
          new = (
              "def _downloader(\n"
              "    tmp_path: Path, *, auth: bool = True, identity: bool = True, max_bytes: int = 1024\n"
              ") -> VerifiedUpdateDownloader:\n"
          )
          if ttext.count(old) != 1:
              raise SystemExit("test signature anchor missing")
          test.write_text(ttext.replace(old, new, 1), encoding="utf-8", newline="\n")

          Path(".github/workflows/r18-8-ruff-fix-helper.yml").unlink()
          PY
          git config user.name "kodepoia-r18-8-ruff"
          git config user.email "actions@users.noreply.github.com"
          git add src/kodepoia/update/delivery.py src/kodepoia/kodestudio/v11_localization.py tests/test_r18_8_verified_delivery.py .github/workflows/r18-8-ruff-fix-helper.yml
          git diff --cached --check
          git commit -m "style(r18.8): satisfy focused Ruff gate"
          git push origin HEAD:r18/08-verified-download-install-rollback
