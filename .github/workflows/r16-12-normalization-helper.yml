name: R16.12 temporary continuity normalization helper

on:
  push:
    branches:
      - r16/12-normalization-helper
    paths:
      - .github/workflows/r16-12-normalization-helper.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: r16/12-normalization-helper
          fetch-depth: 0
      - name: Normalize R16.12 continuity only
        shell: python
        run: |
          from pathlib import Path

          continuity = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          text = continuity.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)
          if not lines or not lines[0].startswith("> Kodepoia, architecture v1.0 gelée."):
              raise SystemExit("continuity preamble not found")
          lines[0] = (
              "> Kodepoia, architecture v1.0 gelée. **R1–R15 COMPLETE + NORMALIZED. "
              "R16 planning ACCEPTED + NORMALIZED. R16.1–R16.12 COMPLETE + NORMALIZED. "
              "R16.13–R16.18 remain PLANNED.** R16.12 implementation/evidence PR #357 merged exact "
              "END head `4c92e0d1ee0bc737ebffbe7e097dded1bd4e8a90` as `main` "
              "`3e92f7aa4e8c348fdd89bb110692d6473f855f65`. This record is the unique post-merge "
              "continuity-only R16.12 normalization authority when its exact candidate passes fresh R0, "
              "Python Core and KodeStudio UI Smoke and merges. R16.13 START-sync is authorized only from "
              "the resulting normalized `main`. Manual NONE.\n"
          )

          hits = [i for i, line in enumerate(lines) if line.startswith("- R16.12 : **COMPLETE**")]
          if len(hits) != 1:
              raise SystemExit(f"expected exactly one R16.12 COMPLETE record, got {len(hits)}")
          record = (
              "- R16.12 : **COMPLETE + NORMALIZED** — normalized R16.11 `main` "
              "`270e022a03d7a596eedd27d8989b22278f18cbca`; clean START "
              "`e654a7eff3bdfa7c7b5ee1e36d47cfbf20e03c3d`; immutable technical source "
              "`7c51c1580ed2c2d9ee18758c6a8cb57dae1ce084`; technical R16.12 #11 / `33676531167` "
              "SUCCESS Windows with 28/28 focused + supply-chain regression tests and 10/10 acceptance, "
              "R16.9 #40 / `33676531542` SUCCESS Ubuntu + Windows, R0 #2354 / `33676531431` SUCCESS "
              "Ubuntu + Windows, Python Core #2326 / `33676531657` SUCCESS 5/5 and UI #2291 / "
              "`33676531178` SUCCESS. Final exact-END head `4c92e0d1ee0bc737ebffbe7e097dded1bd4e8a90` "
              "passed fresh R16.12 #13 / `33677997712` SUCCESS Windows, R16.9 #41 / `33677997868` "
              "SUCCESS Ubuntu + Windows, R0 #2355 / `33677997756` SUCCESS Ubuntu + Windows, Python Core "
              "#2327 / `33677997711` SUCCESS 5/5 and UI #2292 / `33677997768` SUCCESS; PR #357 merged "
              "with `expected_head_sha=4c92e0d1ee0bc737ebffbe7e097dded1bd4e8a90` as implementation/evidence "
              "`main` `3e92f7aa4e8c348fdd89bb110692d6473f855f65`. Exact-END representative acceptance "
              "remains 10/10 PASS with `security_claim=true`, `critical_veto=false`, `secret_free=true`, "
              "`manual_state=NONE`, no live credentials and no destructive host actions; canonical exercised "
              "path is WPF under .NET SDK `10.0.400` x64 with a 161-character project path containing spaces "
              "and governed unsigned publish of 5 files / 184779 bytes. Exact-END package manifest "
              "`2e8eb95a117be2497a9ae70f7ea7affc5fbba6aee0aaf54ed5f67322dce0221e`; package binding "
              "`16e7da1c46018565c9db4bad09669ceaeebe4346dcbf811ed5c80e3b2656a423`; diagnostic "
              "`0bbab8918c19558b4a67467aaabcdfa73f4994c496adfda60d696ad9f2ff50d3`; semantic "
              "`8b2be66de41e5bd4ea0716126fba466e68e9117b8052b8e5faa8a53b82c64df3`; evidence "
              "`21c082143cc143470b62e4f4e809fcae238a879ed89b8cc70286308b2ddd8ef8`; artifact "
              "`9865257768 / sha256:91286636eb53f15e01f52303fbece7e85c54c06e7a7d402b155336bb880a87d7`. "
              "This record is the unique post-merge continuity-only R16.12 normalization authority when its "
              "exact candidate passes fresh R0/Python/UI and merges; manual NONE. R16.13 START-sync is "
              "authorized only from the resulting normalized `main`.\n"
          )
          lines[hits[0]] = record
          continuity.write_text("".join(lines), encoding="utf-8", newline="\n")

          final = continuity.read_text(encoding="utf-8")
          required = (
              "R16.1–R16.12 COMPLETE + NORMALIZED",
              "- R16.12 : **COMPLETE + NORMALIZED**",
              "3e92f7aa4e8c348fdd89bb110692d6473f855f65",
              "R16.13 START-sync is authorized only from the resulting normalized `main`",
          )
          for item in required:
              if item not in final:
                  raise SystemExit(f"missing normalization invariant: {item}")
      - name: Enforce continuity-only diff
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "docs/continuity/KODEPOIA_CONTINUITY.md"
      - name: Commit normalization staging result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m "docs(r16.12): normalize post-merge continuity"
          git push origin HEAD:r16/12-normalization-helper
