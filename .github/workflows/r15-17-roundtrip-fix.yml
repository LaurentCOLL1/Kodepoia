name: R15.17 Temporary Canonical Round-trip Fix

on:
  push:
    branches:
      - 'r15/17-adversarial-integrated-acceptance'
    paths:
      - '.github/workflows/r15-17-roundtrip-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/17-adversarial-integrated-acceptance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make JSON object inventory validation order-independent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/kodepoia/tuning/integrated_acceptance.py')
          text = source.read_text(encoding='utf-8')
          old = '''    checks = evidence["checks"]\n    if not isinstance(checks, dict) or tuple(checks) != CHECK_NAMES:\n        raise ValueError("R15.17 integrated check inventory mismatch")'''
          new = '''    checks = evidence["checks"]\n    if (\n        not isinstance(checks, dict)\n        or len(checks) != len(CHECK_NAMES)\n        or set(checks) != set(CHECK_NAMES)\n    ):\n        raise ValueError("R15.17 integrated check inventory mismatch")'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one semantic inventory validator')
          source.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_r15_17_integrated_acceptance.py')
          text = tests.read_text(encoding='utf-8')
          import_old = '''    CHECK_NAMES,\n    canonical_sha256,'''
          import_new = '''    CHECK_NAMES,\n    canonical_json_bytes,\n    canonical_sha256,'''
          if text.count(import_old) != 1:
              raise SystemExit('expected focused import block')
          text = text.replace(import_old, import_new)
          assertion_old = '    assert tuple(evidence["checks"]) == CHECK_NAMES  # type: ignore[arg-type]'
          assertion_new = '''    assert len(evidence["checks"]) == len(CHECK_NAMES)  # type: ignore[arg-type]\n    assert set(evidence["checks"]) == set(CHECK_NAMES)  # type: ignore[arg-type]'''
          if text.count(assertion_old) != 1:
              raise SystemExit('expected focused inventory assertion')
          text = text.replace(assertion_old, assertion_new)
          anchor = '''def test_integrated_scenario_is_path_independent_and_deterministic(tmp_path: Path) -> None:\n    first = run_integrated_scenario(SOURCE_SHA, tmp_path / "first")\n    second = run_integrated_scenario(SOURCE_SHA, tmp_path / "second")\n    assert first == second\n\n\n'''
          addition = anchor + '''def test_canonical_json_round_trip_remains_authoritative(tmp_path: Path) -> None:\n    evidence = _run(tmp_path)\n    reloaded = json.loads(canonical_json_bytes(evidence))\n    validate_integrated_evidence(reloaded)\n    assert len(reloaded["checks"]) == len(CHECK_NAMES)\n    assert set(reloaded["checks"]) == set(CHECK_NAMES)\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('expected deterministic test anchor')
          tests.write_text(text.replace(anchor, addition), encoding='utf-8')

          workflow = Path('.github/workflows/r15-integrated-acceptance.yml')
          text = workflow.read_text(encoding='utf-8')
          old = "          assert tuple(evidence['checks']) == CHECK_NAMES"
          new = '''          assert len(evidence['checks']) == len(CHECK_NAMES)\n          assert set(evidence['checks']) == set(CHECK_NAMES)'''
          if text.count(old) != 2:
              raise SystemExit(f'expected two workflow inventory assertions, found {text.count(old)}')
          workflow.write_text(text.replace(old, new), encoding='utf-8')
          PY

          python -m pip install -e '.[dev]'
          python -m ruff check src/kodepoia/tuning/integrated_acceptance.py tests/test_r15_17_integrated_acceptance.py scripts/r15_17_integrated_acceptance.py
          python -m pytest -q tests/test_r15_17_integrated_acceptance.py
          python scripts/r15_17_integrated_acceptance.py --source-sha "$(git rev-parse HEAD)" --output /tmp/r15_17_roundtrip.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from kodepoia.tuning.integrated_acceptance import CHECK_NAMES, validate_integrated_evidence

          evidence = json.loads(Path('/tmp/r15_17_roundtrip.json').read_text(encoding='utf-8'))
          schema = json.loads(Path('schemas/r15/r15-integrated-evidence.schema.json').read_text(encoding='utf-8'))
          Draft202012Validator(schema).validate(evidence)
          validate_integrated_evidence(evidence)
          assert len(evidence['checks']) == len(CHECK_NAMES)
          assert set(evidence['checks']) == set(CHECK_NAMES)
          PY
          git diff --check

      - name: Commit only after canonical round-trip acceptance passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kodepoia/tuning/integrated_acceptance.py tests/test_r15_17_integrated_acceptance.py .github/workflows/r15-integrated-acceptance.yml
          git commit -m 'R15.17 make canonical evidence inventory order-independent'
          git push origin HEAD:r15/17-adversarial-integrated-acceptance
