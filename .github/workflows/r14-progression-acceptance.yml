name: R14 Progression Acceptance

on:
  pull_request:
    paths:
      - "src/kodepoia/backend/progression.py"
      - "src/kodepoia/backend/__init__.py"
      - "tests/test_r14_9_progression_leaderboards.py"
      - "scripts/r14_9_progression_acceptance.py"
      - "schemas/r14/backend-progression-*.schema.json"
      - ".github/workflows/r14-progression-acceptance.yml"
      - "docs/roadmap/R14_9_*.md"
  push:
    branches: ["r14/09-progression-leaderboards"]
    paths:
      - "src/kodepoia/backend/progression.py"
      - "src/kodepoia/backend/__init__.py"
      - "tests/test_r14_9_progression_leaderboards.py"
      - "scripts/r14_9_progression_acceptance.py"
      - "schemas/r14/backend-progression-*.schema.json"
      - ".github/workflows/r14-progression-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progression-acceptance:
    name: progression-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_PATH: docs/roadmap/R14_9_PROGRESSION_ACCEPTANCE-${{ matrix.os }}.json
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install acceptance dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests/test_r14_9_progression_leaderboards.py scripts/r14_9_progression_acceptance.py
      - name: Focused progression regression suite
        run: python -m pytest -q tests/test_r14_9_progression_leaderboards.py tests/test_r14_8_cloud_saves.py tests/test_r14_7_matchmaking_lobby_presence.py tests/test_r14_6_authoritative_server.py tests/test_r14_5_postgresql_persistence.py
      - name: Deterministic progression acceptance
        run: python scripts/r14_9_progression_acceptance.py --source-sha "${{ env.EVIDENCE_SOURCE_SHA }}" --output "${{ env.EVIDENCE_PATH }}"
      - name: Validate evidence schema and exact source
        run: >-
          python -c "import json,os; from pathlib import Path; from jsonschema import Draft202012Validator; e=json.loads(Path(os.environ['EVIDENCE_PATH']).read_text(encoding='utf-8')); s=json.loads(Path('schemas/r14/backend-progression-evidence.schema.json').read_text(encoding='utf-8')); Draft202012Validator.check_schema(s); Draft202012Validator(s).validate(e); assert e['source_sha']==os.environ['EVIDENCE_SOURCE_SHA']; assert e['secrets_exposed'] is False; assert e['provider_live_claim'] is False"
      - name: Upload redacted progression evidence
        uses: actions/upload-artifact@v4
        with:
          name: r14-9-progression-evidence-${{ matrix.os }}-${{ env.EVIDENCE_SOURCE_SHA }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: error
