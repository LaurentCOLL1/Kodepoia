name: R15.8 END Sync Diagnose
on:
  push:
    branches: [r15/08-training-runtime-capability]
    paths: ['.github/workflows/r15-8-end-sync-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/08-training-runtime-capability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Replay patch without writing repository
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path('.github/workflows/r15-8-end-sync-helper.yml').read_text(encoding='utf-8'))
          steps = data['jobs']['sync']['steps']
          patch = next(step['run'] for step in steps if step.get('name') == 'Patch bounded R15.8 END records')
          subprocess.run(['python', '-c', patch], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['python', 'scripts/check_repo.py'], check=True)
          print('--- modified files ---')
          subprocess.run(['git', 'diff', '--name-status'], check=True)
