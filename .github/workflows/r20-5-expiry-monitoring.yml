name: R20.5 Update Operations Health Monitor

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: r20-5-update-operations-health
  cancel-in-progress: true

jobs:
  monitor:
    name: r20-5-update-operations-health
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["SOURCE_SHA"].strip().lower()
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused runtime dependencies
        run: python -m pip install -e .

      - name: Fetch public R20.4 production refresh evidence
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/r20-4-scheduled-metadata-refresh.yml/runs?branch=main&per_page=30" \
            > "$RUNNER_TEMP/r20_4_runs.json"

      - name: Evaluate metadata lifetime and refresh health
        run: >-
          python scripts/r20_5_expiry_monitor.py
          --workflow-runs "${{ runner.temp }}/r20_4_runs.json"
          --source-sha "$SOURCE_SHA"
          --fail-on critical
