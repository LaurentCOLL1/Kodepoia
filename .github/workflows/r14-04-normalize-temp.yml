          staged="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$staged"
          expected="$(printf '%s\n' '.github/r14-04-normalize.trigger' '.github/workflows/r14-04-normalize-temp.yml' 'docs/continuity/KODEPOIA_CONTINUITY.md' | sort)"
          test "$staged" = "$expected"
          git commit -m "R14.4 post-merge continuity normalization"
          changed="$(git diff --name-only cae2a1ddcaa79390ff923336ee331eba81937e84..HEAD | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "docs/continuity/KODEPOIA_CONTINUITY.md"
          git push origin HEAD:r14/04-continuity-normalization
