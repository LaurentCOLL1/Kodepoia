name: R15.15 END synchronization helper

on:
  push:
    branches:
      - r15/15-cli-kodestudio-ux
    paths:
      - .github/workflows/r15-15-end-sync-helper.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/15-cli-kodestudio-ux
          fetch-depth: 0
      - name: Synchronize R15.15 END authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          technical = "7ede682ec2c21d89e42886a5774115278b0fbb2c"
          base = "ea724b4d1a84c9f6105d2419f85d6cdb6ecda30e"
          r15_run = "33335194725"
          r0_run = "33335194680"
          python_run = "33335194694"
          ui_run = "33335194748"

          plan_path = Path("docs/roadmap/R15_PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          lines = plan.splitlines()
          for index, line in enumerate(lines):
              if line.startswith("**Execution checkpoint:**"):
                  lines[index] = (
                      "**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. "
                      "R15.1–R15.14 are COMPLETE + NORMALIZED. R15.15 is COMPLETE on technical source `" + technical +
                      "` from normalized R15.14 `main` `" + base + "`; its END-sync candidate must receive fresh exact-head "
                      "R15.15 + R0 + full Python Core + KodeStudio UI Smoke evidence before PR #326 can merge, after which "
                      "the unique continuity-only normalization remains mandatory. R15.16–R15.17 remain PLANNED and unauthorized."
                  )
                  break
          else:
              raise SystemExit("R15_PLAN execution checkpoint not found")
          plan = "\n".join(lines) + "\n"
          old_row = "| R15.15 | CLI + KodeStudio Experience/Bench/Tune UX, dry-run/status/evidence workflows | IN_PROGRESS | NONE | R15.1–R15.14 |"
          new_row = "| R15.15 | CLI + KodeStudio Experience/Bench/Tune UX, dry-run/status/evidence workflows | COMPLETE | NONE | R15.1–R15.14 |"
          if old_row not in plan:
              raise SystemExit("R15_PLAN status row not found")
          plan = plan.replace(old_row, new_row, 1)
          old_status = (
              "**IN_PROGRESS — START-sync from normalized R15.14 `main` `" + base + "`.**\n\n"
              "- dedicated branch: `r15/15-cli-kodestudio-ux`;\n"
              "- manual state: `NONE`;\n"
              "- R15.15 implementation/acceptance only is authorized on this branch. R15.16 remains unauthorized until R15.15 merges and its unique post-merge normalization succeeds."
          )
          new_status = (
              "**COMPLETE — technical source accepted; END-sync exact-head re-gates pending.**\n\n"
              "- normalized R15.14 base: `" + base + "`;\n"
              "- dedicated branch: `r15/15-cli-kodestudio-ux`;\n"
              "- immutable technical source before documentary END-sync: `" + technical + "`;\n"
              "- technical exact-head R15.15 Acceptance #5 / `" + r15_run + "`: SUCCESS Ubuntu 24.04 + Windows 2025;\n"
              "- technical exact-head R0 Repository Guard #2212 / `" + r0_run + "`: SUCCESS Ubuntu + Windows;\n"
              "- technical exact-head Python Core #2187 / `" + python_run + "`: SUCCESS 5/5;\n"
              "- technical exact-head KodeStudio UI Smoke #2152 / `" + ui_run + "`: SUCCESS;\n"
              "- PR #326 carries the implementation/evidence source. This END synchronization changes documentary authority and therefore creates a new final PR head; that exact resulting head MUST receive fresh R15.15 + R0 + full Python Core + KodeStudio UI Smoke evidence before merge with `expected_head_sha`;\n"
              "- manual state: `NONE`;\n"
              "- exactly one continuity-only post-merge normalization with fresh R0/Python/UI remains mandatory before R15.16 START-sync is authorized."
          )
          if old_status not in plan:
              raise SystemExit("R15_PLAN R15.15 START status block not found")
          plan = plan.replace(old_status, new_status, 1)
          plan_path.write_text(plan, encoding="utf-8")

          acceptance_path = Path("docs/roadmap/R15_15_ACCEPTANCE.md")
          acceptance = acceptance_path.read_text(encoding="utf-8")
          old = "Status: IMPLEMENTED / exact-head acceptance pending."
          new = "Status: COMPLETE / technical source accepted; END-sync exact-head re-gates pending."
          if old not in acceptance:
              raise SystemExit("acceptance status not found")
          acceptance = acceptance.replace(old, new, 1)
          marker = "## Exact-head acceptance required before merge\n"
          evidence = (
              "## Accepted technical-source evidence\n\n"
              "Technical source `" + technical + "` passed all pre-END gates on the same SHA:\n\n"
              "- R15.15 CLI + KodeStudio UX Acceptance #5 / `" + r15_run + "`: SUCCESS Ubuntu 24.04 + Windows 2025;\n"
              "- R0 Repository Guard #2212 / `" + r0_run + "`: SUCCESS Ubuntu + Windows;\n"
              "- Python Core #2187 / `" + python_run + "`: SUCCESS 5/5;\n"
              "- KodeStudio UI Smoke #2152 / `" + ui_run + "`: SUCCESS.\n\n"
              "Because this END synchronization changes documentation, these technical-source runs are historical implementation evidence only. The resulting END-sync SHA must receive fresh copies of all four required gates before PR #326 may merge.\n\n"
          )
          if marker not in acceptance:
              raise SystemExit("acceptance exact-head marker not found")
          if "## Accepted technical-source evidence" not in acceptance:
              acceptance = acceptance.replace(marker, evidence + marker, 1)
          acceptance_path.write_text(acceptance, encoding="utf-8")

          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          continuity = continuity_path.read_text(encoding="utf-8")
          c_lines = continuity.splitlines()
          if not c_lines or not c_lines[0].startswith("> Kodepoia, architecture v1.0 gelée."):
              raise SystemExit("continuity authority header not found")
          c_lines[0] = (
              "> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. "
              "R15.1–R15.14 COMPLETE + NORMALIZED; R15.15 COMPLETE / END-SYNC RE-GATES PENDING; R15.16–R15.17 PLANNED.** "
              "R15.15 normalized base `" + base + "`; immutable technical source `" + technical + "` passed R15.15 #5 / `" +
              r15_run + "` Ubuntu + Windows, R0 #2212 / `" + r0_run + "` Ubuntu + Windows, Python Core #2187 / `" +
              python_run + "` 5/5 and KodeStudio UI Smoke #2152 / `" + ui_run + "`. PR #326 carries the implementation/evidence "
              "source; this END synchronization creates a new exact PR head that must receive fresh R15.15 + R0 + Python Core + "
              "KodeStudio UI Smoke before expected-head merge. Manual state R15.15: NONE. R15.16 remains unauthorized until the "
              "implementation merge and unique continuity-only post-merge normalization both complete."
          )
          continuity = "\n".join(c_lines) + "\n"
          if "| R15.15 | IN_PROGRESS | NONE |" not in continuity:
              raise SystemExit("continuity R15.15 table row not found")
          continuity = continuity.replace("| R15.15 | IN_PROGRESS | NONE |", "| R15.15 | COMPLETE | NONE |", 1)
          old_bullet = (
              "- R15.15 : **IN_PROGRESS** — clean START from normalized R15.14 `main` `" + base + "` on dedicated branch "
              "`r15/15-cli-kodestudio-ux`. Scope is limited to the frozen CLI + KodeStudio Experience/Bench/Tune UX, "
              "dry-run/status/evidence workflows. Manual state: NONE. R15.16 remains unauthorized until R15.15 implementation/evidence "
              "merge and its unique post-merge normalization."
          )
          new_bullet = (
              "- R15.15 : **COMPLETE / END-SYNC RE-GATES PENDING** — clean START / normalized R15.14 base `" + base +
              "`; immutable technical source `" + technical + "`; technical exact-head R15.15 #5 / `" + r15_run +
              "` SUCCESS Ubuntu + Windows, R0 #2212 / `" + r0_run + "` SUCCESS Ubuntu + Windows, Python Core #2187 / `" +
              python_run + "` SUCCESS 5/5 and KodeStudio UI Smoke #2152 / `" + ui_run + "` SUCCESS. The accepted surface provides "
              "typed Experience/Dataset/Bench/Gap/Training/Conversion/Ollama/Registry workflows, non-mutating dry-run defaults, explicit "
              "mutation confirmation, fail-closed absent backends, project-scoped SHA-256 evidence with recursive redaction, accessible "
              "FR/EN/pseudo KodeStudio controls and worker-thread execution for governed long operations. PR #326 carries the implementation. "
              "This documentary END-sync changes the PR head, so fresh exact-head R15.15 + R0 + full Python Core + KodeStudio UI Smoke "
              "are mandatory before merge with expected-head protection. Manual NONE. Exactly one continuity-only post-merge normalization "
              "must then merge before R15.16 START-sync is authorized."
          )
          if old_bullet not in continuity:
              raise SystemExit("continuity R15.15 status bullet not found")
          continuity = continuity.replace(old_bullet, new_bullet, 1)
          old_next = (
              "**R15.15 only: implement the frozen structured CLI and KodeStudio Experience/Bench/Tune UX on `r15/15-cli-kodestudio-ux`; "
              "prove help/argument validation, dry-run non-mutation, permission-gated mutation/cancel/rollback, redacted status/evidence and "
              "Windows UI smoke; then require exact-head R15.15 acceptance + R0 + full Python Core + KodeStudio UI Smoke before expected-head "
              "merge. R15.16 remains unauthorized. Manual state: NONE.**"
          )
          new_next = (
              "**R15.15 only: treat the END-sync result as the final PR candidate; require fresh exact-head R15.15 Acceptance + R0 Repository "
              "Guard + full Python Core + KodeStudio UI Smoke on that exact SHA, then merge PR #326 only with `expected_head_sha`. After merge, "
              "create exactly one continuity-only normalization, re-run fresh R0/Python/UI, and merge it. R15.16 remains unauthorized until "
              "that normalization merge completes. Manual state: NONE.**"
          )
          if old_next not in continuity:
              raise SystemExit("continuity next action not found")
          continuity = continuity.replace(old_next, new_next, 1)
          continuity_path.write_text(continuity, encoding="utf-8")
          PY

          rm .github/workflows/r15-15-end-sync-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/R15_PLAN.md docs/roadmap/R15_15_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r15-15-end-sync-helper.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --name-only | grep -Fx '.github/workflows/r15-15-end-sync-helper.yml'
          git diff --cached --name-only | grep -Fx 'docs/continuity/KODEPOIA_CONTINUITY.md'
          git diff --cached --name-only | grep -Fx 'docs/roadmap/R15_15_ACCEPTANCE.md'
          git diff --cached --name-only | grep -Fx 'docs/roadmap/R15_PLAN.md'
          git commit -m "docs(r15.15): synchronize END authority"
          git push origin HEAD:r15/15-cli-kodestudio-ux
