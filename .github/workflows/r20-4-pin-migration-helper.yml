name: R20.4 Action Pin Migration Helper

on:
  push:
    branches:
      - r20/04-scheduled-metadata-refresh

permissions:
  contents: write

concurrency:
  group: r20-4-action-pin-migration-helper
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact migration source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Migrate exact action pins repository-wide
        shell: python
        run: |
          import json
          from pathlib import Path

          replacements = {
              "11d5960a326750d5838078e36cf38b85af677262": "3d3c42e5aac5ba805825da76410c181273ba90b1",
              "a26af69be951a213d495a4c3e4e4022e16d87065": "5fda3b95a4ea91299a34e894583c3862153e4b97",
          }
          roots = (
              Path(".github/workflows"),
              Path("configs"),
              Path("scripts"),
              Path("tests"),
          )
          changed = []
          counts = {old: 0 for old in replacements}
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  original = text
                  for old, new in replacements.items():
                      occurrences = text.count(old)
                      if occurrences:
                          counts[old] += occurrences
                          text = text.replace(old, new)
                  if text != original:
                      path.write_text(text, encoding="utf-8")
                      changed.append(path.as_posix())

          for old, count in counts.items():
              if count == 0:
                  raise SystemExit(f"expected old action pin was not found: {old}")

          policy_path = Path("configs/r16_supply_chain_policy.json")
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          policy["pin_resolution_date"] = "2026-09-10"
          policy["pin_resolution_authority"] = (
              "verified GitHub immutable release refs; Node-24 migration in R20.4; "
              "legacy mutable source_ref labels retained only for non-authoritative inventory"
          )
          policy["node24_migration"] = {
              "phase": "R20.4",
              "actions/checkout": {
                  "release": "v7.0.1",
                  "commit_sha": replacements["11d5960a326750d5838078e36cf38b85af677262"],
              },
              "actions/setup-python": {
                  "release": "v7.0.0",
                  "commit_sha": replacements["a26af69be951a213d495a4c3e4e4022e16d87065"],
              },
              "immutable_sha_pinning_preserved": True,
          }
          policy_path.write_text(json.dumps(policy, indent=2) + "\n", encoding="utf-8")

          print(json.dumps({"changed_files": changed, "replacement_counts": counts}, indent=2))

      - name: Remove one-shot helper from resulting tree
        shell: bash
        run: git rm .github/workflows/r20-4-pin-migration-helper.yml

      - name: Commit and push migration
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows configs/r16_supply_chain_policy.json scripts tests
          if git diff --cached --quiet; then
            echo "No migration changes produced" >&2
            exit 1
          fi
          git commit -m "R20.4 — migrate GitHub Actions pins to Node 24"
          git push origin HEAD:r20/04-scheduled-metadata-refresh
