name: R18.7 Update Discovery Channel UX Acceptance

on:
  push:
    branches:
      - r18/07-kodestudio-update-discovery-channel-ux
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r18-7-update-discovery-acceptance.yml
      - src/kodepoia/update/**
      - src/kodepoia/kodestudio/app_v11.py
      - src/kodepoia/kodestudio/update_settings.py
      - src/kodepoia/kodestudio/v11_localization.py
      - tests/test_r18_7_update_discovery.py
      - tests/test_r18_7_kodestudio_updates.py
      - docs/roadmap/R18_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r18-7-update-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-discovery-contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev,ui]"

      - name: Compile R18.7 sources
        run: >-
          python -m compileall -q
          src/kodepoia/update/discovery.py
          src/kodepoia/kodestudio/update_settings.py
          src/kodepoia/kodestudio/v11_localization.py
          src/kodepoia/kodestudio/app_v11.py
          tests/test_r18_7_update_discovery.py
          tests/test_r18_7_kodestudio_updates.py

      - name: Collect Ruff R18.7 diagnostics
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path

          output = Path("artifacts/r18_7")
          output.mkdir(parents=True, exist_ok=True)
          command = [
              sys.executable,
              "-m",
              "ruff",
              "check",
              "--output-format",
              "json",
              "src/kodepoia/update/discovery.py",
              "src/kodepoia/kodestudio/update_settings.py",
              "src/kodepoia/kodestudio/v11_localization.py",
              "src/kodepoia/kodestudio/app_v11.py",
              "tests/test_r18_7_update_discovery.py",
              "tests/test_r18_7_kodestudio_updates.py",
          ]
          result = subprocess.run(command, text=True, capture_output=True, check=False)
          (output / "ruff.json").write_text(result.stdout or "[]\n", encoding="utf-8")
          (output / "ruff-exit-code.txt").write_text(
              f"{result.returncode}\n", encoding="utf-8"
          )
          if result.stderr:
              (output / "ruff-stderr.txt").write_text(result.stderr, encoding="utf-8")
          if result.returncode not in {0, 1}:
              raise SystemExit(
                  f"Ruff execution failed unexpectedly with exit code {result.returncode}"
              )

      - name: Run focused R18.7 tests
        run: >-
          python -m pytest -q
          tests/test_r18_7_update_discovery.py
          tests/test_r18_7_kodestudio_updates.py

      - name: Emit exact-source R18.7 evidence
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          output = Path("artifacts/r18_7")
          output.mkdir(parents=True, exist_ok=True)
          payload = {
              "schema_version": 1,
              "subdivision": "R18.7",
              "source_sha": os.environ["EVIDENCE_SHA"].strip().lower(),
              "discovery_scope": "tuf-metadata-only",
              "channels": ["stable", "beta", "nightly"],
              "conservative_default": "stable",
              "periodic_default_hours": 24,
              "periodic_bounds_hours": [6, 168],
              "startup_network_dependency": False,
              "target_download_allowed": False,
              "automatic_installer_launch": False,
              "signing_provenance_claims": "tuf-metadata-reported-not-authoritatively-verified",
              "manual_intervention": "NONE",
          }
          (output / "acceptance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

      - name: Upload R18.7 contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-7-update-discovery-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r18_7/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Ruff clean verdict
        if: always()
        shell: python
        run: |
          from pathlib import Path

          status = Path("artifacts/r18_7/ruff-exit-code.txt")
          if not status.is_file():
              raise SystemExit("Ruff diagnostic status is missing")
          code = int(status.read_text(encoding="utf-8").strip())
          if code != 0:
              raise SystemExit(f"Ruff reported diagnostics (exit code {code})")
