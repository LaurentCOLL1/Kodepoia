name: R18.6 Continuity Normalization Transport

on:
  push:
    branches:
      - r18/06-continuity-normalization
    paths:
      - .github/workflows/r18-6-normalization-helper.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: r18/06-continuity-normalization
          fetch-depth: 0
      - name: Apply continuity edit
        run: python scripts/r18_6_normalize_continuity_temp.py
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only -- docs/continuity/KODEPOIA_CONTINUITY.md)" = "docs/continuity/KODEPOIA_CONTINUITY.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git commit -m "R18.6 - Normalize post-merge continuity"
          git push origin HEAD:r18/06-continuity-normalization
