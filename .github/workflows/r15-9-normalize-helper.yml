name: R15.9 Continuity Normalization Helper

on:
  push:
    paths:
      - '.github/workflows/r15-9-normalize-helper.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/09-post-merge-normalization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply continuity-only normalization
        run: python .github/r15_9_normalize.py
      - name: Verify and publish normalization head
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 265c92fe0c9827be55dfde9b439dd29d309eecbc -- docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R15_PLAN.md)"
          printf '%s\n' "$changed"
          test "$changed" = 'docs/continuity/KODEPOIA_CONTINUITY.md'
          git diff --check -- docs/continuity/KODEPOIA_CONTINUITY.md
          rm .github/workflows/r15-9-normalize-helper.yml .github/r15_9_normalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r15-9-normalize-helper.yml .github/r15_9_normalize.py
          git diff --cached --check
          git commit -m 'docs(r15.9): normalize post-merge continuity'
          git push origin HEAD:r15/09-post-merge-normalization
