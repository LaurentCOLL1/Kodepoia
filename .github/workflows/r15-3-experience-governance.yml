name: R15.3 Experience Governance Acceptance

on:
  push:
    branches:
      - r15/03-sanitization-governance
  pull_request:
    paths:
      - 'src/kodepoia/experience/**'
      - 'tests/test_experience_*.py'
      - 'docs/roadmap/R15_3_*.md'
      - 'docs/roadmap/R15_PLAN.md'
      - 'docs/continuity/KODEPOIA_CONTINUITY.md'
      - '.github/workflows/r15-3-experience-governance.yml'

permissions:
  contents: read

jobs:
  governance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: R15 experience regression + R15.3 governance tests
        run: python -m pytest -q tests/test_experience_contracts.py tests/test_experience_collector.py tests/test_experience_governance.py
      - name: Ruff experience governance surface
        run: python -m ruff check src/kodepoia/experience tests/test_experience_contracts.py tests/test_experience_collector.py tests/test_experience_governance.py
      - name: Compile experience package
        run: python -m compileall -q src/kodepoia/experience
