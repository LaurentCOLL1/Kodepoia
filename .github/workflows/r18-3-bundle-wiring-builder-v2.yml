name: Temporary R18.3 Bundle Ruff Fix Builder

on:
  push:
    branches:
      - scratch/r18-3-bundle-wiring-builder-v2

permissions:
  contents: write

jobs:
  fix-bundle-lint:
    runs-on: ubuntu-latest
    env:
      KODEPOIA_BASE_SHA: eb697b6faedef84563ae373558134b80f670a4b9
      KODEPOIA_TARGET_BRANCH: r18/03-sbom-provenance-attestations
    steps:
      - name: Checkout scratch transport
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout exact R18.3 head
        shell: bash
        run: |
          git checkout --detach "$KODEPOIA_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$KODEPOIA_BASE_SHA"
          git checkout -B "$KODEPOIA_TARGET_BRANCH"

      - name: Wrap sole Ruff E501 line
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/kodepoia/release/bundle.py")
          text = path.read_text(encoding="utf-8")
          old = '            raise BundleVerificationError("release bundle must contain exactly one SBOM and provenance record")\n'
          new = (
              '            raise BundleVerificationError(\n'
              '                "release bundle must contain exactly one SBOM and provenance record"\n'
              '            )\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one Ruff target, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

      - name: Verify staged scope and push exact child commit
        shell: bash
        run: |
          git diff --check -- src/kodepoia/release/bundle.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kodepoia/release/bundle.py
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "src/kodepoia/release/bundle.py"
          git commit -m "fix: wrap R18.3 bundle verification message"
          test "$(git rev-parse HEAD^)" = "$KODEPOIA_BASE_SHA"
          git push origin "HEAD:refs/heads/$KODEPOIA_TARGET_BRANCH"
