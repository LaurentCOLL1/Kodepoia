name: R14.16 START sync staging

on:
  push:
    branches:
      - r14/16-start-sync-stage
    paths:
      - .github/workflows/_r14_16_start_sync_stage.yml

permissions:
  contents: write

jobs:
  start-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard staged START authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "r14/16-start-sync-stage"
          test "$(git rev-parse HEAD^)" = "f4ef2f64bb372e012b277d12734c54b1e27a93c6"

      - name: Correct stale START wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          text = p.read_text(encoding="utf-8")
          old = "The next authorized action is R14.16 START-sync from that exact normalized main."
          new = "R14.16 START authority is now established on `r14/16-cli-kodestudio-liveops-ux` from effective current-main branch point `8a7eb312d3fa0d642d6b2b77ef35c2b2d3e7de36`; implementation is the next authorized action."
          if text.count(old) != 1:
              raise SystemExit(f"stale top marker count={text.count(old)}")
          text = text.replace(old, new)
          p.write_text(text, encoding="utf-8", newline="\n")
          PY
          git diff --check -- docs/continuity/KODEPOIA_CONTINUITY.md
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          test "$(git diff --cached --name-only)" = "docs/continuity/KODEPOIA_CONTINUITY.md"

      - name: Commit corrected continuity blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(r14.16): finalize START continuity wording"
          git push origin HEAD:r14/16-start-sync-stage
