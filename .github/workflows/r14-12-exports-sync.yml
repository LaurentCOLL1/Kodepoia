name: R14.12 Backend Export Sync

on:
  push:
    branches:
      - r14/12-content-delivery
    paths:
      - .github/workflows/r14-12-exports-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/12-content-delivery
          fetch-depth: 0
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply anchored public export sync
        run: python .github/r14_12_exports_sync.py
      - name: Compile and validate public exports
        run: |
          python -m compileall -q src/kodepoia/backend
          python -m pytest -q tests/test_r14_12_backend_exports.py
      - name: Commit export and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/r14_12_exports_sync.py .github/workflows/r14-12-exports-sync.yml
          git add src/kodepoia/backend/__init__.py
          test "$(git diff --cached --name-only | sort)" = $'.github/r14_12_exports_sync.py\n.github/workflows/r14-12-exports-sync.yml\nsrc/kodepoia/backend/__init__.py'
          git commit -m "feat(r14.12): export content delivery contracts"
          git push origin HEAD:r14/12-content-delivery
