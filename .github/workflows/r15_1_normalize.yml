name: R15.1 continuity normalization helper

on:
  push:
    branches:
      - r15/01-normalization

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/01-normalization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install R0 dependencies
        run: python -m pip install -r scripts/requirements-r0.txt
      - name: Normalize R15.1 continuity only
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          lines = path.read_text(encoding="utf-8").splitlines()

          lines[0] = (
              "> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. "
              "R15 planning ACCEPTED + NORMALIZED. R15.1 COMPLETE + NORMALIZED; "
              "implementation merge `f0860c1e0d1a27ec5317a10dabc1f28b409703c2`; "
              "R15.2–R15.17 PLANNED.** R14.17 immutable technical source "
              "`11fb0e1a28fd5cbb607e2b302a36314f151ee170`; final END-head "
              "`4f4ab856c233e3a0fd4298e1e26d8ea389c7e750`; canonical integrated digest "
              "`06dbdc830b20fd4b2966b11cbacfd4b010f93101b071d827766c8b9cbfd45189`; "
              "fresh exact-END gates R0 #2042 / `33267376108`, Python #2017 / `33267376130`, "
              "UI #1982 / `33267376112`, Integrated #15 / `33267376114` all SUCCESS; "
              "PR #290 required R0 #2043 / `33267483582` SUCCESS Ubuntu + Windows and merged "
              "exact head as `3327913047625ca26a70b5c96beb3f1608ff7720`. Manual state CONDITIONAL / "
              "NOT TRIGGERED; no provider-live, production-publish, Internet-scale or multi-region claim."
          )

          r151 = next(i for i, line in enumerate(lines) if line.startswith("- R15.1 : **COMPLETE — IMPLEMENTATION MERGE PENDING**"))
          lines[r151] = (
              "- R15.1 : **COMPLETE + NORMALIZED** — clean START "
              "`a474d0c85d27ca7113a8044b2c29a5e664ebd352`; immutable technical source "
              "`2da5e5d5aa712462c898270c41c5cafb42e6aeaa`; final END-head "
              "`ec335e5507de84cd447cbd0354416a36d56d7f17`; exact-END R15.1 #13 / "
              "`33271720105` SUCCESS Ubuntu + Windows, R0 #2064 / `33271720122` SUCCESS Ubuntu + Windows, "
              "Python #2039 / `33271720066` SUCCESS 5/5, UI #2004 / `33271720076` SUCCESS; "
              "PR #295 required R0 #2065 / `33272128985` SUCCESS and merged exact head as "
              "`f0860c1e0d1a27ec5317a10dabc1f28b409703c2`; manual NONE. Non-laundering remains normative: "
              "sanitizer/redaction PASS never overrides denied/unknown/review source, consent, provenance, "
              "license or privacy authorization. This record is the unique post-merge continuity-only R15.1 "
              "normalization authority; R15.2 START-sync is authorized only after this normalization branch "
              "passes fresh R0/Python/UI and merges to `main`."
          )

          next_action = next(i for i, line in enumerate(lines) if line.startswith("**R15.1 implementation merge + its single post-merge continuity-only normalization"))
          lines[next_action] = (
              "**Merge this single R15.1 post-merge continuity-only normalization after fresh exact-head "
              "R0 Repository Guard, full Python Core and KodeStudio UI Smoke. Only the normalized `main` "
              "produced by that merge authorizes the R15.2 START-sync; do not implement R15.2 before it.**"
          )

          path.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          subprocess.run(["git", "diff", "--check"], check=True)
          subprocess.run(["python", "scripts/check_repo.py"], check=True)
      - name: Commit normalized continuity and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15_1_normalize.yml
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git commit -m "docs(r15.1): normalize post-merge continuity"
          git push origin HEAD:r15/01-normalization
