name: R14.13 START Synchronization

on:
  push:
    branches:
      - r14/13-events-telemetry-pipeline
    paths:
      - .github/workflows/r14-13-start-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/13-events-telemetry-pipeline
          fetch-depth: 0
      - name: Apply anchored R14.13 START synchronization
        run: python .github/r14_13_start_sync.py
      - name: Commit clean START synchronization and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/r14_13_start_sync.py .github/workflows/r14-13-start-sync.yml
          git add docs/roadmap/R14_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          test "$(git diff --cached --name-only | sort)" = $'.github/r14_13_start_sync.py\n.github/workflows/r14-13-start-sync.yml\ndocs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R14_PLAN.md'
          git commit -m "docs(r14.13): synchronize START authority"
          git push origin HEAD:r14/13-events-telemetry-pipeline
