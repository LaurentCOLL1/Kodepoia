name: R14.14 END-sync staging

on:
  push:
    branches:
      - r14/14-end-sync-staging
    paths:
      - .github/workflows/_r14_14_end_sync_staging.yml

permissions:
  contents: write

jobs:
  stage-end-sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: r14/14-end-sync-staging
          fetch-depth: 0

      - name: Apply guarded documentation patch
        shell: bash
        run: python .github/r14_14_end_sync_staging.py

      - name: Verify exact staged tree, self-clean and push
        shell: bash
        env:
          SOURCE_SHA: bd7d0130b5241047e5583bd31e0a183be1a1e6f1
        run: |
          set -euo pipefail
          git rm .github/r14_14_end_sync_staging.py .github/workflows/_r14_14_end_sync_staging.yml
          git add docs/roadmap/R14_PLAN.md docs/roadmap/R14_14_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md
          mapfile -t changed < <(git diff --cached "$SOURCE_SHA" --name-only | sort)
          expected=(docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R14_14_ACCEPTANCE.md docs/roadmap/R14_PLAN.md)
          printf 'Staged tree delta from source:\n'; printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          git diff --cached "$SOURCE_SHA" --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(r14.14): stage END synchronization tree'
          git push origin HEAD:r14/14-end-sync-staging
