name: R12 WinUI3 Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r12-winui3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  winui3-windows:
    runs-on: windows-latest
    env:
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Kodepoia
        run: python -m pip install -e ".[dev]"
      - name: Set up accepted .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Provision documented WinUI dotnet-new templates
        run: dotnet new install Microsoft.WindowsAppSDK.WinUI.CSharp.Templates::0.0.6-alpha
      - name: Build and runtime-probe WinUI fixture
        run: python scripts/r12_6_winui_acceptance.py --output .kodepoia/evidence/R12_6_WINUI_ACCEPTANCE.json
      - name: Upload WinUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-6-winui3-${{ github.event.pull_request.head.sha || github.sha }}
          path: .kodepoia/evidence/R12_6_WINUI_ACCEPTANCE.json
          if-no-files-found: error
