name: R15.2 continuity normalization helper
on:
  push:
    branches: [r15/02-normalization]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/02-normalization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize continuity only
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          text = p.read_text(encoding='utf-8')
          old_top = "> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1 COMPLETE + NORMALIZED; R15.2 COMPLETE — implementation merge pending; R15.3–R15.17 PLANNED.** R15.2 immutable technical source `48b519c09fa50f5407cc4a55a0b76baf6f8e8ffd` from clean START `135fd085002bf8074d87308beca35ab33c35ed47`; exact technical R15.2 #4 / `33272926744`, R0 #2069 / `33272926687`, Python #2044 / `33272926696`, UI #2009 / `33272926737` all SUCCESS; manual NONE. Fresh exact END-head re-gates remain mandatory before merge."
          new_top = "> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1–R15.2 COMPLETE + NORMALIZED; R15.3–R15.17 PLANNED.** R15.2 immutable technical source `48b519c09fa50f5407cc4a55a0b76baf6f8e8ffd`; final END-head `afbc8e9c41d25727dcdc786245281e605e73cf97`; exact-END R15.2 #11 / `33280685599`, R0 #2076 / `33280685519`, Python #2051 / `33280685583`, UI #2016 / `33280685572` SUCCESS; final PR #298 required R0 #2077 / `33280858482` SUCCESS and merged exact head as `cf7f53fa9d491019fb9de941c3d703eb34a8f73d`; manual NONE. This record is the unique post-merge continuity-only R15.2 normalization authority; only its merged normalized `main` authorizes R15.3 START-sync."
          assert text.count(old_top) == 1
          text = text.replace(old_top, new_top, 1)
          old = next(line for line in text.splitlines() if line.startswith('- R15.2 : **COMPLETE — IMPLEMENTATION MERGE PENDING**'))
          new = "- R15.2 : **COMPLETE + NORMALIZED** — clean START `135fd085002bf8074d87308beca35ab33c35ed47`; immutable technical source `48b519c09fa50f5407cc4a55a0b76baf6f8e8ffd`; final END-head `afbc8e9c41d25727dcdc786245281e605e73cf97`; exact-END R15.2 #11 / `33280685599`, R0 #2076 / `33280685519`, Python #2051 / `33280685583`, UI #2016 / `33280685572` SUCCESS; final non-draft PR #298 required R0 #2077 / `33280858482` SUCCESS and merged with expected head as `cf7f53fa9d491019fb9de941c3d703eb34a8f73d`; manual NONE. Capture remains disabled by default and training authorization UNKNOWN until later explicit governance. This is the unique post-merge continuity normalization; R15.3 is authorized only after this branch passes fresh R0/Python/UI and merges."
          text = text.replace(old, new, 1)
          old_action = next(line for line in text.splitlines() if line.startswith('**R15.2 END-sync is complete'))
          new_action = "**R15.2 normalization is staged continuity-only. Require fresh exact-head R0 Repository Guard + full Python Core + KodeStudio UI Smoke, merge with `expected_head_sha`, then start R15.3 from that normalized `main`. R15.3 remains unauthorized before this merge.**"
          text = text.replace(old_action, new_action, 1)
          p.write_text(text, encoding='utf-8', newline='\n')
          subprocess.run(['git','diff','--check'], check=True)
          subprocess.run(['python','scripts/check_repo.py'], check=True)
      - name: Commit normalized continuity and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15_2_normalize.yml
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git commit -m "docs(r15.2): normalize post-merge continuity"
          git push origin HEAD:r15/02-normalization
