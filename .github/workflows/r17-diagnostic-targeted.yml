name: Temporary R17 Packaged Diagnostic Targeted

on:
  push:
    branches:
      - scratch/r17-premerge-gates

permissions:
  contents: read

jobs:
  targeted-windows:
    runs-on: windows-latest
    env:
      KODEPOIA_SOURCE_SHA: d703abf62321e9c8cbdde2cb1ceb9adf39035d42
      QT_QPA_PLATFORM: offscreen
      KODEPOIA_LOCALE: fr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:KODEPOIA_SOURCE_SHA) { throw "Wrong source: $actual" }
      - name: Install
        run: python -m pip install -e ".[dev,ui,code,packaging]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: R17 targeted tests
        run: pytest tests/test_r17_guided_ux.py tests/test_r17_packaged_entrypoint.py
