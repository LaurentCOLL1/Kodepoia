name: R13.14 Normalization Helper

on:
  push:
    branches:
      - r13/14-normalize-continuity

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message != 'R13.14 normalize continuity via CI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r13/14-normalize-continuity
          fetch-depth: 0
      - name: Patch continuity only
        shell: python
        run: |
          from pathlib import Path

          p = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          text = p.read_text(encoding='utf-8')

          def one(old: str, new: str, label: str) -> None:
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              text = text.replace(old, new, 1)

          old_prompt = "> Kodepoia, architecture v1.0 gelée. **R1–R12 COMPLETE + NORMALIZED. R13 planning ACCEPTED + NORMALIZED. R13.1–R13.13 COMPLETE + NORMALIZED. R13.14 COMPLETE / END-SYNCED on dedicated branch `r13/14-mobile-diagnostics`; implementation merge + single continuity-only normalization PENDING. R13.15–R13.17 PLANNED / NOT STARTED.** Authorized normalized base for R13.14 is `69efa1f5cf92ae3c3ce4040fe5abe54faae2ed8b`. Accepted technical candidate `ebb446daf6a6c38cff71b0834151ace74ff46099` passed exact-head R0 Repository Guard #1707 / `33094260088`, Python Core #1681 / `33094260123`, and KodeStudio UI Smoke #1648 / `33094260179`, all SUCCESS. Core is deterministic/local mobile diagnostic evidence only: source SHA verification, redaction before persistence/export, bounded Android/Apple source taxonomy, immutable release/artifact/device/toolchain/test-run binding, deterministic fingerprints, performance observations and bounded retention/export; `continuous_hidden_telemetry=false`. Manual remains CONDITIONAL / NOT TRIGGERED. Because end-sync documentation changed bytes, PR #247 may merge only after fresh R0 + full Python Core + UI Smoke succeed on the same final exact head, followed by exactly one continuity-only normalization before R13.15 starts."
          new_prompt = "> Kodepoia, architecture v1.0 gelée. **R1–R12 COMPLETE + NORMALIZED. R13 planning ACCEPTED + NORMALIZED. R13.1–R13.14 COMPLETE + NORMALIZED. R13.15–R13.17 PLANNED / NOT STARTED.** R13.14 accepted technical candidate `ebb446daf6a6c38cff71b0834151ace74ff46099` passed exact-head R0 #1707 / `33094260088`, Python Core #1681 / `33094260123`, and UI #1648 / `33094260179`. Final end-synchronized head `42b500d3a4a19fad9370fb4b56fa528f5ed742eb` then passed fresh R0 Repository Guard #1711 / `33095039101`, Python Core #1685 / `33095038903`, and KodeStudio UI Smoke #1652 / `33095038908`, all SUCCESS on that exact SHA. PR #247 merged with `expected_head_sha=42b500d3a4a19fad9370fb4b56fa528f5ed742eb` as implementation merge `a7a6fc43823c53e78d31d71e20c110abbc35196d`. This branch `r13/14-normalize-continuity` is the single continuity-only normalization. Core remains deterministic/local, redacted before persistence/export, release/artifact-bound, bounded, and `continuous_hidden_telemetry=false`. Manual remained CONDITIONAL / NOT TRIGGERED. R13.15 may start only after this normalization exact head passes R0 + full Python Core + UI Smoke and the normalization PR merges with `expected_head_sha`."
          one(old_prompt, new_prompt, 'prompt')

          one(
              '- R13.1–R13.13: **COMPLETE + NORMALIZED**.',
              '- R13.1–R13.14: **COMPLETE + NORMALIZED**.',
              'global complete range',
          )
          one(
              '- R13.13 normalized `main`: **`69efa1f5cf92ae3c3ce4040fe5abe54faae2ed8b`** after implementation PR #245 and normalization PR #246. Manual **NONE**.\n- R13.14: **COMPLETE / END-SYNCED; MERGE + NORMALIZATION PENDING** on `r13/14-mobile-diagnostics`. Accepted technical candidate **`ebb446daf6a6c38cff71b0834151ace74ff46099`**. Manual **CONDITIONAL / NOT TRIGGERED**.',
              '- R13.14 implementation merge: **`a7a6fc43823c53e78d31d71e20c110abbc35196d`** from final accepted head **`42b500d3a4a19fad9370fb4b56fa528f5ed742eb`** after PR #247. Single continuity-only normalization is **IN_PROGRESS** on `r13/14-normalize-continuity`. Manual **CONDITIONAL / NOT TRIGGERED**.',
              'global R13.14 status',
          )
          one('## R13.14 end-sync authority', '## R13.14 normalization authority', 'heading')
          one(
              '- Status: **COMPLETE / END-SYNCED; IMPLEMENTATION MERGE + SINGLE NORMALIZATION PENDING**. R13.15–R13.17 remain **PLANNED / NOT STARTED**.',
              '- Status: **COMPLETE / IMPLEMENTATION MERGED; SINGLE CONTINUITY-ONLY NORMALIZATION IN PROGRESS**. R13.15–R13.17 remain **PLANNED / NOT STARTED**.',
              'status',
          )
          marker = '- Accepted exact-head technical candidate **`ebb446daf6a6c38cff71b0834151ace74ff46099`** passed R0 Repository Guard #1707 / `33094260088`, Python Core #1681 / `33094260123`, and KodeStudio UI Smoke #1648 / `33094260179`, all SUCCESS. Python Core passed full Ubuntu/Windows tests and package builds including focused R13.14 diagnostics tests. Durable schema/model enforce source digest verification, strict bounded input, deterministic redaction, provider/platform/source separation, release/artifact/device/toolchain/test-run binding, deterministic fingerprinting, bounded performance snapshots and retention/export, and `continuous_hidden_telemetry=false`. No live external account/device/credential seam was introduced. Because end-sync documentation changes bytes, this final branch head must freshly pass R0 + full Python Core + UI Smoke before PR #247 may merge with `expected_head_sha`; then exactly one continuity-only normalization is required before R13.15.'
          replacement = '- Accepted exact-head technical candidate **`ebb446daf6a6c38cff71b0834151ace74ff46099`** passed R0 Repository Guard #1707 / `33094260088`, Python Core #1681 / `33094260123`, and KodeStudio UI Smoke #1648 / `33094260179`, all SUCCESS. Python Core passed full Ubuntu/Windows tests and package builds including focused R13.14 diagnostics tests. Durable schema/model enforce source digest verification, strict bounded input, deterministic redaction, provider/platform/source separation, release/artifact/device/toolchain/test-run binding, deterministic fingerprinting, bounded performance snapshots and retention/export, and `continuous_hidden_telemetry=false`.\n- Final end-synchronized head **`42b500d3a4a19fad9370fb4b56fa528f5ed742eb`** changed no implementation semantics after the accepted technical candidate and passed fresh exact-head R0 Repository Guard #1711 / `33095039101`, Python Core #1685 / `33095038903`, and KodeStudio UI Smoke #1652 / `33095038908`, all SUCCESS. PR #247 merged with **`expected_head_sha=42b500d3a4a19fad9370fb4b56fa528f5ed742eb`** as implementation merge **`a7a6fc43823c53e78d31d71e20c110abbc35196d`**.\n- This branch **`r13/14-normalize-continuity`** was created exactly from implementation merge `a7a6fc43823c53e78d31d71e20c110abbc35196d` and is the single allowed continuity-only normalization. It changes no plan/code/schema/test bytes. No live external account/device/credential seam was introduced; manual remains **CONDITIONAL / NOT TRIGGERED**. R13.15 stays PLANNED until this normalization exact head passes fresh R0 + full Python Core + UI Smoke and its PR merges with `expected_head_sha`.'
          one(marker, replacement, 'candidate/final record')

          old_next = 'Freeze the final R13.14 end-synchronized branch head. Run fresh exact-head **R0 Repository Guard + full Python Core + KodeStudio UI Smoke** on that same SHA. If all three are SUCCESS, merge implementation PR #247 with `expected_head_sha=<final-head>`. Then create exactly one branch from the implementation merge for **continuity-only normalization**, change no plan/code/schema/test bytes, verify the diff is exactly `docs/continuity/KODEPOIA_CONTINUITY.md`, run fresh exact-head R0 + Python + UI, and merge that normalization PR with `expected_head_sha`. Only the resulting normalized `main` authorizes R13.15 to start. If any gate fails, correct the affected R13.14 bytes and rerun all required exact-head gates; manual remains CONDITIONAL / NOT TRIGGERED unless a genuinely device-only prerequisite is newly discovered.'
          new_next = 'Freeze this single R13.14 continuity-only normalization head and verify its diff against implementation merge `a7a6fc43823c53e78d31d71e20c110abbc35196d` is exactly `docs/continuity/KODEPOIA_CONTINUITY.md`. Run fresh exact-head **R0 Repository Guard + full Python Core + KodeStudio UI Smoke**. If all three are SUCCESS, merge the normalization PR with `expected_head_sha`. Only the resulting normalized `main` authorizes R13.15 to start on its own dedicated branch with start plan+continuity synchronization. If any normalization gate fails, correct only continuity and rerun all three; manual remains CONDITIONAL / NOT TRIGGERED.'
          one(old_next, new_next, 'next action')

          p.write_text(text, encoding='utf-8')
      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --quiet && exit 0
          git commit -m "R13.14 normalize continuity via CI"
          git push origin HEAD:r13/14-normalize-continuity
