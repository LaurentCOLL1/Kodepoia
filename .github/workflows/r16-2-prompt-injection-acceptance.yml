name: R16.2 Prompt Injection Acceptance

on:
  push:
    branches:
      - r16/02-prompt-injection-untrusted-content
  pull_request:
    paths:
      - .github/workflows/r16-2-prompt-injection-acceptance.yml
      - docs/security/R16_2_PROMPT_INJECTION.md
      - scripts/r16_2_acceptance.py
      - src/kodepoia/core/trust.py
      - src/kodepoia/core/research_guard.py
      - src/kodepoia/core/guardian.py
      - src/kodepoia/intelligence/context.py
      - src/kodepoia/quality/prompt_injection.py
      - tests/fixtures/r16/redteam-corpus.json
      - tests/fixtures/r16/prompt-injection-cases.json
      - tests/test_r16_prompt_injection.py
      - docs/roadmap/R16_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-injection-hardening:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True, encoding="utf-8"
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused acceptance dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile focused R16.2 sources
        run: >-
          python -m compileall -q
          src/kodepoia/core/trust.py
          src/kodepoia/core/research_guard.py
          src/kodepoia/core/guardian.py
          src/kodepoia/intelligence/context.py
          src/kodepoia/quality/prompt_injection.py
          scripts/r16_2_acceptance.py
          tests/test_r16_prompt_injection.py

      - name: Ruff focused R16.2 sources
        run: >-
          python -m ruff check
          src/kodepoia/core/trust.py
          src/kodepoia/core/research_guard.py
          src/kodepoia/core/guardian.py
          src/kodepoia/intelligence/context.py
          src/kodepoia/quality/prompt_injection.py
          scripts/r16_2_acceptance.py
          tests/test_r16_prompt_injection.py

      - name: Run focused R16.2 tests
        run: python -m pytest -q tests/test_r16_prompt_injection.py

      - name: Emit exact-source R16.2 acceptance
        run: >-
          python scripts/r16_2_acceptance.py
          --source-sha "${{ env.EVIDENCE_SHA }}"
          --output artifacts/r16_2_acceptance.json

      - name: Upload exact-source acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: r16-2-prompt-injection-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r16_2_acceptance.json
          if-no-files-found: error
          retention-days: 30
