name: R20.3 Live Zero-Cost Signer Challenge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r20-3-live-signing-challenge
  cancel-in-progress: false

jobs:
  live-signing-challenge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: tuf-production-signing
    env:
      SOURCE_SHA: ${{ github.sha }}
      TUF_SNAPSHOT_ED25519_SEED_B64: ${{ secrets.TUF_SNAPSHOT_ED25519_SEED_B64 }}
      TUF_TIMESTAMP_ED25519_SEED_B64: ${{ secrets.TUF_TIMESTAMP_ED25519_SEED_B64 }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["SOURCE_SHA"].strip().lower()
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev]"

      - name: Restore exact tracked source after dependency installation
        shell: bash
        run: |
          # Editable build/install hooks can normalize tracked deterministic evidence
          # before the signer challenge itself runs. Restore tracked bytes to the exact
          # checked-out commit so the final cleanliness assertion measures only the
          # challenge, not dependency-install side effects.
          git reset --hard "$SOURCE_SHA"
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Unable to restore exact tracked source before live challenge" >&2
            git status --porcelain --untracked-files=no >&2
            exit 1
          fi

      - name: Verify live Snapshot/Timestamp secret identities without publication
        run: python scripts/r20_3_live_signing_challenge.py --source-sha "$SOURCE_SHA"

      - name: Assert challenge did not modify repository state
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "R20.3 live challenge modified repository state" >&2
            git status --porcelain >&2
            exit 1
          fi
