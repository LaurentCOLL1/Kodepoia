name: R14.8 END Sync Helper

on:
  push:
    branches:
      - r14/08-cloud-saves
    paths:
      - .github/workflows/r14-8-end-sync-helper.yml

permissions:
  contents: write

jobs:
  end-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/08-cloud-saves
          fetch-depth: 0
      - name: Apply END synchronization
        run: python .github/r14_8_end_sync.py
      - name: Commit documentation-only END head
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/R14_PLAN.md docs/roadmap/R14_8_ACCEPTANCE.md docs/continuity/KODEPOIA_CONTINUITY.md .github/r14_8_end_sync.py .github/workflows/r14-8-end-sync-helper.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/r14_8_end_sync.py' '.github/workflows/r14-8-end-sync-helper.yml' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R14_PLAN.md' | sort)"
          test "$changed" = "$expected"
          git commit -m "docs(r14.8): END-sync accepted cloud saves"
          git push origin HEAD:r14/08-cloud-saves
