name: R15.6 END Sync Helper

on:
  push:
    branches: [r15/06-kodebench-v2]
    paths:
      - '.github/workflows/r15-6-end-sync-helper.yml'

permissions:
  contents: write

jobs:
  end-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: r15/06-kodebench-v2
      - name: Apply bounded R15.6 END synchronization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          technical = "ae856396faa964fee19ee39e461bc7de4e775cd9"
          start_sha = "097e99db28508cd1c53eadfe00b2b33576a445af"

          Path("docs/roadmap/R15_6_DESIGN.md").write_text(f'''# R15.6 — KodeBench v2 design

**Status:** COMPLETE — technical design implemented  
**Clean START / branch point:** `{start_sha}`  
**Immutable technical source:** `{technical}`  
**Manual:** NONE

## Objective

Extend the accepted R3 `BaselineBench` into a deterministic KodeBench v2 authority without breaking `bench-models` or `r3-accept`. R15.6 makes later specialization measurable by domain and criticality while keeping failures and resource costs explicit.

## Implemented architecture

- immutable suite, task, scorer, run-config, model/runtime, outcome and report contracts;
- canonical JSON + SHA-256 identities for suite/task/prompt/scorer/config/report evidence;
- exact, contains/forbidden, regex, JSON-schema, tool-call and repository-code-owned custom scorers;
- domain/critical scoring, repeat/seed variance and explicit PASS / WRONG_ANSWER / MODEL_FAILURE / CAPABILITY_UNAVAILABLE / SCORER_FAILURE categories;
- elapsed/load/total/tokens-per-second/token-count/model-size/VRAM evidence when available;
- strict report comparisons requiring identical suite/config/protection digests and exposing critical regressions;
- R15.4 `ProtectedHoldoutRegistry` binding, with safe holdout IDs/digests and prompt/response digests rather than protected raw text in persisted reports;
- strict Draft 2020-12 report schema and `kodebench-compare` CLI;
- `baseline_compat_suite()` and execution through the existing R3 `BaselineBench`.

## Reproducibility and security contract

Comparable runs bind stable suite/scorer definitions, repeats/seeds/options, model/runtime identity and the protected-holdout manifest. Historical scores are immutable. Benchmark/model text never becomes a shell command, and custom scorer callables cannot be imported from benchmark data. Missing holdout authority, mismatched model identity, incomparable reports or scorer failures fail closed or remain separately classified.

## Informative external methodology baseline

MLCommons/MLPerf is used only as an informative reproducibility reference for fixed configurations, traceable results and comparable conditions. NIST TEVV material is used only as an informative reference for structured evidence-backed evaluation. Neither overrides frozen R15 repository governance.

- https://mlcommons.org/benchmarks/
- https://www.nist.gov/artificial-intelligence

## START synchronization repair note

Continuity was correctly changed to `R15.6 IN_PROGRESS` before implementation bytes. `R15_PLAN.md`'s checkpoint/table row was inadvertently left at its older `PLANNED` wording in that START work cycle. This END-sync repairs that stale plan state explicitly; it does not claim the plan had been synchronized earlier. Technical-source gates therefore remain technical evidence only, and fresh exact-head R15.6/R0/Python/UI gates are mandatory on the repaired final END tree.
''', encoding="utf-8", newline="\n")

          Path("docs/roadmap/R15_6_ACCEPTANCE.md").write_text(f'''# R15.6 — Acceptance record

**Acceptance state:** COMPLETE — TECHNICAL ACCEPTANCE RECORDED; FINAL END GATES REQUIRED  
**Clean START:** `{start_sha}`  
**Immutable technical source:** `{technical}`  
**Manual:** NONE

## Acceptance contract

R15.6 is merge-eligible only when the final documented END-head proves on Ubuntu and Windows that KodeBench v2 preserves R3 compatibility, deterministic identities, domain/critical scoring, failure isolation, resource evidence, protected-holdout binding and report-schema validity, and that same exact head passes R0 Repository Guard, full Python Core and KodeStudio UI Smoke.

## Required coverage

- deterministic suite/task/scorer/config identities and task-order-independent suite digest;
- all built-in scorer classes plus code-owned custom scorer failure isolation;
- repeated seeds, domain/critical summaries and variance;
- distinct wrong-answer/model/capability/scorer failure categories;
- resource metrics when available;
- strict model/runtime identity and report comparability with critical-regression detection;
- fail-closed R15.4 protected-holdout registry binding and no protected raw prompt/response in saved reports;
- Draft 2020-12 schema validation;
- R3 `BaselineBench` regression tests, Ruff/import checks, compileall and CLI comparison smoke.

## Technical evidence

Technical source `{technical}` passed:

- R15.6 KodeBench v2 Acceptance #2 / `33295649414`: SUCCESS Ubuntu + Windows; 17 combined R3/R15.6 tests per OS plus schema/Ruff/import/compile/CLI checks;
- R0 Repository Guard #2124 / `33295649494`: SUCCESS Ubuntu + Windows;
- Python Core #2099 / `33295649527`: SUCCESS 5/5;
- KodeStudio UI Smoke #2064 / `33295649458`: SUCCESS.

These prove the technical tree only. This END-sync repairs the stale `R15_PLAN.md` START status; therefore those runs are not final-END proof. Fresh R15.6/R0/Python/UI success is required on the final documented PR head before expected-head merge.

## Rollback / recovery

KodeBench v2 adds derived benchmark contracts/reports and a compatibility layer. Rollback removes the v2 module/schema/CLI comparison surface while preserving the accepted R3 baseline and historical immutable benchmark evidence.
''', encoding="utf-8", newline="\n")

          plan = Path("docs/roadmap/R15_PLAN.md")
          text = plan.read_text(encoding="utf-8")
          lines = text.splitlines()
          checkpoint = f"**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. R15.1–R15.5 are COMPLETE + NORMALIZED. R15.6 is COMPLETE on this documented END candidate after technical qualification of `{technical}`; fresh exact-head R15.6/R0/Python/UI gates, expected-head merge and one continuity-only normalization remain required before R15.7. R15.7–R15.17 remain PLANNED."
          for i, line in enumerate(lines):
              if line.startswith("**Execution checkpoint:**"):
                  lines[i] = checkpoint
                  break
          else:
              raise SystemExit("R15 execution checkpoint marker missing")
          for i, line in enumerate(lines):
              if line.startswith("| R15.6 |"):
                  parts = line.split("|")
                  if len(parts) < 6:
                      raise SystemExit("malformed R15.6 table row")
                  parts[3] = " COMPLETE "
                  lines[i] = "|".join(parts)
                  break
          else:
              raise SystemExit("R15.6 table row missing")
          text = "\n".join(lines) + "\n"
          start = text.index("# R15.6 —")
          end = text.index("# R15.7 —", start)
          section = text[start:end]
          marker = "## Completion record\n\nTo be appended when accepted."
          if section.count(marker) != 1:
              raise SystemExit(f"unexpected R15.6 completion marker count: {section.count(marker)}")
          completion = f'''## Completion record

**COMPLETE — technical acceptance recorded; fresh final-END gates required before merge.**

- clean START / normalized R15.5 branch point: `{start_sha}`;
- continuity START-sync preceded implementation; `R15_PLAN.md` START checkpoint/table was stale and is repaired truthfully here rather than retroactively claimed;
- immutable technical source: `{technical}`;
- R15.6 #2 / `33295649414`: SUCCESS Ubuntu + Windows, 17 combined R3/R15.6 tests per OS plus schema/Ruff/import/compile/CLI checks;
- R0 #2124 / `33295649494`: SUCCESS Ubuntu + Windows;
- Python Core #2099 / `33295649527`: SUCCESS 5/5;
- KodeStudio UI Smoke #2064 / `33295649458`: SUCCESS;
- manual state: `NONE`;
- the exact final documented END-head must receive fresh R15.6/R0/Python/UI evidence before protected merge; technical-source evidence is not reused for that decision.
'''
          section = section.replace(marker, completion, 1)
          plan.write_text(text[:start] + section + text[end:], encoding="utf-8", newline="\n")

          continuity = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          text = continuity.read_text(encoding="utf-8")
          old = "R15.1–R15.5 COMPLETE + NORMALIZED; R15.6 IN_PROGRESS; R15.7–R15.17 PLANNED."
          new = "R15.1–R15.5 COMPLETE + NORMALIZED; R15.6 COMPLETE; R15.7–R15.17 PLANNED."
          if text.count(old) != 1:
              raise SystemExit(f"unexpected continuity header count: {text.count(old)}")
          text = text.replace(old, new, 1)
          lines = text.splitlines()
          entry = f"- R15.6 : **COMPLETE** — clean START / branch point `{start_sha}`; continuity START-sync preceded implementation while the R15_PLAN checkpoint/table was inadvertently left stale and is repaired explicitly at END rather than laundered; immutable technical source `{technical}`; technical R15.6 #2 / `33295649414` SUCCESS Ubuntu + Windows, R0 #2124 / `33295649494` SUCCESS Ubuntu + Windows, Python #2099 / `33295649527` SUCCESS 5/5, UI #2064 / `33295649458` SUCCESS; technical scope accepted: immutable suite/task/scorer/config identities, R3 compatibility, domain/critical scoring, failure isolation, resource metrics, strict comparisons, Draft 2020-12 report schema, R15.4 protected-holdout binding and safe prompt/response digests; manual NONE. Fresh exact-head R15.6/R0/Python/UI on the repaired final END tree remain mandatory before expected-head PR #307 merge, followed by exactly one continuity-only normalization before R15.7."
          for i, line in enumerate(lines):
              if line.startswith("- R15.6 :"):
                  lines[i] = entry
                  break
          else:
              raise SystemExit("R15.6 continuity entry missing")
          continuity.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/R15_6_DESIGN.md docs/roadmap/R15_6_ACCEPTANCE.md docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          changed=$(git diff --cached --name-only | sort)
          printf '%s\n' "$changed"
          for expected in docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R15_6_ACCEPTANCE.md docs/roadmap/R15_6_DESIGN.md docs/roadmap/R15_PLAN.md; do
            printf '%s\n' "$changed" | grep -Fx "$expected" >/dev/null || { echo "missing expected change: $expected"; exit 1; }
          done
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 4
          git rm .github/workflows/r15-6-end-sync-helper.yml
          git commit -m "docs(r15.6): synchronize END authority"
          git push origin HEAD:r15/06-kodebench-v2
