name: R14.6 Store Protocol Temp
on:
  push:
    branches: ["r14/06-authoritative-server-state"]
    paths: [".github/r14-06-store-protocol.trigger"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/06-authoritative-server-state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add provider-neutral authority store protocol
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/kodepoia/backend/authority.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from typing import Any, Callable, Mapping, Sequence\n', 'from typing import Any, Callable, Mapping, Protocol, Sequence\n', 1)
          marker = '''AuthorityHandler = Callable[\n    [Mapping[str, Any], Mapping[str, Any]],\n    tuple[Mapping[str, Any], str, Mapping[str, Any]],\n]\n\n\nclass InMemoryAuthorityStore:'''
          replacement = '''AuthorityHandler = Callable[\n    [Mapping[str, Any], Mapping[str, Any]],\n    tuple[Mapping[str, Any], str, Mapping[str, Any]],\n]\n\n\nclass AuthorityStore(Protocol):\n    def snapshot(self, domain_id: str, target_id: str) -> AuthorityStateSnapshot: ...\n\n    def events(self) -> tuple[AuthorityEvent, ...]: ...\n\n    def last_session_sequence(self, domain_id: str, session_id: str) -> int: ...\n\n    def process_atomic(\n        self,\n        command: AuthorityCommand,\n        handler: AuthorityHandler,\n        *,\n        server_time_ms: int,\n    ) -> AuthorityCommandOutcome: ...\n\n\nclass InMemoryAuthorityStore:'''
          if marker not in text:
              raise SystemExit('authority store insertion marker not found')
          text = text.replace(marker, replacement, 1)
          if '    def _process_atomic(\n' not in text:
              raise SystemExit('process_atomic rename marker not found')
          text = text.replace('    def _process_atomic(\n', '    def process_atomic(\n', 1)
          if '        store: InMemoryAuthorityStore,\n' not in text:
              raise SystemExit('processor store type marker not found')
          text = text.replace('        store: InMemoryAuthorityStore,\n', '        store: AuthorityStore,\n', 1)
          if 'return self.store._process_atomic(command, handler, server_time_ms=now)' not in text:
              raise SystemExit('processor call marker not found')
          text = text.replace('return self.store._process_atomic(command, handler, server_time_ms=now)', 'return self.store.process_atomic(command, handler, server_time_ms=now)', 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          p = Path('src/kodepoia/backend/__init__.py')
          text = p.read_text(encoding='utf-8')
          if '    AuthorityStore,\n' not in text:
              text = text.replace('    AuthorityStateSnapshot,\n', '    AuthorityStateSnapshot,\n    AuthorityStore,\n', 1)
          if '    "AuthorityStore",\n' not in text:
              text = text.replace('    "AuthorityStateSnapshot",\n', '    "AuthorityStateSnapshot",\n    "AuthorityStore",\n', 1)
          p.write_text(text, encoding='utf-8', newline='\n')
          PY
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests/test_r14_6_authoritative_server.py
          python -m pytest -q tests/test_r14_6_authoritative_server.py
          git rm .github/workflows/r14-06-store-protocol-temp.yml .github/r14-06-store-protocol.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/kodepoia/backend/authority.py src/kodepoia/backend/__init__.py
          git commit -m "R14.6 decouple authority store protocol"
          git push origin HEAD:r14/06-authoritative-server-state
