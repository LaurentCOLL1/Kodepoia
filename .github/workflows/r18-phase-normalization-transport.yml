name: R18 Phase Normalization Transport

on:
  push:
    branches:
      - r18/phase-normalization-transport-final

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout transport head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Append canonical R18 phase normalization record
        shell: bash
        run: |
          set -euo pipefail
          cat >> docs/continuity/KODEPOIA_CONTINUITY.md <<'EOF'


          ## R18 phase post-merge normalization authority

          - **Latest-state authority:** R18.11 implementation/evidence closure is merged. Final exact-END head `c64bac012ef3afa332526a539901b11428fd966f` passed fresh R18.11 Integrated Adversarial Release Update Acceptance #8 / `34058165771`, R16.9 Supply Chain Provenance Acceptance #204 / `34058165647`, R0 Repository Guard #2556 / `34058165607` Ubuntu + Windows, full Python Core #2528 / `34058165818` 5/5, KodeStudio UI Smoke #2493 / `34058165759` and R17 Windows Installer #128 / `34058165670`; all are SUCCESS on that exact SHA.
          - PR #403 merged only `c64bac012ef3afa332526a539901b11428fd966f` with exact `expected_head_sha` protection as implementation/evidence `main` `0ea7b14f03a4e3d0539ce3e7d4fc932427fdb104`.
          - R18.11 canonical integrated report remains **PASS** with `blockers=[]`, `critical_veto=false`, `manual_intervention=NONE`, `project_data_mutation=false`, `provider_effect_count=0` and report SHA-256 `a4d5e79c142c4e5b0135665bc468c6a264f1c30aaaf422d9ea1c9809bea32372`. Final `KodepoiaSetup.exe` remains version `1.1.0-rc1`, SHA-256 `6ae0d670786710c9bad85bf0da16ea29e1d7ad2260a58c52b9c8c3e86e3ee31e`, `production_signed=false`.
          - Dedicated phase-normalization branch `r18/phase-continuity-normalization` was created exactly from implementation/evidence `main` `0ea7b14f03a4e3d0539ce3e7d4fc932427fdb104`. This is the **single authorized post-merge continuity-only R18 phase normalization**.
          - The authoritative normalization decision tree may change only `docs/continuity/KODEPOIA_CONTINUITY.md`; `docs/roadmap/R18_PLAN.md`, all workflows, implementation/evidence bytes, runtime/test bytes, release/update logic and packaged artifacts remain identical to `0ea7b14f03a4e3d0539ce3e7d4fc932427fdb104`. No temporary transport/helper file or helper workflow is authorized on the decision head.
          - Before this record may enter `main`, its exact candidate head must pass fresh R0 Repository Guard Ubuntu + Windows, full Python Core 5/5 and KodeStudio UI Smoke, then merge only with `expected_head_sha` equal to that exact candidate. No second R18 phase normalization is permitted.
          - Core manual state remains **NONE**. Production signing, public GitHub Release publication/mutation, production TUF key custody/rotation and public WinGet submission remain **CONDITIONAL / NOT TRIGGERED**; phase normalization performs no external production effect.
          - Once this exact gated continuity-only normalization merge is present on `main`, **R18 is COMPLETE + NORMALIZED** and R18.1–R18.11 are all COMPLETE + NORMALIZED. The frozen R18 subdivision set ends at R18.11: **no R18.12 and no additional R18 subdivision are authorized**. Phase completion does not imply any public/production distribution action.
          EOF

      - name: Verify and publish clean transport tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/continuity/KODEPOIA_CONTINUITY.md)" = "4323f9905b9905eb416e3d06d78fea14bb0ed436"
          rm .github/workflows/r18-phase-normalization-transport.yml
          git add -- docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r18-phase-normalization-transport.yml
          mapfile -t staged < <(git diff --cached --name-only)
          printf '%s\n' "${staged[@]}"
          test "${#staged[@]}" -eq 2
          printf '%s\n' "${staged[@]}" | grep -Fxq '.github/workflows/r18-phase-normalization-transport.yml'
          printf '%s\n' "${staged[@]}" | grep -Fxq 'docs/continuity/KODEPOIA_CONTINUITY.md'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "transport: materialize R18 phase normalization tree"
          git push origin HEAD:r18/phase-normalization-transport-final
