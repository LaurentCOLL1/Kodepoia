name: R15.9 START Sync Helper

on:
  push:
    paths:
      - '.github/workflows/r15-9-start-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/09-qlora-sft
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch bounded R15.9 START records
        shell: python
        run: |
          from pathlib import Path

          plan = Path('docs/roadmap/R15_PLAN.md')
          continuity = Path('docs/continuity/KODEPOIA_CONTINUITY.md')

          p = plan.read_text(encoding='utf-8')
          replacements = {
              '**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. R15.1–R15.7 are COMPLETE + NORMALIZED. R15.8 is COMPLETE on immutable technical source `fa932e4a436004045074f417005b2edc038cfc87` with R15.8 #5 / 33306096508 SUCCESS Ubuntu + Windows (13 focused tests per OS + Ruff + compile + CLI/schema checks); fresh exact-END R15.8/R0/Python/UI gates, protected merge and the unique post-merge continuity-only normalization remain required before R15.9. R15.9–R15.17 remain PLANNED.': '**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. R15.1–R15.8 are COMPLETE + NORMALIZED. R15.9 is IN_PROGRESS from normalized `main` `4c1c726301b5a5f798944632336e130ccfb0cbbe`; R15.10–R15.17 remain PLANNED.',
              '| R15.8 | Optional training runtime, backend capability probes, dependency isolation + reproducibility | COMPLETE | CONDITIONAL | R15.7 + R1/R6/R9 |': '| R15.8 | Optional training runtime, backend capability probes, dependency isolation + reproducibility | COMPLETE + NORMALIZED | CONDITIONAL | R15.7 + R1/R6/R9 |',
              '| R15.9 | QLoRA/SFT adapter training, checkpoints, resume/cancel/recovery + budget controls | PLANNED | CONDITIONAL | R15.5/R15.7–R15.8 |': '| R15.9 | QLoRA/SFT adapter training, checkpoints, resume/cancel/recovery + budget controls | IN_PROGRESS | CONDITIONAL / NOT TRIGGERED | R15.5/R15.7–R15.8 |',
          }
          for old, new in replacements.items():
              if p.count(old) != 1:
                  raise SystemExit(f'plan marker count != 1: {old[:80]}')
              p = p.replace(old, new, 1)
          plan.write_text(p, encoding='utf-8', newline='\n')

          c = continuity.read_text(encoding='utf-8')
          old_header = '> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1–R15.8 COMPLETE + NORMALIZED; R15.9–R15.17 PLANNED.** R15.8 final END-head `660dcc1194c925b4dcc5e139c59adc04a6b5ac45` passed R15.8 #11 / `33307477588`, R0 #2142 / `33307477529`, Python Core #2117 / `33307477555` 5/5 and UI #2082 / `33307477574` SUCCESS; PR #311 merged the exact expected head as `main` `2982d42493e6e433250c65721bf3b02f7bd815df`. This continuity-only record is the unique R15.8 post-merge normalization authority when merged. Manual state R15.8: CONDITIONAL / NOT TRIGGERED. R15.9 START is authorized only from the normalized main produced by this normalization PR.'
          new_header = '> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1–R15.8 COMPLETE + NORMALIZED; R15.9 IN_PROGRESS; R15.10–R15.17 PLANNED.** R15.8 normalization PR #312 merged as normalized `main` `4c1c726301b5a5f798944632336e130ccfb0cbbe`; R15.9 START branch `r15/09-qlora-sft` begins from that exact authority. Manual state R15.9: CONDITIONAL / NOT TRIGGERED; core acceptance uses bounded fixture training and does not claim real target-GPU qualification.'
          if c.count(old_header) != 1:
              raise SystemExit('continuity header marker count != 1')
          c = c.replace(old_header, new_header, 1)
          continuity.write_text(c, encoding='utf-8', newline='\n')
      - name: Validate START scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'docs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R10_7_LOCAL_ACCEPTANCE.json\ndocs/roadmap/R15_PLAN.md'
          git diff --ignore-space-at-eol --exit-code -- docs/roadmap/R10_7_LOCAL_ACCEPTANCE.json
          git diff --check -- docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R15_PLAN.md
      - name: Commit START sync and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/r15-9-start-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r15-9-start-sync.yml
          git commit -m 'docs(r15.9): synchronize START authority'
          git push origin HEAD:r15/09-qlora-sft
