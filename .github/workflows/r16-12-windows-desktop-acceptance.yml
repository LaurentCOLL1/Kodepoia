name: R16.12 Representative Windows Desktop Acceptance

on:
  push:
    branches:
      - r16/12-representative-windows-desktop-application
  pull_request:
    paths:
      - .github/workflows/r16-12-windows-desktop-acceptance.yml
      - configs/r16_supply_chain_policy.json
      - scripts/r16_12_windows_desktop_acceptance.py
      - src/kodepoia/desktop/windows_beta_acceptance.py
      - tests/fixtures/r16_12_windows_desktop/**
      - tests/test_r16_12_windows_desktop.py
      - tests/test_supply_chain_r16_9.py
      - docs/roadmap/R16_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  representative-windows-desktop:
    runs-on: windows-latest
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up accepted .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True, encoding="utf-8"
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused acceptance dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build exact-source wheel and sdist
        run: python -m build --wheel --sdist --outdir dist

      - name: Compile focused R16.12 sources
        run: >-
          python -m compileall -q
          src/kodepoia/desktop/windows_beta_acceptance.py
          scripts/r16_12_windows_desktop_acceptance.py
          tests/test_r16_12_windows_desktop.py

      - name: Ruff focused R16.12 sources
        run: >-
          python -m ruff check
          src/kodepoia/desktop/windows_beta_acceptance.py
          scripts/r16_12_windows_desktop_acceptance.py
          tests/test_r16_12_windows_desktop.py

      - name: Run focused R16.12 and supply-chain regression tests
        run: >-
          python -m pytest -q
          tests/test_r16_12_windows_desktop.py
          tests/test_supply_chain_r16_9.py

      - name: Emit exact-source R16.12 acceptance
        run: >-
          python scripts/r16_12_windows_desktop_acceptance.py
          --source-sha "${{ env.EVIDENCE_SHA }}"
          --platform "Windows"
          --output artifacts/r16_12_windows_desktop_acceptance.json

      - name: Upload exact-source acceptance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r16-12-windows-desktop-${{ env.EVIDENCE_SHA }}
          path: artifacts/r16_12_windows_desktop_acceptance.json
          if-no-files-found: error
          retention-days: 30
