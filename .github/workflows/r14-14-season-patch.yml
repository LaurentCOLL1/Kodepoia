name: R14.14 Season Authority Patch

on:
  push:
    branches:
      - r14/14-liveops-campaigns-schedules

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: r14/14-liveops-campaigns-schedules
          fetch-depth: 4

      - name: Assert season patch surface
        shell: bash
        run: |
          set -euo pipefail
          test -f src/kodepoia/backend/liveops.py
          test -f scripts/_r14_14_season_patch.py
          test -f .github/workflows/r14-14-season-patch.yml

      - name: Apply immutable season authority
        run: python scripts/_r14_14_season_patch.py

      - name: Compile season authority
        run: python -m compileall -q src/kodepoia/backend/liveops.py

      - name: Commit clean technical result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm scripts/_r14_14_season_patch.py
          rm .github/workflows/r14-14-season-patch.yml
          git add src/kodepoia/backend/liveops.py
          git add -u -- scripts/_r14_14_season_patch.py .github/workflows/r14-14-season-patch.yml
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx 'src/kodepoia/backend/liveops.py'
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/_r14_14_season_patch.py'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/r14-14-season-patch.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(r14.14): add immutable LiveOps season authority'
          git push origin HEAD:r14/14-liveops-campaigns-schedules
