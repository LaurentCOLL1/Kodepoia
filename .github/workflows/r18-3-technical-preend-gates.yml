name: Temporary R18.3 Technical Pre-END Gates

on:
  push:
    branches:
      - scratch/r18-3-technical-preend-gates

permissions:
  contents: read

jobs:
  r0:
    name: r0-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KODEPOIA_SOURCE_SHA: 4dbc635edf3ee0e7db0922f95c706192dcad3228
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install R0 dependencies
        run: python -m pip install -r scripts/requirements-r0.txt
      - name: Verify Git LFS
        run: git lfs version
      - name: Repository Guard
        run: python scripts/check_repo.py

  python-core:
    name: python-core-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KODEPOIA_SOURCE_SHA: 4dbc635edf3ee0e7db0922f95c706192dcad3228
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install
        run: python -m pip install -e ".[dev,code]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate R7 integrated acceptance
        if: runner.os == 'Linux'
        run: python scripts/r7_integrated_acceptance.py --check-or-print docs/roadmap/R7_INTEGRATED_ACCEPTANCE.json
      - name: Validate R8 integrated acceptance
        if: runner.os == 'Linux'
        run: python scripts/r8_integrated_acceptance.py --check-or-print docs/roadmap/R8_INTEGRATED_ACCEPTANCE.json
      - name: Validate R9 integrated acceptance
        if: runner.os == 'Linux'
        run: python scripts/r9_integrated_acceptance.py --check-or-print docs/roadmap/R9_INTEGRATED_ACCEPTANCE.json
      - name: Validate PowerShell acceptance runner syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @(
            "scripts/r3_accept_local.ps1",
            "scripts/r5_accept_local.ps1",
            "scripts/r5_diagnose_godot_process.ps1",
            "scripts/r6_4_accept_local.ps1",
            "scripts/r6_5_accept_local.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Full Python Core
        run: pytest

  ui-smoke:
    name: kodestudio-ui-windows
    runs-on: windows-latest
    env:
      KODEPOIA_SOURCE_SHA: 4dbc635edf3ee0e7db0922f95c706192dcad3228
      QT_QPA_PLATFORM: offscreen
      KODEPOIA_LOCALE: fr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install UI dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: KodeStudio UI Smoke
        run: pytest tests/test_kodestudio_smoke.py tests/test_r6_5_accessibility_ui.py tests/test_r6_6_localization_ui.py tests/test_r7_10_research_ui.py tests/test_r8_10_kodestudio.py tests/test_comfyui_r9_10_kodestudio.py

  r16-9:
    name: r16-9-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: 4dbc635edf3ee0e7db0922f95c706192dcad3228
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['EVIDENCE_SHA']"
      - name: Install focused dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build exact-source wheel and sdist
        run: python -m build --wheel --sdist --outdir dist
      - name: Compile R16.9 sources
        run: python -m compileall -q src/kodepoia/quality/supply_chain.py scripts/r16_9_supply_chain_acceptance.py tests/test_supply_chain_r16_9.py
      - name: Ruff R16.9 sources
        run: python -m ruff check src/kodepoia/quality/supply_chain.py scripts/r16_9_supply_chain_acceptance.py tests/test_supply_chain_r16_9.py
      - name: Test R16.9
        run: python -m pytest -q tests/test_supply_chain_r16_9.py
      - name: Emit exact-source R16.9 acceptance
        run: python scripts/r16_9_supply_chain_acceptance.py --source-sha "${{ env.EVIDENCE_SHA }}" --platform "${{ runner.os }}" --output artifacts/r16_9_supply_chain_acceptance.json
      - name: Upload R16.9 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r16-9-r18-3-technical-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r16_9_supply_chain_acceptance.json
          if-no-files-found: error
          retention-days: 30
