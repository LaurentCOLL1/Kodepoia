name: R15.11 END Sync Helper

on:
  push:
    branches: [r15/11-model-export-lineage-final]

permissions:
  contents: write

jobs:
  end_sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/11-model-export-lineage-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded END synchronization
        run: python .github/scripts/r15_11_end_sync.py
      - name: Verify and publish clean END head
        shell: bash
        run: |
          rm .github/scripts/r15_11_end_sync.py
          rm .github/workflows/r15-11-end-sync-helper.yml
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/r15_11_end_sync.py' \
            '.github/workflows/r15-11-end-sync-helper.yml' \
            'docs/continuity/KODEPOIA_CONTINUITY.md' \
            'docs/roadmap/R15_PLAN.md' | sort)"
          test "$actual" = "$expected" || {
            echo 'Unexpected END-sync diff:'
            git diff --name-only
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R15_PLAN.md
          git rm .github/scripts/r15_11_end_sync.py .github/workflows/r15-11-end-sync-helper.yml
          staged="$(git diff --cached --name-only | sort)"
          test "$staged" = "$expected"
          git diff --cached --check
          git commit -m 'docs(r15.11): synchronize COMPLETE END state'
          git push origin HEAD:r15/11-model-export-lineage-final
