name: R12 Tauri2 Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r12-tauri2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri2-windows:
    name: tauri2-windows
    runs-on: windows-2022
    env:
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Kodepoia
        run: python -m pip install -e ".[dev]"
      - name: Select supported Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup default stable-msvc
          rustc -vV
          cargo --version
      - name: Render deterministic Tauri fixture
        run: python scripts/r12_9_tauri_acceptance.py --prepare-only
      - name: Preload locked Rust dependencies as CI infrastructure
        shell: pwsh
        run: |
          $manifest = ".kodepoia/fixtures/tauri2/Cargo.toml"
          cargo generate-lockfile --manifest-path $manifest
          cargo fetch --locked --manifest-path $manifest
          if (-not (Test-Path ".kodepoia/fixtures/tauri2/Cargo.lock")) { throw "Cargo.lock missing after CI preload" }
      - name: Build offline and runtime-probe Tauri WebView2 fixture
        run: python scripts/r12_9_tauri_acceptance.py --output ".kodepoia/evidence/R12_9_TAURI_WINDOWS.json"
      - name: Upload Tauri evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-9-tauri2-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: .kodepoia/evidence/R12_9_TAURI_WINDOWS.json
          if-no-files-found: warn
