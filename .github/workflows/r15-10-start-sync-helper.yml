name: R15.10 START Sync Helper

on:
  push:
    paths:
      - '.github/workflows/r15-10-start-sync-helper.yml'

permissions:
  contents: write

jobs:
  start_sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/10-base-adapter-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded START synchronization
        run: python .github/r15_10_start_sync.py
      - name: Verify and publish clean START head
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only ba37dbc46393ca64d565ee1122fe545cc1b48c2d -- docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md)"
          printf '%s\n' "$changed"
          test "$changed" = $'docs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R15_PLAN.md'
          git diff --check -- docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          rm .github/workflows/r15-10-start-sync-helper.yml .github/r15_10_start_sync.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r15-10-start-sync-helper.yml .github/r15_10_start_sync.py
          git diff --cached --check
          git commit -m 'docs(r15.10): synchronize START state'
          git push origin HEAD:r15/10-base-adapter-evaluation
