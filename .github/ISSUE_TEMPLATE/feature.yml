name: Feature request
description: Propose a feature within the frozen architecture
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user/project problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: foundation
    attributes:
      label: Foundation change?
      options:
        - "No — module/plugin/sub-feature"
        - "Potentially — ADR required"
    validations:
      required: true
