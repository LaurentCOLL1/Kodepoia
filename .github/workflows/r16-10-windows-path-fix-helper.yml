name: R16.10 Windows Path Fix Helper

on:
  push:
    branches:
      - r16/10-representative-godot-2d-beta-project
    paths:
      - .github/workflows/r16-10-windows-path-fix-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: r16/10-representative-godot-2d-beta-project
          fetch-depth: 0
      - name: Apply bounded canonical-path fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/kodepoia/kodegodot/beta_acceptance.py")
          text = path.read_text(encoding="utf-8")
          old = '"snapshot": aggregate_snapshot.relative_to(workspace).as_posix(),'
          new = '"snapshot": aggregate_snapshot.relative_to(safe_change.project_root).as_posix(),'
          if text.count(old) != 1:
              raise SystemExit(f"expected one target, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Validate and freeze clean fix
        run: |
          python -m compileall -q src/kodepoia/kodegodot/beta_acceptance.py
          git diff --check -- src/kodepoia/kodegodot/beta_acceptance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r16-10-windows-path-fix-helper.yml
          git add src/kodepoia/kodegodot/beta_acceptance.py
          expected=$'.github/workflows/r16-10-windows-path-fix-helper.yml\nsrc/kodepoia/kodegodot/beta_acceptance.py'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m "fix(r16.10): canonicalize snapshot path on Windows"
          git push origin HEAD:r16/10-representative-godot-2d-beta-project
