name: R14.6 Focused Temp
on:
  push:
    branches: ["r14/06-authoritative-server-state"]
    paths: [".github/r14-06-focused.trigger"]
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/06-authoritative-server-state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused R14.6 tests
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests/test_r14_6_authoritative_server.py
          python -m pytest -q tests/test_r14_6_authoritative_server.py tests/test_r14_5_postgresql_persistence.py tests/test_r14_4_auth_identity_sessions.py
      - name: Remove temporary workflow and trigger
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/r14-06-focused-temp.yml .github/r14-06-focused.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "R14.6 cleanup focused prevalidation"
          git push origin HEAD:r14/06-authoritative-server-state
