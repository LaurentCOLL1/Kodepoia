name: R15.5 Immutable Dataset Builder Acceptance
on:
  push:
    branches: [r15/05-immutable-dataset-builder]
  pull_request:
    paths:
      - 'src/kodepoia/experience/**'
      - 'tests/test_experience_*.py'
      - 'schemas/experience-dataset-*.schema.json'
      - '.github/workflows/r15-5-dataset-builder.yml'
      - 'docs/roadmap/R15_5_*'
      - 'docs/roadmap/R15_PLAN.md'
      - 'docs/continuity/KODEPOIA_CONTINUITY.md'
permissions:
  contents: read
jobs:
  immutable-dataset-builder:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: R15 experience regression plus R15.5 dataset tests
        run: >-
          python -m pytest -q
          tests/test_experience_contracts.py
          tests/test_experience_collector.py
          tests/test_experience_governance.py
          tests/test_experience_dedup.py
          tests/test_experience_dataset.py
      - name: Ruff experience dataset surface
        run: >-
          python -m ruff check
          src/kodepoia/experience
          tests/test_experience_contracts.py
          tests/test_experience_collector.py
          tests/test_experience_governance.py
          tests/test_experience_dedup.py
          tests/test_experience_dataset.py
      - name: Compile experience package
        run: python -m compileall -q src/kodepoia/experience
