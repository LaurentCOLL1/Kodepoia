name: R18.1 Normalization Transport

on:
  push:
    branches:
      - transport/r18-1-normalization
    paths:
      - scripts/r18_1_normalization_transport.py

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Generate continuity normalization
        run: python scripts/r18_1_normalization_transport.py

      - name: Commit generated continuity only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          staged="$(git diff --cached --name-only)"
          test "$staged" = "docs/continuity/KODEPOIA_CONTINUITY.md"
          git diff --cached --check
          git commit -m "docs(r18.1): generate post-merge normalization"
          git push origin HEAD:transport/r18-1-normalization
