name: R15.5 END Sync Helper
on:
  push:
    branches: [r15/05-immutable-dataset-builder]
    paths: ['.github/workflows/r15-5-end-sync-helper.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/05-immutable-dataset-builder
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch bounded R15.5 END records
        shell: python
        run: |
          from pathlib import Path
          import re

          source = "1ecdfda67a23d8659e48e4c76f805a45a1560ec5"
          focused = "R15.5 #4 / 33288632868"
          r0 = "R0 #2102 / 33288632870"
          python_core = "Python Core #2077 / 33288632943"
          ui = "KodeStudio UI Smoke #2042 / 33288632867"

          plan_path = Path("docs/roadmap/R15_PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          old_checkpoint = "**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. R15.1–R15.4 are COMPLETE + NORMALIZED. R15.5 is IN_PROGRESS from normalized R15.4 `main` `8744df5f3a408595693c67819a29f95b3a82f1d7` on dedicated branch `r15/05-immutable-dataset-builder`; R15.6–R15.17 remain PLANNED."
          new_checkpoint = f"**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. R15.1–R15.4 are COMPLETE + NORMALIZED. R15.5 is COMPLETE on immutable technical source `{source}` with fresh technical acceptance recorded below; post-merge continuity normalization is still required before R15.6. R15.6–R15.17 remain PLANNED."
          assert plan.count(old_checkpoint) == 1
          plan = plan.replace(old_checkpoint, new_checkpoint, 1)
          old_row = "| R15.5 | Immutable dataset builder, group-safe deterministic splits, manifests + dataset cards | IN_PROGRESS | NONE | R15.1–R15.4 |"
          new_row = "| R15.5 | Immutable dataset builder, group-safe deterministic splits, manifests + dataset cards | COMPLETE | NONE | R15.1–R15.4 |"
          assert plan.count(old_row) == 1
          plan = plan.replace(old_row, new_row, 1)
          marker = re.search(r"\n---\n\n# R15\.6\b", plan)
          assert marker is not None
          record = f'''\n## R15.5 implementation evidence\n\n- Clean START: `4c9bee744e4c43ef130e50c4867ca3d467878c51` from normalized R15.4 `main` `8744df5f3a408595693c67819a29f95b3a82f1d7`.\n- Immutable technical source: `{source}`.\n- Exact-source focused acceptance: {focused} SUCCESS on Ubuntu + Windows; both jobs passed exact checkout, cumulative R15 Experience regression tests, R15.5 adversarial dataset tests, Ruff and compileall.\n- Exact-source repository qualification: {r0} SUCCESS, {python_core} SUCCESS 5/5, {ui} SUCCESS.\n- Accepted scope: policy-digest-bound immutable dataset construction, authoritative R15.4 group-safe deterministic splits, contamination exclusion, tokenizer-independent text/prompt-completion/conversational JSONL, deterministic domain and `(domain, task)` balancing, safe provenance, strict manifest/card schemas, export hashes/byte statistics, and fail-closed manifest↔JSONL reconciliation.\n- Local interoperability adapters expose repository files and Hugging Face-compatible `README.md` + `train.jsonl` / `validation.jsonl` / `test.jsonl` naming without network access, account use or publication authorization.\n- Manual state: **NONE**.\n- R15.6 remains blocked until this END-sync receives fresh exact-head gates, PR #304 merges with expected head, and the unique continuity-only post-merge normalization passes fresh R0/Python/UI and merges.\n'''
          plan = plan[:marker.start()] + record + plan[marker.start():]
          plan_path.write_text(plan, encoding="utf-8", newline="\n")

          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          continuity = continuity_path.read_text(encoding="utf-8")
          old_top = "> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1–R15.4 COMPLETE + NORMALIZED; R15.5 IN_PROGRESS; R15.6–R15.17 PLANNED.** R15.5 exact branch point is normalized R15.4 `main` `8744df5f3a408595693c67819a29f95b3a82f1d7`; dedicated branch `r15/05-immutable-dataset-builder`; manual NONE. Dataset construction remains fail-closed: only curated, fully authorized, sanitized, uncontaminated records may enter; R15.4 duplicate groups must remain split-atomic and protected holdouts remain forbidden."
          new_top = f"> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1–R15.4 COMPLETE + NORMALIZED; R15.5 COMPLETE / NORMALIZATION PENDING; R15.6–R15.17 PLANNED.** R15.5 immutable technical source `{source}` is accepted on fresh exact-source focused/R0/Python/UI evidence; PR #304 END-head re-gates and unique post-merge continuity-only normalization remain mandatory before R15.6. Manual NONE. Dataset construction remains fail-closed: only curated, fully authorized, sanitized, uncontaminated records may enter; R15.4 duplicate groups remain split-atomic, protected holdouts remain forbidden, and manifest↔JSONL reconciliation is mandatory."
          assert continuity.count(old_top) == 1
          continuity = continuity.replace(old_top, new_top, 1)
          old_line = "- R15.5 : **IN_PROGRESS** — exact branch point normalized R15.4 `main` `8744df5f3a408595693c67819a29f95b3a82f1d7`; branch `r15/05-immutable-dataset-builder`; START-sync only, no R15.5 implementation precedes this state; manual NONE."
          new_line = f"- R15.5 : **COMPLETE / NORMALIZATION PENDING** — clean START `4c9bee744e4c43ef130e50c4867ca3d467878c51` from normalized R15.4 `main` `8744df5f3a408595693c67819a29f95b3a82f1d7`; immutable technical source `{source}`; exact-source {focused} SUCCESS Ubuntu + Windows, {r0} SUCCESS, {python_core} SUCCESS 5/5, {ui} SUCCESS; PR #304 open on exact source pending END-sync exact-head re-gates; manual NONE. R15.5 enforces authoritative R15.4 group-atomic splits, contamination exclusion, deterministic domain/task-domain balancing, safe provenance and fail-closed manifest↔JSONL digest reconciliation. R15.6 remains blocked until merge plus unique continuity-only normalization."
          assert continuity.count(old_line) == 1
          continuity = continuity.replace(old_line, new_line, 1)
          continuity_path.write_text(continuity, encoding="utf-8", newline="\n")

          design_path = Path("docs/roadmap/R15_5_DESIGN.md")
          design = design_path.read_text(encoding="utf-8")
          assert design.count("**Status:** IMPLEMENTED / TECHNICAL GATES PENDING") == 1
          design = design.replace("**Status:** IMPLEMENTED / TECHNICAL GATES PENDING", "**Status:** TECHNICAL SOURCE ACCEPTED / END-HEAD GATES PENDING", 1)
          pending = "Pending fresh exact-head R15.5 acceptance on Ubuntu + Windows, followed by R0 Repository Guard, full Python Core and KodeStudio UI Smoke."
          evidence = f"Immutable technical source `{source}` passed {focused} on Ubuntu + Windows, {r0}, {python_core} 5/5 and {ui}, all SUCCESS. These are source-qualification proofs only; fresh gates on the final documentation END-head are still required before PR #304 merge."
          assert design.count(pending) == 1
          design = design.replace(pending, evidence, 1)
          design_path.write_text(design, encoding="utf-8", newline="\n")

          acceptance_path = Path("docs/roadmap/R15_5_ACCEPTANCE.md")
          acceptance = acceptance_path.read_text(encoding="utf-8")
          assert acceptance.count("**Acceptance state:** IMPLEMENTED / TECHNICAL GATES PENDING") == 1
          acceptance = acceptance.replace("**Acceptance state:** IMPLEMENTED / TECHNICAL GATES PENDING", "**Acceptance state:** TECHNICAL SOURCE ACCEPTED / END-HEAD GATES PENDING", 1)
          pending_evidence = "Pending fresh exact-head R15.5 acceptance after completion of the full planned scope. No stale run or pre-correction SUCCESS claim is accepted as final evidence."
          accepted_evidence = f"Immutable technical source `{source}`: {focused} SUCCESS Ubuntu + Windows; {r0} SUCCESS; {python_core} SUCCESS 5/5; {ui} SUCCESS. The earlier `f03a08465e1d2a0c0fed507971360f7fdc5e2f06` successes remain explicitly non-authoritative because the task/domain balancing and manifest↔JSONL reconciliation scope was subsequently completed. Fresh exact-END-head gates are still required after this documentation synchronization."
          assert acceptance.count(pending_evidence) == 1
          acceptance = acceptance.replace(pending_evidence, accepted_evidence, 1)
          acceptance_path.write_text(acceptance, encoding="utf-8", newline="\n")
      - name: Validate bounded sync
        shell: bash
        run: |
          git diff --check
          python scripts/check_repo.py
          expected=$'docs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R15_5_ACCEPTANCE.md\ndocs/roadmap/R15_5_DESIGN.md\ndocs/roadmap/R15_PLAN.md'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
      - name: Commit END sync and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15-5-end-sync-helper.yml
          git add docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R15_PLAN.md docs/roadmap/R15_5_DESIGN.md docs/roadmap/R15_5_ACCEPTANCE.md
          git diff --cached --check
          git commit -m "docs(r15.5): synchronize accepted technical source"
          git push origin HEAD:r15/05-immutable-dataset-builder
