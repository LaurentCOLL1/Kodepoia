name: R15.4 post-merge normalization helper

on:
  push:
    branches:
      - r15/04-post-merge-normalization

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/04-post-merge-normalization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install R0 dependencies
        run: python -m pip install -r scripts/requirements-r0.txt
      - name: Apply continuity-only normalization
        run: python scripts/r15_4_post_merge_normalize.py
      - name: Validate repository
        run: |
          git diff --check
          python scripts/check_repo.py
      - name: Commit normalized continuity and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/r15_4_post_merge_normalize.py
          rm .github/workflows/r15_4_post_merge_normalize.yml
          git add -A
          git commit -m "docs(r15.4): normalize post-merge continuity"
          changed="$(git diff --name-only 195920e06fb6487fe58be4247ba9b90a75b96dad...HEAD)"
          test "$changed" = "docs/continuity/KODEPOIA_CONTINUITY.md"
          test -z "$(git diff 195920e06fb6487fe58be4247ba9b90a75b96dad...HEAD -- docs/roadmap/R15_PLAN.md)"
          git push origin HEAD:r15/04-post-merge-normalization
