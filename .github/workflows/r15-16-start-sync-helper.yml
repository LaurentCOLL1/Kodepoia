name: R15.16 START synchronization helper

on:
  push:
    branches:
      - r15/16-hardware-local-qualification
    paths:
      - .github/workflows/r15-16-start-sync-helper.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/16-hardware-local-qualification
          fetch-depth: 0
      - name: Synchronize R15.16 START authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          normalized_main = "01f91fd4b56ed2a02151b46d70502b734c771e7f"
          normalization_head = "aee4cd4006b48c14ff5d0795a12cf235158c971a"
          implementation_merge = "38de802865ca66f6c9b37589b0895821b652f0a9"
          final_end = "5d1f6f5761f46dd911eee99c4088dd19abf9d0cb"
          r15_run = "33336221022"
          impl_r0 = "33336220940"
          impl_python = "33336220978"
          impl_ui = "33336220979"
          norm_r0 = "33336553267"
          norm_python = "33336553314"
          norm_ui = "33336553193"

          plan_path = Path("docs/roadmap/R15_PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          lines = plan.splitlines()
          for index, line in enumerate(lines):
              if line.startswith("**Execution checkpoint:**"):
                  lines[index] = (
                      "**Execution checkpoint:** R1–R14 are COMPLETE + NORMALIZED; R15 planning is ACCEPTED + NORMALIZED. "
                      "R15.1–R15.15 are COMPLETE + NORMALIZED. R15.16 is IN_PROGRESS from normalized `main` `" + normalized_main +
                      "`; R15.17 remains PLANNED and unauthorized until R15.16 completes, merges, and receives its unique post-merge normalization."
                  )
                  break
          else:
              raise SystemExit("R15_PLAN execution checkpoint not found")
          plan = "\n".join(lines) + "\n"
          replacements = {
              "| R15.13 | Ollama import/Modelfile packaging, base-binding + local runtime verification | COMPLETE | CONDITIONAL / NOT TRIGGERED | R15.10–R15.12 + R3 |":
              "| R15.13 | Ollama import/Modelfile packaging, base-binding + local runtime verification | COMPLETE + NORMALIZED | CONDITIONAL / NOT TRIGGERED | R15.10–R15.12 + R3 |",
              "| R15.15 | CLI + KodeStudio Experience/Bench/Tune UX, dry-run/status/evidence workflows | COMPLETE | NONE | R15.1–R15.14 |":
              "| R15.15 | CLI + KodeStudio Experience/Bench/Tune UX, dry-run/status/evidence workflows | COMPLETE + NORMALIZED | NONE | R15.1–R15.14 |",
              "| R15.16 | Hardware-local end-to-end qualification + reproducibility/resource acceptance | PLANNED | CONDITIONAL | R15.1–R15.15 |":
              "| R15.16 | Hardware-local end-to-end qualification + reproducibility/resource acceptance | IN_PROGRESS | CONDITIONAL / NOT TRIGGERED | R15.1–R15.15 |",
          }
          for old, new in replacements.items():
              if old not in plan:
                  raise SystemExit(f"R15_PLAN status row not found: {old}")
              plan = plan.replace(old, new, 1)

          marker = "## Completion record\n\nTo be appended when accepted.\n\n---\n\n# R15.17 — Adversarial integrated Experience/Bench/Fine-tuning acceptance"
          start_record = (
              "## START record\n\n"
              "**IN_PROGRESS — clean START from normalized R15.15 `main` `" + normalized_main + "`.**\n\n"
              "- R15.15 final exact END-head: `" + final_end + "`; exact-END R15.15 #12 / `" + r15_run + "`, R0 #2216 / `" + impl_r0 + "`, Python Core #2191 / `" + impl_python + "` 5/5 and UI #2156 / `" + impl_ui + "` SUCCESS;\n"
              "- implementation/evidence merge: `" + implementation_merge + "`;\n"
              "- unique R15.15 normalization head: `" + normalization_head + "`; normalization R0 #2218 / `" + norm_r0 + "`, Python Core #2193 / `" + norm_python + "` 5/5 and UI #2158 / `" + norm_ui + "` SUCCESS; normalization PR #327 -> normalized `main` `" + normalized_main + "`;\n"
              "- dedicated branch: `r15/16-hardware-local-qualification`;\n"
              "- manual state at START: `CONDITIONAL / NOT TRIGGERED`; hosted CI must not fabricate target-workstation GPU/backend support.\n\n"
              "## Completion record\n\nTo be appended when accepted.\n\n---\n\n# R15.17 — Adversarial integrated Experience/Bench/Fine-tuning acceptance"
          )
          if marker not in plan:
              raise SystemExit("R15.16 completion marker not found")
          plan = plan.replace(marker, start_record, 1)
          plan_path.write_text(plan, encoding="utf-8")

          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          continuity = continuity_path.read_text(encoding="utf-8")
          old_header = continuity.splitlines()[0]
          if not old_header.startswith("> Kodepoia, architecture v1.0 gelée."):
              raise SystemExit("continuity authority header not found")
          new_header = (
              "> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. "
              "R15.1–R15.15 COMPLETE + NORMALIZED; R15.16 IN_PROGRESS; R15.17 PLANNED.** R15.15 final END-head `" + final_end +
              "` passed R15.15 #12 / `" + r15_run + "`, R0 #2216 / `" + impl_r0 + "`, Python Core #2191 / `" + impl_python +
              "` 5/5 and UI #2156 / `" + impl_ui + "`; implementation PR #326 merged as `" + implementation_merge +
              "`. Unique normalization head `" + normalization_head + "` passed R0 #2218 / `" + norm_r0 + "`, Python Core #2193 / `" +
              norm_python + "` 5/5 and UI #2158 / `" + norm_ui + "`; normalization PR #327 merged as normalized `main` `" + normalized_main +
              "`. R15.16 starts only from that exact main on `r15/16-hardware-local-qualification`; manual state CONDITIONAL / NOT TRIGGERED."
          )
          continuity = continuity.replace(old_header, new_header, 1)
          continuity = continuity.replace("| R15.15 | COMPLETE / NORMALIZATION PENDING | NONE |", "| R15.15 | COMPLETE + NORMALIZED | NONE |", 1)
          continuity = continuity.replace("| R15.16 | PLANNED | CONDITIONAL |", "| R15.16 | IN_PROGRESS | CONDITIONAL / NOT TRIGGERED |", 1)

          old_bullet = (
              "- R15.15 : **COMPLETE / NORMALIZATION PENDING** — normalized R15.14 base `ea724b4d1a84c9f6105d2419f85d6cdb6ecda30e`; immutable technical source `7ede682ec2c21d89e42886a5774115278b0fbb2c`; final exact END-head `" + final_end + "`; exact-END R15.15 #12 / `" + r15_run + "` SUCCESS Ubuntu + Windows, R0 #2216 / `" + impl_r0 + "` SUCCESS Ubuntu + Windows, Python Core #2191 / `" + impl_python + "` SUCCESS 5/5 and KodeStudio UI Smoke #2156 / `" + impl_ui + "` SUCCESS. The accepted surface provides typed Experience/Dataset/Bench/Gap/Training/Conversion/Ollama/Registry workflows, non-mutating dry-run defaults, explicit mutation confirmation, fail-closed absent backends, project-scoped SHA-256 evidence with recursive redaction, accessible FR/EN/pseudo KodeStudio controls and worker-thread execution for governed long operations. PR #326 merged with `expected_head_sha=" + final_end + "` as implementation/evidence `main` `" + implementation_merge + "`. Manual NONE. This record is the unique post-merge continuity-only normalization authority; it becomes COMPLETE + NORMALIZED only after this normalization head passes fresh R0/Python/UI and the normalization PR merges with exact expected-head protection. R15.16 remains unauthorized until then."
          )
          new_bullet = (
              "- R15.15 : **COMPLETE + NORMALIZED** — normalized R15.14 base `ea724b4d1a84c9f6105d2419f85d6cdb6ecda30e`; immutable technical source `7ede682ec2c21d89e42886a5774115278b0fbb2c`; final exact END-head `" + final_end + "`; exact-END R15.15 #12 / `" + r15_run + "` SUCCESS Ubuntu + Windows, R0 #2216 / `" + impl_r0 + "` SUCCESS Ubuntu + Windows, Python Core #2191 / `" + impl_python + "` SUCCESS 5/5 and KodeStudio UI Smoke #2156 / `" + impl_ui + "` SUCCESS. PR #326 merged exact head as implementation/evidence `main` `" + implementation_merge + "`. Unique continuity-only normalization head `" + normalization_head + "` passed R0 #2218 / `" + norm_r0 + "`, Python Core #2193 / `" + norm_python + "` 5/5 and UI #2158 / `" + norm_ui + "`, then normalization PR #327 merged exact head as normalized `main` `" + normalized_main + "`. Manual NONE."
          )
          if old_bullet not in continuity:
              raise SystemExit("continuity R15.15 normalization bullet not found")
          continuity = continuity.replace(old_bullet, new_bullet, 1)

          old_next = "**R15.15 normalization only: this branch must change only `docs/continuity/KODEPOIA_CONTINUITY.md`; require fresh exact-head R0 Repository Guard + full Python Core + KodeStudio UI Smoke, then merge the single normalization PR only with `expected_head_sha`. R15.16 START-sync is authorized only from the normalized `main` produced by that merge. Manual state: NONE.**"
          new_next = "**R15.16 only: implement the frozen hardware-local doctor/acceptance runner from normalized `main` `" + normalized_main + "`. Hosted CI must validate schemas, fixtures and truthful supported/unavailable paths without fabricating target-hardware capability. Manual state starts CONDITIONAL / NOT TRIGGERED; if a real target-workstation training/conversion/promotion claim becomes required, stop before R15.17 and request only the bounded local evidence defined by R15.16. R15.17 remains unauthorized.**"
          if old_next not in continuity:
              raise SystemExit("continuity R15.16 next action anchor not found")
          continuity = continuity.replace(old_next, new_next, 1)
          continuity_path.write_text(continuity, encoding="utf-8")
          PY

          rm .github/workflows/r15-16-start-sync-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r15-16-start-sync-helper.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --name-only | grep -Fx 'docs/roadmap/R15_PLAN.md'
          git diff --cached --name-only | grep -Fx 'docs/continuity/KODEPOIA_CONTINUITY.md'
          git diff --cached --name-only | grep -Fx '.github/workflows/r15-16-start-sync-helper.yml'
          git commit -m "docs(r15.16): synchronize START authority"
          git push origin HEAD:r15/16-hardware-local-qualification
