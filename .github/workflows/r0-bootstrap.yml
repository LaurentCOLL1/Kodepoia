name: R0 Repository Guard

on:
  push:
    branches:
      - "r15/**"

permissions:
  contents: write

jobs:
  normalize-r15-table:
    if: github.ref == 'refs/heads/r15/phase-normalization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Normalize R15.17 table state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          text = path.read_text(encoding='utf-8')
          old = '| R15.17 | COMPLETE | CONDITIONAL / NOT TRIGGERED |'
          new = '| R15.17 | COMPLETE + NORMALIZED | CONDITIONAL / NOT TRIGGERED |'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('R15.17 table authority not found')
          PY
          if git diff --quiet -- docs/continuity/KODEPOIA_CONTINUITY.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          test "$(git diff --cached --name-only)" = "docs/continuity/KODEPOIA_CONTINUITY.md"
          git commit -m 'R15 normalize phase status table authority'
          git push origin HEAD:r15/phase-normalization
