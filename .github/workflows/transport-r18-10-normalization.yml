name: Transport R18.10 normalization

on:
  push:
    branches:
      - transport/r18-10-normalization-20260906

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply continuity-only normalization
        run: python .github/transport/r18_10_normalization.py
