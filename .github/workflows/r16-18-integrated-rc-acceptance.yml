name: Temporary R16 Phase Normalization Builder

on:
  push:
    branches:
      - scratch/r16-phase-normalization-builder
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout scratch builder object database
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Build unique continuity-only normalization from Git objects
        shell: bash
        env:
          BASE_SHA: c03d5cb003aec4140d8f7429240980d26d01b7ba
          TARGET_BRANCH: r16/phase-continuity-normalization
        run: |
          set -euo pipefail
          git config user.name "LaurentCOLL1"
          git config user.email "128934707+LaurentCOLL1@users.noreply.github.com"
          git fetch origin "$BASE_SHA"
          tmp="$RUNNER_TEMP/KODEPOIA_CONTINUITY.md"
          git show "$BASE_SHA:docs/continuity/KODEPOIA_CONTINUITY.md" > "$tmp"
          CONTINUITY_TMP="$tmp" python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["CONTINUITY_TMP"])
          text = path.read_text(encoding="utf-8")
          trailing_newline = text.endswith("\n")

          _, remainder = text.split("\n\n", 1)
          first = (
              "> Kodepoia, architecture v1.0 gelée. **R1–R15 COMPLETE + NORMALIZED. R16 planning ACCEPTED + NORMALIZED. "
              "R16.1–R16.17 COMPLETE + NORMALIZED on `main` `41706493d974799b7011953e584b887ca6db1996`. "
              "R16.18 final exact-END `1efcf82721ccef000d3cf335ad89132fb742fceb` passed fresh R16.18 #21 / `33859618254`, "
              "R16.9 #86 / `33859618312`, R0 #2409 / `33859618319`, Python Core #2381 / `33859618371` 5/5 and "
              "KodeStudio UI Smoke #2346 / `33859618310`, then PR #373 merged with exact expected head as implementation/evidence "
              "`main` `c03d5cb003aec4140d8f7429240980d26d01b7ba`. This record is the unique post-merge continuity-only R16 phase "
              "normalization authority; once this exact record is present on `main` through its fresh exact-head R0/Python/UI-gated merge, "
              "R16 is COMPLETE + NORMALIZED and the v1.0 phase is complete.** Immutable R16.18 technical source remains "
              "`230ff65feaaa50e9b0c740658e06c74976448908`; integrated authority is 33/33 fresh and non-circular with `critical_veto=false` "
              "and cross-platform RC bytes identical. Optional live-capability/manual evidence remains CONDITIONAL / NOT TRIGGERED; no production "
              "signing, public/store publication or provider/domain cutover is claimed."
          )
          text = first + "\n\n" + remainder

          lines = text.splitlines()
          if not any(line.startswith("- R16 :") for line in lines):
              planning_idx = next(i for i, line in enumerate(lines) if line.startswith("- R16 planning :"))
              lines.insert(
                  planning_idx + 1,
                  "- R16 : **COMPLETE + NORMALIZED effective when this unique phase-normalization record enters `main` through its exact gated merge** — immutable R16.18 technical source "
                  "`230ff65feaaa50e9b0c740658e06c74976448908`; final exact-END `1efcf82721ccef000d3cf335ad89132fb742fceb`; exact-END "
                  "R16.18 #21 / `33859618254`, R16.9 #86 / `33859618312`, R0 #2409 / `33859618319`, Python Core #2381 / `33859618371` "
                  "5/5 and UI #2346 / `33859618310` all SUCCESS; PR #373 merged with `expected_head_sha=1efcf82721ccef000d3cf335ad89132fb742fceb` "
                  "as implementation/evidence `main` `c03d5cb003aec4140d8f7429240980d26d01b7ba`. Canonical integrated authority digest "
                  "`43bb342e1c888a07f6ce64c75b7da5e9aadf0e3e09fada478f81cb320def359a`; 33/33 exact-source reports, blockers empty, "
                  "`critical_veto=false`, RC packages byte-identical cross-platform. This continuity-only record is the single authorized R16 phase "
                  "normalization authority; no second R16 phase normalization is authorized. Phase completion does not imply a public release."
              )
          text = "\n".join(lines) + ("\n" if trailing_newline else "")

          old_state = (
              "- R16.18 state: **COMPLETE at END-sync**; core integrated acceptance manual state **NONE**. Optional live-capability evidence remains "
              "**CONDITIONAL / NOT TRIGGERED** and `NOT_EXERCISED`. R16/v1.0 phase closure remains pending fresh exact-END re-gates, exact-head "
              "implementation/evidence merge, and the unique post-merge continuity-only R16 phase normalization."
          )
          new_state = (
              "- R16.18 state: **COMPLETE at END-sync**; core integrated acceptance manual state **NONE**. Optional live-capability evidence remains "
              "**CONDITIONAL / NOT TRIGGERED** and `NOT_EXERCISED`. Fresh exact-END re-gates and the exact-head implementation/evidence merge are complete; "
              "the single remaining authority boundary is this continuity-only R16 phase normalization receiving fresh exact-head R0/Python/UI and entering `main` by exact-head merge."
          )
          if old_state not in text:
              raise SystemExit("R16.18 state authority anchor missing")
          text = text.replace(old_state, new_state, 1)

          source_anchor = (
              "- Exact normalized base: `main` `41706493d974799b7011953e584b887ca6db1996`; immutable technical source "
              "`230ff65feaaa50e9b0c740658e06c74976448908`.\n"
          )
          source_addition = (
              "- Final exact-END head `1efcf82721ccef000d3cf335ad89132fb742fceb` is a direct child of the immutable technical source and changes only "
              "`docs/roadmap/R16_PLAN.md` plus `docs/continuity/KODEPOIA_CONTINUITY.md`; helper/workflow staging is absent from the decision head.\n"
              "- Fresh exact-END gates on that exact SHA are all SUCCESS: R16.18 #21 / `33859618254`; R16.9 #86 / `33859618312`; "
              "R0 Repository Guard #2409 / `33859618319`; Python Core #2381 / `33859618371` 5/5; KodeStudio UI Smoke #2346 / `33859618310`.\n"
              "- PR #373 merged only with `expected_head_sha=1efcf82721ccef000d3cf335ad89132fb742fceb` as implementation/evidence `main` "
              "`c03d5cb003aec4140d8f7429240980d26d01b7ba`.\n"
          )
          if source_anchor not in text:
              raise SystemExit("R16.18 source anchor missing")
          text = text.replace(source_anchor, source_anchor + source_addition, 1)

          old_end_requirement = (
              "- This END-sync changes only `docs/roadmap/R16_PLAN.md` and `docs/continuity/KODEPOIA_CONTINUITY.md` relative to immutable technical source "
              "`230ff65feaaa50e9b0c740658e06c74976448908`. Its exact resulting END head must pass fresh R16.18/R16.9/R0/Python/UI SUCCESS before "
              "PR #373 may merge with `expected_head_sha` equal to that exact head."
          )
          new_end_requirement = (
              "- The accepted END-sync changes only `docs/roadmap/R16_PLAN.md` and `docs/continuity/KODEPOIA_CONTINUITY.md` relative to immutable technical "
              "source `230ff65feaaa50e9b0c740658e06c74976448908`; final exact-END `1efcf82721ccef000d3cf335ad89132fb742fceb` passed the required fresh "
              "R16.18/R16.9/R0/Python/UI gates and PR #373 merged from that exact head."
          )
          if old_end_requirement not in text:
              raise SystemExit("R16.18 END requirement anchor missing")
          text = text.replace(old_end_requirement, new_end_requirement, 1)

          section = (
              "## R16 phase post-merge normalization authority\n\n"
              "- Implementation/evidence merge base: `main` `c03d5cb003aec4140d8f7429240980d26d01b7ba`, produced only after final exact-END "
              "`1efcf82721ccef000d3cf335ad89132fb742fceb` passed fresh R16.18 #21 / `33859618254`, R16.9 #86 / `33859618312`, "
              "R0 Repository Guard #2409 / `33859618319`, Python Core #2381 / `33859618371` 5/5 and KodeStudio UI Smoke #2346 / `33859618310`.\n"
              "- PR #373 merged with exact expected-head protection from `1efcf82721ccef000d3cf335ad89132fb742fceb` as implementation/evidence `main` "
              "`c03d5cb003aec4140d8f7429240980d26d01b7ba`. The accepted R16.18 technical source remains "
              "`230ff65feaaa50e9b0c740658e06c74976448908`; canonical authority digest remains "
              "`43bb342e1c888a07f6ce64c75b7da5e9aadf0e3e09fada478f81cb320def359a`.\n"
              "- Dedicated normalization branch: `r16/phase-continuity-normalization`, created exactly from implementation/evidence `main` "
              "`c03d5cb003aec4140d8f7429240980d26d01b7ba`. Its authoritative decision tree may change only "
              "`docs/continuity/KODEPOIA_CONTINUITY.md`; `docs/roadmap/R16_PLAN.md`, workflows, implementation/runtime/test bytes, policies and RC package logic remain "
              "identical to the implementation/evidence merge. No temporary helper or helper workflow may exist on the normalization decision head.\n"
              "- This is the single authorized post-merge R16 phase normalization. Before this record may enter `main`, its exact candidate head must pass fresh "
              "R0 Repository Guard Ubuntu + Windows, full Python Core 5/5 and KodeStudio UI Smoke, then merge with `expected_head_sha` equal to that exact candidate. "
              "No second R16 phase normalization is permitted.\n"
              "- Core R16.18 manual state remains **NONE**; optional live-capability evidence remains **CONDITIONAL / NOT TRIGGERED** / `NOT_EXERCISED`. "
              "No production credential, production signing, public/store publication, provider/domain cutover or automatic public release is claimed by normalization.\n"
              "- Once this exact continuity record is present on `main` as the result of that gated exact-head merge, R16 is **COMPLETE + NORMALIZED** and the v1.0 phase is complete; no further R16 normalization or subdivision is authorized.\n\n"
          )
          marker = "## R16 status index\n"
          if marker not in text:
              raise SystemExit("R16 status marker missing")
          text = text.replace(marker, section + marker, 1)

          old_row = "| R16.18 | COMPLETE | CONDITIONAL / NOT TRIGGGERED |"
          new_row = "| R16.18 | COMPLETE + NORMALIZED (effective on phase-normalization merge) | CONDITIONAL / NOT TRIGGERED |"
          if old_row not in text:
              raise SystemExit("R16.18 status row missing")
          text = text.replace(old_row, new_row, 1)

          next_heading = "## Next authorized action\n"
          permanent_heading = "\n## Permanent R-phase execution rule"
          start = text.index(next_heading)
          end = text.index(permanent_heading, start)
          final_block = (
              "## Final phase state\n\n"
              "This continuity-only record is the single authorized R16 phase-normalization authority. Before it may enter `main`, its exact candidate head must receive fresh SUCCESS from "
              "R0 Repository Guard, full Python Core and KodeStudio UI Smoke, and the normalization PR must merge only with `expected_head_sha` equal to that candidate. "
              "Once this exact record is present on `main` as the result of that gated merge, R16 is **COMPLETE + NORMALIZED** and the v1.0 phase is complete; no further R16 "
              "normalization or subdivision is authorized. Phase completion does not imply public release, production signing, public/store publication or provider/domain cutover, "
              "and optional live-capability claims remain CONDITIONAL / NOT TRIGGERED.\n"
          )
          text = text[:start] + final_block + text[end:]

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          blob_sha="$(git hash-object -w "$tmp")"
          export GIT_INDEX_FILE="$RUNNER_TEMP/r16-normalization.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$BASE_SHA"
          git update-index --cacheinfo 100644,"$blob_sha",docs/continuity/KODEPOIA_CONTINUITY.md
          tree_sha="$(git write-tree)"
          commit_sha="$(printf '%s\n' 'R16: normalize phase continuity' | git commit-tree "$tree_sha" -p "$BASE_SHA")"
          changed="$(git diff-tree --no-commit-id --name-only -r "$commit_sha")"
          test "$changed" = "docs/continuity/KODEPOIA_CONTINUITY.md"
          test "$(git rev-parse "$commit_sha^")" = "$BASE_SHA"
          test "$(git show "$commit_sha:.github/workflows/r16-18-integrated-rc-acceptance.yml" | git hash-object --stdin)" = "ca252eb658375e2a7bfcf9e20aafd522037ac6cf"
          git push origin "$commit_sha:refs/heads/$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$BASE_SHA"
          echo "normalization_sha=$commit_sha"
