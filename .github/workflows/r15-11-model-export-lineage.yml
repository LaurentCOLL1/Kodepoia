name: R15.11 Model Export Lineage Acceptance

on:
  push:
    branches: [r15/11-model-export-lineage]
  pull_request:
    paths:
      - 'src/kodepoia/tuning/export.py'
      - 'tests/test_model_export_r15_11.py'
      - 'schemas/r15-11-model-export.schema.json'
      - '.github/workflows/r15-11-model-export-lineage.yml'
      - 'docs/roadmap/R15_PLAN.md'
      - 'docs/continuity/KODEPOIA_CONTINUITY.md'

permissions:
  contents: read

jobs:
  model-export-lineage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core development dependencies
        run: python -m pip install -e ".[dev]"
      - name: R15.11 focused tests
        run: python -m pytest -q tests/test_model_export_r15_11.py
      - name: Ruff R15.11-owned surface
        run: python -m ruff check src/kodepoia/tuning/export.py tests/test_model_export_r15_11.py
      - name: Compile R15.11 surface
        run: python -m compileall -q src/kodepoia/tuning/export.py
      - name: Validate R15.11 JSON schema
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          path = Path('schemas/r15-11-model-export.schema.json')
          Draft202012Validator.check_schema(json.loads(path.read_text(encoding='utf-8')))
          PY
