name: R16.7 END Sync Helper

on:
  push:
    branches:
      - r16/07-memory-context-poisoning-hardening
    paths:
      - .github/workflows/r16-7-end-sync-helper.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R16.7 branch
        uses: actions/checkout@v4
        with:
          ref: r16/07-memory-context-poisoning-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch bounded R16.7 END records
        shell: python
        run: |
          from pathlib import Path
          import re

          source = "f095781fde179045fcbcf7fb89661f72f9c51c46"
          focused = "R16.7 #3 / 33548649753"
          r0 = "R0 #2299 / 33548649697"
          python_core = "Python Core #2271 / 33548649730"
          ui = "KodeStudio UI Smoke #2236 / 33548649767"
          semantic = "da712c044ecc6fc7a6a7263c512603ffabe7f55ef126d3ad6214e2135fe60136"
          linux_artifact = "9816508603 / archive sha256:20f5b1f01c3bcb9272813f82a8b54932a857a2910dfc1a16682c425ae2b04acc / payload sha256:a4a699a2da38d68c4571d846614fba07425746039bf510e8bdb83175dc1787ed"
          windows_artifact = "9816556278 / archive sha256:65b69553bcd265e0d7cd1b681719abf0b383238a92003de77da31319a9ee7b7f / payload sha256:a79b8b777038efbeb7b1be985d4018de3828fa034a4b8aa26631dea439512fba"

          plan_path = Path("docs/roadmap/R16_PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          old_checkpoint = "**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + NORMALIZED. R16.1–R16.6 are COMPLETE + NORMALIZED. R16.7 is IN_PROGRESS from normalized `main` `9c358e48e97352046160d48cee0417ade435b6ac` on dedicated branch `r16/07-memory-context-poisoning-hardening`. R16.8–R16.18 remain PLANNED."
          new_checkpoint = f"**Execution checkpoint:** R1–R15 are COMPLETE + NORMALIZED. R16 planning is ACCEPTED + NORMALIZED. R16.1–R16.6 are COMPLETE + NORMALIZED. R16.7 is COMPLETE on immutable technical source `{source}` with fresh technical acceptance recorded below; post-merge continuity normalization is still required before R16.8. R16.8–R16.18 remain PLANNED."
          assert plan.count(old_checkpoint) == 1
          plan = plan.replace(old_checkpoint, new_checkpoint, 1)

          old_row = "| R16.7 | Memory/context poisoning detection, quarantine and rebuild | IN_PROGRESS | NONE |"
          new_row = "| R16.7 | Memory/context poisoning detection, quarantine and rebuild | COMPLETE | NONE |"
          assert plan.count(old_row) == 1
          plan = plan.replace(old_row, new_row, 1)

          marker = re.search(r"\n---\n\n# R16\.8\b", plan)
          assert marker is not None
          record = f'''\n## R16.7 implementation evidence\n\n- Normalized R16.6 base: `9c358e48e97352046160d48cee0417ade435b6ac`; dedicated branch `r16/07-memory-context-poisoning-hardening`.\n- Immutable technical source: `{source}`.\n- Exact-source focused acceptance: {focused} SUCCESS on Ubuntu + Windows; exact checkout, compileall, Ruff, 18 focused adversarial tests and 15-case acceptance emission all passed.\n- Exact-source repository qualification: {r0} SUCCESS Ubuntu + Windows, {python_core} SUCCESS across all five jobs, {ui} SUCCESS.\n- Cross-platform acceptance semantic SHA-256: `{semantic}`; 15/15 critical cases PASS with `security_claim=true`, `critical_veto=false`, `manual=NONE`, synthetic-only fixtures, zero network calls, zero live secrets and no raw poison persistence.\n- Technical artifacts: Linux `{linux_artifact}`; Windows `{windows_artifact}`.\n- Accepted scope: versioned provenance/project-scope/trust/record-class/integrity/expiry metadata; fail-closed tamper, replay, same-version conflict, stale-version, cross-project and expiry handling; hashed quarantine evidence without raw secret retention; memory content cannot self-authorize, alter policy/architecture or raise its trust class; bounded invalidation preserves unrelated valid memory; deterministic authoritative rebuild replaces only matching lineages and reports `INCONCLUSIVE` when no trustworthy source exists; action suggestions cannot become authoritative rebuild facts.\n- Legacy memory rows migrate as data-only/untrusted and legacy add/list/semantic-search behavior remains available. Tests are synthetic/disposable and do not use live secrets, production memory or network calls. Manual state: **NONE**.\n- R16.8 remains blocked until this END-sync receives fresh exact-head R16.7/R0/Python/UI gates, PR #347 merges with `expected_head_sha`, and the unique continuity-only post-merge normalization passes fresh R0/Python/UI and merges.\n'''
          plan = plan[:marker.start()] + record + plan[marker.start():]
          plan_path.write_text(plan, encoding="utf-8", newline="\n")

          continuity_path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          continuity = continuity_path.read_text(encoding="utf-8")
          old_top = "**R1–R15 COMPLETE + NORMALIZED. R16 planning ACCEPTED + NORMALIZED. R16.1–R16.6 COMPLETE + NORMALIZED. R16.7 IN_PROGRESS on `r16/07-memory-context-poisoning-hardening` from normalized `main` `9c358e48e97352046160d48cee0417ade435b6ac`. R16.8–R16.18 remain PLANNED.**"
          new_top = f"**R1–R15 COMPLETE + NORMALIZED. R16 planning ACCEPTED + NORMALIZED. R16.1–R16.6 COMPLETE + NORMALIZED. R16.7 COMPLETE / NORMALIZATION PENDING on immutable technical source `{source}`. R16.8–R16.18 remain PLANNED.**"
          assert continuity.count(old_top) == 1
          continuity = continuity.replace(old_top, new_top, 1)

          old_line = "- R16.7 : **IN_PROGRESS** — normalized R16.6 `main` `9c358e48e97352046160d48cee0417ade435b6ac`; dedicated branch `r16/07-memory-context-poisoning-hardening`; scope frozen to memory/context poisoning detection, quarantine and deterministic rebuild; manual NONE. R16.8 remains PLANNED."
          new_line = f"- R16.7 : **COMPLETE / NORMALIZATION PENDING** — normalized R16.6 `main` `9c358e48e97352046160d48cee0417ade435b6ac`; immutable technical source `{source}`; exact-source {focused} SUCCESS Ubuntu + Windows, {r0} SUCCESS, {python_core} SUCCESS 5/5, {ui} SUCCESS; semantic `{semantic}` with 15/15 PASS, `critical_veto=false`, manual NONE; technical artifacts Linux `{linux_artifact}`, Windows `{windows_artifact}`; PR #347 remains open pending this END-sync exact-head re-gate. Memory is provenance/version/integrity-bound, scoped and fail-closed under tamper/replay/conflict/stale/cross-project/expiry; secret-like or authority-spoofing payloads are rejected without raw persistence; bounded invalidation preserves unrelated valid memory; authoritative rebuild is deterministic or truthfully `INCONCLUSIVE`; action suggestions never become authority. R16.8 remains blocked until merge plus unique continuity-only post-merge normalization."
          assert continuity.count(old_line) == 1
          continuity = continuity.replace(old_line, new_line, 1)
          continuity_path.write_text(continuity, encoding="utf-8", newline="\n")

      - name: Validate bounded sync
        shell: bash
        run: |
          git diff --check -- docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R16_PLAN.md
          python scripts/check_repo.py
          expected=$'docs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R16_PLAN.md'
          actual="$(git diff --name-only -- docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R16_PLAN.md | sort)"
          test "$actual" = "$expected"
          unexpected="$(git diff --name-only -- . \
            ':(exclude)docs/continuity/KODEPOIA_CONTINUITY.md' \
            ':(exclude)docs/roadmap/R16_PLAN.md' \
            ':(exclude)docs/roadmap/R10_7_LOCAL_ACCEPTANCE.json' | sort)"
          test -z "$unexpected"

      - name: Commit END sync and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r16-7-end-sync-helper.yml
          git add docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R16_PLAN.md
          expected_staged=$'.github/workflows/r16-7-end-sync-helper.yml\ndocs/continuity/KODEPOIA_CONTINUITY.md\ndocs/roadmap/R16_PLAN.md'
          actual_staged="$(git diff --cached --name-only | sort)"
          test "$actual_staged" = "$expected_staged"
          git diff --cached --check
          git commit -m "docs(r16.7): synchronize accepted technical source"
          git push origin HEAD:r16/07-memory-context-poisoning-hardening
