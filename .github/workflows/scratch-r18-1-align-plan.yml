name: Scratch R18.1 plan alignment

on:
  push:
    branches:
      - r18/01-release-identity

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact helper source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Align imports tests acceptance and build binding
        shell: python
        run: |
          from pathlib import Path

          def replace(path_name: str, old: str, new: str, count: int = 1) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path_name}: expected {count} occurrences, found {actual}: {old!r}")
              path.write_text(text.replace(old, new, count), encoding="utf-8", newline="\n")

          for path_name in (
              "src/kodepoia/__init__.py",
              "src/kodepoia/cli.py",
              "src/kodepoia/kodestudio/app_v11.py",
          ):
              replace(path_name, "from kodepoia.release_identity import CURRENT_RELEASE", "from kodepoia.release import CURRENT_RELEASE")

          replace(
              "tests/test_r18_release_identity.py",
              "from kodepoia.release_identity import CURRENT_RELEASE, ReleaseIdentity",
              "from jsonschema import Draft202012Validator\n\nfrom kodepoia.release import CURRENT_RELEASE, ReleaseIdentity",
          )
          replace(
              "tests/test_r18_release_identity.py",
              '    return ReleaseIdentity(\n        schema_version=1,\n        product="Kodepoia",\n        channel=channel,\n',
              '    build_type = {"stable": "release", "beta": "prerelease", "nightly": "development"}[channel]\n'
              '    return ReleaseIdentity(\n'
              '        schema_version=1,\n'
              '        product="Kodepoia",\n'
              '        package="kodepoia",\n'
              '        channel=channel,\n'
              '        build_type=build_type,\n'
              '        source_binding="exact-head",\n',
          )
          replace(
              "tests/test_r18_release_identity.py",
              '    payload = json.loads((ROOT / "src/kodepoia/release_identity.json").read_text(encoding="utf-8"))\n    assert payload == {\n        "schema_version": 1,\n        "product": "Kodepoia",\n        "channel": "beta",\n        "version": {"major": 1, "minor": 1, "patch": 0, "stage": "rc", "serial": 1},\n    }\n',
              '    identity_path = ROOT / "src/kodepoia/release/release_identity.json"\n'
              '    payload = json.loads(identity_path.read_text(encoding="utf-8"))\n'
              '    assert payload == {\n'
              '        "schema_version": 1,\n'
              '        "product": "Kodepoia",\n'
              '        "package": "kodepoia",\n'
              '        "channel": "beta",\n'
              '        "build_type": "prerelease",\n'
              '        "source_binding": "exact-head",\n'
              '        "version": {"major": 1, "minor": 1, "patch": 0, "stage": "rc", "serial": 1},\n'
              '    }\n'
              '    schema = json.loads((ROOT / "schemas/release_identity.schema.json").read_text(encoding="utf-8"))\n'
              '    Draft202012Validator(schema).validate(payload)\n'
              '    bound = CURRENT_RELEASE.bind_source("a" * 40).to_dict()\n'
              '    Draft202012Validator(schema).validate(bound)\n'
              '    assert bound["source_sha"] == "a" * 40\n'
              '    assert bound["package"] == "kodepoia"\n'
              '    assert bound["build_type"] == "prerelease"\n',
          )
          replace(
              "tests/test_r18_release_identity.py",
              '    assert "from kodepoia.release_identity import CURRENT_RELEASE" in build_script\n',
              '    assert "kodepoia.release.identity" in build_script\n'
              '    assert "--source-sha" in build_script\n'
              '    assert "source_sha" in build_script\n',
          )

          replace(
              "scripts/r18_1_release_identity_acceptance.py",
              "from kodepoia.release_identity import CURRENT_RELEASE, ReleaseIdentity",
              "from jsonschema import Draft202012Validator\n\nfrom kodepoia.release import CURRENT_RELEASE, ReleaseIdentity",
          )
          replace(
              "scripts/r18_1_release_identity_acceptance.py",
              '    return ReleaseIdentity(\n        schema_version=1,\n        product="Kodepoia",\n        channel=channel,\n',
              '    build_type = {"stable": "release", "beta": "prerelease", "nightly": "development"}[channel]\n'
              '    return ReleaseIdentity(\n'
              '        schema_version=1,\n'
              '        product="Kodepoia",\n'
              '        package="kodepoia",\n'
              '        channel=channel,\n'
              '        build_type=build_type,\n'
              '        source_binding="exact-head",\n',
          )
          replace(
              "scripts/r18_1_release_identity_acceptance.py",
              '    identity_path = root / "src/kodepoia/release_identity.json"\n    identity_payload = json.loads(identity_path.read_text(encoding="utf-8"))\n',
              '    identity_path = root / "src/kodepoia/release/release_identity.json"\n'
              '    identity_payload = json.loads(identity_path.read_text(encoding="utf-8"))\n'
              '    schema = json.loads((root / "schemas/release_identity.schema.json").read_text(encoding="utf-8"))\n'
              '    bound_identity = CURRENT_RELEASE.bind_source(exact_source)\n'
              '    Draft202012Validator(schema).validate(identity_payload)\n'
              '    Draft202012Validator(schema).validate(bound_identity.to_dict())\n',
          )
          replace(
              "scripts/r18_1_release_identity_acceptance.py",
              '        "single_machine_identity_schema": identity_payload == {\n            "schema_version": 1,\n            "product": "Kodepoia",\n            "channel": "beta",\n            "version": {"major": 1, "minor": 1, "patch": 0, "stage": "rc", "serial": 1},\n        },\n',
              '        "single_machine_identity_schema": identity_payload == {\n'
              '            "schema_version": 1,\n'
              '            "product": "Kodepoia",\n'
              '            "package": "kodepoia",\n'
              '            "channel": "beta",\n'
              '            "build_type": "prerelease",\n'
              '            "source_binding": "exact-head",\n'
              '            "version": {"major": 1, "minor": 1, "patch": 0, "stage": "rc", "serial": 1},\n'
              '        },\n'
              '        "schema_validates_static_and_bound_identity": True,\n'
              '        "bound_source_sha_exact": bound_identity.source_sha == exact_source,\n'
              '        "package_name_canonical": CURRENT_RELEASE.package == "kodepoia",\n'
              '        "build_type_canonical": CURRENT_RELEASE.build_type == "prerelease",\n',
          )
          replace(
              "scripts/r18_1_release_identity_acceptance.py",
              '            and "from kodepoia.release_identity import CURRENT_RELEASE" in build_script\n',
              '            and "kodepoia.release.identity" in build_script\n'
              '            and "--source-sha" in build_script\n'
              '            and "source_sha" in build_script\n',
          )
          replace(
              "scripts/r18_1_release_identity_acceptance.py",
              '        "release": CURRENT_RELEASE.to_dict(),\n',
              '        "release": bound_identity.to_dict(),\n',
          )

          path = Path("scripts/build_windows_installer.ps1")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '    [string]$Version = "",\n    [string]$OutputDir = "artifacts/windows",\n',
              '    [string]$Version = "",\n    [string]$SourceSha = "",\n    [string]$OutputDir = "artifacts/windows",\n',
              1,
          )
          old = '$ReleaseLines = & $Python -c "import json; from kodepoia.release_identity import CURRENT_RELEASE; print(json.dumps(CURRENT_RELEASE.to_dict(), sort_keys=True))"\n'
          new = (
              'if (-not $SourceSha) {\n'
              '    $SourceSha = (& git rev-parse HEAD).Trim().ToLowerInvariant()\n'
              '    if ($LASTEXITCODE -ne 0) {\n'
              '        throw "Failed to resolve exact Git source SHA for the installer build."\n'
              '    }\n'
              '}\n'
              'if ($SourceSha -notmatch "^[0-9a-fA-F]{40}$") {\n'
              '    throw "SourceSha must be an exact 40-character hexadecimal Git commit."\n'
              '}\n'
              '$SourceSha = $SourceSha.ToLowerInvariant()\n'
              '$ReleaseLines = & $Python -m kodepoia.release.identity --source-sha $SourceSha --json\n'
          )
          if old not in text:
              raise SystemExit("Windows builder canonical identity command not found")
          text = text.replace(old, new, 1)
          marker = '    release_identity_schema = [int]$ReleaseIdentity.schema_version\n'
          if marker not in text:
              raise SystemExit("Windows builder manifest marker not found")
          text = text.replace(marker, marker + '    source_sha = [string]$ReleaseIdentity.source_sha\n    build_type = [string]$ReleaseIdentity.build_type\n', 1)
          path.write_text(text, encoding="utf-8", newline="\n")

          workflow = Path(".github/workflows/r18-1-release-identity-acceptance.yml")
          text = workflow.read_text(encoding="utf-8")
          text = text.replace("      - src/kodepoia/release_identity.json\n      - src/kodepoia/release_identity.py\n", "      - schemas/release_identity.schema.json\n      - src/kodepoia/release/**\n")
          text = text.replace("          src/kodepoia/release_identity.py\n", "          src/kodepoia/release/identity.py\n")
          workflow.write_text(text, encoding="utf-8", newline="\n")

      - name: Remove superseded root identity files
        shell: bash
        run: |
          set -euo pipefail
          git rm src/kodepoia/release_identity.py src/kodepoia/release_identity.json

      - name: Compile aligned R18.1 Python sources
        run: >-
          python -m compileall -q
          src/kodepoia/release
          src/kodepoia/__init__.py
          src/kodepoia/cli.py
          src/kodepoia/kodestudio/app_v11.py
          scripts/r18_1_release_identity_acceptance.py
          tests/test_r18_release_identity.py

      - name: Commit alignment and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/scratch-r18-1-align-plan.yml
          git add .github/workflows/r18-1-release-identity-acceptance.yml schemas/release_identity.schema.json src/kodepoia/release src/kodepoia/__init__.py src/kodepoia/cli.py src/kodepoia/kodestudio/app_v11.py scripts/build_windows_installer.ps1 scripts/r18_1_release_identity_acceptance.py tests/test_r18_release_identity.py
          git commit -m "refactor(r18.1): align release identity with frozen plan"
          git push origin HEAD:r18/01-release-identity
