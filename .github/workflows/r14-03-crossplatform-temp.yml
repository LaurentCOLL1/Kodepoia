name: R14.3 Cross-platform Focused Temp

on:
  push:
    branches:
      - r14/03-local-backend-runtime

permissions:
  contents: write

jobs:
  focused:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: r14/03-local-backend-runtime
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,code]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Focused R14.3 runtime tests
        run: pytest -q tests/test_r14_3_local_backend_runtime.py tests/test_r14_2_backend_profiles.py

  cleanup:
    if: ${{ always() && github.actor != 'github-actions[bot]' }}
    needs: focused
    runs-on: ubuntu-latest
    steps:
      - name: Require both focused jobs success
        run: test '${{ needs.focused.result }}' = 'success'
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: r14/03-local-backend-runtime
          fetch-depth: 0
      - name: Remove temporary cross-platform trigger
        run: |
          rm -f .github/workflows/r14-03-crossplatform-temp.yml .r14_3_crossplatform_trigger
          git add -u -- .github/workflows/r14-03-crossplatform-temp.yml .r14_3_crossplatform_trigger
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R14.3 remove cross-platform prevalidation temporaries'
          git push origin HEAD:r14/03-local-backend-runtime
