name: R15.8 END Sync Finalize
on:
  push:
    branches: [r15/08-training-runtime-capability]
    paths: ['.github/workflows/r15-8-end-sync-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/08-training-runtime-capability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-r0.txt
      - name: Replay accepted bounded patch
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path('.github/workflows/r15-8-end-sync-helper.yml').read_text(encoding='utf-8'))
          patch = next(
              step['run'] for step in data['jobs']['sync']['steps']
              if step.get('name') == 'Patch bounded R15.8 END records'
          )
          subprocess.run(['python', '-c', patch], check=True)
      - name: Validate exact scope and inherited EOL-only noise
        shell: python
        run: |
          import subprocess
          expected = {
              'docs/continuity/KODEPOIA_CONTINUITY.md',
              'docs/roadmap/R10_7_LOCAL_ACCEPTANCE.json',
              'docs/roadmap/R15_8_ACCEPTANCE.md',
              'docs/roadmap/R15_8_DESIGN.md',
              'docs/roadmap/R15_PLAN.md',
          }
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['python', 'scripts/check_repo.py'], check=True)
          subprocess.run(
              ['git', 'diff', '--ignore-space-at-eol', '--exit-code', '--',
               'docs/roadmap/R10_7_LOCAL_ACCEPTANCE.json'],
              check=True,
          )
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'Unexpected END-sync worktree scope: {sorted(actual)}')
      - name: Commit only R15.8 authority and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15-8-end-sync-helper.yml
          git rm .github/workflows/r15-8-end-sync-diagnose.yml
          git rm .github/workflows/r15-8-end-sync-finalize.yml
          git add docs/continuity/KODEPOIA_CONTINUITY.md docs/roadmap/R15_PLAN.md docs/roadmap/R15_8_DESIGN.md docs/roadmap/R15_8_ACCEPTANCE.md
          test "$(git diff --cached --name-only -- docs/roadmap/R10_7_LOCAL_ACCEPTANCE.json)" = ""
          git diff --cached --check
          git commit -m "docs(r15.8): synchronize accepted technical source"
          git push origin HEAD:r15/08-training-runtime-capability