name: R15.17 START synchronization helper

on:
  push:
    branches:
      - r15/17-adversarial-integrated-acceptance
    paths:
      - .github/workflows/r15-17-start-sync-helper.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/17-adversarial-integrated-acceptance
          fetch-depth: 0
      - name: Synchronize R15.17 START authority
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')).decode())"
          rm .github/workflows/r15-17-start-sync-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r15-17-start-sync-helper.yml
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 3
          printf '%s\n' "${staged[@]}" | grep -Fx 'docs/roadmap/R15_PLAN.md'
          printf '%s\n' "${staged[@]}" | grep -Fx 'docs/continuity/KODEPOIA_CONTINUITY.md'
          printf '%s\n' "${staged[@]}" | grep -Fx '.github/workflows/r15-17-start-sync-helper.yml'
          git commit -m "docs(r15.17): synchronize START authority"
          git push origin HEAD:r15/17-adversarial-integrated-acceptance
