name: R14.15 normalization staging

on:
  push:
    branches:
      - r14/15-normalize-stage
    paths:
      - .github/workflows/_r14_15_normalize_stage.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard staging parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "r14/15-normalize-stage"
          test "$(git rev-parse HEAD^)" = "239179d11a4fbbd582999e72859bb2cefb09eca0"
          test -f scripts/_r14_15_normalize_stage.py

      - name: Apply continuity transform
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_r14_15_normalize_stage.py
          git diff --check -- docs/continuity/KODEPOIA_CONTINUITY.md
          python - <<'PY'
          import subprocess
          expected = {'docs/continuity/KODEPOIA_CONTINUITY.md'}
          ignored_eol = {'docs/roadmap/R10_7_LOCAL_ACCEPTANCE.json'}
          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          paths = {line[3:] for line in lines if line.strip()}
          assert paths - ignored_eol == expected, (paths, expected)
          assert paths <= expected | ignored_eol, paths
          PY

      - name: Commit staged continuity only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          test "$(git diff --cached --name-only)" = "docs/continuity/KODEPOIA_CONTINUITY.md"
          git commit -m "docs(r14.15): stage continuity normalization"
          git push origin HEAD:r14/15-normalize-stage
