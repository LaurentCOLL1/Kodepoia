name: R14.3 Continuity Normalize Temp
on:
  push:
    branches: [r14/03-continuity-normalization]
    paths: [.r14_3_norm_trigger]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/03-continuity-normalization
          fetch-depth: 0
      - name: Normalize continuity only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          s = p.read_text(encoding='utf-8')
          old_prompt = "> Kodepoia, architecture v1.0 gelée. **R1–R13 COMPLETE + NORMALIZED. R14 planning ACCEPTED + NORMALIZED. R14.1–R14.2 COMPLETE + NORMALIZED. R14.3 COMPLETE at technical/evidence level on `r14/03-local-backend-runtime`; final END-synchronized exact-head re-gates and PR #261 merge remain pending. R14.4–R14.17 remain PLANNED.** R14.3 accepted immutable technical source `4de5036e7a37f949ec64ae68d9ee45e57ac99631` passed R0 #1770 / `33146235062`, Python Core #1744 / `33146235104`, and UI #1711 / `33146235181`, all SUCCESS; Ubuntu full suite recorded 1477 passed / 13 skipped / 46 warnings and Windows Core also passed. Focused prevalidation `33146069094` passed 36 tests; cross-platform runtime validation `33146135676` passed on Ubuntu and Windows. No implementation semantics may change during END-sync. After fresh final R0 + Python Core + UI on the END head, merge #261 with expected-head protection, then perform exactly one continuity-only normalization before R14.3 becomes COMPLETE + NORMALIZED and R14.4 is authorized. Manual state is NONE."
          new_prompt = "> Kodepoia, architecture v1.0 gelée. **R1–R13 COMPLETE + NORMALIZED. R14 planning ACCEPTED + NORMALIZED. R14.1–R14.3 COMPLETE + NORMALIZED upon merge of the single continuity-only normalization PR; R14.4–R14.17 remain PLANNED.** R14.3 immutable technical source `4de5036e7a37f949ec64ae68d9ee45e57ac99631` passed R0 #1770 / `33146235062`, Python Core #1744 / `33146235104`, and UI #1711 / `33146235181`; final END-head `8411ce92da962a37cb9a5936bdac740d9a132204` passed fresh R0 #1775 / `33146496788`, Python Core #1749 / `33146496859`, and UI #1716 / `33146496739`, all SUCCESS; PR #261 merged with expected-head protection as `d288772a90d5877cabe35adb6e71f0ede32f6b8d`. Single authorized post-merge normalization branch is `r14/03-continuity-normalization`; after its fresh R0/Python/UI gates and merge, R14.4 is authorized. Manual state is NONE."
          if old_prompt not in s:
              raise SystemExit('prompt marker missing')
          s = s.replace(old_prompt, new_prompt, 1)
          old_global = "- R14 planning: **ACCEPTED + NORMALIZED**. R14.1–R14.2 are **COMPLETE + NORMALIZED**. R14.3 accepted immutable technical source **`4de5036e7a37f949ec64ae68d9ee45e57ac99631`** passed R0 #1770 / `33146235062`, Python Core #1744 / `33146235104`, and UI #1711 / `33146235181`, all SUCCESS. R14.3 is **COMPLETE / FINAL_DOCUMENTATION_REGATES_PENDING** on `r14/03-local-backend-runtime`; R14.4–R14.17 remain PLANNED. Manual **NONE**."
          new_global = "- R14 planning: **ACCEPTED + NORMALIZED**. R14.1–R14.2 are **COMPLETE + NORMALIZED**. R14.3 technical source **`4de5036e7a37f949ec64ae68d9ee45e57ac99631`** passed R0 #1770 / `33146235062`, Python Core #1744 / `33146235104`, UI #1711 / `33146235181`; END-head **`8411ce92da962a37cb9a5936bdac740d9a132204`** passed R0 #1775 / `33146496788`, Python #1749 / `33146496859`, UI #1716 / `33146496739`; PR #261 merged as **`d288772a90d5877cabe35adb6e71f0ede32f6b8d`**. R14.3 is **COMPLETE / NORMALIZATION_IN_PROGRESS** on `r14/03-continuity-normalization`; R14.4–R14.17 remain PLANNED until this single normalization merges. Manual **NONE**."
          if old_global not in s:
              raise SystemExit('global marker missing')
          s = s.replace(old_global, new_global, 1)
          old_tail = "- R14.3 is COMPLETE at technical/evidence level; R14.4 remains PLANNED pending final END re-gates, PR #261 merge and one continuity-only normalization.\n- Manual intervention: **NONE**."
          new_tail = "- Final END-synchronized head: `8411ce92da962a37cb9a5936bdac740d9a132204`; relative to the immutable technical source only `docs/roadmap/R14_PLAN.md`, `docs/roadmap/R14_3_ACCEPTANCE.md`, and continuity changed.\n- Final exact-head re-gates: R0 #1775 / `33146496788`, Python Core #1749 / `33146496859`, and UI #1716 / `33146496739`, all SUCCESS.\n- Implementation/evidence PR #261 merged with `expected_head_sha=8411ce92da962a37cb9a5936bdac740d9a132204` as `d288772a90d5877cabe35adb6e71f0ede32f6b8d`.\n- Single authorized normalization branch: `r14/03-continuity-normalization`, created exactly from that merge. Its cumulative diff MUST contain exactly `docs/continuity/KODEPOIA_CONTINUITY.md`. After fresh R0 + full Python Core + KodeStudio UI Smoke and merge with expected-head protection, R14.3 is authoritatively **COMPLETE + NORMALIZED** and R14.4 is authorized.\n- Manual intervention: **NONE**."
          if old_tail not in s:
              raise SystemExit('R14.3 tail marker missing')
          s = s.replace(old_tail, new_tail, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          rm -f .github/workflows/r14-03-normalize-temp.yml .r14_3_norm_trigger
          git add -- docs/continuity/KODEPOIA_CONTINUITY.md
          git add -u -- .github/workflows/r14-03-normalize-temp.yml .r14_3_norm_trigger
          git diff --cached --check
          staged=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' '.github/workflows/r14-03-normalize-temp.yml' '.r14_3_norm_trigger' 'docs/continuity/KODEPOIA_CONTINUITY.md' | sort)
          test "$staged" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R14.3 post-merge continuity normalization'
          cumulative=$(git diff --ignore-space-at-eol --name-only d288772a90d5877cabe35adb6e71f0ede32f6b8d HEAD -- | sort)
          test "$cumulative" = "docs/continuity/KODEPOIA_CONTINUITY.md"
          git push origin HEAD:r14/03-continuity-normalization
