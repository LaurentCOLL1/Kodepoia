name: Temporary R17 Exact-Head Premerge Gates

on:
  push:
    branches:
      - scratch/r17-premerge-gates

permissions:
  contents: read

jobs:
  r0:
    name: r0-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KODEPOIA_SOURCE_SHA: d7972c3f26d0c7448fde80930a3eac5131475a2f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install R0 dependencies
        run: python -m pip install -r scripts/requirements-r0.txt
      - name: Verify Git LFS
        run: git lfs version
      - name: Repository Guard
        run: python scripts/check_repo.py

  python-core:
    name: python-core-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KODEPOIA_SOURCE_SHA: d7972c3f26d0c7448fde80930a3eac5131475a2f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install
        run: python -m pip install -e ".[dev,code]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Full Python Core
        run: pytest

  ui-smoke:
    name: kodestudio-ui-windows
    runs-on: windows-latest
    env:
      KODEPOIA_SOURCE_SHA: d7972c3f26d0c7448fde80930a3eac5131475a2f
      QT_QPA_PLATFORM: offscreen
      KODEPOIA_LOCALE: fr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact source
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['KODEPOIA_SOURCE_SHA']"
      - name: Install UI dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: KodeStudio + R17 smoke
        run: pytest tests/test_kodestudio_smoke.py tests/test_r6_5_accessibility_ui.py tests/test_r6_6_localization_ui.py tests/test_r7_10_research_ui.py tests/test_r8_10_kodestudio.py tests/test_r17_guided_ux.py
