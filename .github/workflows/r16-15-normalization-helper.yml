name: R16.15 Normalization Helper

on:
  push:
    branches:
      - "r16/15-normalization-helper"

permissions:
  contents: write

jobs:
  publish-normalization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "r16/15-normalization-helper"
          path: helper
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact R16.15 implementation/evidence merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "f1a57893f136e5b5b058aa420adcd4f24bf81c9e"
          path: repo
          fetch-depth: 0

      - name: Build and publish continuity-only normalization
        shell: bash
        run: |
          set -euo pipefail
          MERGE=f1a57893f136e5b5b058aa420adcd4f24bf81c9e
          test "$(git -C repo rev-parse HEAD)" = "$MERGE"
          cp helper/.github/r16_15_normalization_helper.py /tmp/r16_15_normalization_helper.py
          cd repo
          git update-index --assume-unchanged docs/roadmap/R10_7_LOCAL_ACCEPTANCE.json
          python /tmp/r16_15_normalization_helper.py

          expected="docs/continuity/KODEPOIA_CONTINUITY.md"
          git add -- "$expected"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 1
          test "${staged[0]}" = "$expected"
          git diff --cached --check

          tree=$(git write-tree)
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'docs(r16.15): normalize post-merge continuity' | git commit-tree "$tree" -p "$MERGE")
          mapfile -t committed < <(git diff-tree --no-commit-id --name-only -r "$commit")
          test "${#committed[@]}" -eq 1
          test "${committed[0]}" = "$expected"
          echo "R16_15_NORMALIZATION_HEAD=$commit"
          git push origin "$commit":refs/heads/r16/15-continuity-normalization
