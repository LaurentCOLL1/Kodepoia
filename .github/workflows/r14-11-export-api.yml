name: R14.11 Export Backend API

on:
  push:
    branches:
      - r14/11-remote-config-feature-flags
    paths:
      - .github/workflows/r14-11-export-api.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/11-remote-config-feature-flags
          fetch-depth: 0
      - name: Export R14.11 backend API
        run: python .github/r14_11_export_api.py
      - name: Commit export and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/r14_11_export_api.py .github/workflows/r14-11-export-api.yml
          git add src/kodepoia/backend/__init__.py
          git commit -m "feat(r14.11): export remote config backend API"
          git push origin HEAD:r14/11-remote-config-feature-flags
