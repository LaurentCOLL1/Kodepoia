name: R18.11 Integrated Adversarial Release Update Acceptance

on:
  push:
    branches:
      - r18/11-integrated-adversarial-release-update-acceptance
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r18-11-integrated-acceptance.yml
      - src/kodepoia/release/**
      - src/kodepoia/update/**
      - src/kodepoia/kodestudio/**
      - scripts/r18_11_integrated_acceptance.py
      - scripts/r18_*.py
      - scripts/build_windows_installer.ps1
      - tests/test_r18*.py
      - tests/test_supply_chain_r16_9.py
      - packaging/windows/**
      - packaging/winget/**
      - docs/roadmap/R18_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r18-11-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      R17_FIXTURE_SHA: 58e488d80e60d04fc675e305bc8f040a3ab2bb9c
      QT_QPA_PLATFORM: offscreen
      KODEPOIA_LOCALE: fr
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: pwsh
        run: |
          $expected = ([string]$env:EVIDENCE_SHA).Trim().ToLowerInvariant()
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Expected exact source $expected, got $actual"
          }

      - name: Install integrated acceptance dependencies
        run: python -m pip install -e ".[dev,ui,code,packaging]"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile and Ruff R18.11-owned Python
        shell: pwsh
        run: |
          python -m compileall -q `
            src/kodepoia/release/integrated_acceptance.py `
            scripts/r18_11_integrated_acceptance.py `
            tests/test_r18_11_integrated_acceptance.py
          python -m ruff check `
            src/kodepoia/release/integrated_acceptance.py `
            scripts/r18_11_integrated_acceptance.py `
            tests/test_r18_11_integrated_acceptance.py

      - name: Run fresh integrated R18.1-R18.10 regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/r18_11" | Out-Null
          python -m pytest -q `
            tests/test_r18_release_identity.py `
            tests/test_r18_release_bundle.py `
            tests/test_r18_sbom_provenance.py `
            tests/test_r18_authenticode.py `
            tests/test_r18_5_release_promotion.py `
            tests/test_r18_6_tuf_security.py `
            tests/test_r18_6_update_trust.py `
            tests/test_r18_6_packaged_root.py `
            tests/test_r18_7_update_discovery.py `
            tests/test_r18_7_kodestudio_updates.py `
            tests/test_r18_8_verified_delivery.py `
            tests/test_r18_8_kodestudio_install.py `
            tests/test_r18_9_winget.py `
            tests/test_r18_10_incident_drills.py `
            tests/test_r18_10_kodestudio_incident.py `
            tests/test_supply_chain_r16_9.py `
            tests/test_r18_11_integrated_acceptance.py `
            --junitxml=artifacts/r18_11/focused-r18.xml

      - name: Emit fresh R18.1-R18.8 and R18.10 machine evidence
        shell: pwsh
        run: |
          $out = "artifacts/r18_11/subdivisions"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          python scripts/r18_1_release_identity_acceptance.py `
            --source-sha "$env:EVIDENCE_SHA" `
            --output "$out/R18_1.json"
          python scripts/r18_2_release_bundle_acceptance.py `
            --source-sha "$env:EVIDENCE_SHA" `
            --output "$out/R18_2.json"
          python scripts/r18_3_sbom_provenance_acceptance.py `
            --source-sha "$env:EVIDENCE_SHA" `
            --output "$out/R18_3.json"
          python scripts/r18_4_authenticode_acceptance.py `
            --source-sha "$env:EVIDENCE_SHA" `
            --output "$out/R18_4.json"
          python scripts/r18_5_release_staging_acceptance.py `
            --source-sha "$env:EVIDENCE_SHA" `
            --output "$out/R18_5.json"
          python scripts/r18_6_tuf_acceptance.py `
            --source-sha "$env:EVIDENCE_SHA" `
            --output "$out/R18_6.json"
          python scripts/r18_10_acceptance.py `
            --source-sha "$env:EVIDENCE_SHA" `
            --output "$out/R18_10.json"
          @'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/r18_11/subdivisions")
          source = os.environ["EVIDENCE_SHA"].strip().lower()
          payloads = {
              "R18_7.json": {
                  "schema_version": 1,
                  "subdivision": "R18.7",
                  "source_sha": source,
                  "status": "PASS",
                  "fresh_focused_tests": True,
                  "discovery_scope": "tuf-metadata-only",
                  "provider_effect_count": 0,
              },
              "R18_8.json": {
                  "schema_version": 1,
                  "subdivision": "R18.8",
                  "source_sha": source,
                  "status": "PASS",
                  "fresh_focused_tests": True,
                  "verified_delivery": True,
                  "explicit_user_consent_required": True,
                  "provider_effect_count": 0,
              },
          }
          for name, payload in payloads.items():
              (root / name).write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          '@ | python -

      - name: Build exact-source R18 Windows candidate
        shell: pwsh
        run: |
          ./scripts/build_windows_installer.ps1 -SourceSha "$env:EVIDENCE_SHA"
          $candidateDir = "artifacts/r18_11/candidate"
          New-Item -ItemType Directory -Force -Path $candidateDir | Out-Null
          Copy-Item "dist/windows/KodepoiaSetup.exe" "$candidateDir/KodepoiaSetup.exe"
          Copy-Item "dist/windows/installer-manifest.json" "$candidateDir/installer-manifest.json"

      - name: Emit fresh R18.9 candidate-bound evidence
        shell: pwsh
        run: |
          $manifestDir = "artifacts/r18_11/winget"
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
          python scripts/r18_9_winget_acceptance.py `
            --source-sha "$env:EVIDENCE_SHA" `
            --installer "artifacts/r18_11/candidate/KodepoiaSetup.exe" `
            --manifest-dir "$manifestDir" `
            --output "artifacts/r18_11/subdivisions/R18_9.json"

      - name: Emit exact-source integrated core evidence
        shell: pwsh
        run: |
          python scripts/r18_11_integrated_acceptance.py core `
            --source-sha "$env:EVIDENCE_SHA" `
            --evidence-dir "artifacts/r18_11/subdivisions" `
            --focused-regressions-passed `
            --output "artifacts/r18_11/core.json"

      - name: Build immutable R17 accepted fixture
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP "kodepoia-r17-fixture-src"
          Remove-Item $fixtureRoot -Recurse -Force -ErrorAction SilentlyContinue
          git worktree add --detach "$fixtureRoot" "$env:R17_FIXTURE_SHA"
          try {
            Push-Location $fixtureRoot
            $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
            if ($actual -ne $env:R17_FIXTURE_SHA) {
              throw "R17 fixture checkout mismatch: $actual"
            }
            ./scripts/build_windows_installer.ps1 -Version "1.1.0-rc1"
            $fixtureDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/r18_11/fixture"
            New-Item -ItemType Directory -Force -Path $fixtureDir | Out-Null
            Copy-Item "dist/windows/KodepoiaSetup.exe" (Join-Path $fixtureDir "KodepoiaSetup.exe")
            Copy-Item "dist/windows/installer-manifest.json" (Join-Path $fixtureDir "installer-manifest.json")
          }
          finally {
            Pop-Location
            git worktree remove --force "$fixtureRoot"
          }

      - name: Exercise clean install, update, packaged smoke and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidateSetup = (Resolve-Path "artifacts/r18_11/candidate/KodepoiaSetup.exe").Path
          $fixtureSetup = (Resolve-Path "artifacts/r18_11/fixture/KodepoiaSetup.exe").Path
          $candidateManifest = Get-Content "artifacts/r18_11/candidate/installer-manifest.json" -Raw | ConvertFrom-Json
          $candidateHash = (Get-FileHash $candidateSetup -Algorithm SHA256).Hash.ToLowerInvariant()
          $fixtureHash = (Get-FileHash $fixtureSetup -Algorithm SHA256).Hash.ToLowerInvariant()
          $candidateSourceMatch = ([string]$candidateManifest.source_sha).ToLowerInvariant() -eq $env:EVIDENCE_SHA
          $candidateDigestMatch = ([string]$candidateManifest.sha256).ToLowerInvariant() -eq $candidateHash

          function Invoke-Setup([string]$setup, [string]$installDir) {
            $process = Start-Process -FilePath $setup -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/MERGETASKS=!desktopicon",
              "/DIR=$installDir"
            ) -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Installer $setup exited with $($process.ExitCode)"
            }
          }

          function Invoke-PackagedSmoke([string]$exe, [string]$label) {
            $smokeDir = Join-Path $env:RUNNER_TEMP "kodepoia-smoke-$label"
            $report = Join-Path $env:RUNNER_TEMP "kodepoia-smoke-$label.txt"
            Remove-Item $smokeDir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $report -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null

            $originalPath = $env:PATH
            $originalPythonHome = $env:PYTHONHOME
            $originalPythonPath = $env:PYTHONPATH
            $env:PATH = @(
              (Join-Path $env:SystemRoot "System32"),
              $env:SystemRoot,
              (Join-Path $env:SystemRoot "System32\Wbem")
            ) -join ";"
            $env:PYTHONHOME = $null
            $env:PYTHONPATH = $null
            try {
              if (Get-Command python.exe -ErrorAction SilentlyContinue) {
                throw "Developer Python remained visible during $label smoke"
              }
              if (Get-Command pip.exe -ErrorAction SilentlyContinue) {
                throw "Developer pip remained visible during $label smoke"
              }
              $process = Start-Process -FilePath $exe -ArgumentList @(
                "--smoke-test",
                "--smoke-report=$report"
              ) -WorkingDirectory $smokeDir -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                if (Test-Path $report) { Get-Content $report }
                throw "Packaged smoke $label exited with $($process.ExitCode)"
              }
            }
            finally {
              $env:PATH = $originalPath
              $env:PYTHONHOME = $originalPythonHome
              $env:PYTHONPATH = $originalPythonPath
            }
          }

          function Invoke-Uninstall([string]$installDir) {
            $uninstall = Join-Path $installDir "unins000.exe"
            $exe = Join-Path $installDir "KodepoiaStudio.exe"
            if (-not (Test-Path $uninstall)) { throw "Missing uninstaller in $installDir" }
            $process = Start-Process -FilePath $uninstall -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART"
            ) -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Uninstaller exited with $($process.ExitCode)"
            }
            for ($attempt = 0; $attempt -lt 40 -and (Test-Path $exe); $attempt++) {
              Start-Sleep -Milliseconds 250
            }
            return -not (Test-Path $exe)
          }

          $cleanDir = Join-Path $env:RUNNER_TEMP "Kodepoia-r18-clean"
          Remove-Item $cleanDir -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-Setup $candidateSetup $cleanDir
          $cleanExe = Join-Path $cleanDir "KodepoiaStudio.exe"
          if (-not (Test-Path $cleanExe)) { throw "Candidate clean install executable missing" }
          Invoke-PackagedSmoke $cleanExe "candidate-clean"
          $cleanUninstall = Invoke-Uninstall $cleanDir
          if (-not $cleanUninstall) { throw "Candidate clean uninstall left executable behind" }

          $upgradeDir = Join-Path $env:RUNNER_TEMP "Kodepoia-r17-to-r18"
          Remove-Item $upgradeDir -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-Setup $fixtureSetup $upgradeDir
          $fixtureExe = Join-Path $upgradeDir "KodepoiaStudio.exe"
          if (-not (Test-Path $fixtureExe)) { throw "R17 fixture executable missing" }
          Invoke-PackagedSmoke $fixtureExe "fixture"
          Invoke-Setup $candidateSetup $upgradeDir
          $upgradeExe = Join-Path $upgradeDir "KodepoiaStudio.exe"
          if (-not (Test-Path $upgradeExe)) { throw "Candidate upgrade executable missing" }
          Invoke-PackagedSmoke $upgradeExe "candidate-upgrade"
          $upgradeUninstall = Invoke-Uninstall $upgradeDir
          if (-not $upgradeUninstall) { throw "Upgrade uninstall left executable behind" }

          $windowsEvidence = @{
            candidate_source_sha = $env:EVIDENCE_SHA.ToLowerInvariant()
            fixture_source_sha = $env:R17_FIXTURE_SHA.ToLowerInvariant()
            fixture_installer_sha256 = $fixtureHash
            candidate_installer_sha256 = $candidateHash
            candidate_clean_install_smoke = $true
            candidate_clean_install_uninstall_clean = [bool]$cleanUninstall
            fixture_install_smoke = $true
            candidate_upgrade_smoke = $true
            candidate_manifest_source_match = [bool]$candidateSourceMatch
            candidate_installer_digest_match = [bool]$candidateDigestMatch
            upgrade_uninstall_clean = [bool]$upgradeUninstall
            provider_effect_count = 0
            project_data_mutation = $false
            production_signing_performed = $false
            public_release_effect = $false
            public_winget_submission = $false
          }
          $windowsEvidence | ConvertTo-Json -Depth 5 |
            Set-Content -Encoding UTF8 "artifacts/r18_11/windows.json"

      - name: Finalize and assert integrated verdict
        shell: pwsh
        run: |
          python scripts/r18_11_integrated_acceptance.py finalize `
            --source-sha "$env:EVIDENCE_SHA" `
            --core "artifacts/r18_11/core.json" `
            --windows "artifacts/r18_11/windows.json" `
            --output "artifacts/r18_11/R18_11_INTEGRATED_ACCEPTANCE.json"
          $report = Get-Content "artifacts/r18_11/R18_11_INTEGRATED_ACCEPTANCE.json" -Raw | ConvertFrom-Json
          if ($report.source_sha -ne $env:EVIDENCE_SHA) { throw "Final source SHA mismatch" }
          if ($report.status -ne "PASS") { throw "R18.11 final status is not PASS" }
          if ($report.blockers.Count -ne 0) { throw "R18.11 blockers are not empty" }
          if ($report.critical_veto) { throw "R18.11 critical veto is true" }
          if ($report.manual_intervention -ne "NONE") { throw "Unexpected manual intervention state" }
          if ($report.provider_effect_count -ne 0) { throw "Provider effect count is not zero" }
          Get-Content "artifacts/r18_11/R18_11_INTEGRATED_ACCEPTANCE.json"

      - name: Upload R18.11 exact-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-11-integrated-${{ env.EVIDENCE_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/r18_11/focused-r18.xml
            artifacts/r18_11/subdivisions/*.json
            artifacts/r18_11/core.json
            artifacts/r18_11/windows.json
            artifacts/r18_11/R18_11_INTEGRATED_ACCEPTANCE.json
            artifacts/r18_11/candidate/KodepoiaSetup.exe
            artifacts/r18_11/candidate/installer-manifest.json
            artifacts/r18_11/fixture/installer-manifest.json
            artifacts/r18_11/winget/*.yaml
