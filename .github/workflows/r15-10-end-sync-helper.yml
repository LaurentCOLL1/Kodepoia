name: R15.10 END Sync Helper

on:
  push:
    branches: [r15/10-base-adapter-evaluation]

permissions:
  contents: write

jobs:
  end_sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/10-base-adapter-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded END synchronization
        run: python .github/scripts/r15_10_end_sync.py
      - name: Verify and publish clean END head
        shell: bash
        run: |
          rm .github/scripts/r15_10_end_sync.py
          rm .github/workflows/r15-10-end-sync-helper.yml
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/r15_10_end_sync.py' \
            '.github/workflows/r15-10-end-sync-helper.yml' \
            'docs/continuity/KODEPOIA_CONTINUITY.md' \
            'docs/roadmap/R15_PLAN.md' | sort)"
          test "$actual" = "$expected" || {
            echo 'Unexpected END-sync diff:'
            git diff --name-only
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(r15.10): synchronize final completion evidence'
          git push origin HEAD:r15/10-base-adapter-evaluation
