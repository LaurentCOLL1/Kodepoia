name: Kodepoia 1.1.1 Consolidation Candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v1-1-1-v2-consolidation-candidate.yml
      - src/kodepoia/release/**
      - pyproject.toml
      - packaging/windows/**
      - scripts/build_windows_installer.ps1
      - scripts/build_release_bundle.py
      - scripts/generate_release_evidence.py
      - scripts/r18_2_release_bundle_acceptance.py
      - scripts/windows_authenticode.py
      - scripts/v2_6_1_acceptance.py
      - scripts/v2_6_2_acceptance.py
      - scripts/v2_6_3_acceptance.py
      - tests/test_r18_release_identity.py
      - tests/test_v2_6_1_terminal_release_freeze.py
      - tests/test_v2_6_2_terminal_hardening.py
      - tests/test_v2_6_3_terminal_candidate.py
      - tests/test_v1_1_1_v2_consolidation.py
      - configs/r16_supply_chain_policy.json
      - docs/release/V1_1_1_V2_CONSOLIDATION.md
      - docs/continuity/STATE.md
      - docs/continuity/NEXT.md
      - docs/continuity/KODEPOIA_CURRENT_AUTHORITY.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-1-1-consolidation-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-candidate:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN_SHA: 913aef2cf4673a2c8b8b7874204fe1b11edcf225
      BASELINE_TAG: v1.1.0
      BASELINE_SOURCE_SHA: 46ed800888b4f19da9e984232dd1ad6cdb639cc1
      BASELINE_BYTES: "38834833"
      BASELINE_SHA256: 8197bc9d8272b97394170a2c7c27b17c1e2f2849931587d21c7bdfda126da2ef
      TARGET_TAG: v1.1.1
      TARGET_VERSION: 1.1.1
      FROZEN_TARGET_SOURCE_SHA: aa1c80389b10f5ef44737241bf192c04f847e4ec
      FROZEN_TARGET_BYTES: "38880869"
      FROZEN_TARGET_SHA256: c8e7949ead2e1e14adece7cb9826f0b1be689b81ac814eef2f041760b9f738cd
    steps:
      - name: Checkout exact consolidation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: pwsh
        run: |
          $expected = ([string]$env:EVIDENCE_SHA).Trim().ToLowerInvariant()
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $expected) { throw "Expected exact consolidation source $expected, got $actual" }
          git merge-base --is-ancestor "$env:BASE_MAIN_SHA" "$expected"
          if ($LASTEXITCODE -ne 0) { throw "Consolidation source is not descended from terminal V2 main" }

      - name: Install build and test dependencies
        run: python -m pip install -e ".[dev,ui,code,packaging]"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile Ruff and focused consolidation tests
        shell: pwsh
        run: |
          python -m compileall -q src/kodepoia/release scripts/v2_6_1_acceptance.py scripts/v2_6_2_acceptance.py scripts/v2_6_3_acceptance.py tests/test_v1_1_1_v2_consolidation.py
          python -m ruff check src/kodepoia/release scripts/v2_6_1_acceptance.py scripts/v2_6_2_acceptance.py scripts/v2_6_3_acceptance.py tests/test_r18_release_identity.py tests/test_v2_6_1_terminal_release_freeze.py tests/test_v2_6_2_terminal_hardening.py tests/test_v2_6_3_terminal_candidate.py tests/test_v1_1_1_v2_consolidation.py
          python -m pytest -q tests/test_r18_release_identity.py tests/test_v2_6_1_terminal_release_freeze.py tests/test_v2_6_2_terminal_hardening.py tests/test_v2_6_3_terminal_candidate.py tests/test_v1_1_1_v2_consolidation.py

      - name: Verify public 1.1.0 baseline and coherent 1.1.1 namespace
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/v1_1_1" | Out-Null
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:BASELINE_TAG" | ConvertFrom-Json
          $tagSha = [string]$tag.object.sha
          if ([string]$tag.object.type -eq "tag") {
            $annotated = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" | ConvertFrom-Json
            $tagSha = [string]$annotated.object.sha
          }
          if ($tagSha -ne $env:BASELINE_SOURCE_SHA) { throw "Public 1.1.0 tag source drift" }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:BASELINE_TAG" | ConvertFrom-Json
          if ([bool]$release.draft -or [bool]$release.prerelease) { throw "Public 1.1.0 release state drift" }
          $assets = @($release.assets | Where-Object { $_.name -eq "KodepoiaSetup.exe" })
          if ($assets.Count -ne 1) { throw "Expected exactly one public 1.1.0 installer" }
          if ([int64]$assets[0].size -ne [int64]$env:BASELINE_BYTES) { throw "Public 1.1.0 installer length drift" }
          if ([string]$assets[0].digest -ne "sha256:$env:BASELINE_SHA256") { throw "Public 1.1.0 installer digest drift" }

          # Before initial publication both names must be absent. After publication
          # both must exist and match the ORIGINAL immutable candidate identity.
          # A half-published namespace or any drift fails closed.
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TARGET_TAG" *> $null
          $tagPresent = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TARGET_TAG" *> $null
          $releasePresent = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($tagPresent -ne $releasePresent) { throw "Half-published 1.1.1 namespace" }
          if ($tagPresent) {
            $targetRef = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TARGET_TAG" | ConvertFrom-Json
            $targetSha = [string]$targetRef.object.sha
            if ([string]$targetRef.object.type -eq "tag") {
              $targetObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$targetSha" | ConvertFrom-Json
              $targetSha = [string]$targetObject.object.sha
            }
            if ($targetSha -ne $env:FROZEN_TARGET_SOURCE_SHA) { throw "Published 1.1.1 source drift" }
            $targetRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TARGET_TAG" | ConvertFrom-Json
            if ([bool]$targetRelease.draft -or [bool]$targetRelease.prerelease) { throw "Published 1.1.1 must be stable" }
            $targetAssets = @($targetRelease.assets)
            if ($targetAssets.Count -ne 1 -or [string]$targetAssets[0].name -ne "KodepoiaSetup.exe") { throw "Published 1.1.1 installer asset count/name drift" }
            if ([int64]$targetAssets[0].size -ne [int64]$env:FROZEN_TARGET_BYTES) { throw "Published 1.1.1 installer length drift" }
            if ([string]$targetAssets[0].digest -ne "sha256:$env:FROZEN_TARGET_SHA256") { throw "Published 1.1.1 installer SHA256 drift" }
          }

          @{
            baseline_tag = $env:BASELINE_TAG
            baseline_source_sha = $env:BASELINE_SOURCE_SHA
            baseline_installer_bytes = [int64]$env:BASELINE_BYTES
            baseline_installer_sha256 = $env:BASELINE_SHA256
            target_tag = $env:TARGET_TAG
            target_namespace_absent = (-not $tagPresent)
            target_namespace_coherent = $true
            published_target_verified = $tagPresent
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 "artifacts/v1_1_1/public-baseline.json"

      - name: Generate exact-source SPDX SBOM and provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/v1_1_1/evidence" | Out-Null
          $created = (git show -s --format=%cI "$env:EVIDENCE_SHA").Trim()
          python scripts/generate_release_evidence.py --source-sha "$env:EVIDENCE_SHA" --output-dir "artifacts/v1_1_1/evidence" --repository "$env:GITHUB_REPOSITORY" --workflow-ref "$env:GITHUB_WORKFLOW_REF" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT" --created-at "$created" --optional-group ui --optional-group code

      - name: Build exact-source consolidation candidate one
        shell: pwsh
        run: |
          ./scripts/build_windows_installer.ps1 -SourceSha "$env:EVIDENCE_SHA"
          New-Item -ItemType Directory -Force -Path "artifacts/v1_1_1/build1" | Out-Null
          Copy-Item "dist/windows/KodepoiaSetup.exe" "artifacts/v1_1_1/build1/KodepoiaSetup.exe"
          Copy-Item "dist/windows/installer-manifest.json" "artifacts/v1_1_1/build1/installer-manifest.json"
          python scripts/build_release_bundle.py --installer "artifacts/v1_1_1/build1/KodepoiaSetup.exe" --installer-manifest "artifacts/v1_1_1/build1/installer-manifest.json" --source-sha "$env:EVIDENCE_SHA" --output-dir "artifacts/v1_1_1/bundle1" --repository "$env:GITHUB_REPOSITORY" --workflow-ref "$env:GITHUB_WORKFLOW_REF" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT" --sbom "artifacts/v1_1_1/evidence/release-sbom.spdx.json" --provenance "artifacts/v1_1_1/evidence/release-provenance.json"

      - name: Inspect exact consolidation Authenticode truth
        shell: pwsh
        run: |
          python scripts/windows_authenticode.py --mode unsigned --source-sha "$env:EVIDENCE_SHA" --subject "artifacts/v1_1_1/build1/KodepoiaSetup.exe" --output "artifacts/v1_1_1/signing.json"

      - name: Build exact-source consolidation candidate two
        shell: pwsh
        run: |
          ./scripts/build_windows_installer.ps1 -SourceSha "$env:EVIDENCE_SHA"
          New-Item -ItemType Directory -Force -Path "artifacts/v1_1_1/build2" | Out-Null
          Copy-Item "dist/windows/KodepoiaSetup.exe" "artifacts/v1_1_1/build2/KodepoiaSetup.exe"
          Copy-Item "dist/windows/installer-manifest.json" "artifacts/v1_1_1/build2/installer-manifest.json"
          python scripts/build_release_bundle.py --installer "artifacts/v1_1_1/build2/KodepoiaSetup.exe" --installer-manifest "artifacts/v1_1_1/build2/installer-manifest.json" --source-sha "$env:EVIDENCE_SHA" --output-dir "artifacts/v1_1_1/bundle2" --repository "$env:GITHUB_REPOSITORY" --workflow-ref "$env:GITHUB_WORKFLOW_REF" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT" --sbom "artifacts/v1_1_1/evidence/release-sbom.spdx.json" --provenance "artifacts/v1_1_1/evidence/release-provenance.json"

      - name: Run R18 two-build semantic comparison
        shell: pwsh
        run: |
          $one = (Get-ChildItem "artifacts/v1_1_1/bundle1" -Filter "*.zip" | Select-Object -First 1).FullName
          $two = (Get-ChildItem "artifacts/v1_1_1/bundle2" -Filter "*.zip" | Select-Object -First 1).FullName
          if (-not $one -or -not $two) { throw "Consolidation release bundles are missing" }
          python scripts/r18_2_release_bundle_acceptance.py --source-sha "$env:EVIDENCE_SHA" --bundle-one "$one" --bundle-two "$two" --output "artifacts/v1_1_1/two-build.json"
          $report = Get-Content "artifacts/v1_1_1/two-build.json" -Raw | ConvertFrom-Json
          if ($report.status -ne "PASS" -or -not [bool]$report.comparison.semantic_equivalent) { throw "1.1.1 two-build semantic comparison failed" }

      - name: Clean install packaged smoke and uninstall
        shell: pwsh
        run: |
          $setup = (Resolve-Path "artifacts/v1_1_1/build1/KodepoiaSetup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "Kodepoia-v111-candidate"
          $smokeDir = Join-Path $env:RUNNER_TEMP "Kodepoia-v111-smoke"
          $smokeReport = Join-Path $env:RUNNER_TEMP "kodepoia-v111-smoke.txt"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $install = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/MERGETASKS=!desktopicon","/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "1.1.1 clean install failed: $($install.ExitCode)" }
          $exe = Join-Path $installDir "KodepoiaStudio.exe"
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $exe -PathType Leaf) -or -not (Test-Path $uninstaller -PathType Leaf)) { throw "1.1.1 installed files missing" }
          $originalPath=$env:PATH; $originalPythonHome=$env:PYTHONHOME; $originalPythonPath=$env:PYTHONPATH
          $env:PATH=@((Join-Path $env:SystemRoot "System32"),$env:SystemRoot,(Join-Path $env:SystemRoot "System32\Wbem")) -join ";"
          $env:PYTHONHOME=$null; $env:PYTHONPATH=$null
          try {
            if (Get-Command python.exe -ErrorAction SilentlyContinue) { throw "Developer Python visible during packaged smoke" }
            $smoke=Start-Process -FilePath $exe -ArgumentList @("--smoke-test","--smoke-report=$smokeReport") -WorkingDirectory $smokeDir -Wait -PassThru
            if ($smoke.ExitCode -ne 0) { throw "1.1.1 packaged smoke failed: $($smoke.ExitCode)" }
          } finally {
            $env:PATH=$originalPath; $env:PYTHONHOME=$originalPythonHome; $env:PYTHONPATH=$originalPythonPath
          }
          $uninstall=Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "1.1.1 uninstall failed: $($uninstall.ExitCode)" }
          for ($attempt=0; $attempt -lt 40 -and (Test-Path $exe); $attempt++) { Start-Sleep -Milliseconds 250 }
          if (Test-Path $exe) { throw "1.1.1 executable remains after uninstall" }
          @{
            source_sha=$env:EVIDENCE_SHA.ToLowerInvariant()
            clean_install_smoke=$true
            clean_uninstall=$true
            custom_install_directory=$installDir
            public_release_effect=$false
            production_tuf_mutation=$false
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 "artifacts/v1_1_1/windows.json"

      - name: Emit 1.1.1 consolidation candidate evidence
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path

          installer = Path("artifacts/v1_1_1/build1/KodepoiaSetup.exe")
          manifest = json.loads(Path("artifacts/v1_1_1/build1/installer-manifest.json").read_text(encoding="utf-8-sig"))
          signing = json.loads(Path("artifacts/v1_1_1/signing.json").read_text(encoding="utf-8-sig"))
          windows = json.loads(Path("artifacts/v1_1_1/windows.json").read_text(encoding="utf-8-sig"))
          comparison = json.loads(Path("artifacts/v1_1_1/two-build.json").read_text(encoding="utf-8-sig"))
          baseline = json.loads(Path("artifacts/v1_1_1/public-baseline.json").read_text(encoding="utf-8-sig"))
          data = installer.read_bytes()
          digest = hashlib.sha256(data).hexdigest()

          checks = {
              "exact_source": manifest["source_sha"] == os.environ["EVIDENCE_SHA"].lower(),
              "version_1_1_1": manifest["public_version"] == "1.1.1" and manifest["pep440_version"] == "1.1.1",
              "stable_release": manifest["channel"] == "stable" and manifest["build_type"] == "release",
              "installer_digest": manifest["sha256"] == digest and len(data) > 0,
              "two_build_semantic": comparison["status"] == "PASS" and comparison["comparison"]["semantic_equivalent"] is True,
              "unsigned_truth": signing["mode"] == "unsigned" and signing["production_signed"] is False,
              "windows_smoke": windows["clean_install_smoke"] is True and windows["clean_uninstall"] is True,
              "baseline_1_1_0": baseline["baseline_source_sha"] == os.environ["BASELINE_SOURCE_SHA"],
              "target_namespace_coherent": baseline["target_namespace_coherent"] is True and (
                  baseline["target_namespace_absent"] is True or baseline["published_target_verified"] is True
              ),
          }
          failed=[name for name, ok in checks.items() if not ok]
          report={
              "schema_version":1,
              "release":"1.1.1",
              "title":"V2 terminal consolidation release candidate",
              "status":"PASS" if not failed else "FAIL",
              "source_sha":os.environ["EVIDENCE_SHA"].lower(),
              "base_terminal_main_sha":os.environ["BASE_MAIN_SHA"],
              "installer_name":installer.name,
              "installer_bytes":len(data),
              "installer_sha256":digest,
              "production_signed":False,
              "authenticode_policy":"allow-unsigned",
              "public_release_triggered":False,
              "public_tag_triggered":False,
              "production_tuf_mutation_triggered":False,
              "winget_submission_triggered":False,
              "checks":checks,
              "summary":{"passed":len(checks)-len(failed),"total":len(checks),"failed":failed},
          }
          canonical=json.dumps(report,sort_keys=True,separators=(",",":")).encode()
          report["evidence_sha256"]=hashlib.sha256(canonical).hexdigest()
          out=Path("artifacts/v1_1_1/V1_1_1_CONSOLIDATION_CANDIDATE.json")
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(report,indent=2,sort_keys=True))
          if failed:
              raise SystemExit("1.1.1 consolidation candidate failed: "+", ".join(failed))

      - name: Upload 1.1.1 consolidation candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1-1-1-consolidation-${{ env.EVIDENCE_SHA }}
          path: artifacts/v1_1_1
          if-no-files-found: error
          retention-days: 30
