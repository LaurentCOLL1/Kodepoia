name: R14.8 END Plan Repair

on:
  push:
    branches:
      - r14/08-cloud-saves
    paths:
      - .github/workflows/r14-8-plan-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/08-cloud-saves
          fetch-depth: 0
      - name: Restore authoritative pre-END plan
        shell: bash
        run: git show 8132c4029983f693a32e0d26903d05e347313bf6:docs/roadmap/R14_PLAN.md > docs/roadmap/R14_PLAN.md
      - name: Apply targeted R14.8 END patch
        run: python .github/r14_8_plan_repair.py
      - name: Self-remove helpers and commit repaired plan
        shell: bash
        run: |
          rm .github/r14_8_plan_repair.py .github/workflows/r14-8-plan-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/R14_PLAN.md .github/r14_8_plan_repair.py .github/workflows/r14-8-plan-repair.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/r14_8_plan_repair.py' '.github/workflows/r14-8-plan-repair.yml' 'docs/roadmap/R14_PLAN.md' | sort)"
          test "$changed" = "$expected"
          git commit -m "docs(r14.8): repair targeted END plan sync"
          git push origin HEAD:r14/08-cloud-saves
