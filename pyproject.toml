[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kodepoia"
version = "0.1.0a2"
description = "Local-first AI development environment for games and applications"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "All rights reserved - private development"}
authors = [{name = "LaurentCOLL1"}]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "keyring>=25.7,<26",
]

[project.optional-dependencies]
ui = ["PySide6>=6.10,<7"]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
kodepoia = "kodepoia.cli:main"
kodepoia-studio = "kodepoia.kodestudio.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kodepoia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
