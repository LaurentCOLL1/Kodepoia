name: R13 Apple Xcode Acceptance

on:
  push:
    branches:
      - "r13/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r13-apple-xcode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-xcode-probe:
    name: apple-xcode-macos-26
    runs-on: macos-26
    timeout-minutes: 15
    env:
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Kodepoia evidence dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused R13.8 Apple/Xcode tests
        run: python -m pytest tests/test_r13_8_apple_xcode_bridge.py -q

      - name: Collect exact-head hosted Xcode capability evidence
        run: >-
          python scripts/r13_8_apple_xcode_acceptance.py
          --source-sha "${{ env.KODEPOIA_SOURCE_SHA }}"
          --output "${{ runner.temp }}/R13_8_APPLE_XCODE_CAPABILITY.json"

      - name: Verify exact-head stable capability without account/device claims
        run: >-
          python -c "import json,os,pathlib; p=json.loads(pathlib.Path(r'${{ runner.temp }}/R13_8_APPLE_XCODE_CAPABILITY.json').read_text(encoding='utf-8')); assert p['source_sha']==os.environ['KODEPOIA_SOURCE_SHA']; assert p['policy_freshness']=='CURRENT'; assert p['channel']=='STABLE'; assert p['capability_state']=='AVAILABLE'; assert p['readiness']=='PRODUCTION_UPLOAD_TOOLCHAIN_READY'; assert p['production_upload_toolchain_capable'] is True; assert p['testflight_beta_toolchain_capable'] is False; assert p['physical_device_capability_proven'] is False; assert p['blockers']==[]"

      - name: Upload exact-head Apple/Xcode capability evidence
        uses: actions/upload-artifact@v4
        with:
          name: r13-8-apple-xcode-${{ runner.os }}-${{ env.KODEPOIA_SOURCE_SHA }}
          if-no-files-found: error
          path: ${{ runner.temp }}/R13_8_APPLE_XCODE_CAPABILITY.json
