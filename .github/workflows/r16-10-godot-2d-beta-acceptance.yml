name: R16.10 Representative Godot 2D Beta Acceptance
# Exact-head retrigger marker; removed by the next commit.

on:
  push:
    branches:
      - r16/10-representative-godot-2d-beta-project
  pull_request:
    paths:
      - .github/workflows/r16-10-godot-2d-beta-acceptance.yml
      - scripts/r16_10_godot_beta_acceptance.py
      - src/kodepoia/core/safe_change.py
      - src/kodepoia/kodegodot/beta_acceptance.py
      - tests/fixtures/r16_10_godot_2d_beta/**
      - tests/test_r16_10_godot_beta.py
      - docs/roadmap/R16_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  representative-godot-2d-beta:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True, encoding="utf-8"
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused acceptance dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build exact-source wheel and sdist
        run: python -m build --wheel --sdist --outdir dist

      - name: Compile focused R16.10 sources
        run: >-
          python -m compileall -q
          src/kodepoia/core/safe_change.py
          src/kodepoia/kodegodot/beta_acceptance.py
          scripts/r16_10_godot_beta_acceptance.py
          tests/test_r16_10_godot_beta.py

      - name: Ruff focused R16.10 sources
        run: >-
          python -m ruff check
          src/kodepoia/core/safe_change.py
          src/kodepoia/kodegodot/beta_acceptance.py
          scripts/r16_10_godot_beta_acceptance.py
          tests/test_r16_10_godot_beta.py

      - name: Run focused R16.10 tests
        run: >-
          python -m pytest -q
          tests/test_audit_safechange.py
          tests/test_r16_10_godot_beta.py

      - name: Emit exact-source R16.10 acceptance
        run: >-
          python scripts/r16_10_godot_beta_acceptance.py
          --source-sha "${{ env.EVIDENCE_SHA }}"
          --platform "${{ runner.os }}"
          --output artifacts/r16_10_godot_beta_acceptance.json

      - name: Upload exact-source acceptance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r16-10-godot-2d-beta-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r16_10_godot_beta_acceptance.json
          if-no-files-found: error
          retention-days: 30
