name: R15.13 normalization helper

on:
  push:
    branches: [r15/13-normalization]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/13-normalization
          fetch-depth: 0
      - name: Normalize continuity and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          text = path.read_text(encoding='utf-8')

          header = "> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1–R15.13 COMPLETE + NORMALIZED; R15.14–R15.17 PLANNED.** R15.13 immutable technical source `f0dfcd1ed3e9d2382ad44efdcd2ec05dbac1b7ac`; final exact END-head `ceecdffcfa207ce73f871c97f95728c0caac1c95` passed R15.13 #34 / `33331358480` Ubuntu + Windows, R0 #2199 / `33331358511` Ubuntu + Windows, Python Core #2174 / `33331358536` and KodeStudio UI Smoke #2139 / `33331358432`; PR #322 merged with `expected_head_sha=ceecdffcfa207ce73f871c97f95728c0caac1c95` as implementation/evidence `main` `6eec01b90790f94fdc32513727329961d884539a`. Manual state R15.13: CONDITIONAL / NOT TRIGGERED. This record is the unique post-merge continuity-only R15.13 normalization authority when merged; R15.14 START-sync is authorized only from the resulting normalized `main` after this branch passes fresh exact-head R0/Python/UI."
          text, n = re.subn(r'^> Kodepoia, architecture v1\.0 gelée\..*$', header, text, count=1, flags=re.M)
          assert n == 1, 'header replacement failed'

          entry = "- R15.13 : **COMPLETE + NORMALIZED** — clean START / normalized R15.12 `main` `ca625d51808de6c1f9c950faecc2aa785e7a757d`; immutable technical source `f0dfcd1ed3e9d2382ad44efdcd2ec05dbac1b7ac`; final exact END-head `ceecdffcfa207ce73f871c97f95728c0caac1c95`; exact-END R15.13 #34 / `33331358480` SUCCESS Ubuntu + Windows, R0 #2199 / `33331358511` SUCCESS Ubuntu + Windows, Python Core #2174 / `33331358536` SUCCESS and KodeStudio UI Smoke #2139 / `33331358432` SUCCESS; PR #322 merged with `expected_head_sha=ceecdffcfa207ce73f871c97f95728c0caac1c95` as implementation/evidence `main` `6eec01b90790f94fdc32513727329961d884539a`. Exact FROM/ADAPTER base binding, deterministic Modelfile, namespaced candidate tags, create/show/tags/run lifecycle, digest/details capture, structured/tool probes, KodeBench veto and governed rollback remain authoritative. Public push, remote authoritative Ollama and silent active-tag replacement remain forbidden. Manual CONDITIONAL / NOT TRIGGERED; no real local-model packaging claim is made. This record is the unique post-merge continuity-only R15.13 normalization authority when merged; R15.14 START-sync is authorized only from the resulting normalized `main` after fresh exact-head R0/Python/UI on this normalization branch."
          text, n = re.subn(r'^- R15\.13 : \*\*COMPLETE\*\* —.*$', entry, text, count=1, flags=re.M)
          assert n == 1, 'R15.13 entry replacement failed'

          text = text.replace('| R15.13 | COMPLETE | CONDITIONAL / NOT TRIGGERED |', '| R15.13 | COMPLETE + NORMALIZED | CONDITIONAL / NOT TRIGGERED |', 1)

          next_action = "**R15.13 implementation/evidence is merged as `main` `6eec01b90790f94fdc32513727329961d884539a`. Complete only this unique continuity-only normalization: require fresh exact-head R0 Repository Guard + full Python Core + KodeStudio UI Smoke, then merge the normalization PR with exact `expected_head_sha`. R15.14 START-sync becomes authorized only from the normalized `main` produced by that merge.**"
          text, n = re.subn(r'(?s)(## Next authorized action\n\n)\*\*.*?\*\*(\n\n## Permanent R-phase execution rule)', r'\1' + next_action + r'\2', text, count=1)
          assert n == 1, 'next action replacement failed'

          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/r15-13-normalize-helper.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          git commit -m "docs(r15.13): normalize post-merge continuity"
          git push origin HEAD:r15/13-normalization
