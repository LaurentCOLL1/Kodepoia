name: V2.6.3 Exact-Source Windows Candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v2-6-3-terminal-candidate.yml
      - .github/workflows/python-core.yml
      - scripts/v2_6_1_acceptance.py
      - scripts/v2_6_2_acceptance.py
      - scripts/v2_6_3_acceptance.py
      - scripts/build_windows_installer.ps1
      - scripts/build_release_bundle.py
      - scripts/generate_release_evidence.py
      - scripts/windows_authenticode.py
      - src/kodepoia/release/**
      - pyproject.toml
      - packaging/windows/**
      - tests/test_r18_release_identity.py
      - tests/test_r18_release_bundle.py
      - tests/test_r18_sbom_provenance.py
      - tests/test_r18_authenticode.py
      - tests/test_r18_5_release_promotion.py
      - tests/test_r18_6_update_trust.py
      - tests/test_v2_6_1_terminal_release_freeze.py
      - tests/test_v2_6_2_terminal_hardening.py
      - tests/test_v2_6_3_terminal_candidate.py
      - docs/release/V2_6_3_TERMINAL_CANDIDATE.md
      - docs/continuity/STATE.md
      - docs/continuity/NEXT.md
      - docs/continuity/KODEPOIA_CURRENT_AUTHORITY.md
      - docs/roadmap/KODEPOIA_ROADMAP_V2.md
      - docs/roadmap/V2_6_HARDENING_NEXT_PUBLIC_WINDOWS_RELEASE.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-6-3-terminal-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-candidate:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KODEPOIA_LOCALE: fr
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
      PUBLISHED_STABLE_SOURCE_SHA: 46ed800888b4f19da9e984232dd1ad6cdb639cc1
      PUBLISHED_STABLE_BYTES: "38834833"
      PUBLISHED_STABLE_SHA256: 8197bc9d8272b97394170a2c7c27b17c1e2f2849931587d21c7bdfda126da2ef
      PUBLISHED_STABLE_RELEASE_ID: "404195689"
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: pwsh
        run: |
          $expected = ([string]$env:EVIDENCE_SHA).Trim().ToLowerInvariant()
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Expected exact candidate source $expected, got $actual"
          }


      - name: Detect terminal publication state
        id: publication
        shell: pwsh
        run: |
          $tagExists = $false
          $releaseExists = $false

          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v1.1.0" *> $null
          if ($LASTEXITCODE -eq 0) {
            $tagExists = $true
          } elseif ($LASTEXITCODE -ne 1) {
            throw "Could not determine public tag state"
          }
          $global:LASTEXITCODE = 0

          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v1.1.0" *> $null
          if ($LASTEXITCODE -eq 0) {
            $releaseExists = $true
          } elseif ($LASTEXITCODE -ne 1) {
            throw "Could not determine public release state"
          }
          $global:LASTEXITCODE = 0

          if ($tagExists -xor $releaseExists) {
            throw "Partial v1.1.0 publication state is not accepted"
          }
          $published = $tagExists -and $releaseExists
          "published=$($published.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify terminal published stable authority
        if: steps.publication.outputs.published == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/v2_6_3" | Out-Null

          $tagRef = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v1.1.0" |
            ConvertFrom-Json
          $tagSha = [string]$tagRef.object.sha
          if ([string]$tagRef.object.type -eq "tag") {
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" |
              ConvertFrom-Json
            $tagSha = [string]$tagObject.object.sha
          }
          if ($tagSha.ToLowerInvariant() -ne $env:PUBLISHED_STABLE_SOURCE_SHA) {
            throw "Published v1.1.0 tag source drift: $tagSha"
          }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v1.1.0" |
            ConvertFrom-Json
          if ([string]$release.id -ne $env:PUBLISHED_STABLE_RELEASE_ID) {
            throw "Published v1.1.0 release identity drift"
          }
          if ([bool]$release.draft -or [bool]$release.prerelease) {
            throw "Published v1.1.0 release state drift"
          }
          if ([string]$release.tag_name -ne "v1.1.0") {
            throw "Published v1.1.0 release tag drift"
          }
          if ([string]$release.target_commitish -ne $env:PUBLISHED_STABLE_SOURCE_SHA) {
            throw "Published v1.1.0 target source drift"
          }
          if ([string]$release.name -ne "Kodepoia 1.1.0") {
            throw "Published v1.1.0 release name drift"
          }

          $assets = @($release.assets | Where-Object { $_.name -eq "KodepoiaSetup.exe" })
          if ($assets.Count -ne 1) {
            throw "Expected exactly one published KodepoiaSetup.exe"
          }
          $asset = $assets[0]
          if ([int64]$asset.size -ne [int64]$env:PUBLISHED_STABLE_BYTES) {
            throw "Published v1.1.0 installer size drift"
          }
          if ([string]$asset.digest -ne "sha256:$env:PUBLISHED_STABLE_SHA256") {
            throw "Published v1.1.0 installer digest drift"
          }

          @{
            schema_version = 1
            mode = "post-publication-historical-verification"
            source_sha = $env:EVIDENCE_SHA.ToLowerInvariant()
            candidate_source_sha = $env:PUBLISHED_STABLE_SOURCE_SHA
            tag = "v1.1.0"
            release_id = [int64]$release.id
            asset_name = [string]$asset.name
            asset_size = [int64]$asset.size
            asset_sha256 = $env:PUBLISHED_STABLE_SHA256
            public_release_verified = $true
            candidate_rebuilt = $false
            candidate_republished = $false
            production_tuf_mutated = $false
            winget_submission = $false
          } | ConvertTo-Json -Depth 5 |
            Set-Content -Encoding UTF8 "artifacts/v2_6_3/post-publication.json"

      - name: Upload V2.6.3 post-publication historical verification
        if: steps.publication.outputs.published == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-6-3-post-publication-${{ env.EVIDENCE_SHA }}
          path: artifacts/v2_6_3/post-publication.json
          if-no-files-found: error
          retention-days: 30

      - name: Install candidate build dependencies
        if: steps.publication.outputs.published != 'true'
        run: python -m pip install -e ".[dev,ui,code,packaging]"

      - name: Install Inno Setup 6
        if: steps.publication.outputs.published != 'true'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile and Ruff V2.6.3 release surfaces
        if: steps.publication.outputs.published != 'true'
        shell: pwsh
        run: |
          python -m compileall -q `
            src/kodepoia/release `
            scripts/v2_6_1_acceptance.py `
            scripts/v2_6_2_acceptance.py `
            scripts/v2_6_3_acceptance.py `
            tests/test_v2_6_3_terminal_candidate.py
          python -m ruff check `
            src/kodepoia/release `
            scripts/v2_6_1_acceptance.py `
            scripts/v2_6_2_acceptance.py `
            scripts/v2_6_3_acceptance.py `
            tests/test_r18_release_identity.py `
            tests/test_r18_6_update_trust.py `
            tests/test_v2_6_1_terminal_release_freeze.py `
            tests/test_v2_6_2_terminal_hardening.py `
            tests/test_v2_6_3_terminal_candidate.py

      - name: Run focused candidate and inherited R18 tests
        if: steps.publication.outputs.published != 'true'
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_v2_6_3_terminal_candidate.py `
            tests/test_r18_release_identity.py `
            tests/test_r18_release_bundle.py `
            tests/test_r18_sbom_provenance.py `
            tests/test_r18_authenticode.py `
            tests/test_r18_5_release_promotion.py `
            tests/test_r18_6_update_trust.py `
            tests/test_v2_6_1_terminal_release_freeze.py `
            tests/test_v2_6_2_terminal_hardening.py

      - name: Generate exact-source SPDX SBOM and provenance
        if: steps.publication.outputs.published != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/v2_6_3/evidence" | Out-Null
          $created = (git show -s --format=%cI "$env:EVIDENCE_SHA").Trim()
          python scripts/generate_release_evidence.py `
            --source-sha "$env:EVIDENCE_SHA" `
            --output-dir "artifacts/v2_6_3/evidence" `
            --repository "$env:GITHUB_REPOSITORY" `
            --workflow-ref "$env:GITHUB_WORKFLOW_REF" `
            --run-id "$env:GITHUB_RUN_ID" `
            --run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --created-at "$created" `
            --optional-group ui `
            --optional-group code

      - name: Build exact-source Windows candidate one
        if: steps.publication.outputs.published != 'true'
        shell: pwsh
        run: |
          ./scripts/build_windows_installer.ps1 -SourceSha "$env:EVIDENCE_SHA"
          New-Item -ItemType Directory -Force -Path "artifacts/v2_6_3/build1" | Out-Null
          Copy-Item "dist/windows/KodepoiaSetup.exe" "artifacts/v2_6_3/build1/KodepoiaSetup.exe"
          Copy-Item `
            "dist/windows/installer-manifest.json" `
            "artifacts/v2_6_3/build1/installer-manifest.json"
          python scripts/build_release_bundle.py `
            --installer "artifacts/v2_6_3/build1/KodepoiaSetup.exe" `
            --installer-manifest "artifacts/v2_6_3/build1/installer-manifest.json" `
            --source-sha "$env:EVIDENCE_SHA" `
            --output-dir "artifacts/v2_6_3/bundle1" `
            --repository "$env:GITHUB_REPOSITORY" `
            --workflow-ref "$env:GITHUB_WORKFLOW_REF" `
            --run-id "$env:GITHUB_RUN_ID" `
            --run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --sbom "artifacts/v2_6_3/evidence/release-sbom.spdx.json" `
            --provenance "artifacts/v2_6_3/evidence/release-provenance.json"
          $bundle = (
            Get-ChildItem "artifacts/v2_6_3/bundle1" -Filter "*.zip" |
              Select-Object -First 1
          ).FullName
          if (-not $bundle) { throw "Candidate bundle one was not produced" }
          "V263_BUNDLE_ONE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inspect exact candidate Authenticode truth
        if: steps.publication.outputs.published != 'true'
        shell: pwsh
        run: |
          python scripts/windows_authenticode.py `
            --mode unsigned `
            --source-sha "$env:EVIDENCE_SHA" `
            --subject "artifacts/v2_6_3/build1/KodepoiaSetup.exe" `
            --output "artifacts/v2_6_3/signing.json"

      - name: Build exact-source Windows candidate two
        if: steps.publication.outputs.published != 'true'
        shell: pwsh
        run: |
          ./scripts/build_windows_installer.ps1 -SourceSha "$env:EVIDENCE_SHA"
          New-Item -ItemType Directory -Force -Path "artifacts/v2_6_3/build2" | Out-Null
          Copy-Item "dist/windows/KodepoiaSetup.exe" "artifacts/v2_6_3/build2/KodepoiaSetup.exe"
          Copy-Item `
            "dist/windows/installer-manifest.json" `
            "artifacts/v2_6_3/build2/installer-manifest.json"
          python scripts/build_release_bundle.py `
            --installer "artifacts/v2_6_3/build2/KodepoiaSetup.exe" `
            --installer-manifest "artifacts/v2_6_3/build2/installer-manifest.json" `
            --source-sha "$env:EVIDENCE_SHA" `
            --output-dir "artifacts/v2_6_3/bundle2" `
            --repository "$env:GITHUB_REPOSITORY" `
            --workflow-ref "$env:GITHUB_WORKFLOW_REF" `
            --run-id "$env:GITHUB_RUN_ID" `
            --run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --sbom "artifacts/v2_6_3/evidence/release-sbom.spdx.json" `
            --provenance "artifacts/v2_6_3/evidence/release-provenance.json"
          $bundle = (
            Get-ChildItem "artifacts/v2_6_3/bundle2" -Filter "*.zip" |
              Select-Object -First 1
          ).FullName
          if (-not $bundle) { throw "Candidate bundle two was not produced" }
          "V263_BUNDLE_TWO=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compare two exact-source candidate builds
        if: steps.publication.outputs.published != 'true'
        shell: pwsh
        run: |
          python scripts/r18_2_release_bundle_acceptance.py `
            --source-sha "$env:EVIDENCE_SHA" `
            --bundle-one "$env:V263_BUNDLE_ONE" `
            --bundle-two "$env:V263_BUNDLE_TWO" `
            --output "artifacts/v2_6_3/two-build.json"
          $report = Get-Content "artifacts/v2_6_3/two-build.json" -Raw | ConvertFrom-Json
          if ($report.status -ne "PASS") { throw "R18.2 two-build candidate comparison failed" }

      - name: Observe public tag and release state without mutation
        if: steps.publication.outputs.published != 'true'
        shell: pwsh
        run: |
          $tagExists = $false
          $releaseExists = $false

          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v1.1.0" *> $null
          if ($LASTEXITCODE -eq 0) {
            $tagExists = $true
          } elseif ($LASTEXITCODE -ne 1) {
            throw "Could not determine public tag state"
          }
          $global:LASTEXITCODE = 0

          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v1.1.0" *> $null
          if ($LASTEXITCODE -eq 0) {
            $releaseExists = $true
          } elseif ($LASTEXITCODE -ne 1) {
            throw "Could not determine public release state"
          }
          $global:LASTEXITCODE = 0

          if ($tagExists -or $releaseExists) {
            throw "v1.1.0 tag/release already exists; immutable candidate staging refuses reuse"
          }

          @{
            tag = "v1.1.0"
            tag_exists = $false
            release_exists = $false
            immutable_release_capability = "not-mutated-in-pull-request"
          } | ConvertTo-Json -Depth 4 |
            Set-Content -Encoding UTF8 "artifacts/v2_6_3/tag-state.json"

      - name: Stage immutable release description without publishing
        if: steps.publication.outputs.published != 'true'
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          from kodepoia.release.bundle import verify_bundle_archive
          from kodepoia.release.promotion import stage_release_archive

          bundle = Path(os.environ["V263_BUNDLE_ONE"])
          verified = verify_bundle_archive(
              bundle,
              expected_source_sha=os.environ["EVIDENCE_SHA"],
          )
          attestation = {
              "schema_version": 1,
              "provider": "github-artifact-attestations",
              "semantics": "provenance_only_not_security_verdict",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["EVIDENCE_SHA"].lower(),
              "verified": True,
              "verification_mode": "synthetic-offline",
              "subjects": [
                  {
                      "name": bundle.name,
                      "sha256": verified["archive_sha256"],
                      "size": verified["archive_size"],
                  }
              ],
          }
          signing = json.loads(
              Path("artifacts/v2_6_3/signing.json").read_text(encoding="utf-8")
          )
          tag_state = json.loads(
              Path("artifacts/v2_6_3/tag-state.json").read_text(encoding="utf-8-sig")
          )
          staged = stage_release_archive(
              archive_path=bundle,
              source_sha=os.environ["EVIDENCE_SHA"],
              repository=os.environ["GITHUB_REPOSITORY"],
              signing_evidence=signing,
              attestation_receipt=attestation,
              tag_state=tag_state,
          )
          if staged["github_release"]["publication_triggered"]:
              raise SystemExit("candidate staging unexpectedly triggered publication")
          Path("artifacts/v2_6_3/staged-release.json").write_text(
              json.dumps(staged, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

      - name: Clean install, packaged smoke and uninstall
        if: steps.publication.outputs.published != 'true'
        shell: pwsh
        run: |
          $setup = (Resolve-Path "artifacts/v2_6_3/build1/KodepoiaSetup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "Kodepoia-v263-candidate"
          $smokeDir = Join-Path $env:RUNNER_TEMP "Kodepoia-v263-smoke"
          $smokeReport = Join-Path $env:RUNNER_TEMP "kodepoia-v263-smoke.txt"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeReport -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null

          $install = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/MERGETASKS=!desktopicon",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Candidate install failed: $($install.ExitCode)" }

          $exe = Join-Path $installDir "KodepoiaStudio.exe"
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $exe)) { throw "Installed candidate executable missing" }
          if (-not (Test-Path $uninstaller)) { throw "Candidate uninstaller missing" }

          $originalPath = $env:PATH
          $originalPythonHome = $env:PYTHONHOME
          $originalPythonPath = $env:PYTHONPATH
          $env:PATH = @(
            (Join-Path $env:SystemRoot "System32"),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot "System32\Wbem")
          ) -join ";"
          $env:PYTHONHOME = $null
          $env:PYTHONPATH = $null
          try {
            if (Get-Command python.exe -ErrorAction SilentlyContinue) {
              throw "Developer Python is visible during candidate smoke"
            }
            if (Get-Command pip.exe -ErrorAction SilentlyContinue) {
              throw "Developer pip is visible during candidate smoke"
            }
            $smoke = Start-Process -FilePath $exe -ArgumentList @(
              "--smoke-test",
              "--smoke-report=$smokeReport"
            ) -WorkingDirectory $smokeDir -Wait -PassThru
            if ($smoke.ExitCode -ne 0) {
              if (Test-Path $smokeReport) { Get-Content $smokeReport }
              throw "Candidate packaged smoke failed: $($smoke.ExitCode)"
            }
          }
          finally {
            $env:PATH = $originalPath
            $env:PYTHONHOME = $originalPythonHome
            $env:PYTHONPATH = $originalPythonPath
          }

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Candidate uninstall failed: $($uninstall.ExitCode)"
          }
          for ($attempt = 0; $attempt -lt 40 -and (Test-Path $exe); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          $clean = -not (Test-Path $exe)
          if (-not $clean) { throw "Candidate executable remains after uninstall" }

          @{
            source_sha = $env:EVIDENCE_SHA.ToLowerInvariant()
            clean_install_smoke = $true
            clean_uninstall = [bool]$clean
            project_data_mutation = $false
            public_release_effect = $false
            production_tuf_mutation = $false
          } | ConvertTo-Json -Depth 4 |
            Set-Content -Encoding UTF8 "artifacts/v2_6_3/windows.json"

      - name: Run actual V2.6.3 exact-source candidate acceptance
        if: steps.publication.outputs.published != 'true'
        shell: pwsh
        run: |
          python scripts/v2_6_3_acceptance.py `
            --source-sha "$env:EVIDENCE_SHA" `
            --repository "$env:GITHUB_REPOSITORY" `
            --installer "artifacts/v2_6_3/build1/KodepoiaSetup.exe" `
            --installer-manifest "artifacts/v2_6_3/build1/installer-manifest.json" `
            --bundle-one "$env:V263_BUNDLE_ONE" `
            --bundle-two "$env:V263_BUNDLE_TWO" `
            --sbom "artifacts/v2_6_3/evidence/release-sbom.spdx.json" `
            --provenance "artifacts/v2_6_3/evidence/release-provenance.json" `
            --signing-evidence "artifacts/v2_6_3/signing.json" `
            --windows-evidence "artifacts/v2_6_3/windows.json" `
            --staged-release "artifacts/v2_6_3/staged-release.json" `
            --output "artifacts/v2_6_3/V2_6_3_WINDOWS_CANDIDATE.json"
          $report = Get-Content "artifacts/v2_6_3/V2_6_3_WINDOWS_CANDIDATE.json" -Raw | ConvertFrom-Json
          if ($report.status -ne "PASS") { throw "V2.6.3 candidate status is not PASS" }
          if ($report.candidate_source_sha -ne $env:EVIDENCE_SHA) {
            throw "V2.6.3 candidate source SHA mismatch"
          }
          if (
            $report.public_release_triggered -or
            $report.public_tag_triggered -or
            $report.public_asset_upload_triggered -or
            $report.production_tuf_mutation_triggered -or
            $report.live_updater_activation_triggered -or
            $report.signing_secret_provisioned -or
            $report.winget_submission_triggered
          ) {
            throw "V2.6.3 candidate unexpectedly performed a forbidden public effect"
          }

      - name: Upload V2.6.3 exact-source candidate evidence
        if: steps.publication.outputs.published != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-6-3-windows-candidate-${{ env.EVIDENCE_SHA }}
          path: artifacts/v2_6_3
          if-no-files-found: error
          retention-days: 30
