name: R14.3 Focused Prevalidation Temp

on:
  push:
    branches:
      - r14/03-local-backend-runtime

permissions:
  contents: write

jobs:
  focused:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R14.3 branch
        uses: actions/checkout@v4
        with:
          ref: r14/03-local-backend-runtime
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply R14.3 core patch
        run: |
          python scripts/_r14_3_core_patch_temp.py
          git diff --check -- src/kodepoia/backend schemas/r14 tests/test_r14_3_local_backend_runtime.py docs/roadmap/R14_3_DESIGN.md docs/roadmap/R14_3_ACCEPTANCE.md
      - name: Install focused test dependencies
        run: python -m pip install -e ".[dev,code]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: R14.3 focused and compatibility tests
        run: |
          pytest -q \
            tests/test_r14_3_local_backend_runtime.py \
            tests/test_r14_2_backend_profiles.py \
            tests/test_r2_acceptance.py
      - name: Prepare final implementation tree
        run: |
          rm -f scripts/_r14_3_core_patch_temp.py .github/workflows/r14-03-focused-temp.yml .r14_3_focused_trigger
          git add \
            src/kodepoia/backend/__init__.py \
            src/kodepoia/backend/local_config.py \
            src/kodepoia/backend/scaffold.py \
            src/kodepoia/backend/health.py \
            src/kodepoia/backend/local_fixture_server.py \
            src/kodepoia/backend/runtime.py \
            schemas/r14/backend-local-config.schema.json \
            schemas/r14/backend-workspace-manifest.schema.json \
            schemas/r14/backend-health-snapshot.schema.json \
            tests/test_r14_3_local_backend_runtime.py \
            docs/roadmap/R14_3_DESIGN.md \
            docs/roadmap/R14_3_ACCEPTANCE.md
          git add -u -- scripts/_r14_3_core_patch_temp.py .github/workflows/r14-03-focused-temp.yml .r14_3_focused_trigger
          git diff --cached --check
          staged=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/r14-03-focused-temp.yml' \
            '.r14_3_focused_trigger' \
            'docs/roadmap/R14_3_ACCEPTANCE.md' \
            'docs/roadmap/R14_3_DESIGN.md' \
            'schemas/r14/backend-health-snapshot.schema.json' \
            'schemas/r14/backend-local-config.schema.json' \
            'schemas/r14/backend-workspace-manifest.schema.json' \
            'scripts/_r14_3_core_patch_temp.py' \
            'src/kodepoia/backend/__init__.py' \
            'src/kodepoia/backend/health.py' \
            'src/kodepoia/backend/local_config.py' \
            'src/kodepoia/backend/local_fixture_server.py' \
            'src/kodepoia/backend/runtime.py' \
            'src/kodepoia/backend/scaffold.py' \
            'tests/test_r14_3_local_backend_runtime.py' | sort)
          if [ "$staged" != "$expected" ]; then
            echo 'Unexpected staged paths:'
            printf '%s\n' "$staged"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R14.3 deterministic local backend scaffold and runtime'
          git push origin HEAD:r14/03-local-backend-runtime
