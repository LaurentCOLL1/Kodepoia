name: R15.4 START-sync helper
on:
  push:
    branches: [r15/04-dedup-contamination]
permissions:
  contents: write
jobs:
  start-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/04-dedup-contamination
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-r0.txt
      - run: python scripts/r15_4_start_sync.py
      - run: git diff --check
      - run: python scripts/check_repo.py
      - name: Commit START state and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15_4_start_sync.yml scripts/r15_4_start_sync.py
          git add docs/roadmap/R15_PLAN.md docs/continuity/KODEPOIA_CONTINUITY.md
          git commit -m "docs(r15.4): synchronize START state"
          git push origin HEAD:r15/04-dedup-contamination
