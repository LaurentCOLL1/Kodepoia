name: R18.5 Immutable GitHub Release Staging Acceptance

on:
  push:
    branches:
      - r18/05-immutable-github-release-staging
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r18-5-github-release-staging-acceptance.yml
      - schemas/release/github-release-promotion.schema.json
      - scripts/github_release_promotion.py
      - scripts/r18_5_release_staging_acceptance.py
      - src/kodepoia/release/**
      - tests/test_r18_5_release_promotion.py
      - docs/release/R18_5_GITHUB_RELEASE_STAGING.md
      - docs/roadmap/R18_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r18-5-github-release-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile R18.5 sources
        run: >-
          python -m compileall -q
          src/kodepoia/release/promotion.py
          scripts/github_release_promotion.py
          scripts/r18_5_release_staging_acceptance.py
          tests/test_r18_5_release_promotion.py

      - name: Collect Ruff R18.5 diagnostics
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path

          output = Path("artifacts/r18_5")
          output.mkdir(parents=True, exist_ok=True)
          command = [
              sys.executable,
              "-m",
              "ruff",
              "check",
              "--output-format",
              "json",
              "src/kodepoia/release/promotion.py",
              "scripts/github_release_promotion.py",
              "scripts/r18_5_release_staging_acceptance.py",
              "tests/test_r18_5_release_promotion.py",
          ]
          result = subprocess.run(command, text=True, capture_output=True, check=False)
          (output / "ruff.json").write_text(result.stdout or "[]\n", encoding="utf-8")
          (output / "ruff-exit-code.txt").write_text(
              f"{result.returncode}\n", encoding="utf-8"
          )
          if result.stderr:
              (output / "ruff-stderr.txt").write_text(result.stderr, encoding="utf-8")
          if result.returncode not in {0, 1}:
              raise SystemExit(
                  f"Ruff execution failed unexpectedly with exit code {result.returncode}"
              )

      - name: Run focused R18.5 tests
        run: python -m pytest -q tests/test_r18_5_release_promotion.py

      - name: Emit exact-source synthetic R18.5 acceptance
        run: >-
          python scripts/r18_5_release_staging_acceptance.py
          --source-sha "${{ env.EVIDENCE_SHA }}"
          --output artifacts/r18_5/release-staging-acceptance.json

      - name: Assert no public effect was triggered
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("artifacts/r18_5/release-staging-acceptance.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          if report["source_sha"] != expected:
              raise SystemExit("acceptance source SHA mismatch")
          if report["cases_total"] != 12 or report["cases_passed"] != 12:
              raise SystemExit("R18.5 focused acceptance is incomplete")
          if report["github_api_write_calls"] != 0:
              raise SystemExit("R18.5 acceptance unexpectedly performed a GitHub write")
          if report["public_release_created"]:
              raise SystemExit("R18.5 acceptance unexpectedly created a public release")
          if report["immutable_release_setting_changed"]:
              raise SystemExit("R18.5 acceptance unexpectedly changed repository settings")

      - name: Upload R18.5 contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-5-release-staging-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r18_5/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Ruff clean verdict
        if: always()
        shell: python
        run: |
          from pathlib import Path

          status = Path("artifacts/r18_5/ruff-exit-code.txt")
          if not status.is_file():
              raise SystemExit("Ruff diagnostic status is missing")
          code = int(status.read_text(encoding="utf-8").strip())
          if code != 0:
              raise SystemExit(f"Ruff reported diagnostics (exit code {code})")
