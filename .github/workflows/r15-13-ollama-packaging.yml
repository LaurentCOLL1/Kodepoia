name: R15.13 Ollama Packaging Acceptance

on:
  push:
    branches: [r15/13-ollama-import-packaging]
  pull_request:
    paths:
      - 'src/kodepoia/tuning/ollama_packaging.py'
      - 'tests/test_ollama_packaging_r15_13.py'
      - 'schemas/r15-13-ollama-package.schema.json'
      - '.github/workflows/r15-13-ollama-packaging.yml'
      - 'src/kodepoia/brain/ollama.py'
      - 'src/kodepoia/tuning/gguf.py'
      - 'tests/test_ollama_client.py'
      - 'tests/test_gguf_conversion_r15_12.py'
      - 'docs/roadmap/R15_PLAN.md'
      - 'docs/continuity/KODEPOIA_CONTINUITY.md'

permissions:
  contents: read

jobs:
  ollama-packaging:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core development dependencies
        run: python -m pip install -e ".[dev]"
      - name: R15.13 focused and dependency tests
        run: >-
          python -m pytest -q
          tests/test_ollama_packaging_r15_13.py
          tests/test_ollama_client.py
          tests/test_gguf_conversion_r15_12.py
      - name: Ruff R15.13-owned surface
        run: >-
          python -m ruff check
          src/kodepoia/tuning/ollama_packaging.py
          tests/test_ollama_packaging_r15_13.py
      - name: Compile R15.13 surface
        run: python -m compileall -q src/kodepoia/tuning/ollama_packaging.py
      - name: Validate R15.13 JSON schema
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          path = Path('schemas/r15-13-ollama-package.schema.json')
          Draft202012Validator.check_schema(json.loads(path.read_text(encoding='utf-8')))
          PY
