name: R16.16 START Sync Helper

on:
  push:
    branches:
      - "r16/16-start-sync-helper"

permissions:
  contents: write

jobs:
  publish-start-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "r16/16-start-sync-helper"
          path: helper
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact normalized R16.15 main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "d19a8b1fa32fa5e28fa23b036407bc5bd902ef92"
          path: repo
          fetch-depth: 0

      - name: Build and publish documentation-only START-sync
        shell: bash
        run: |
          set -euo pipefail
          BASE=d19a8b1fa32fa5e28fa23b036407bc5bd902ef92
          test "$(git -C repo rev-parse HEAD)" = "$BASE"
          cp helper/.github/r16_16_start_sync_helper.py /tmp/r16_16_start_sync_helper.py
          cd repo
          git update-index --assume-unchanged docs/roadmap/R10_7_LOCAL_ACCEPTANCE.json
          python /tmp/r16_16_start_sync_helper.py

          expected=(
            "docs/continuity/KODEPOIA_CONTINUITY.md"
            "docs/roadmap/R16_PLAN.md"
          )
          git add -- "${expected[@]}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${staged[*]}" = "${expected_sorted[*]}"
          git diff --cached --check

          tree=$(git write-tree)
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'docs(r16.16): synchronize START authority' | git commit-tree "$tree" -p "$BASE")
          mapfile -t committed < <(git diff-tree --no-commit-id --name-only -r "$commit" | sort)
          test "${committed[*]}" = "${expected_sorted[*]}"
          echo "R16_16_START_HEAD=$commit"
          git push origin "$commit":refs/heads/r16/16-resource-concurrency-leak-diagnostics-soak
