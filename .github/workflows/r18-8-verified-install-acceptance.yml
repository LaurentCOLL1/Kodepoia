name: R18.8 Verified Download Install Rollback Acceptance

on:
  push:
    branches:
      - r18/08-verified-download-install-rollback
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r18-8-verified-install-acceptance.yml
      - src/kodepoia/update/**
      - src/kodepoia/kodestudio/update_settings.py
      - src/kodepoia/kodestudio/v11_localization.py
      - tests/test_r18_8_verified_delivery.py
      - tests/test_r18_8_kodestudio_install.py
      - configs/r16_supply_chain_policy.json
      - tests/test_supply_chain_r16_9.py
      - docs/roadmap/R18_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r18-8-verified-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-delivery-contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install Qt Linux runtime dependency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev,ui]"

      - name: Compile R18.8 sources and tests
        run: >-
          python -m compileall -q
          src/kodepoia/update/delivery.py
          src/kodepoia/kodestudio/update_settings.py
          src/kodepoia/kodestudio/v11_localization.py
          tests/test_r18_8_verified_delivery.py

      - name: Enforce Ruff-clean R18.8 scope
        run: >-
          python -m ruff check
          src/kodepoia/update/delivery.py
          src/kodepoia/kodestudio/update_settings.py
          src/kodepoia/kodestudio/v11_localization.py
          tests/test_r18_8_verified_delivery.py
          tests/test_supply_chain_r16_9.py

      - name: Run focused R18.8 delivery tests
        run: python -m pytest -q tests/test_r18_8_verified_delivery.py

      - name: Run R16.9 supply-chain regression
        run: python -m pytest -q tests/test_supply_chain_r16_9.py

      - name: Run KodeStudio R18.8 UI tests when present
        shell: bash
        run: |
          if [ -f tests/test_r18_8_kodestudio_install.py ]; then
            python -m pytest -q tests/test_r18_8_kodestudio_install.py
          fi

      - name: Emit exact-source R18.8 evidence
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          output = Path("artifacts/r18_8")
          output.mkdir(parents=True, exist_ok=True)
          payload = {
              "schema_version": 1,
              "subdivision": "R18.8",
              "source_sha": os.environ["EVIDENCE_SHA"].strip().lower(),
              "target_transport": "bounded-streaming",
              "partial_suffix": ".partial",
              "atomic_finalize_after_verification": True,
              "tuf_length_hash_required": True,
              "authenticode_required_before_finalize": True,
              "installer_identity_required_before_finalize": True,
              "tamper_recheck_before_launch": True,
              "explicit_user_consent_required": True,
              "automatic_installer_launch": False,
              "recovery_state_persisted": True,
              "project_data_mutation": False,
              "manual_intervention": "NONE",
          }
          (output / "acceptance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

      - name: Upload R18.8 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-8-verified-install-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r18_8/
          if-no-files-found: error
          retention-days: 30
