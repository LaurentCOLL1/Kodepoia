name: R14.2 Core Patch Temp

on:
  push:
    branches:
      - r14/02-backend-service-intent
    paths:
      - .r14_2_core_patch_trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R14.2 branch
        uses: actions/checkout@v4
        with:
          ref: r14/02-backend-service-intent
          fetch-depth: 0

      - name: Apply deterministic core patch
        run: |
          python scripts/_r14_2_patch_temp.py
          python -m compileall -q src
          git diff --check

      - name: Prepare final core patch tree
        run: |
          rm scripts/_r14_2_patch_temp.py
          rm .github/workflows/r14-02-core-patch-temp.yml
          rm .r14_2_core_patch_trigger
          git add src/kodepoia/backend/contracts.py src/kodepoia/backend/__init__.py src/kodepoia/project/dna.py src/kodepoia/project/wizard.py schemas/project-dna-v1.schema.json
          git add -u -- scripts/_r14_2_patch_temp.py .github/workflows/r14-02-core-patch-temp.yml .r14_2_core_patch_trigger
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R14.2 Project DNA backend profiles and Wizard intent"
          git push origin HEAD:r14/02-backend-service-intent
