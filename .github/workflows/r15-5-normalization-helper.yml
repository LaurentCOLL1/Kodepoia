name: R15.5 Normalization Helper
on:
  push:
    branches: [r15/05-post-merge-normalization]
    paths: ['.github/workflows/r15-5-normalization-helper.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/05-post-merge-normalization
          fetch-depth: 0
      - name: Normalize continuity only
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          text = p.read_text(encoding='utf-8')
          lines = text.splitlines()
          assert lines[0].startswith('> Kodepoia, architecture v1.0 gelée.')
          lines[0] = '> Kodepoia, architecture v1.0 gelée. **R1–R14 COMPLETE + NORMALIZED. R15 planning ACCEPTED + NORMALIZED. R15.1–R15.5 COMPLETE + NORMALIZED; R15.6–R15.17 PLANNED.** R15.5 clean START `4c9bee744e4c43ef130e50c4867ca3d467878c51`; immutable technical source `1ecdfda67a23d8659e48e4c76f805a45a1560ec5`; implementation END `9cc528a3be1dba2f915b6383c1817191f78060d1`; implementation merge `ceba5be8875e5eb9af62db202c050015be00e09a`; bounded END-sync recovery head `a28f38fb20f0121a469d5584673a8b11c3c728ba` passed R15.5 #10 / `33289951604`, R0 #2120 / `33289951595`, Python Core #2095 / `33289951773` 5/5 and UI #2060 / `33289951649`, then recovery PR #305 merged exact head as `ff6851eb43905cbf347a44f444a68fea5d0227fe`. This is the unique continuity-only R15.5 post-merge normalization candidate; only its exact-head R0/Python/UI SUCCESS and expected-head merge authorize R15.6. Manual NONE.'
          text = '\n'.join(lines) + '\n'
          text, n = re.subn(r'(?m)^- R15\.5 : \*\*COMPLETE\*\* —.*$', '- R15.5 : **COMPLETE + NORMALIZED** — clean START `4c9bee744e4c43ef130e50c4867ca3d467878c51`; immutable technical source `1ecdfda67a23d8659e48e4c76f805a45a1560ec5`; implementation END `9cc528a3be1dba2f915b6383c1817191f78060d1` with exact-END R15.5 #6 / `33288867382`, R0 #2103 / `33288867356`, Python #2078 / `33288867418` 5/5 and UI #2043 / `33288867394` SUCCESS; implementation PR #304 merge `ceba5be8875e5eb9af62db202c050015be00e09a`; bounded END-sync recovery head `a28f38fb20f0121a469d5584673a8b11c3c728ba` passed R15.5 #10 / `33289951604`, R0 #2120 / `33289951595`, Python #2095 / `33289951773` 5/5 and UI #2060 / `33289951649`; recovery PR #305 merged exact head as `ff6851eb43905cbf347a44f444a68fea5d0227fe`. Manual NONE. This record is the unique post-merge continuity-only R15.5 normalization candidate; R15.6 START-sync is authorized only after fresh exact-head R0/Python/UI on this branch and expected-head merge to `main`.', text, count=1)
          assert n == 1
          text, n = re.subn(r'(?m)^\| R15\.5 \| COMPLETE \| NONE \|$', '| R15.5 | COMPLETE + NORMALIZED | NONE |', text, count=1)
          assert n == 1
          replacement = '## Next authorized action\n\n**R15.5 END-sync recovery is merged as `ff6851eb43905cbf347a44f444a68fea5d0227fe`. This branch is the unique continuity-only post-merge normalization: require fresh exact-head R0 Repository Guard + full Python Core + KodeStudio UI Smoke, then merge only with `expected_head_sha`. Only the resulting normalized `main` authorizes R15.6 START-sync; `docs/roadmap/R15_PLAN.md` must not change.**\n\n'
          text, n = re.subn(r'## Next authorized action\n.*?(?=## Permanent R-phase execution rule)', replacement, text, count=1, flags=re.S)
          assert n == 1
          p.write_text(text, encoding='utf-8')
      - name: Commit normalization and remove helper
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r15-5-normalization-helper.yml
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git commit -m "docs(r15.5): normalize post-merge continuity"
          git push origin HEAD:r15/05-post-merge-normalization
