name: R20.5 Expiry Monitoring UX Acceptance

on:
  push:
    branches:
      - r20/05-expiry-monitoring-ux-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r20-5-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitoring-contract:
    name: r20-5-contract-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile R20.5 sources
        run: >-
          python -m compileall -q
          src/kodepoia/update/operations_health.py
          scripts/r20_5_expiry_monitor.py
          tests/test_r20_5_operations_health.py

      - name: Run Ruff R20.5
        run: >-
          python -m ruff check
          src/kodepoia/update/operations_health.py
          scripts/r20_5_expiry_monitor.py
          tests/test_r20_5_operations_health.py

      - name: Run R20.5 and inherited refresh regressions
        run: >-
          python -m pytest -q
          tests/test_r20_5_operations_health.py
          tests/test_r20_4_steady_state_refresh.py
          tests/test_r20_3_zero_cost_signing.py
          tests/test_r20_3_root_transition.py
          tests/test_r20_2_online_signing.py
          tests/test_r20_1_bridge_refresh.py

      - name: Prepare deterministic healthy R20.4 workflow evidence
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "r20_4_runs.json"
          path.write_text(json.dumps({
              "workflow_runs": [{
                  "id": 205,
                  "event": "schedule",
                  "head_branch": "main",
                  "head_sha": "f" * 40,
                  "status": "completed",
                  "conclusion": "success",
                  "run_started_at": "2026-09-10T18:17:00Z",
                  "updated_at": "2026-09-10T18:20:00Z",
                  "html_url": "https://github.com/LaurentCOLL1/Kodepoia/actions/runs/205",
              }]
          }), encoding="utf-8")

      - name: Prove production metadata monitor is non-destructive
        run: >-
          python scripts/r20_5_expiry_monitor.py
          --workflow-runs "${{ runner.temp }}/r20_4_runs.json"
          --reference-time 2026-09-10T20:00:00Z
          --source-sha "$EVIDENCE_SHA"
          --fail-on critical

      - name: Assert monitor did not modify repository state
        shell: python
        run: |
          import subprocess

          changed = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=no"], text=True
          ).strip()
          if changed:
              raise SystemExit(f"R20.5 monitor modified tracked repository state: {changed}")

      - name: Assert R20.5 operational workflow is least-privilege
        shell: python
        run: |
          from pathlib import Path

          text = Path(".github/workflows/r20-5-expiry-monitoring.yml").read_text(encoding="utf-8")
          lowered = text.lower()
          required = (
              'cron: "47 */6 * * *"',
              "workflow_dispatch:",
              "actions: read",
              "contents: read",
              "r20-4-scheduled-metadata-refresh.yml/runs?branch=main",
              "scripts/r20_5_expiry_monitor.py",
              "--fail-on critical",
          )
          for marker in required:
              if marker not in lowered:
                  raise SystemExit(f"R20.5 monitor workflow missing invariant: {marker}")
          forbidden = (
              "actions: write",
              "contents: write",
              "pull-requests: write",
              "id-token: write",
              "tuf_snapshot_ed25519_seed_b64",
              "tuf_timestamp_ed25519_seed_b64",
              "environment: tuf-production-signing",
              "upload-artifact",
          )
          for marker in forbidden:
              if marker in lowered:
                  raise SystemExit(f"R20.5 monitor workflow has forbidden capability: {marker}")

      - name: Assert R20.5 documentation authority is synchronized
        shell: python
        run: |
          from pathlib import Path

          plan = Path("docs/roadmap/R20_PLAN.md").read_text(encoding="utf-8")
          continuity = Path("docs/continuity/KODEPOIA_CONTINUITY_R20.md").read_text(encoding="utf-8")
          runbook = Path("docs/release/R20_5_UPDATE_OPERATIONS_RUNBOOK.md").read_text(encoding="utf-8")
          required_plan = (
              "R20.5 — Expiry Monitoring, Alerting & Client UX Hardening",
              "36 hours",
              "24 hours",
              "9 hours",
              "18 hours",
              "r20-5-expiry-monitoring.yml",
          )
          for marker in required_plan:
              if marker not in plan:
                  raise SystemExit(f"R20 plan missing R20.5 synchronization: {marker}")
          required_continuity = (
              "fa8460a7681554e2e9cd47adc591e2fed5af0956",
              "r20/05-expiry-monitoring-ux-hardening",
              "R20_5_UPDATE_OPERATIONS_RUNBOOK.md",
          )
          for marker in required_continuity:
              if marker not in continuity:
                  raise SystemExit(f"R20 continuity missing R20.5 synchronization: {marker}")
          for marker in (
              "Emergency manual refresh",
              "GitHub Actions outage",
              "Root/Targets",
              "never accept expired",
          ):
              if marker not in runbook:
                  raise SystemExit(f"R20.5 runbook missing incident guidance: {marker}")

      - name: Emit R20.5 acceptance summary
        shell: python
        run: |
          import json
          import os

          print(json.dumps({
              "format": "kodepoia-r20-5-expiry-monitoring-ux-acceptance",
              "schema_version": 1,
              "source_sha": os.environ["EVIDENCE_SHA"].strip().lower(),
              "metadata_roles_monitored": ["root", "targets", "snapshot", "timestamp"],
              "online_warning_hours": 36,
              "online_critical_hours": 24,
              "refresh_success_warning_hours": 9,
              "refresh_success_critical_hours": 18,
              "localized_service_messages": ["en", "fr"],
              "blocks_application_startup": False,
              "blocks_local_work": False,
              "accepts_expired_or_unverifiable_metadata": False,
              "monitor_has_signing_secrets": False,
              "paid_provider_required": False,
              "runbook_present": True,
              "status": "pass",
          }, indent=2, sort_keys=True))
