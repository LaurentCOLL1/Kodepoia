name: R16.8 Fault Recovery Acceptance

on:
  push:
    branches:
      - r16/08-fault-injection-recovery-drills
  pull_request:
    paths:
      - .github/workflows/r16-8-fault-recovery-acceptance.yml
      - scripts/r16_8_fault_recovery_acceptance.py
      - src/kodepoia/core/backup.py
      - src/kodepoia/core/fault_injection.py
      - src/kodepoia/core/recovery.py
      - src/kodepoia/core/safe_change.py
      - src/kodepoia/core/kill_switch.py
      - src/kodepoia/core/sandbox.py
      - tests/test_r16_fault_recovery.py
      - tests/fixtures/r16_8/**
      - docs/roadmap/R16_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fault-recovery:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True, encoding="utf-8"
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused acceptance dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile focused R16.8 sources
        run: >-
          python -m compileall -q
          src/kodepoia/core/backup.py
          src/kodepoia/core/fault_injection.py
          src/kodepoia/core/recovery.py
          src/kodepoia/core/safe_change.py
          src/kodepoia/core/kill_switch.py
          src/kodepoia/core/sandbox.py
          scripts/r16_8_fault_recovery_acceptance.py
          tests/test_r16_fault_recovery.py

      - name: Ruff focused R16.8 sources
        run: >-
          python -m ruff check
          src/kodepoia/core/backup.py
          src/kodepoia/core/fault_injection.py
          src/kodepoia/core/recovery.py
          src/kodepoia/core/safe_change.py
          src/kodepoia/core/kill_switch.py
          src/kodepoia/core/sandbox.py
          scripts/r16_8_fault_recovery_acceptance.py
          tests/test_r16_fault_recovery.py

      - name: Run focused R16.8 tests
        run: python -m pytest -q tests/test_r16_fault_recovery.py

      - name: Emit exact-source R16.8 acceptance
        run: >-
          python scripts/r16_8_fault_recovery_acceptance.py
          --source-sha "${{ env.EVIDENCE_SHA }}"
          --output artifacts/r16_8_fault_recovery_acceptance.json

      - name: Validate machine-readable R16.8 acceptance
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("artifacts/r16_8_fault_recovery_acceptance.json").read_text(encoding="utf-8")
          )
          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          if report["source_sha"] != expected:
              raise SystemExit("acceptance source SHA mismatch")
          if report["manual"] != "NONE":
              raise SystemExit("R16.8 must remain manual NONE")
          if report["critical_veto"]:
              raise SystemExit("R16.8 acceptance has a critical veto")
          if report["summary"]["passed"] != report["summary"]["total"]:
              raise SystemExit("R16.8 acceptance is not fully passing")
          if report["production_disaster_recovery_guarantee"]:
              raise SystemExit("R16.8 must not claim production disaster recovery")

      - name: Upload exact-source acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: r16-8-fault-recovery-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r16_8_fault_recovery_acceptance.json
          if-no-files-found: error
          retention-days: 30
