name: R18 Accepted Installer Prerelease And Root Sync

on:
  push:
    branches:
      - release/r18-root-installer-prerelease-fast

permissions:
  contents: write

jobs:
  publish-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      KODEPOIA_RELEASE_SOURCE_SHA: c64bac012ef3afa332526a539901b11428fd966f
      KODEPOIA_RELEASE_TAG: v1.1.0-rc1
      KODEPOIA_ACCEPTED_ARTIFACT_ID: '9997038510'
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/r18-root-installer-prerelease-fast
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Download accepted R17 Windows installer artifact
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'accepted-installer.zip'
          $out = Join-Path $env:RUNNER_TEMP 'accepted-installer'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:KODEPOIA_ACCEPTED_ARTIFACT_ID/zip"
          Invoke-WebRequest -Uri $uri -Headers $headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $setup = Get-ChildItem $out -Recurse -File -Filter 'KodepoiaSetup.exe' | Select-Object -First 1
          $manifest = Get-ChildItem $out -Recurse -File -Filter 'installer-manifest.json' | Select-Object -First 1
          if (-not $setup) { throw 'Accepted artifact does not contain KodepoiaSetup.exe' }
          if (-not $manifest) { throw 'Accepted artifact does not contain installer-manifest.json' }
          "KODEPOIA_ACCEPTED_SETUP=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KODEPOIA_ACCEPTED_MANIFEST=$($manifest.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify accepted artifact metadata
        shell: pwsh
        run: |
          $manifest = Get-Content $env:KODEPOIA_ACCEPTED_MANIFEST -Raw | ConvertFrom-Json
          if ($manifest.production_signed -ne $false) { throw 'Expected accepted RC to remain production_signed=false' }
          Write-Host (Get-Content $env:KODEPOIA_ACCEPTED_MANIFEST -Raw)

      - name: Re-run clean install, packaged smoke and uninstall
        shell: pwsh
        run: |
          $setup = $env:KODEPOIA_ACCEPTED_SETUP
          $installDir = Join-Path $env:RUNNER_TEMP 'Kodepoia-accepted-installed'
          $smokeDir = Join-Path $env:RUNNER_TEMP 'Kodepoia-accepted-smoke'
          $smokeReport = Join-Path $env:RUNNER_TEMP 'Kodepoia-accepted-smoke.txt'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/MERGETASKS=!desktopicon',"/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $exe = Join-Path $installDir 'KodepoiaStudio.exe'
          $uninstall = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $exe)) { throw 'Installed KodepoiaStudio.exe missing' }
          if (-not (Test-Path $uninstall)) { throw 'Uninstaller missing' }
          $originalPath = $env:PATH
          $originalPythonHome = $env:PYTHONHOME
          $originalPythonPath = $env:PYTHONPATH
          $env:PATH = @((Join-Path $env:SystemRoot 'System32'),$env:SystemRoot,(Join-Path $env:SystemRoot 'System32\Wbem')) -join ';'
          $env:PYTHONHOME = $null
          $env:PYTHONPATH = $null
          try {
            if (Get-Command python.exe -ErrorAction SilentlyContinue) { throw 'Developer Python visible during packaged smoke' }
            if (Get-Command pip.exe -ErrorAction SilentlyContinue) { throw 'Developer pip visible during packaged smoke' }
            $smoke = Start-Process -FilePath $exe -ArgumentList @('--smoke-test',"--smoke-report=$smokeReport") -WorkingDirectory $smokeDir -Wait -PassThru
            if ($smoke.ExitCode -ne 0) {
              if (Test-Path $smokeReport) { Get-Content $smokeReport }
              throw "Packaged smoke failed with $($smoke.ExitCode)"
            }
          }
          finally {
            $env:PATH = $originalPath
            $env:PYTHONHOME = $originalPythonHome
            $env:PYTHONPATH = $originalPythonPath
          }
          $remove = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstaller failed with $($remove.ExitCode)" }
          for ($attempt = 0; $attempt -lt 40 -and (Test-Path $exe); $attempt++) { Start-Sleep -Milliseconds 250 }
          if (Test-Path $exe) { throw 'KodepoiaStudio.exe still exists after uninstall' }

      - name: Record accepted installer identity
        shell: pwsh
        run: |
          $hash = (Get-FileHash $env:KODEPOIA_ACCEPTED_SETUP -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $env:KODEPOIA_ACCEPTED_SETUP).Length
          "KODEPOIA_INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KODEPOIA_INSTALLER_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer SHA-256: $hash"
          Write-Host "Installer bytes: $size"

      - name: Publish public GitHub prerelease
        shell: pwsh
        run: |
          gh release view $env:KODEPOIA_RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:KODEPOIA_RELEASE_TAG already exists; refusing implicit mutation" }
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          Kodepoia 1.1.0-rc1 is the accepted Windows beta/release-candidate published after R18 completion.

          - Windows x64 standalone installer: KodepoiaSetup.exe
          - Accepted exact source: $env:KODEPOIA_RELEASE_SOURCE_SHA
          - SHA-256: $env:KODEPOIA_INSTALLER_SHA256
          - Installer size: $env:KODEPOIA_INSTALLER_SIZE bytes
          - production_signed=false

          This is a public prerelease, not a production-signed stable release. Windows/SmartScreen may display a signature or reputation warning. Public WinGet submission, production Authenticode signing and production TUF key custody/rotation remain separate and are not triggered by this release.
          "@ | Set-Content -Path $notes -Encoding utf8
          gh release create $env:KODEPOIA_RELEASE_TAG `
            "$env:KODEPOIA_ACCEPTED_SETUP#KodepoiaSetup.exe" `
            "$env:KODEPOIA_ACCEPTED_MANIFEST#installer-manifest.json" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:KODEPOIA_RELEASE_SOURCE_SHA `
            --title 'Kodepoia 1.1.0-rc1' `
            --notes-file $notes `
            --prerelease

      - name: Materialize root installer mirror and documentation
        shell: pwsh
        run: |
          Copy-Item $env:KODEPOIA_ACCEPTED_SETUP (Join-Path $env:GITHUB_WORKSPACE 'KodepoiaSetup.exe') -Force
          "$env:KODEPOIA_INSTALLER_SHA256  KodepoiaSetup.exe" | Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'KodepoiaSetup.exe.sha256') -Encoding ascii
          python .github/r18_release_root_sync.py

      - name: Commit clean candidate through Git LFS
        shell: pwsh
        run: |
          git lfs install --local
          Remove-Item '.github/r18_release_root_sync.py' -Force
          Remove-Item '.github/workflows/r18-release-root-fast-transport.yml' -Force
          git add -A
          Write-Host '=== Staged paths ==='
          git diff --cached --name-status
          python scripts/check_repo.py
          $lfs = git lfs ls-files
          $lfs | Write-Host
          if (-not ($lfs -match 'KodepoiaSetup.exe')) { throw 'Root KodepoiaSetup.exe is not tracked by Git LFS' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: expose accepted Windows installer at root and publish prerelease'
          git push origin HEAD:release/r18-root-installer-prerelease-fast
