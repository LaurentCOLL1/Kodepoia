name: R14.2 START Sync Temp

on:
  push:
    branches:
      - r14/02-backend-service-intent
    paths:
      - .r14_2_start_sync_trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R14.2 branch
        uses: actions/checkout@v4
        with:
          ref: r14/02-backend-service-intent
          fetch-depth: 0

      - name: Apply deterministic START-sync
        run: |
          python scripts/_r14_2_start_sync_temp.py
          git diff --check

      - name: Prepare final START-sync tree
        run: |
          rm scripts/_r14_2_start_sync_temp.py
          rm .github/workflows/r14-02-start-sync-temp.yml
          rm .r14_2_start_sync_trigger
          git restore --source=HEAD --worktree -- docs/roadmap/R10_7_LOCAL_ACCEPTANCE.json
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only 41f0775731c405a6b208baec8910bdb36a78d10e -- | sort)"
          expected="$(printf '%s\n' 'docs/continuity/KODEPOIA_CONTINUITY.md' 'docs/roadmap/R14_PLAN.md' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected cumulative START-sync tree:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R14.2 START-sync plan and continuity"
          git push origin HEAD:r14/02-backend-service-intent
