name: R16.18 START Helper

on:
  push:
    branches:
      - "r16/18-start-helper"

permissions:
  contents: write

jobs:
  publish-start:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "r16/18-start-helper"
          path: helper
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact normalized R16.17 main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "41706493d974799b7011953e584b887ca6db1996"
          path: repo
          fetch-depth: 0
          lfs: false

      - name: Build and publish documentation-only R16.18 START
        shell: bash
        run: |
          set -euo pipefail
          BASE=41706493d974799b7011953e584b887ca6db1996
          DECISION_BRANCH=r16/18-integrated-adversarial-real-project-rc-acceptance
          test "$(git -C repo rev-parse HEAD)" = "$BASE"
          current_remote="$(git -C repo ls-remote origin "refs/heads/$DECISION_BRANCH" | cut -f1)"
          test "$current_remote" = "$BASE"

          cp helper/.github/r16_18_start_helper.py /tmp/r16_18_start_helper.py
          cd repo
          git update-index --assume-unchanged docs/roadmap/R10_7_LOCAL_ACCEPTANCE.json
          python /tmp/r16_18_start_helper.py

          expected=(
            "docs/continuity/KODEPOIA_CONTINUITY.md"
            "docs/roadmap/R16_PLAN.md"
          )
          git add -- "${expected[@]}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${staged[*]}" = "${expected_sorted[*]}"
          git diff --cached --check

          tree=$(git write-tree)
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'docs(r16.18): synchronize START authority' | git commit-tree "$tree" -p "$BASE")
          test "$(git rev-parse "$commit^")" = "$BASE"
          mapfile -t committed < <(git diff-tree --no-commit-id --name-only -r "$commit" | sort)
          test "${committed[*]}" = "${expected_sorted[*]}"
          echo "R16_18_START_BOT_HEAD=$commit"
          git push origin "$commit:refs/heads/$DECISION_BRANCH"
