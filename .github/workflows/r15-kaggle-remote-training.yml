name: R15 Kaggle Remote Training Acceptance

on:
  pull_request:
    paths:
      - 'src/kodepoia/tuning/kaggle_remote.py'
      - 'tests/test_tuning_kaggle_remote.py'
      - 'src/kodepoia/tuning/kaggle_live_qualification.py'
      - 'src/kodepoia/tuning/kaggle_live_bootstrap.py'
      - 'qualification/v2_4_5/live_workload.json'
      - 'tests/test_v2_4_5_model_lab_accelerator.py'
      - 'tests/test_v2_4_5_live_bootstrap.py'
      - 'schemas/v2-4-5-kaggle-live-qualification.schema.json'
      - 'pyproject.toml'
      - '.github/workflows/r15-kaggle-remote-training.yml'
      - 'docs/user/KAGGLE_REMOTE_TRAINING.md'

permissions:
  contents: read

jobs:
  kaggle-remote-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.KODEPOIA_SOURCE_SHA }}
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os, subprocess
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == os.environ['KODEPOIA_SOURCE_SHA'], (actual, os.environ['KODEPOIA_SOURCE_SHA'])
      - name: Install core development dependencies only
        run: python -m pip install -e ".[dev]"
      - name: Compile Kaggle integration
        run: >-
          python -m compileall -q
          src/kodepoia/tuning/kaggle_remote.py
          src/kodepoia/tuning/kaggle_live_qualification.py
          src/kodepoia/tuning/kaggle_live_bootstrap.py
          tests/test_tuning_kaggle_remote.py
          tests/test_v2_4_5_model_lab_accelerator.py
          tests/test_v2_4_5_live_bootstrap.py
          tests/test_v2_4_5_live_bootstrap.py
      - name: Ruff Kaggle integration
        run: >-
          python -m ruff check
          src/kodepoia/tuning/kaggle_remote.py
          src/kodepoia/tuning/kaggle_live_qualification.py
          src/kodepoia/tuning/kaggle_live_bootstrap.py
          src/kodepoia/kodestudio/model_lab_accelerator.py
          tests/test_tuning_kaggle_remote.py
          tests/test_v2_4_5_model_lab_accelerator.py
          tests/test_v2_4_5_live_bootstrap.py
      - name: Focused Kaggle tests
        run: >-
          python -m pytest -q
          tests/test_tuning_kaggle_remote.py
          tests/test_v2_4_5_model_lab_accelerator.py
      - name: CLI import smoke
        run: python -c "from kodepoia.tuning.kaggle_remote import main; assert callable(main)"
