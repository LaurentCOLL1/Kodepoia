name: R14.2 Continuity Normalize Temp

on:
  push:
    branches:
      - r14/02-continuity-normalization

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout normalization branch
        uses: actions/checkout@v4
        with:
          ref: r14/02-continuity-normalization
          fetch-depth: 0
      - name: Apply continuity-only normalization
        run: |
          python scripts/_r14_2_normalize_temp.py
      - name: Guard cumulative normalization scope
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only ad5de7c1697d061946bf75220420c75b73851531...HEAD; git diff --name-only)
          printf '%s\n' "${changed[@]}" | sed '/^$/d' | sort -u > /tmp/changed.txt
          allowed='docs/continuity/KODEPOIA_CONTINUITY.md'
          actual=$(grep -v -E '^(.github/workflows/r14-02-normalize-temp.yml|scripts/_r14_2_normalize_temp.py|.r14_2_normalize_trigger)$' /tmp/changed.txt || true)
          if [ "$actual" != "$allowed" ]; then
            echo 'Unexpected cumulative normalization paths:'
            cat /tmp/changed.txt
            exit 1
          fi
      - name: Commit final continuity-only tree
        run: |
          rm -f scripts/_r14_2_normalize_temp.py .github/workflows/r14-02-normalize-temp.yml .r14_2_normalize_trigger
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git add -u -- scripts/_r14_2_normalize_temp.py .github/workflows/r14-02-normalize-temp.yml .r14_2_normalize_trigger
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R14.2 normalize post-merge continuity'
          git push origin HEAD:r14/02-continuity-normalization
