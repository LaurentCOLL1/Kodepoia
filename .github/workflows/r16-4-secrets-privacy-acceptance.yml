name: R16.4 Secrets Privacy Acceptance

on:
  push:
    branches:
      - r16/04-secrets-privacy-exfiltration-hardening
  pull_request:
    paths:
      - .github/workflows/r16-4-secrets-privacy-acceptance.yml
      - docs/security/R16_4_SECRETS_PRIVACY.md
      - scripts/r16_4_acceptance.py
      - src/kodepoia/core/secret_guard.py
      - src/kodepoia/core/secrets.py
      - src/kodepoia/core/sandbox.py
      - tests/test_r16_secret_guard.py
      - docs/roadmap/R16_PLAN.md
      - docs/continuity/KODEPOIA_CONTINUITY.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-privacy:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert exact checkout provenance
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["EVIDENCE_SHA"].strip().lower()
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True, encoding="utf-8"
          ).strip().lower()
          if actual != expected:
              raise SystemExit(f"checkout mismatch: expected {expected}, got {actual}")

      - name: Install focused acceptance dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile focused R16.4 sources
        run: >-
          python -m compileall -q
          src/kodepoia/core/secret_guard.py
          scripts/r16_4_acceptance.py
          tests/test_r16_secret_guard.py

      - name: Ruff focused R16.4 sources
        run: >-
          python -m ruff check
          src/kodepoia/core/secret_guard.py
          scripts/r16_4_acceptance.py
          tests/test_r16_secret_guard.py

      - name: Run focused R16.4 tests
        run: python -m pytest -q tests/test_r16_secret_guard.py

      - name: Emit exact-source R16.4 acceptance
        run: >-
          python scripts/r16_4_acceptance.py
          --source-sha "${{ env.EVIDENCE_SHA }}"
          --output artifacts/r16_4_acceptance.json

      - name: Upload exact-source acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: r16-4-secrets-privacy-${{ runner.os }}-${{ env.EVIDENCE_SHA }}
          path: artifacts/r16_4_acceptance.json
          if-no-files-found: error
          retention-days: 30
