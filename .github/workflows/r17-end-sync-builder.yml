name: Temporary R17 END Sync Builder

on:
  push:
    branches:
      - scratch/r17-end-sync-builder

permissions:
  contents: write

jobs:
  build-clean-end:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 7ed0731c1aa3c94d8a5feb13a08ae7ad953a86c9
      TARGET_BRANCH: r17/distribution-guided-ux
    steps:
      - name: Checkout immutable technical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Build documentation blobs from exact source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          source = os.environ["SOURCE_SHA"]

          def show(path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"{source}:{path}"], text=True, encoding="utf-8"
              )

          plan_path = "docs/roadmap/R17_PLAN.md"
          plan = show(plan_path)
          old_status = "Status: **IN_PROGRESS**"
          new_status = "Status: **COMPLETE AT END-SYNC — PENDING EXACT-HEAD MERGE + PHASE NORMALIZATION**"
          if plan.count(old_status) != 1:
              raise SystemExit("Unexpected R17 plan status cardinality")
          plan = plan.replace(old_status, new_status, 1)

          anchor = "## Out of scope\n"
          if plan.count(anchor) != 1:
              raise SystemExit("Unexpected R17 plan out-of-scope anchor cardinality")
          evidence = """## Technical acceptance evidence\n\n- Immutable accepted technical source: `7ed0731c1aa3c94d8a5feb13a08ae7ad953a86c9`.\n- R17 Windows Installer #8 / `33899936010`: **SUCCESS** on Windows Server 2025. Focused R17 packaging/UX tests: **11 passed**. Nuitka 4.2 built the complete standalone distribution and Inno Setup 6.7.1 produced `KodepoiaSetup.exe`.\n- Installer identity: version `1.1.0-rc1`; `KodepoiaSetup.exe` SHA-256 `e1871a7f01a08685aadd993e3a51d8ecf01e5bcbdd52bb050652b5bcdf1f9cc2`; `production_signed=false`.\n- Installer artifact: Actions artifact `9947822021`, name `KodepoiaSetup-Windows`, 33,444,079 bytes, ZIP digest `sha256:877d884568024b3653cbb725eea73e3c8a2fab7b6fdaed1f763bc26e81546f06`.\n- End-user independence was exercised, not inferred: silent install succeeded; installed `KodepoiaStudio.exe` launched from a clean temporary working directory while developer `python.exe` and `pip.exe` were absent from `PATH` and `PYTHONHOME`/`PYTHONPATH` were cleared; packaged UI smoke returned success; silent uninstall succeeded; the installed executable was confirmed removed.\n- Exact-source general gates: Temporary R17 Exact-Head Premerge Gates #6 / `33900785285` — R0 Repository Guard **SUCCESS** Ubuntu + Windows, full Python Core **SUCCESS** Ubuntu + Windows, and KodeStudio + R17 UI smoke **SUCCESS** Windows.\n- Superseded diagnostic predecessor `4cd308200ec9fbdef6f15f660373962fee02d2b0` / installer run #7 `33895528885` is **NON-AUTHORITATIVE** for the final decision because its installed packaged smoke failed. Its failure was used only to harden diagnostics and isolation; its PASS fragments are not reused as final acceptance evidence.\n- Diagnostic candidate `d703abf62321e9c8cbdde2cb1ceb9adf39035d42` and targeted run `33899782461` validated the diagnostic/clean-smoke contract before integration but are not the immutable final technical source.\n- Core manual intervention: **NONE**. Production code signing and public/store publication remain **CONDITIONAL / NOT TRIGGERED**; no certificate, production signing identity, store credential or publication action was exercised.\n- This END-sync is documentation-only relative to the immutable technical source. Its resulting exact END-head must pass fresh R17 Windows Installer + R0 + full Python Core + KodeStudio UI gates before the implementation/evidence PR may merge to `main`.\n\n"""
          plan = plan.replace(anchor, evidence + anchor, 1)

          continuity_path = "docs/continuity/KODEPOIA_CONTINUITY.md"
          continuity = show(continuity_path)
          marker = "## R17 — Distribution & Guided Creation UX\n"
          prefix, found, _old_tail = continuity.partition(marker)
          if not found:
              raise SystemExit("R17 continuity marker not found")
          new_tail = marker + """\n- State: **COMPLETE AT END-SYNC / PENDING exact-head implementation-evidence merge + single post-merge normalization**.\n- Authorized normalized base: `main` `11194ec5bbb6a986d0fa206517ad3759378a80cf` — R16 COMPLETE + NORMALIZED / v1.0 phase complete.\n- Dedicated branch: `r17/distribution-guided-ux`. Frozen R17 scope remains Windows end-user distribution, French-first guided UX, beginner project-creation catalogs, functional local Chat/Vision, README/install guidance and guarded exact-source packaging CI.\n- Immutable accepted technical source: **`7ed0731c1aa3c94d8a5feb13a08ae7ad953a86c9`**.\n- R17 Windows Installer #8 / `33899936010`: **SUCCESS** on Windows Server 2025. Focused R17 packaging/UX tests: **11 passed**. Nuitka 4.2 compiled 533 C files into the standalone distribution; Inno Setup 6.7.1 produced the final accepted installer.\n- Accepted `KodepoiaSetup.exe`: version `1.1.0-rc1`; SHA-256 **`e1871a7f01a08685aadd993e3a51d8ecf01e5bcbdd52bb050652b5bcdf1f9cc2`**; manifest `production_signed=false`; standalone executable `KodepoiaStudio.exe`.\n- Accepted Actions artifact: ID **`9947822021`**, `KodepoiaSetup-Windows`, **33,444,079 bytes**, artifact ZIP digest **`sha256:877d884568024b3653cbb725eea73e3c8a2fab7b6fdaed1f763bc26e81546f06`**.\n- End-user independence is exercised evidence: silent install succeeded into a clean runner-temp location; the installed executable existed with its uninstaller; packaged UI smoke launched from a separate empty working directory while developer Python/pip were removed from `PATH` and `PYTHONHOME`/`PYTHONPATH` were cleared; smoke returned success; silent uninstall returned success; `KodepoiaStudio.exe` was confirmed removed afterward. Target users therefore do not require a separately installed Python or `pip` for this accepted package.\n- Exact-source general gates: Temporary R17 Exact-Head Premerge Gates #6 / `33900785285` — R0 Repository Guard **SUCCESS Ubuntu + Windows**; full Python Core **SUCCESS Ubuntu + Windows**; KodeStudio + R17 UI smoke **SUCCESS Windows**, all checking out exact source `7ed0731c1aa3c94d8a5feb13a08ae7ad953a86c9`.\n- Superseded predecessor `4cd308200ec9fbdef6f15f660373962fee02d2b0` and R17 Windows Installer #7 / `33895528885` are **NON-AUTHORITATIVE** for final acceptance because packaged runtime smoke failed there. The earlier installer hash and partial PASSes are diagnostic history only and are not reused for the final decision.\n- Diagnostic candidate `d703abf62321e9c8cbdde2cb1ceb9adf39035d42` / targeted gate `33899782461` is also not the immutable final source; it only validated the clean-environment diagnostic contract prior to PR #376 integration.\n- French/local UX acceptance includes FR/EN locale selection, French-system preference with explicit override, guided genre/graphics/scope/audience presets without breaking R12–R14 `QLineEdit` contracts, a real Chat/Vision page, structured Summary/Goals/Success metrics/Constraints/MVP/Out of scope/Requirements/Acceptance criteria, local Ollama integration, deterministic clarification fallback, draft persistence and Chat→project Vision transfer.\n- Installer truth boundary: `production_signed=false`; no public GitHub Release/store publication, production certificate, signing key, store credential or external model/Ollama bundle is claimed. Core manual state **NONE**; optional production signing/public publication remain **CONDITIONAL / NOT TRIGGERED**.\n- This END-sync changes only `docs/roadmap/R17_PLAN.md` and this continuity file relative to immutable technical source `7ed0731c1aa3c94d8a5feb13a08ae7ad953a86c9`. The exact END-head containing this record must receive fresh R17 Windows Installer + R0 + full Python Core + KodeStudio UI success before exact-head merge to `main`; technical-source gates alone cannot authorize the END merge.\n- After that implementation/evidence merge, exactly one continuity-only post-merge R17 phase normalization is authorized. No second R17 phase normalization is permitted.\n"""
          continuity = prefix + new_tail

          tmp = Path(os.environ["RUNNER_TEMP"])
          (tmp / "R17_PLAN.md").write_text(plan, encoding="utf-8", newline="\n")
          (tmp / "KODEPOIA_CONTINUITY.md").write_text(continuity, encoding="utf-8", newline="\n")
          PY

      - name: Create clean direct-child END commit and fast-forward R17
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [[ "$remote_head" != "$SOURCE_SHA" ]]; then
            echo "R17 moved: expected $SOURCE_SHA, got $remote_head" >&2
            exit 1
          fi

          plan_blob="$(git hash-object -w "$RUNNER_TEMP/R17_PLAN.md")"
          continuity_blob="$(git hash-object -w "$RUNNER_TEMP/KODEPOIA_CONTINUITY.md")"
          index="$RUNNER_TEMP/r17-end-index"
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "${SOURCE_SHA}^{tree}"
          GIT_INDEX_FILE="$index" git update-index --add --cacheinfo "100644,${plan_blob},docs/roadmap/R17_PLAN.md"
          GIT_INDEX_FILE="$index" git update-index --add --cacheinfo "100644,${continuity_blob},docs/continuity/KODEPOIA_CONTINUITY.md"
          tree="$(GIT_INDEX_FILE="$index" git write-tree)"

          export GIT_AUTHOR_NAME="LaurentCOLL1"
          export GIT_AUTHOR_EMAIL="128934707+LaurentCOLL1@users.noreply.github.com"
          export GIT_COMMITTER_NAME="LaurentCOLL1"
          export GIT_COMMITTER_EMAIL="128934707+LaurentCOLL1@users.noreply.github.com"
          end_sha="$(printf '%s\n' 'docs(r17): final END-sync acceptance evidence' | git commit-tree "$tree" -p "$SOURCE_SHA")"

          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$end_sha" | sort)
          expected=("docs/continuity/KODEPOIA_CONTINUITY.md" "docs/roadmap/R17_PLAN.md")
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected END diff: %s\n' "${changed[*]}" >&2
            exit 1
          fi

          git push origin "${end_sha}:refs/heads/${TARGET_BRANCH}"
          echo "R17_END_SHA=$end_sha"
