name: R14.15 guarded implementation

on:
  push:
    branches:
      - r14/15-service-operations-resilience
    paths:
      - .github/workflows/_r14_15_impl.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard exact START parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "r14/15-service-operations-resilience"
          test "$(git rev-parse HEAD^)" = "c3dd8aa5f3a7ec7d5f866ead207cf3a023fedbf0"

      - name: Apply R14.15 implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import zlib
          from pathlib import Path

          payload = ''
          files = json.loads(zlib.decompress(base64.b64decode(payload)).decode("utf-8"))
          for raw_path, content in files.items():
              path = Path(raw_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")

          init_path = Path("src/kodepoia/backend/__init__.py")
          text = init_path.read_text(encoding="utf-8")
          assert "from .resilience import (" not in text
          import_marker = "from .runtime import BackendLocalRuntime, BackendRuntimeHandle\n"
          assert import_marker in text
          resilience_import = '''from .resilience import (
    BackupArtifact,
    Bulkhead,
    CircuitBreaker,
    CircuitState,
    DependencyHealth,
    DependencyState,
    DisasterRecoveryPolicy,
    FailureAction,
    FailureInjector,
    FailureRule,
    GracefulDrain,
    IsolatedRestoreRunner,
    LoadBudgetResult,
    LoadObservation,
    LoadProfile,
    OtelServiceObservation,
    ResilienceCapacityError,
    ResiliencePolicyError,
    ResilienceStateError,
    ResilientExecutor,
    RestoreEvidence,
    RetryEvidence,
    RetryPolicy,
    ServiceHealthSnapshot,
    ServiceHealthState,
    ServiceOperationsEvidence,
    TokenBucketRateLimiter,
    evaluate_load,
)
'''
          text = text.replace(import_marker, resilience_import + import_marker, 1)
          all_marker = '    "canonical_sha256",\n]'
          assert all_marker in text
          resilience_all = '''    "BackupArtifact",
    "Bulkhead",
    "CircuitBreaker",
    "CircuitState",
    "DependencyHealth",
    "DependencyState",
    "DisasterRecoveryPolicy",
    "FailureAction",
    "FailureInjector",
    "FailureRule",
    "GracefulDrain",
    "IsolatedRestoreRunner",
    "LoadBudgetResult",
    "LoadObservation",
    "LoadProfile",
    "OtelServiceObservation",
    "ResilienceCapacityError",
    "ResiliencePolicyError",
    "ResilienceStateError",
    "ResilientExecutor",
    "RestoreEvidence",
    "RetryEvidence",
    "RetryPolicy",
    "ServiceHealthSnapshot",
    "ServiceHealthState",
    "ServiceOperationsEvidence",
    "TokenBucketRateLimiter",
    "evaluate_load",
'''
          text = text.replace(all_marker, resilience_all + all_marker, 1)
          init_path.write_text(text, encoding="utf-8")
          Path(".github/workflows/_r14_15_impl.yml").unlink()
          PY

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Focused validation before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/kodepoia/backend/resilience.py \
            src/kodepoia/backend/__init__.py \
            scripts/r14_15_resilience_acceptance.py \
            tests/test_r14_15_resilience.py \
            tests/test_r14_15_backend_exports.py
          python -m pytest -q tests/test_r14_15_resilience.py tests/test_r14_15_backend_exports.py
          python scripts/r14_15_resilience_acceptance.py \
            --source-sha aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --output /tmp/r14_15_evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          evidence = json.loads(Path("/tmp/r14_15_evidence.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("schemas/r14/backend-resilience-evidence.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(evidence)
          assert evidence["status"] == "pass"
          assert len(evidence["checks"]) >= 20
          assert all(evidence["checks"].values())
          PY
          git diff --check

      - name: Guard final implementation surface and push
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat <<'EOF'
.github/workflows/r14-resilience-acceptance.yml
schemas/r14/backend-resilience-evidence.schema.json
scripts/r14_15_resilience_acceptance.py
src/kodepoia/backend/__init__.py
src/kodepoia/backend/resilience.py
tests/test_r14_15_backend_exports.py
tests/test_r14_15_resilience.py
EOF
          )"
          actual="$(git diff --name-only c3dd8aa5f3a7ec7d5f866ead207cf3a023fedbf0 | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(r14.15): add service operations resilience"
          git push origin HEAD:r14/15-service-operations-resilience
