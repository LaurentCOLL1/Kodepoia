name: R15.10 Base Adapter Evaluation Acceptance

on:
  push:
    branches: [r15/10-base-adapter-evaluation]
  pull_request:
    paths:
      - 'src/kodepoia/bench/**'
      - 'tests/test_kodebench_v2.py'
      - 'tests/test_candidate_evaluation_r15_10.py'
      - 'schemas/kodebench-v2-report.schema.json'
      - 'schemas/r15-10-candidate-evaluation.schema.json'
      - '.github/workflows/r15-6-kodebench-v2.yml'
      - '.github/workflows/r15-10-base-adapter-evaluation.yml'
      - 'docs/roadmap/R15_10_*'
      - 'docs/roadmap/R15_PLAN.md'
      - 'docs/continuity/KODEPOIA_CONTINUITY.md'

permissions:
  contents: read

jobs:
  base-adapter-evaluation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core development dependencies
        run: python -m pip install -e ".[dev]"
      - name: KodeBench compatibility and R15.10 focused tests
        run: >-
          python -m pytest -q
          tests/test_kodebench_v2.py
          tests/test_candidate_evaluation_r15_10.py
      - name: Ruff R15.10-owned surface
        run: >-
          python -m ruff check
          src/kodepoia/bench/evaluation.py
          tests/test_candidate_evaluation_r15_10.py
      - name: Verify public import block
        run: python -m ruff check --select I src/kodepoia/bench/__init__.py
      - name: Compile benchmark evaluation surface
        run: python -m compileall -q src/kodepoia/bench
      - name: Validate KodeBench and R15.10 JSON schemas
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          for path in (
              Path('schemas/kodebench-v2-report.schema.json'),
              Path('schemas/r15-10-candidate-evaluation.schema.json'),
          ):
              schema = json.loads(path.read_text(encoding='utf-8'))
              Draft202012Validator.check_schema(schema)
          PY
      - name: Serialized candidate evaluation schema smoke
        run: >-
          python -m pytest -q
          tests/test_candidate_evaluation_r15_10.py::test_saved_evaluation_validates_r15_10_schema
