name: R18.7 normalization helper (ephemeral)

on:
  push:
    branches:
      - r18/07-continuity-normalization
    paths:
      - .github/workflows/r18-7-normalization-helper.yml

permissions:
  contents: write

jobs:
  normalize-continuity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout normalization branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Write unique R18.7 normalization record and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/continuity/KODEPOIA_CONTINUITY.md")
          helper = Path(".github/workflows/r18-7-normalization-helper.yml")
          text = path.read_text(encoding="utf-8")

          old_banner = "> Kodepoia, architecture v1.0 gelée. **R1–R17 COMPLETE + NORMALIZED. R18 planning ACCEPTED + NORMALIZED. R18.1–R18.6 are COMPLETE + NORMALIZED on their recorded canonical mains. R18.7 KodeStudio update discovery and release-channel UX is IN_PROGRESS at END-sync after technical acceptance on immutable source `9e177643f245eb32dd302a5c5eedd6d76d4b9386`; pre-END R18.7/R16.9/R0/Python/UI gates are SUCCESS, while fresh exact-END gates, protected PR #395 merge and the unique post-merge continuity normalization remain mandatory. R18.8–R18.11 remain PLANNED.** Production signing, public GitHub Release publication, immutable-release repository setting changes, production TUF key custody/hosting and public WinGet submission remain CONDITIONAL / NOT TRIGGERED."
          new_banner = "> Kodepoia, architecture v1.0 gelée. **R1–R17 COMPLETE + NORMALIZED. R18 planning ACCEPTED + NORMALIZED. R18.1–R18.6 are COMPLETE + NORMALIZED on their recorded canonical mains. R18.7 KodeStudio update discovery and release-channel UX is COMPLETE + NORMALIZED effective when this unique post-merge continuity-only normalization record enters `main` through fresh exact-head R0/Python/UI gates and exact expected-head merge; R18.8–R18.11 remain PLANNED and R18.8 START is authorized only from the normalized `main` produced by that merge.** Production signing, public GitHub Release publication, immutable-release repository setting changes, production TUF key custody/hosting and public WinGet submission remain CONDITIONAL / NOT TRIGGERED."

          r18_6 = "- R18.6 : **COMPLETE + NORMALIZED effective when this unique post-merge continuity-only normalization record enters `main` through fresh exact-head R0/Python/UI gates and exact expected-head merge** — exact normalized R18.5 base `main` `2f0929c30f717ad608523cc1837ecfb1129a28f1`; immutable technical source `071d5a8715d0d28c73283a9313730a339d72cc44`; final exact-END `5bed28375d99b068eb765c40e90197fcd1312e1d` passed R18.6 #50 / `33993086014` Ubuntu + Windows, R16.9 #158 / `33993085919` Ubuntu + Windows, R0 #2500 / `33993085982` Ubuntu + Windows, Python Core #2472 / `33993085851` 5/5 and UI #2437 / `33993085986`; PR #393 merged with `expected_head_sha=5bed28375d99b068eb765c40e90197fcd1312e1d` as implementation/evidence `main` `ac966e4fc678b51857c99fdeb9cc93487ea6888f`. Embedded synthetic root remains v1, 2-of-2, 2044 exact bytes, SHA-256 `885bc87c3a5e9fe8b378cac85eb89fc37f99fcd8ba0bc7c494ee1e407da96670`, acceptance-only and explicit opt-in. This record is the single authorized R18.6 post-merge continuity-only normalization authority; no second R18.6 normalization is authorized. R18.7 START-sync is authorized only from the normalized `main` produced by this record's exact gated merge. Production TUF root/key custody/hosting and all public/production distribution effects remain NOT TRIGGERED."
          r18_7 = "- R18.7 : **COMPLETE + NORMALIZED effective when this unique post-merge continuity-only normalization record enters `main` through fresh exact-head R0/Python/UI gates and exact expected-head merge** — exact normalized R18.6 base `main` `4ccbe4ef1fe66f88e38dfc8c9dfebba7e183efe1`; immutable accepted technical source `9e177643f245eb32dd302a5c5eedd6d76d4b9386`; final exact-END `85021acb72cd0d69763eaa2c87e874019061d538` passed R18.7 #47 / `34019055827` Ubuntu + Windows, R16.9 #184 / `34019055655` Ubuntu + Windows, R0 #2528 / `34019055858` Ubuntu + Windows, Python Core #2500 / `34019055862` 5/5 and KodeStudio UI Smoke #2465 / `34019055667`; PR #395 merged with `expected_head_sha=85021acb72cd0d69763eaa2c87e874019061d538` as implementation/evidence `main` `a896650d547e28fe0a7158dc360f5a11c2bb1b91`. Discovery remains TUF-metadata-only with channels `stable`/`beta`/`nightly`, conservative `stable` default, 24 h periodic default bounded 6–168 h, no startup network dependency, no target download and no automatic installer launch. This record is the single authorized R18.7 post-merge continuity-only normalization authority; no second R18.7 normalization is authorized. R18.8 START-sync is authorized only from the normalized `main` produced by this record's exact gated merge. Manual NONE; production signing/public GitHub Release/immutable-release setting/production TUF key custody-hosting/public WinGet remain CONDITIONAL / NOT TRIGGERED."

          old_state = "- State: **IN_PROGRESS at END-sync** — planning and R18.1–R18.6 are COMPLETE + NORMALIZED. Canonical normalized R18.6 `main` is `4ccbe4ef1fe66f88e38dfc8c9dfebba7e183efe1` after implementation/evidence PR #393 and unique normalization PR #394. R18.7 technical acceptance is SUCCESS on immutable source `9e177643f245eb32dd302a5c5eedd6d76d4b9386`; fresh exact-END gates, protected PR #395 merge and the unique post-merge continuity-only normalization are still mandatory before R18.8 START. R18.8–R18.11 remain PLANNED. Manual state for core R18.7 is NONE; public/production distribution effects remain CONDITIONAL / NOT TRIGGERED."
          new_state = "- State: **R18.7 COMPLETE + NORMALIZED effective when this unique post-merge continuity-only normalization record enters `main` through fresh exact-head R0/Python/UI gates and exact expected-head merge** — planning and R18.1–R18.6 are already COMPLETE + NORMALIZED; R18.7 immutable technical source is `9e177643f245eb32dd302a5c5eedd6d76d4b9386`, final exact-END is `85021acb72cd0d69763eaa2c87e874019061d538`, and implementation/evidence PR #395 merged that exact head as `main` `a896650d547e28fe0a7158dc360f5a11c2bb1b91`. R18.8–R18.11 remain PLANNED; R18.8 START is authorized only after this normalization record itself passes fresh R0/Python/UI and merges with exact expected-head protection. Manual state for R18.7 is NONE; public/production distribution effects remain CONDITIONAL / NOT TRIGGERED."

          for needle, label in [(old_banner, "banner"), (r18_6, "R18.6 anchor"), (old_state, "R18 state")]:
              if text.count(needle) != 1:
                  raise SystemExit(f"{label} is not uniquely anchored")
          if "- R18.7 : **COMPLETE + NORMALIZED effective when this unique post-merge" in text:
              raise SystemExit("R18.7 normalization record already exists")

          text = text.replace(old_banner, new_banner, 1)
          text = text.replace(r18_6, r18_6 + "\n" + r18_7, 1)
          text = text.replace(old_state, new_state, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          helper.unlink()
          PY

          git config user.name "kodepoia-r18-normalization"
          git config user.email "actions@users.noreply.github.com"
          git add docs/continuity/KODEPOIA_CONTINUITY.md .github/workflows/r18-7-normalization-helper.yml
          git diff --cached --check
          git commit -m "docs(r18.7): normalize post-merge continuity"
          git push origin HEAD:r18/07-continuity-normalization
