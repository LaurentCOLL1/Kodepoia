name: Python Core

on:
  push:
    branches:
      - main
      - develop
      - "agent/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: python-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python-core-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,code]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate or emit R7 integrated acceptance
        if: runner.os == 'Linux'
        run: python scripts/r7_integrated_acceptance.py --check-or-print docs/roadmap/R7_INTEGRATED_ACCEPTANCE.json
      - name: Validate or emit R8 integrated acceptance
        if: runner.os == 'Linux'
        run: python scripts/r8_integrated_acceptance.py --check-or-print docs/roadmap/R8_INTEGRATED_ACCEPTANCE.json
      - name: Validate PowerShell acceptance runner syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @(
            "scripts/r3_accept_local.ps1",
            "scripts/r5_accept_local.ps1",
            "scripts/r5_diagnose_godot_process.ps1",
            "scripts/r6_4_accept_local.ps1",
            "scripts/r6_5_accept_local.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Test
        run: pytest

  ui-smoke:
    name: kodestudio-ui-windows
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install UI and test dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: KodeStudio smoke
        run: pytest tests/test_kodestudio_smoke.py tests/test_r6_5_accessibility_ui.py tests/test_r6_6_localization_ui.py tests/test_r7_10_research_ui.py tests/test_r8_10_kodestudio.py

  package-build:
    name: package-build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KODEPOIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KODEPOIA_BUILD_PLATFORM: ${{ matrix.os }}
    steps:
      - name: Checkout exact evidence source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build evidence dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build wheel and sdist
        run: python -m build --wheel --sdist --outdir dist
      - name: Collect and validate build evidence
        run: python scripts/r6_8_collect_build.py
      - name: Upload package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: kodepoia-build-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*
            .kodepoia/releases/${{ matrix.os }}/latest.json
            .kodepoia/workflows/r6-8-package-build/latest.json
