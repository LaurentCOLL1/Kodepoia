name: R14.9 Fixture Patch

on:
  push:
    branches:
      - r14/09-progression-leaderboards
    paths:
      - .github/workflows/r14-9-fixture-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/09-progression-leaderboards
          fetch-depth: 0
      - name: Apply fixture patch
        run: python .github/r14_9_fixture_patch.py
      - name: Commit fixture corrections and self-remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/r14_9_fixture_patch.py .github/workflows/r14-9-fixture-patch.yml
          git add tests/test_r14_9_progression_leaderboards.py scripts/r14_9_progression_acceptance.py
          test "$(git diff --cached --name-only | sort)" = $'.github/r14_9_fixture_patch.py\n.github/workflows/r14-9-fixture-patch.yml\nscripts/r14_9_progression_acceptance.py\ntests/test_r14_9_progression_leaderboards.py'
          git commit -m "test(r14.9): use explicit authority objects in fixtures"
          git push origin HEAD:r14/09-progression-leaderboards
