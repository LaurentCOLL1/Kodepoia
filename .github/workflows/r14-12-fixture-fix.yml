name: R14.12 Acceptance Fixture Fix

on:
  push:
    branches:
      - r14/12-content-delivery
    paths:
      - .github/workflows/r14-12-fixture-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r14/12-content-delivery
          fetch-depth: 0
      - name: Apply fixture authorization repair
        run: python .github/r14_12_fix_acceptance_fixture.py
      - name: Compile acceptance runner
        run: python -m compileall -q scripts/r14_12_content_delivery_acceptance.py
      - name: Commit fixture repair and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/r14_12_fix_acceptance_fixture.py .github/workflows/r14-12-fixture-fix.yml
          git add scripts/r14_12_content_delivery_acceptance.py
          test "$(git diff --cached --name-only | sort)" = $'.github/r14_12_fix_acceptance_fixture.py\n.github/workflows/r14-12-fixture-fix.yml\nscripts/r14_12_content_delivery_acceptance.py'
          git commit -m "test(r14.12): authorize adversarial acceptance fixtures"
          git push origin HEAD:r14/12-content-delivery
