name: R15.5 END Sync Recovery Cleanup
on:
  push:
    branches: [r15/05-end-sync-recovery]
    paths: ['.github/workflows/r15-5-end-sync-recovery-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/05-end-sync-recovery
          fetch-depth: 0
      - name: Remove all temporary recovery helpers
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/r15-5-end-sync-recovery-helper.yml \
            .github/workflows/r15-5-end-sync-recovery-pr.yml \
            .github/workflows/r15-5-end-sync-recovery-fix.yml \
            .github/workflows/r15-5-end-sync-recovery-fix2.yml \
            .github/workflows/r15-5-end-sync-recovery-doc-commit.yml \
            .github/workflows/r15-5-end-sync-recovery-doc-commit2.yml \
            .github/workflows/r15-5-end-sync-recovery-doc-commit3.yml \
            .github/workflows/r15-5-end-sync-recovery-doc-commit4.yml \
            .github/workflows/r15-5-end-sync-recovery-doc-commit5.yml \
            .github/workflows/r15-5-end-sync-recovery-doc-commit6.yml \
            .github/workflows/r15-5-end-sync-recovery-doc-commit7.yml \
            .github/workflows/r15-5-end-sync-recovery-doc-commit8.yml \
            .github/workflows/r15-5-end-sync-recovery-doc-commit9.yml \
            .github/workflows/r15-5-end-sync-recovery-cleanup.yml
          git commit -m "chore(r15.5): remove recovery helpers"
          git push origin HEAD:r15/05-end-sync-recovery
