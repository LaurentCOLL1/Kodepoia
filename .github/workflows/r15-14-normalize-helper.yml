name: R15.14 normalization helper

on:
  push:
    branches:
      - r15/14-normalize

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/14-normalize
          fetch-depth: 0
      - name: Normalize R15.14 continuity authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/continuity/KODEPOIA_CONTINUITY.md')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'R15.1–R15.13 COMPLETE + NORMALIZED; R15.14 COMPLETE / NORMALIZATION PENDING; R15.15–R15.17 PLANNED.',
              'R15.1–R15.14 COMPLETE + NORMALIZED; R15.15–R15.17 PLANNED.',
              1,
          )
          text = text.replace(
              '| R15.14 | COMPLETE / NORMALIZATION PENDING | NONE |',
              '| R15.14 | COMPLETE + NORMALIZED | NONE |',
              1,
          )

          bullet = '''- R15.14 : **COMPLETE + NORMALIZED** — clean START / normalized R15.13 `main` `d0225f4086c8ad1328fe6450a85e92fcc62644a6`; immutable technical source `d6e3aef8224cb45a329b76077d1dd39a9adda0c3`; final exact END-head `c9ca0cb9b16870a2fa46eee280c3dd9d7cc0b140`; exact-END R15.14 #10 / `33333256059` SUCCESS Ubuntu + Windows, R0 #2207 / `33333258400` SUCCESS, Python Core #2182 / `33333258385` SUCCESS 5/5 and KodeStudio UI Smoke #2147 / `33333258329` SUCCESS; PR #324 merged with `expected_head_sha=c9ca0cb9b16870a2fa46eee280c3dd9d7cc0b140` as implementation/evidence `main` `6277995cda41a2a34c101f634b89666d2e674d89`. Immutable digest-bound versions, explicit lineage/artifact variants/role eligibility, fail-closed rejected/non-promotable activation, mutable runtime-ref digest verification, atomic persisted promotion, SafeChange snapshot hook, health rollback, restart-safe exact rollback and R3 `KodeModelRouter` compatibility remain authoritative. Manual NONE. This record is the unique post-merge continuity-only R15.14 normalization authority when merged; R15.15 START-sync is authorized only from the resulting normalized `main` after this branch passes fresh exact-head R0/Python/UI and merges.'''

          text, n = re.subn(
              r'- R15\.14 : \*\*COMPLETE / NORMALIZATION PENDING\*\* — .*?\n\n## Next authorized action',
              bullet + '\n\n## Next authorized action',
              text,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'R15.14 bullet replacement failed'

          next_action = '''## Next authorized action

**R15.14 normalization only: require fresh exact-head R0 Repository Guard + full Python Core + KodeStudio UI Smoke on this continuity-only normalization head, then merge its PR with exact `expected_head_sha`. R15.15 remains unauthorized until that normalization merge creates the new normalized `main`. Manual state: NONE.**

## Permanent R-phase execution rule'''
          text, n = re.subn(
              r'## Next authorized action\n\n\*\*.*?\*\*\n\n## Permanent R-phase execution rule',
              next_action,
              text,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'next action replacement failed'

          path.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/r15-14-normalize-helper.yml
          git add docs/continuity/KODEPOIA_CONTINUITY.md
          git diff --cached --check
          git commit -m "docs(r15.14): normalize post-merge continuity"
          git push origin HEAD:r15/14-normalize
