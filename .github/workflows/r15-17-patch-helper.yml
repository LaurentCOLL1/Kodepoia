name: R15.17 Temporary Patch Helper

on:
  push:
    branches:
      - 'r15/17-adversarial-integrated-acceptance'
    paths:
      - '.github/workflows/r15-17-patch-helper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15/17-adversarial-integrated-acceptance
          fetch-depth: 0

      - name: Apply exact API correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/kodepoia/tuning/integrated_acceptance.py')
          text = path.read_text(encoding='utf-8')
          old = '"evaluation_binding": canonical_sha256(binding.to_dict()),'
          new = '"evaluation_binding": binding.digest,'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one CandidateBinding.to_dict occurrence')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kodepoia/tuning/integrated_acceptance.py
          git commit -m 'R15.17 fix candidate binding digest API'
          git push origin HEAD:r15/17-adversarial-integrated-acceptance
